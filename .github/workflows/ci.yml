name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Chromium for E2E
        run: npx playwright-core install --with-deps chromium
      - name: E2E
        run: npm run test:e2e
        env:
          SCRATCH_DIR: ${{ runner.temp }}
          SHOT_DIR: ${{ runner.temp }}
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/*.png
          if-no-files-found: ignore
