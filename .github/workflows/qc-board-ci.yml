name: QC Board CI

# qc-board/ 配下が変わったときだけ走らせる(このリポジトリには UI 教材 / ui-kit も同居している)
on:
  push:
    branches: [main]
    paths:
      - 'qc-board/**'
      - '.github/workflows/qc-board-ci.yml'
  pull_request:
    paths:
      - 'qc-board/**'
      - '.github/workflows/qc-board-ci.yml'

permissions:
  contents: read
  packages: write

defaults:
  run:
    working-directory: qc-board

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: qc-board/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Chromium for E2E
        run: npx playwright-core install --with-deps chromium
      - name: E2E
        run: npm run test:e2e
        env:
          SCRATCH_DIR: ${{ runner.temp }}
          SHOT_DIR: ${{ runner.temp }}
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/*.png
          if-no-files-found: ignore

  # Dockerfile が壊れていないことを確認し、main では GHCR にイメージを公開する
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: ./qc-board
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/reiri0135678/qc-board:latest
            ghcr.io/reiri0135678/qc-board:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
