<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>QC Board 単一ファイル版</title>
<!--
  QC Board(検査依頼デジタル化ホワイトボード)を 1 ファイルのバニラ JS で再現したもの。
  本体(client/ + server/)との違い:
    - サーバーが無いので、同時編集は「同じブラウザの別タブ」間だけ(BroadcastChannel)。保存は localStorage
    - 競合解決(Yjs)は無く、後から送った内容が勝つ
    - 認証・kintone・通知・バックアップ・埋め込み連携は無い(kintone は番号を振るだけのモック)
    - ペンの筆圧表現(perfect-freehand)と PDF の画像化は無い
  それ以外の操作(ツール、表、区画、雛形、版、コメント、一覧、CSV、範囲貼り付け…)は本体と同じ振る舞いを目指している。
-->
<style>
:root {
  --qc-bg: #faf9f5; --qc-panel: #fffefb; --qc-panel-2: #f3f1ea; --qc-border: #e4e1d8; --qc-text: #141413; --qc-muted: #6b675f;
  --qc-accent: #d97757; --qc-accent-soft: rgba(217,119,87,0.12); --qc-blue: #6a9bcc; --qc-green: #788c5d;
  --font-ui: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", system-ui, sans-serif;
  --font-display: "Hiragino Mincho ProN", "Noto Serif JP", "Yu Mincho", serif;
  --shadow: 0 6px 20px rgba(20,20,19,0.08);
}
* { box-sizing: border-box; }
html, body, #root { height: 100%; margin: 0; }
body { font-family: var(--font-ui); color: var(--qc-text); background: var(--qc-bg); font-size: 13px; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.hidden { display: none !important; }
.link { background: none; border: none; color: var(--qc-accent); padding: 0 4px; cursor: pointer; }
.muted { color: var(--qc-muted); }
.btn { border: 1px solid var(--qc-border); background: var(--qc-panel); border-radius: 8px; padding: 5px 10px; }
.btn--primary { background: var(--qc-accent); border-color: var(--qc-accent); color: #fff; }
.btn:disabled { opacity: 0.5; cursor: default; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; margin: 0; }

/* ---- 入口 ---- */
.landing { height: 100%; display: grid; place-items: center; }
.card { width: 460px; max-width: 92vw; background: var(--qc-panel); border: 1px solid var(--qc-border); border-radius: 14px; box-shadow: var(--shadow); padding: 22px; }
.card h1 { font-size: 24px; margin-bottom: 4px; }
.card p { margin: 6px 0 14px; color: var(--qc-muted); }
.row { display: flex; gap: 8px; align-items: center; }
.row input { flex: 1; padding: 7px 10px; border: 1px solid var(--qc-border); border-radius: 8px; background: #fff; }
.rooms { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 6px; }
.rooms button { width: 100%; text-align: left; padding: 9px 12px; border: 1px solid var(--qc-border); border-radius: 10px; background: #fff; }
.rooms button:hover { border-color: var(--qc-accent); }
.limits { margin-top: 14px; font-size: 12px; color: var(--qc-muted); line-height: 1.6; border-top: 1px solid var(--qc-border); padding-top: 10px; }

/* ---- 依頼フォーム ---- */
.form { max-width: 560px; margin: 20px auto; background: var(--qc-panel); border: 1px solid var(--qc-border); border-radius: 14px; padding: 20px; box-shadow: var(--shadow); }
.form label { display: block; margin: 8px 0; font-size: 12px; color: var(--qc-muted); }
.form input, .form select, .form textarea { width: 100%; margin-top: 3px; padding: 7px 9px; border: 1px solid var(--qc-border); border-radius: 8px; background: #fff; }
.form .done { font-family: var(--font-display); font-size: 22px; margin: 14px 0; }

/* ---- アプリ骨格 ---- */
.app { display: grid; grid-template-rows: 44px 1fr; grid-template-columns: 300px 1fr; height: 100%; }
.app[data-drawer='true'] { grid-template-rows: 44px 1fr var(--drawer-h, 260px); }
.header { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 0 14px; border-bottom: 1px solid var(--qc-border); background: var(--qc-panel); }
.header h1 { font-size: 18px; }
.header .spacer { flex: 1; }
.peers { display: flex; gap: 4px; }
.peer { border: 1px solid var(--qc-border); border-radius: 999px; padding: 2px 8px; background: #fff; font-size: 12px; }
.peer[data-follow='true'] { border-color: var(--qc-accent); background: var(--qc-accent-soft); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #aaa; margin-right: 4px; }
.dot--online { background: var(--qc-green); }
.sidebar { border-right: 1px solid var(--qc-border); background: var(--qc-panel); overflow: auto; padding: 12px; }
.sidebar h2 { font-size: 15px; margin-bottom: 8px; }
.panel__head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.field { display: block; margin: 6px 0; font-size: 12px; color: var(--qc-muted); }
.field input, .field select, .field textarea { width: 100%; margin-top: 2px; padding: 5px 8px; border: 1px solid var(--qc-border); border-radius: 6px; background: #fff; font-size: 13px; color: var(--qc-text); }
.field2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.gallery { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.gallery li { border: 1px solid var(--qc-border); border-radius: 8px; overflow: hidden; background: #fff; cursor: pointer; }
.gallery li[data-linking='true'] { outline: 2px dashed var(--qc-accent); }
.gallery img { display: block; width: 100%; height: 80px; object-fit: cover; }
.gallery .name { display: block; padding: 4px 6px; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.linked { list-style: none; margin: 4px 0; padding: 0; display: grid; gap: 4px; }
.linked li { display: flex; align-items: center; gap: 6px; font-size: 12px; }
.linked img { width: 36px; height: 28px; object-fit: cover; border-radius: 4px; border: 1px solid var(--qc-border); }
.hist { list-style: none; margin: 6px 0; padding: 0; font-size: 11px; color: var(--qc-muted); max-height: 160px; overflow: auto; }
.hist li { padding: 3px 0; border-bottom: 1px dashed var(--qc-border); }
.hint { background: var(--qc-accent-soft); border-radius: 8px; padding: 6px 8px; font-size: 12px; }

/* ---- ボード ---- */
.board { position: relative; overflow: hidden; background: var(--qc-bg);
  background-image: radial-gradient(rgba(20,20,19,0.10) 1px, transparent 1px); background-size: 24px 24px; }
.board canvas.main { position: absolute; inset: 0; touch-action: none; }
.qc-toolbar { position: absolute; left: 12px; top: 12px; width: 118px; display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 4px;
  background: var(--qc-panel); border: 1px solid var(--qc-border); border-radius: 12px; box-shadow: var(--shadow); z-index: 300; }
.qc-toolbar__btn { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 5px 2px; border: none; background: transparent; border-radius: 8px; font-size: 10px; color: var(--qc-muted); }
.qc-toolbar__btn:hover { background: var(--qc-panel-2); }
.qc-toolbar__btn[data-active='true'] { background: var(--qc-accent); color: #fff; }
.qc-toolbar__icon { font-size: 16px; line-height: 1; color: var(--qc-text); }
.qc-toolbar__btn[data-active='true'] .qc-toolbar__icon { color: #fff; }
.qc-toolbar__sep { height: 1px; background: var(--qc-border); margin: 1px 4px; grid-column: 1 / -1; }
.qc-toolbar__wide { grid-column: 1 / -1; }
.style-panel { position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 6px; padding: 8px;
  background: var(--qc-panel); border: 1px solid var(--qc-border); border-radius: 10px; box-shadow: var(--shadow); z-index: 300; max-width: 330px; }
.style-panel__row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.swatch { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--qc-border); cursor: pointer; padding: 0; }
.swatch[data-active='true'] { box-shadow: 0 0 0 2px var(--qc-accent); }
.swatch--note { border-radius: 4px; }
.chip { font-size: 12px; min-width: 28px; height: 26px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--qc-border); background: #fff; }
.chip[data-active='true'] { background: var(--qc-accent); border-color: var(--qc-accent); color: #fff; }
.zoom-bar { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 4px; align-items: center; background: var(--qc-panel); border: 1px solid var(--qc-border); border-radius: 10px; padding: 4px; box-shadow: var(--shadow); z-index: 300; }
.minimap { position: absolute; right: 12px; bottom: 56px; background: var(--qc-panel); border: 1px solid var(--qc-border); border-radius: 10px; box-shadow: var(--shadow); z-index: 300; cursor: crosshair; }
.page-bar { position: absolute; left: 140px; bottom: 12px; display: flex; gap: 4px; background: var(--qc-panel); border: 1px solid var(--qc-border); border-radius: 10px; padding: 4px; box-shadow: var(--shadow); z-index: 300; }
.page-bar button { border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 3px 10px; }
.page-bar button[data-active='true'] { border-color: var(--qc-accent); background: var(--qc-accent-soft); }
.text-editor { position: absolute; z-index: 400; resize: none; border: 1px solid var(--qc-accent); outline: none; padding: 0; overflow: hidden; font-family: var(--font-ui); }
.menu { position: fixed; z-index: 500; background: var(--qc-panel); border: 1px solid var(--qc-border); border-radius: 10px; box-shadow: var(--shadow); padding: 4px; min-width: 200px; }
.menu__item { display: block; width: 100%; text-align: left; border: none; background: transparent; padding: 6px 10px; border-radius: 6px; font-size: 12px; }
.menu__item:hover { background: var(--qc-panel-2); }
.menu__item:disabled { opacity: 0.4; }
.menu__sep { height: 1px; background: var(--qc-border); margin: 3px 4px; }
.pop { position: absolute; z-index: 450; background: var(--qc-panel); border: 1px solid var(--qc-border); border-radius: 10px; box-shadow: var(--shadow); padding: 10px; width: 280px; font-size: 12px; }
.pop textarea { width: 100%; height: 56px; border: 1px solid var(--qc-border); border-radius: 6px; padding: 5px; resize: none; }
.pop .replies { max-height: 140px; overflow: auto; margin: 6px 0; }
.pop .reply { border-top: 1px dashed var(--qc-border); padding: 4px 0; }
.find-bar { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); display: flex; gap: 6px; align-items: center; background: var(--qc-panel); border: 1px solid var(--qc-border); border-radius: 10px; padding: 6px 8px; box-shadow: var(--shadow); z-index: 350; }
.find-bar input { padding: 4px 8px; border: 1px solid var(--qc-border); border-radius: 6px; width: 220px; }
.banner { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: var(--qc-accent); color: #fff; border-radius: 999px; padding: 4px 12px; z-index: 350; font-size: 12px; }
.tpl { position: relative; grid-column: 1 / -1; }
.tpl__pop { position: absolute; left: 118px; bottom: 0; width: 280px; background: var(--qc-panel); border: 1px solid var(--qc-border); border-radius: 10px; box-shadow: var(--shadow); padding: 8px; z-index: 360; max-height: 70vh; overflow: auto; }
.tpl__item { display: block; width: 100%; text-align: left; border: none; background: transparent; padding: 6px 8px; border-radius: 6px; }
.tpl__item:hover { background: var(--qc-panel-2); }
.tpl__item small { display: block; color: var(--qc-muted); }
.tpl__custom { display: flex; align-items: center; }
.versions { position: absolute; right: 12px; top: 48px; width: 300px; background: var(--qc-panel); border: 1px solid var(--qc-border); border-radius: 10px; box-shadow: var(--shadow); padding: 10px; z-index: 360; font-size: 12px; }
.versions__save { display: flex; gap: 6px; margin-bottom: 8px; }
.versions__save input { flex: 1; padding: 4px 8px; border: 1px solid var(--qc-border); border-radius: 6px; }
.versions ul { list-style: none; margin: 0; padding: 0; max-height: 240px; overflow: auto; }
.versions li { display: flex; gap: 6px; align-items: center; padding: 4px 0; border-top: 1px dashed var(--qc-border); }
.versions li span { flex: 1; }

/* ---- ドロワー(一覧) ---- */
.drawer { grid-column: 1 / -1; background: var(--qc-panel); border-top: 1px solid var(--qc-border); display: flex; flex-direction: column; min-height: 0; position: relative; }
.drawer-handle { position: absolute; top: -4px; left: 0; right: 0; height: 8px; cursor: row-resize; z-index: 10; }
.sheet__bar { display: flex; gap: 8px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--qc-border); flex-wrap: wrap; }
.sheet__bar input, .sheet__bar select { padding: 4px 8px; border: 1px solid var(--qc-border); border-radius: 6px; background: #fff; }
.sheet__msg { padding: 4px 10px; font-size: 12px; color: var(--qc-green); background: #f1f4ea; }
.sheet__scroll { overflow: auto; flex: 1; }
.tab { border: 1px solid var(--qc-border); background: #fff; border-radius: 6px; padding: 3px 10px; }
.tab[data-active='true'] { background: var(--qc-accent); border-color: var(--qc-accent); color: #fff; }
.bulk { display: flex; gap: 8px; align-items: center; padding: 6px 10px; background: var(--qc-accent-soft); border-bottom: 1px solid var(--qc-border); font-size: 12px; flex-wrap: wrap; }
.grid { border-collapse: collapse; font-size: 12px; table-layout: fixed; }
.grid th { position: sticky; top: 0; background: var(--qc-panel-2); text-align: left; font-weight: 500; color: var(--qc-muted); padding: 5px 6px; border-bottom: 1px solid var(--qc-border); cursor: pointer; user-select: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.grid td { padding: 0; border-bottom: 1px solid var(--qc-border); border-right: 1px solid var(--qc-panel-2); }
.grid tbody tr[data-selected='true'] td { background: var(--qc-accent-soft); }
.grid tbody tr[data-due='overdue'] td[data-col='dueDate'] input { color: #b5462b; font-weight: 700; }
.grid tbody tr[data-due='soon'] td[data-col='dueDate'] input { color: #c9922a; }
.grid tbody tr[data-priority='至急'] td[data-col='priority'] select { color: #b5462b; font-weight: 700; }
.grid td[data-range='true'] { background: rgba(217,119,87,0.14); box-shadow: inset 0 0 0 1px rgba(217,119,87,0.45); }
.grid td input, .grid td select { width: 100%; font-size: 12px; padding: 5px 6px; border: 1px solid transparent; background: transparent; border-radius: 0; }
.grid td input:focus, .grid td select:focus { outline: none; border-color: var(--qc-accent); background: #fff; }
.grid__ro { display: block; padding: 5px 6px; color: var(--qc-muted); }
.grid__check { width: 32px; text-align: center; }
.summary { padding: 12px; overflow: auto; }
.tiles { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.tile { border: 1px solid var(--qc-border); border-radius: 10px; padding: 8px 14px; min-width: 130px; background: #fff; }
.tile__label { display: block; font-size: 11px; color: var(--qc-muted); }
.tile__value { display: block; font-family: var(--font-display); font-size: 22px; }
.tile[data-tone='bad'] .tile__value { color: #b5462b; }
.tile[data-tone='warn'] .tile__value { color: #c9922a; }
.summary__tables { display: flex; gap: 16px; flex-wrap: wrap; }
.breakdown h3 { font-size: 13px; margin-bottom: 4px; }
table.mini { border-collapse: collapse; font-size: 12px; }
table.mini td, table.mini th { padding: 3px 8px; border-bottom: 1px solid var(--qc-border); }
table.mini .num { text-align: right; }
.bad { color: #b5462b; }
.board-banner { position: absolute; left: 50%; bottom: 60px; transform: translateX(-50%); background: #fff3e6; border: 1px solid var(--qc-accent); border-radius: 8px; padding: 6px 12px; z-index: 350; font-size: 12px; }
@media (max-width: 900px) { .app { grid-template-columns: 1fr; } .sidebar { display: none; } }
</style>
</head>
<body>
<div id="root"></div>
<script>
'use strict';
/* =====================================================================
 * 1. 定数・図形の定義(shared/shapes.ts 相当)
 * ===================================================================== */
const COLORS = ['#141413', '#b5462b', '#3f6f9e', '#788c5d', '#d97757', '#7b5c9c'];
const NOTE_COLORS = ['#fef3c7', '#fde2e1', '#dbeafe', '#dcfce7', '#f3e8ff', '#fffefb'];
const HIGHLIGHT_COLOR = '#f5d90a';
const CARD_W = 260, CARD_H = 150;
const STATUSES = ['受付', '検査中', '保留', '差戻し', '完了', '取消', 'アーカイブ'];
const CLOSED = ['完了', '取消', 'アーカイブ'];
const TRANSITIONS = {
  '受付': ['検査中', '保留', '差戻し', '取消'],
  '検査中': ['完了', '保留', '差戻し', '受付'],
  '保留': ['検査中', '受付', '取消'],
  '差戻し': ['受付', '取消'],
  '完了': ['検査中', 'アーカイブ'],
  '取消': ['受付', 'アーカイブ'],
  'アーカイブ': []
};
const canTransition = (from, to) => from === to || (TRANSITIONS[from] || []).includes(to);
const PRIORITIES = ['通常', '至急'];
const RESULTS = ['未判定', '合格', '条件付合格', '不合格'];
const STATUS_BG = { '受付': '#e8eef5', '検査中': '#fdf0d5', '保留': '#eeeeee', '差戻し': '#fde2e1', '完了': '#e3ecd8', '取消': '#e5e5e5', 'アーカイブ': '#dddddd' };
const DASH = { solid: [], dashed: [10, 6], dotted: [2, 5] };
const GEO_KINDS = ['rect', 'rounded', 'triangle', 'diamond', 'hexagon'];
const GEO_LABEL = { rect: '四角', rounded: '角丸', triangle: '三角', diamond: 'ひし形', hexagon: '六角' };

const newId = () => 's_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const newGroupId = () => 'g_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const today = () => new Date().toISOString().slice(0, 10);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/** 種類ごとの既定値。normalize にも使う */
function defaultsFor(type) {
  const base = { type, x: 0, y: 0, w: 120, h: 80, rotation: 0, locked: false, groupId: null, color: COLORS[0] };
  switch (type) {
    case 'draw': return { ...base, points: [], size: 3, opacity: 1, w: 1, h: 1 };
    case 'text': return { ...base, text: '', fontSize: 18, bold: false, italic: false, underline: false, align: 'left', w: 200, h: 28 };
    case 'note': return { ...base, text: '', color: NOTE_COLORS[0], fontSize: 18, bold: false, italic: false, underline: false, align: 'left', w: 180, h: 180 };
    case 'arrow': return { ...base, dx: 120, dy: 0, size: 2, dash: 'solid', headStart: false, headEnd: true, startBind: null, endBind: null, w: 1, h: 1 };
    case 'rect': return { ...base, kind: 'rect', label: '', fontSize: 14, size: 2, fill: 'transparent', dash: 'solid' };
    case 'ellipse': return { ...base, label: '', fontSize: 14, size: 2, fill: 'transparent', dash: 'solid' };
    case 'image': return { ...base, src: '', name: '', crop: null, w: 400, h: 300 };
    case 'frame': return { ...base, title: '区画', color: '#6a9bcc', w: 400, h: 300 };
    case 'table': { const colWidths = [120, 120, 120], rowHeights = [40, 40, 40]; return { ...base, cells: [['項目', '基準', '結果'], ['', '', ''], ['', '', '']], colWidths, rowHeights, headerRow: true, fontSize: 13, ...tableSize(colWidths, rowHeights) }; }
    case 'request-card': return { ...base, w: CARD_W, h: CARD_H, no: '', title: '検査依頼', dept: '製造1課', partNo: '', lot: '', qty: '', status: '受付', requester: '', requestedAt: '', note: '', assignee: '', dueDate: '', priority: '通常', result: '未判定', resultNote: '', judgedBy: '', judgedAt: '', archived: false, linkedShapeIds: [], kintoneRecordId: '' };
    default: return base;
  }
}
const tableSize = (colWidths, rowHeights) => ({ w: colWidths.reduce((a, b) => a + b, 0), h: rowHeights.reduce((a, b) => a + b, 0) });

/** 図形の外接矩形(回転は無視) */
function bounds(s) {
  if (s.type === 'arrow') return { x: Math.min(s.x, s.x + s.dx), y: Math.min(s.y, s.y + s.dy), w: Math.abs(s.dx) || 1, h: Math.abs(s.dy) || 1 };
  return { x: s.x, y: s.y, w: s.w || 1, h: s.h || 1 };
}
function boundsOf(list) {
  if (!list.length) return null;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const s of list) { const b = bounds(s); x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y); x1 = Math.max(x1, b.x + b.w); y1 = Math.max(y1, b.y + b.h); }
  return { x: x0, y: y0, w: Math.max(1, x1 - x0), h: Math.max(1, y1 - y0) };
}
const inside = (b, r) => b.x >= r.x && b.y >= r.y && b.x + b.w <= r.x + r.w && b.y + b.h <= r.y + r.h;
/** 区画の中に完全に入っている図形(区画自身と他の区画は除く) */
const shapesInFrame = (f, all) => all.filter((s) => s.id !== f.id && s.type !== 'frame' && s.page === f.page && inside(bounds(s), bounds(f)));
/** 検索対象の文字 */
function shapeTexts(s) {
  switch (s.type) {
    case 'text': case 'note': return [s.text];
    case 'rect': case 'ellipse': return [s.label];
    case 'frame': return [s.title];
    case 'table': return s.cells.flat();
    case 'image': return [s.name];
    case 'request-card': return [s.no, s.title, s.dept, s.partNo, s.lot, s.requester, s.note, s.assignee];
    default: return [];
  }
}

/* ---- 矢印の吸着 ---- */
const anchorPoint = (s, b) => { const r = bounds(s); return { x: r.x + r.w * b.nx, y: r.y + r.h * b.ny }; };
