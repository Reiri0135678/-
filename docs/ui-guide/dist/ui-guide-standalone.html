u003c/td>\u003c/tr>\n      <tr><td>ウィンドウ状態の復元\u003c/td><td>マルチディスプレイ→シングルに戻した時に画面外へ行かない\u003c/td>\u003c/tr>\n      <tr><td>メニューと画面のショートカット\u003c/td><td>同じキーを二重登録していない\u003c/td>\u003c/tr>\n      <tr><td>認証情報\u003c/td><td>safeStorage。ログ・エラー画面にトークンを出さない\u003c/td>\u003c/tr>\n      <tr><td>オフライン\u003c/td><td>79 のキューが main 再起動後も残る（ファイルに保存）\u003c/td>\u003c/tr>\n      <tr><td>自動更新\u003c/td><td>更新は業務時間外か、ユーザーの承諾後に再起動（進捗は 40 の作法）\u003c/td>\u003c/tr>\n    \u003c/table>\n  \u003c/div>\n  <p class=\"note\">API 名・挙動は Electron のバージョンで変わる。特に <code>webUtils.getPathForFile\u003c/code>（<code>File.path\u003c/code> の後継）と <code>titleBarOverlay\u003c/code> は比較的新しい API なので、使用バージョンの公式ドキュメントで確認すること。\u003c/p>\n\u003c/main>\n\u003c/body>\n\u003c/html>\n","docs/ui-guide/13-kintone.html":"<!DOCTYPE html>\n<html lang=\"ja\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>kintone 連携リファレンス\u003c/title>\n<link rel=\"stylesheet\" href=\"assets/guide.css\">\n<style>\n  .tierF { background: #475569; }\n  main.single { max-width: 960px; margin: 0 auto; padding: 24px; }\n  .ref { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; margin-bottom: 14px; }\n  .ref h2 { margin: 0 0 6px; font-size: 16px; } .ref p { font-size: 13.5px; margin: 0 0 8px; }\n  pre { background: var(--code); color: #e2e8f0; padding: 10px 12px; border-radius: 8px; font-size: 12px; overflow: auto; margin: 6px 0; line-height: 1.5; }\n  table.cmp { border-collapse: collapse; width: 100%; font-size: 13px; background: #fff; }\n  table.cmp th, table.cmp td { border: 1px solid var(--line); padding: 6px 10px; vertical-align: top; text-align: left; }\n  table.cmp th { background: #f1f5f9; }\n\u003c/style>\n\u003c/head>\n<body>\n<header class=\"top\">\n  <h1>kintone 連携リファレンス <span class=\"tier tierF\">UI操作との対応\u003c/span>\u003c/h1>\n  <nav><a href=\"00-index.html\">⌂ 入口\u003c/a><a href=\"01-ui-operations-catalog.html\">カタログ\u003c/a><a href=\"12-electron.html\">Electron\u003c/a><a href=\"05-advanced.html\">D\u003c/a>\u003c/nav>\n\u003c/header>\n<main class=\"single\">\n  <div class=\"lead\">デモの中で「kintone ならこう」と書いた箇所を、API 側の制約とセットでまとめる。<b>UI の作りは API の上限で決まる\u003c/b>（1回で取れる件数、1回で更新できる件数、リビジョン）。数値は執筆時点の把握であり、<b>必ず公式 REST API リファレンスで確認\u003c/b>すること。このページは参照用で、コードは実行されない。\u003c/div>\n\n  <div class=\"ref\"><h2>0. 呼び出しの置き場所（Electron の場合）\u003c/h2>\n    <p>renderer から kintone へ直接 <code>fetch\u003c/code> すると、オリジン（<code>file://\u003c/code> や <code>app://\u003c/code>）からの CORS で拒否される。<b>main プロセスで通信し、IPC で結果を返す\u003c/b>（12 の構成）。トークンも main にだけ置ける。\u003c/p>\n<pre>// main.js\nipcMain.handle('kintone:request', async (e, { method, path, params, body }) => {\n  const url = new URL(path, `https://${SUBDOMAIN}.cybozu.com`);\n  if (method === 'GET' &amp;&amp; params) url.search = new URLSearchParams(params);\n  const res = await net.fetch(url, { method, headers: { 'X-Cybozu-API-Token': token(), 'Content-Type': 'application/json' }, body: body &amp;&amp; JSON.stringify(body) });\n  const json = await res.json();\n  if (!res.ok) throw Object.assign(new Error(json.message || res.statusText), { code: json.code, status: res.status, errors: json.errors });\n  return json;\n});\u003c/pre>\u003c/div>\n\n  <div class=\"ref\"><h2>1. 一覧の取得 <small>← 21 ページネーション / 23 仮想スクロール / 71 大規模グリッド\u003c/small>\u003c/h2>\n    <p>取得は <code>GET /k/v1/records.json\u003c/code>。1回の <code>limit\u003c/code> は最大 500、<code>offset\u003c/code> は上限あり（大きな値で拒否される）。数千件を超えるなら<b>カーソル API\u003c/b>（作成→取得を繰り返す）か、<code>$id\u003c/code> でソートして「前回の最後の id より大きい」を条件にする方法。取り切ったデータは 23/71 の仮想スクロールで描く（DOM は表示分だけ）。\u003c/p>\n<pre>// 方式A: offset/limit（件数が少ない・ページ番号 UI に向く）… 21 の pager と同じ\nGET /k/v1/records.json?app=1&amp;query=order by $id asc limit 500 offset 0\n\n// 方式B: id 基準（offset 上限を避ける。全件取得に向く）\nlet last = 0, all = [];\nwhile (true) {\n  const { records } = await api({ method: 'GET', path: '/k/v1/records.json', params: { app: 1, query: `$id > ${last} order by $id asc limit 500` } });\n  all.push(...records); if (records.length < 500) break; last = records.at(-1).$id.value;\n}\n// 方式C: カーソル API（POST /k/v1/records/cursor.json で作成 → GET で繰り返し取得 → 使い終わったら DELETE）\u003c/pre>\n    <p>UI 側：取得中は 22 のスケルトン、取得済み件数と総件数（<code>totalCount: true\u003c/code> を付けると返る）を 40 の進捗で出す。\u003c/p>\u003c/div>\n\n  <div class=\"ref\"><h2>2. 更新とリビジョン <small>← 57 楽観的更新 / 78 競合解決\u003c/small>\u003c/h2>\n    <p>レコードは <code>$revision\u003c/code> を持つ。<code>PUT\u003c/code> 時に <code>revision\u003c/code> を付けると、サーバ側が進んでいれば<b>エラーで拒否\u003c/b>される（省略または -1 で無視）。これが 78 の「楽観ロック」。手順：①開いた時の revision を保持 ②保存時に付けて PUT ③拒否されたら最新を GET して 3方向マージ（<code>ui-kit/merge.js\u003c/code>）→ 再 PUT。\u003c/p>\n<pre>// 1件更新\nPUT /k/v1/record.json  { app: 1, id: 1001, revision: 5, record: { 数量: { value: '120' } } }\n// 拒否された場合（HTTP 409 系。エラーコードは公式で確認）→ 78 のフロー\nconst server = await api({ method: 'GET', path: '/k/v1/record.json', params: { app: 1, id } });\nconst { merged, conflicts } = threeWayMerge(base, mine, flatten(server.record));\nif (conflicts.length) { /* ダイアログで選ばせる */ }\nawait api({ method: 'PUT', path: '/k/v1/record.json', body: { app: 1, id, revision: server.record.$revision.value, record: toKintone(merged) } });\u003c/pre>\n    <p>57 の楽観的更新と組み合わせるなら：画面は先に変え、PUT 失敗（競合含む）で巻き戻してから 78 へ。\u003c/p>\u003c/div>\n\n  <div class=\"ref\"><h2>3. 一括更新 <small>← 76 バッチ操作\u003c/small>\u003c/h2>\n    <p><code>PUT /k/v1/records.json\u003c/code> は 1回 <b>最大 100 件\u003c/b>（POST 追加・DELETE 削除も同様）。101 件以上は 76 のようにチャンク分割し、チャンクごとに進捗を進める。1回のリクエスト内は全件成功か全件失敗（原子的）なので、「部分失敗」はチャンク単位で起きる。複数種類の操作をまとめて原子的に行いたいときは <code>bulkRequest\u003c/code>（1回の中に複数リクエスト、上限あり）。\u003c/p>\n<pre>for (const chunk of chunks(changes, 100)) {\n  try { await api({ method: 'PUT', path: '/k/v1/records.json', body: { app: 1, records: chunk.map(c => ({ id: c.id, revision: c.revision, record: c.record })) } }); done += chunk.length; }\n  catch (err) { failed.push({ chunk, err }); }           // 76: 失敗チャンクだけ再試行\n  progress.value = done;\n}\u003c/pre>\u003c/div>\n\n  <div class=\"ref\"><h2>4. 検索 <small>← 74 検索の型\u003c/small>\u003c/h2>\n    <p>サーバ検索は <code>query\u003c/code> パラメータ（<code>like\u003c/code>、<code>in\u003c/code>、<code>and/or\u003c/code>、<code>order by\u003c/code>）。入力のたびに投げないよう 74 のデバウンス（250ms 以上）を入れ、前のリクエストが返る前に次が出たら古い結果を捨てる（連番で判定）。取得済みデータの絞り込みなら手元で <code>ui-kit/search.js\u003c/code>。\u003c/p>\n<pre>let seq = 0;\nconst run = debounce(async (text) => {\n  const my = ++seq;\n  const res = await api({ method: 'GET', path: '/k/v1/records.json', params: { app: 1, query: `品名 like \"${escapeQuery(text)}\" order by $id desc limit 100` } });\n  if (my !== seq) return;                                 // 古い応答は捨てる\n  render(res.records);\n}, 300);\u003c/pre>\u003c/div>\n\n  <div class=\"ref\"><h2>5. オフラインと再送 <small>← 79\u003c/small>\u003c/h2>\n    <p>現場端末で通信が切れる前提なら、更新を <code>ui-kit/offline-queue.js\u003c/code> に積む。job には <b>app, id, revision, record\u003c/b> を入れ、送信時に revision 不一致なら 78 のフローへ回す（課題12）。Electron では main 再起動後もキューが残るよう、<code>storage\u003c/code> にファイル保存の実装を渡す。\u003c/p>\u003c/div>\n\n  <div class=\"ref\"><h2>6. フィールド型と UI 部品の対応\u003c/h2>\n    <table class=\"cmp\">\n      <tr><th style=\"width:200px\">kintone フィールド\u003c/th><th>値の形\u003c/th><th>向く UI（番号）\u003c/th>\u003c/tr>\n      <tr><td>文字列（1行）／数値\u003c/td><td><code>{ value: '…' }\u003c/code>\u003c/td><td>38 インライン編集、56 グリッド\u003c/td>\u003c/tr>\n      <tr><td>ドロップダウン／ラジオ\u003c/td><td><code>{ value: '選択肢' }\u003c/code>\u003c/td><td>20 ドロップダウン、36 コマンドパレット（選択肢が多い時）\u003c/td>\u003c/tr>\n      <tr><td>チェックボックス／複数選択\u003c/td><td><code>{ value: ['a','b'] }\u003c/code>\u003c/td><td>11 選択（Ctrl/Shift）\u003c/td>\u003c/tr>\n      <tr><td>日付／日時\u003c/td><td><code>'2026-09-12'\u003c/code> / ISO 8601\u003c/td><td>84 タイムライン、75 フォーム\u003c/td>\u003c/tr>\n      <tr><td>ユーザー選択\u003c/td><td><code>{ value: [{ code, name }] }\u003c/code>\u003c/td><td>74 あいまい検索つき選択\u003c/td>\u003c/tr>\n      <tr><td>テーブル（サブテーブル）\u003c/td><td><code>{ value: [{ id, value: {…} }] }\u003c/code>\u003c/td><td>56 グリッド、32 並べ替え\u003c/td>\u003c/tr>\n      <tr><td>添付ファイル\u003c/td><td><code>{ value: [{ fileKey, name }] }\u003c/code>\u003c/td><td>59 ファイルドロップ → アップロード API → fileKey を付けて PUT\u003c/td>\u003c/tr>\n      <tr><td>関連レコード／ルックアップ\u003c/td><td>参照先の値\u003c/td><td>83 スマートプレビュー（ホバーで参照先を先読み）\u003c/td>\u003c/tr>\n      <tr><td>$id / $revision\u003c/td><td>システム値\u003c/td><td>78 競合解決、82 ルーティング（URL に id）\u003c/td>\u003c/tr>\n    \u003c/table>\n  \u003c/div>\n\n  <div class=\"ref\"><h2>7. 上限の早見表（要公式確認）\u003c/h2>\n    <table class=\"cmp\">\n      <tr><th style=\"width:280px\">操作\u003c/th><th>上限（把握値）\u003c/th><th>UI 側の対応\u003c/th>\u003c/tr>\n      <tr><td>GET records の limit\u003c/td><td>500 件/回\u003c/td><td>21 ページング、23 仮想スクロール\u003c/td>\u003c/tr>\n      <tr><td>GET records の offset\u003c/td><td>上限あり（大きい値は拒否）\u003c/td><td>id 基準取得かカーソル API\u003c/td>\u003c/tr>\n      <tr><td>POST / PUT / DELETE records\u003c/td><td>100 件/回\u003c/td><td>76 チャンク分割と進捗\u003c/td>\u003c/tr>\n      <tr><td>bulkRequest\u003c/td><td>複数リクエストを1回で原子的に（件数上限あり）\u003c/td><td>76 の「全部成功か全部失敗」が必要な時\u003c/td>\u003c/tr>\n      <tr><td>同時リクエスト数\u003c/td><td>ドメインごとに上限あり\u003c/td><td>並列度を絞る（76 の Promise.all は数件まで）\u003c/td>\u003c/tr>\n      <tr><td>query の文字列長／like\u003c/td><td>上限あり。前方一致のみ等の制約\u003c/td><td>74 で手元検索と併用\u003c/td>\u003c/tr>\n    \u003c/table>\n  \u003c/div>\n  <div class=\"ref\"><h2>8. kintone カスタマイズ JS の中で使う場合（Electron ではなく kintone 画面内）\u003c/h2>\n    <p>kintone の画面に JS を読み込ませるカスタマイズでは、通信は <code>kintone.api()\u003c/code>（CORS も認証も不要）、画面の差し込み先は <code>kintone.app.getHeaderSpaceElement()\u003c/code> 等。デモと ui-kit はそのまま使えるが、<b>kintone 側の DOM は書き換えない\u003c/b>（アップデートで壊れる）。自前の要素をスペースに追加し、その中で動かす。\u003c/p>\n<pre>(function () {\n  'use strict';\n  kintone.events.on('app.record.index.show', async (event) => {\n    const space = kintone.app.getHeaderSpaceElement();            // 自前 UI の置き場所\n    if (space.querySelector('.my-panel')) return event;            // 二重描画防止\n    const panel = document.createElement('div'); panel.className = 'my-panel'; space.appendChild(panel);\n\n    // 通信：REST を直接叩かず kintone.api（トークン不要、CORS 不要）\n    const res = await kintone.api(kintone.api.url('/k/v1/records', true), 'GET', { app: kintone.app.getId(), query: 'limit 500' });\n\n    // ui-kit（dist 版をカスタマイズ JS として先に読み込んでおく → window.UIKit）\n    const { createVirtualList, createToaster } = window.UIKit;\n    const view = document.createElement('div'); view.style.cssText = 'height:300px;overflow:auto'; panel.appendChild(view);\n    createVirtualList(view, { rowHeight: 28, count: res.records.length, renderRow: i => `&lt;div&gt;${res.records[i].品名.value}&lt;/div&gt;` });\n    createToaster().show(`${res.records.length} 件を表示`);\n    return event;\n  });\n  // 編集画面の保存前検証（75 の作法でエラー項目を示す）\n  kintone.events.on(['app.record.create.submit', 'app.record.edit.submit'], (event) => {\n    if (+event.record.数量.value <= 0) event.record.数量.error = '数量は1以上';   // 項目に error を付けると kintone が表示する\n    return event;\n  });\n})();\u003c/pre>\n    <p>ショートカット（35）を kintone 画面で登録するときは、kintone 自身のキー操作と衝突しないよう修飾キー付きに限定する。ページ遷移で JS が読み直されるため、81 の永続化は <code>localStorage\u003c/code> にアプリ ID をキーに含めて保存する。\u003c/p>\u003c/div>\n  <p class=\"note\">エラー時の JSON には <code>code\u003c/code>・<code>message\u003c/code>・<code>errors\u003c/code>（項目ごとの詳細）が入る。75 の作法どおり「どの項目が、なぜ」を画面に出し、該当項目へフォーカスを移す。\u003c/p>\n\u003c/main>\n\u003c/body>\n\u003c/html>\n","docs/ui-guide/14-playground.html":"<!DOCTYPE html>\n<html lang=\"ja\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>プレイグラウンド\u003c/title>\n<link rel=\"stylesheet\" href=\"assets/guide.css\">\n\u003cscript src=\"assets/demo-data.js\">\u003c/script>\n<style>\n  .tierF { background: #475569; }\n  .pg { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 14px 20px; max-width: 1400px; margin: 0 auto; }\n  .pg .editors { display: grid; grid-template-rows: auto 1fr 1fr 1fr; gap: 8px; min-height: calc(100vh - 140px); }\n  .pg textarea { width: 100%; height: 100%; min-height: 120px; font: 12.5px/1.5 ui-monospace, Menlo, Consolas, monospace; tab-size: 2; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--code); color: #e2e8f0; resize: vertical; white-space: pre; }\n  .pg label.ed { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); min-height: 0; }\n  .pg iframe { width: 100%; height: 100%; min-height: 480px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }\n  .pg .preview { display: flex; flex-direction: column; gap: 8px; }\n  .pg .desc { font-size: 13px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }\n  .pg .desc .how { color: var(--muted); margin: 4px 0 0; }\n  .err { color: #dc2626; font: 12px ui-monospace, monospace; white-space: pre-wrap; }\n  @media (max-width: 900px) { .pg { grid-template-columns: 1fr; } }\n\u003c/style>\n\u003c/head>\n<body>\n<header class=\"top\">\n  <h1>プレイグラウンド <span class=\"tier tierF\">編集して即実行\u003c/span>\u003c/h1>\n  <nav><a href=\"00-index.html\">⌂ 入口\u003c/a><a href=\"01-ui-operations-catalog.html\">カタログ\u003c/a><a href=\"09-exercises.html\">課題\u003c/a>\u003c/nav>\n  <select id=\"pick\" style=\"margin-left:auto;max-width:360px\">\u003c/select>\n  <button id=\"run\" class=\"primary\">実行（Ctrl+Enter）\u003c/button>\n  <button id=\"reset\">元に戻す\u003c/button>\n  <button id=\"discard\" title=\"この デモの下書きを消して元のコードに戻す\">下書きを破棄\u003c/button>\n  <span id=\"draft\" class=\"readout\" hidden>下書き復元\u003c/span>\n  <a id=\"back\" href=\"#\" style=\"font-size:13px\">元のデモへ\u003c/a>\n\u003c/header>\n<div class=\"pg\">\n  <div class=\"editors\">\n    <div class=\"desc\"><b id=\"d-title\">\u003c/b><p id=\"d-what\" style=\"margin:4px 0 0\">\u003c/p><p class=\"how\" id=\"d-how\">\u003c/p>\u003c/div>\n    <label class=\"ed\">HTML（デモ領域）<textarea id=\"ed-html\" spellcheck=\"false\">\u003c/textarea>\u003c/label>\n    <label class=\"ed\">CSS<textarea id=\"ed-css\" spellcheck=\"false\">\u003c/textarea>\u003c/label>\n    <label class=\"ed\">JavaScript（$ / $$ / logTo が使える）<textarea id=\"ed-js\" spellcheck=\"false\">\u003c/textarea>\u003c/label>\n  \u003c/div>\n  <div class=\"preview\">\n    <iframe id=\"frame\" title=\"実行結果\">\u003c/iframe>\n    <div class=\"err\" id=\"err\">\u003c/div>\n    <p class=\"note\">練習課題（09）の解答をここで試せる。書き換えはデモごとに下書きとして自動保存される（この端末のブラウザ内）。「元に戻す」は元のコードを表示、「下書きを破棄」は保存も消す。iframe 内では <code>localStorage\u003c/code> と <code>BroadcastChannel\u003c/code> も動くので、75・80・81・85 も試せる。\u003c/p>\n  \u003c/div>\n\u003c/div>\n\u003cscript>\n(() => {\n  const $ = s => document.querySelector(s);\n  const pick = $('#pick'), frame = $('#frame'), err = $('#err');\n  const byId = Object.fromEntries(DEMOS.map(d => [d.id, d]));\n  // ページごとに optgroup\n  const groups = new Map(); DEMOS.forEach(d => { if (!groups.has(d.page)) groups.set(d.page, []); groups.get(d.page).push(d); });\n  pick.innerHTML = [...groups].map(([page, list]) => `<optgroup label=\"${list[0].pageTitle}\">${list.map(d => `<option value=\"${d.id}\">${d.title}\u003c/option>`).join('')}\u003c/optgroup>`).join('');\n  let current = null;\n  const KEY = id => 'ui-guide.playground.' + id;   // デモごとの下書き（この端末のブラウザに保存）\n  const readDraft = id => { try { return JSON.parse(localStorage.getItem(KEY(id)) || 'null'); } catch { return null; } };\n  const saveDraft = () => { if (!current) return; const d = { html: $('#ed-html').value, css: $('#ed-css').value, js: $('#ed-js').value };\n    const same = d.html === current.html && d.css === current.css && d.js === current.js;\n    try { same ? localStorage.removeItem(KEY(current.id)) : localStorage.setItem(KEY(current.id), JSON.stringify(d)); } catch {} $('#draft').hidden = same; };\n  const load = (id, { useDraft = true } = {}) => {\n    current = byId[id] || DEMOS[0]; pick.value = current.id;\n    $('#d-title').textContent = current.title; $('#d-what').textContent = current.what; $('#d-how').textContent = current.how;\n    const d = useDraft ? readDraft(current.id) : null;\n    $('#ed-html').value = d?.html ?? current.html; $('#ed-css').value = d?.css ?? current.css; $('#ed-js').value = d?.js ?? current.js;\n    $('#draft').hidden = !d;\n    $('#back').href = `${current.page}#${current.id}`; history.replaceState(null, '', '#' + current.id);\n    run();\n  };\n  const run = () => {\n    err.textContent = '';\n    // srcdoc は親と同じ基準 URL を持つので、相対パスの guide.css / guide.js がそのまま読める\n    frame.srcdoc = `<!DOCTYPE html><html lang=\"ja\"><head><meta charset=\"utf-8\"><link rel=\"stylesheet\" href=\"assets/guide.css\">\u003cscript src=\"assets/guide.js\"><\\/script>\n<style>body{padding:14px;background:#f6f7f9}section.demo{margin:0}<\\/style><style>${$('#ed-css').value}<\\/style>\u003c/head>\n<body><section class=\"demo\" id=\"${current.id}\">${$('#ed-html').value}\u003c/section>\n\u003cscript>window.onerror=(m,s,l,c)=>{parent.postMessage({pgError:m+' (行 '+l+')'},'*')};try{${$('#ed-js').value}\\n}catch(e){parent.postMessage({pgError:String(e)},'*')}<\\/script>\u003c/body>\u003c/html>`;\n  };\n  window.addEventListener('message', e => { if (e.data?.pgError) err.textContent = 'エラー: ' + e.data.pgError; });\n  pick.onchange = () => load(pick.value);\n  $('#run').onclick = run;\n  $('#reset').onclick = () => { $('#ed-html').value = current.html; $('#ed-css').value = current.css; $('#ed-js').value = current.js; run(); };\n  $('#discard').onclick = () => { try { localStorage.removeItem(KEY(current.id)); } catch {} load(current.id, { useDraft: false }); };\n  let saveTimer; document.querySelectorAll('textarea').forEach(t => t.addEventListener('input', () => { clearTimeout(saveTimer); saveTimer = setTimeout(saveDraft, 300); }));\n  document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); run(); } });\n  // textarea で Tab をインデントに\n  document.querySelectorAll('textarea').forEach(t => t.addEventListener('keydown', e => { if (e.key === 'Tab') { e.preventDefault(); const s = t.selectionStart; t.setRangeText('  ', s, t.selectionEnd, 'end'); } }));\n  load((location.hash || '#n02').slice(1));\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","docs/ui-guide/15-curriculum.html":"<!DOCTYPE html>\n<html lang=\"ja\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>学習カリキュラム\u003c/title>\n<link rel=\"stylesheet\" href=\"assets/guide.css\">\n\u003cscript src=\"assets/guide.js\">\u003c/script>\n<style>\n  .tierF { background: #475569; }\n  main.single { max-width: 900px; margin: 0 auto; padding: 24px; }\n  .day { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; margin-bottom: 12px; }\n  .day h2 { margin: 0 0 4px; font-size: 16px; display: flex; align-items: baseline; gap: 10px; } .day h2 small { color: var(--muted); font-weight: 400; font-size: 12.5px; }\n  .day .goal { font-size: 13px; color: var(--muted); margin: 0 0 8px; }\n  .day label { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; padding: 4px 0; cursor: pointer; }\n  .day label.done { color: var(--muted); text-decoration: line-through; }\n  .bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 8px 0 16px; } .bar i { display: block; height: 100%; background: var(--accent); transition: width .3s; }\n\u003c/style>\n\u003c/head>\n<body>\n<header class=\"top\">\n  <h1>学習カリキュラム <span class=\"tier tierF\">7ステップ\u003c/span>\u003c/h1>\n  <nav><a href=\"00-index.html\">⌂ 入口\u003c/a><a href=\"01-ui-operations-catalog.html\">カタログ\u003c/a><a href=\"11-quiz.html\">クイズ\u003c/a><a href=\"09-exercises.html\">課題\u003c/a>\u003c/nav>\n\u003c/header>\n<main class=\"single\">\n  <div class=\"lead\">この資料を「名称が分かる」→「動きを説明できる」→「自分で組める」の順に進めるための道筋。1ステップ60〜120分。チェックはこの端末のブラウザに保存される。順番は守らなくてよいが、ステップ1と7は飛ばさない。\u003c/div>\n  <div class=\"row\"><span class=\"readout\" id=\"prog\">-\u003c/span><button id=\"reset\">チェックを全部消す\u003c/button>\u003c/div>\n  <div class=\"bar\"><i id=\"bar\">\u003c/i>\u003c/div>\n  <div id=\"days\">\u003c/div>\n\u003c/main>\n\u003cscript>\n(() => {\n  const PLAN = [\n    { title: 'ステップ1：土台を作る', time: '60分', goal: '座標系・イベント・描画の順序を言葉で説明できる。混同しやすい用語を切り分けられる。', items: [\n      ['00-index.html', '入口を読み、資料の構成を把握する'], ['08-foundations.html#f1', 'F1 座標系：5種類の原点の違いを自分の言葉で言える'], ['08-foundations.html#f2', 'F2 伝播：preventDefault と stopPropagation の違いを言える'],\n      ['08-foundations.html#f3', 'F3 transform と left/top の違いと、なぜ transform を使うか'], ['08-foundations.html#f11', 'F11 描画タイミング：void offsetWidth と rAF 2回の理由'], ['08-foundations.html#f8', 'F8 用語対比表を一通り読む'] ] },\n    { title: 'ステップ2：一般的な操作（A層）', time: '90分', goal: '01〜22 の名称を見て動きが想像できる。', items: [\n      ['02-basic.html', 'A層 01〜22 のデモを全部触る（コードは開かなくてよい）'], ['11-quiz.html', 'クイズ：A層のみ・20問で 16 点以上'], ['02-basic.html#n02', '02 パン と 01 スクロール の違いを説明できる'], ['02-basic.html#n15', '15 モーダル の作法（Esc・フォーカス・暗幕）を3つ言える'] ] },\n    { title: 'ステップ3：標準挙動を制御する（B層）', time: '90分', goal: 'Pointer Events・Observer・rAF の3つの道具の使いどころが分かる。', items: [\n      ['03-custom.html', 'B層 23〜42 のデモを触り、23・28・30・37 はコードも読む'], ['09-exercises.html', '課題1〜3 を解く（プレイグラウンドで）'], ['11-quiz.html', 'クイズ：B層のみ・20問で 16 点以上'], ['03-custom.html#n28', '28 慣性 と 29 スプリング の違いを説明できる'] ] },\n    { title: 'ステップ4：ツール系の高度操作（C層）', time: '120分', goal: '座標変換と状態機械で、ドラッグ系の機能を自分で設計できる。', items: [\n      ['04-pro.html#n43', '43〜45 座標変換を読み、toWorld / toScreen の式を書ける'], ['04-pro.html#n52', '52 状態機械：idle / pressed / dragging の遷移を図にできる'], ['04-pro.html', 'C層の残りを触る（55・56・57・58 はコードも読む）'],\n      ['08-foundations.html#f9', 'F9・F10 で「重い」を数字にする方法を知る'], ['09-exercises.html', '課題4〜8 を解く'] ] },\n    { title: 'ステップ5：業務アプリの設計（D層）', time: '120分', goal: '一覧・編集・一括処理・競合・オフラインを、部品の組み合わせとして説明できる。', items: [\n      ['05-advanced.html', 'D層 71〜86 のデモを触る'], ['13-kintone.html', 'kintone リファレンス：取得方式・revision・100件上限とデモ番号の対応を読む'], ['05-advanced.html#n78', '78 競合解決：3方向マージの判定表を自分で書ける'],\n      ['09-exercises.html', '課題9〜12 を解く（12 は要点だけでよい）'], ['11-quiz.html', 'クイズ：D層のみ・16問'] ] },\n    { title: 'ステップ6：演出とアクセシビリティ', time: '60分', goal: '「入れる演出・入れない演出」の判断基準と、キーボード・読み上げ・色・動きのチェックができる。', items: [\n      ['06-effects.html', 'E層 63〜70 を触り、69 のフレーム時間を自分の端末で見る'], ['10-accessibility.html', 'A1〜A6：自分のアプリに当てはめてチェックリストを埋める'], ['03-custom.html#n42', '42 モーション低減を必ず実装すると決める'] ] },\n    { title: 'ステップ7：自分のアプリに組み込む', time: '半日', goal: 'ui-kit を1つ import して、既存画面を壊さずに動かす。', items: [\n      ['../../ui-kit/example/index.html', 'ui-kit 実例アプリを触り、どの部品がどこで使われているか対応づける'], ['12-electron.html', 'Electron リファレンス：構成の原則と IPC の形を自分のアプリに当てはめる'], ['07-implementation-plan.md', '実装計画の「確認事項」を埋める'],\n      ['14-playground.html#n23', 'プレイグラウンドで 23 仮想スクロール を自分のデータ形に書き換える'], ['../../ui-kit/README.md', 'hotkeys.js（Ctrl+S）を最初の1つとして組み込む'] ] },\n  ];\n  const KEY = 'ui-guide.curriculum'; let done = new Set(); try { done = new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch {}\n  const total = PLAN.reduce((a, d) => a + d.items.length, 0);\n  const render = () => {\n    document.getElementById('days').innerHTML = PLAN.map((d, di) => `<div class=\"day\"><h2>${d.title} <small>${d.time}\u003c/small>\u003c/h2><p class=\"goal\">到達目標：${d.goal}\u003c/p>${d.items.map(([href, text], ii) => { const k = di + '-' + ii; return `<label class=\"${done.has(k) ? 'done' : ''}\"><input type=\"checkbox\" data-k=\"${k}\" ${done.has(k) ? 'checked' : ''}><span>${text} <a href=\"${href}\">→\u003c/a>\u003c/span>\u003c/label>`; }).join('')}\u003c/div>`).join('');\n    document.getElementById('prog').textContent = `${done.size} / ${total} 完了`; document.getElementById('bar').style.width = (done.size / total * 100) + '%';\n  };\n  document.getElementById('days').addEventListener('change', e => { const k = e.target.dataset.k; if (!k) return; e.target.checked ? done.add(k) : done.delete(k); try { localStorage.setItem(KEY, JSON.stringify([...done])); } catch {} render(); });\n  document.getElementById('reset').onclick = () => { done = new Set(); try { localStorage.removeItem(KEY); } catch {} render(); };\n  render();\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","docs/ui-guide/README.md":"# UI操作レクチャー資料（バニラJS / HTML）\n\nフロントエンドUIの「操作名称」と「動作」を対応づける教材。依存ライブラリなし。各HTMLをブラウザで開くだけで動く（サーバ不要）。\n\n| # | ファイル | 内容 | 状態 |\n|---|---|---|---|\n| 00 | `00-index.html` | 入口。おすすめの順路、読み方、付属物 | 完成 |\n| 01 | `01-ui-operations-catalog.html` | UI操作の分類リスト（A:一般 / B:カスタマイズ / C:プロ志向、通し番号01〜62、検索・フィルタ、各項目からデモへリンク） | 完成 |\n| 02 | `02-basic.html` | A層 01〜22 の動くデモ（スクロール、パン、ズーム、DnD、フェード、モーダル…） | 完成 |\n| 03 | `03-custom.html` | B層 23〜42 の動くデモ（仮想スクロール、慣性、スプリング、FLIP、並べ替え、Undo/Redo…） | 完成 |\n| 04 | `04-pro.html` | C層 43〜62 の動くデモ（無限キャンバス、ミニマップ、ノードエディタ、スナップ、データグリッド、Electron…） | 完成 |\n| 05 | `05-advanced.html` | D層（第3弾・第4弾）業務アプリの設計パターン 16項目：大規模グリッド複合(71)、ツリーグリッド(72)、ピボット(73)、検索の型(74)、フォームの型(75)、バッチ操作(76)、差分表示(77)、競合解決(78)、オフライン対応(79)、ドッキング完成形(80)、ワークスペース永続化(81)、ルーティングと履歴(82)、スマートプレビュー(83)、タイムライン/ガント(84)、マルチウィンドウ同期(85)、監視ボード(86) | 完成 |\n| 06 | `06-effects.html` | E層（第4弾）演出・体感の上位効果 8項目：シェアードエレメント遷移(63)、スタガー(64)、スケルトンモーフ(65)、マイクロインタラクション(66)、ジェスチャー連動の物理(67)、CSSスクロール駆動(68)、ぼかしと性能(69)、テーマ切替のクロスフェード(70) | 完成 |\n| 08 | `08-foundations.html` | 基礎知識：座標系、イベント伝播、transform vs left/top、passive、動かし方の4手段、スロットル/デバウンス、スタッキングコンテキスト、混同しやすい用語の対比表（20組） | 完成 |\n| 09 | `09-exercises.html` | 練習課題12問（難易度1〜3、ヒントと解答例つき） | 完成 |\n| 10 | `10-accessibility.html` | アクセシビリティ：フォーカス順の可視化、名前のない操作要素の検出、コントラスト計算、aria-live、環境設定検出、チェックリスト | 完成 |\n| 11 | `11-quiz.html` | 名称当てクイズ（カタログのデータから出題、層・問題数・英語名モード） | 完成 |\n| 12 | `12-electron.html` | Electron 実装リファレンス（参照用、コードは実行されない） | 完成 |\n| 13 | `13-kintone.html` | kintone 連携リファレンス（参照用、上限値は公式で要確認） | 完成 |\n| 16 | `16-bundler.html` | 単一ファイル版を作るバンドラ（ブラウザだけで生成。Node 不要） | 完成 |\n| 15 | `15-curriculum.html` | 学習カリキュラム（7ステップ、到達目標、チェック保存） | 完成 |\n| 14 | `14-playground.html` | プレイグラウンド：各デモの HTML / CSS / JS を編集して即実行（`assets/demo-data.js` を `build.mjs` が生成） | 完成 |\n| 07 | `07-implementation-plan.md` | 実装計画：部品ライブラリ化（完了）と Mission Bridge への適用手順・確認事項 | 計画 |\n| - | `assets/guide.css` / `assets/guide.js` / `assets/catalog-data.js` | 共通スタイル、目次生成、コード表示ランタイム、カタログデータ（01 と 11 が共有） | - |\n| - | `../ui-kit/` | デモから切り出した再利用部品（15モジュール、テスト26件、単一ファイル版 `dist/ui-kit.js`、実例 `example/index.html`） | 完成 |\n| - | `build.mjs` | デモ抽出（`assets/demo-data.js`）・検索索引（`assets/search-index.js`）・収録一覧（`assets/manifest.js`）・単一ファイル版（`dist/ui-guide-standalone.html`）の生成。デモを編集したら `npm run build:docs` | - |\n| - | `assets/bundler.js` / `assets/standalone-shell.js` | 単一ファイル版の組み立て処理と、生成物の中で動くランタイム。ブラウザ（16）と Node（build.mjs）が同じものを使う | - |\n| - | `dist/ui-guide-standalone.html` | 生成済みの単一ファイル版（約 0.7 MB）。ダブルクリックで開き、そのまま配布できる | 生成物 |\n| - | `test/verify.mjs` | 教材ページの検証（JSエラー、リンク、デモ数、代表操作、タッチスワイプ）。`npm run test:docs` | - |\n\n## デモページの読み方\n各項目は次の3段構成。\n1. **動作の意味**：その操作が何をするものか、何と混同しやすいか\n2. **操作してみる**：ページ上で実際に触れる\n3. **コードを見る**：折りたたみを開くと、そのデモを動かしている CSS / JS の実物が表示される（表示コード＝実行コード。`data-code` 属性の付いた `<style>` / `\u003cscript>` を `guide.js` が転記している）\n\n## 学習の補助\n- `00-index.html` の横断検索：全ページの見出しと説明を検索\n- カタログの「理解した」チェック：進捗はこの端末のブラウザ（`localStorage`）に保存。未習得のみ表示できる\n- テーマ：ヘッダーのボタンで OS設定／ダーク／ライトを切替。デモ領域は配色固定\n- プレイグラウンドの下書き：デモごとに `localStorage` へ自動保存。「下書きを破棄」で消せる\n- クイズ「動きを見て当てる」：デモを iframe で動かし、説明文なしで名称を当てる\n\n## 前提・制約\n- 動作確認は Chromium 系ブラウザで実施。View Transitions（31）・`popover` 等は対応ブラウザでのみ動き、非対応時はフォールバックする\n- 61・62（Electron のフレームレスウィンドウ／ネイティブメニュー）はブラウザ上では動作しないため、模擬動作とメイン／preload／renderer のコード提示にとどめている\n- 50（マルチタッチ）はタッチ端末での2本指操作が本来の形。マウスでは Shift+ドラッグで2本目の指を模擬する\n- D層・E層の番号（63〜86）は第3弾提案時のリスト番号をそのまま使っている（63〜70 が E層、71〜86 が D層）\n- 08 基礎知識に F9（レイアウトスラッシング）・F10（計測の道具）・F11（イベントループと描画タイミング）を追加。F4 は仕様上、passive リスナー内の preventDefault でコンソールに警告が出る（意図した実演）\n- 01 カタログは印刷ボタンでフィルタ結果を早見表として印刷できる。番号・部品名でも検索でき、ui-kit の対応部品をバッジ表示する\n- 63・68・70 は View Transitions / `animation-timeline` 対応ブラウザ（Chromium 系）で本来の動きになる。非対応では即時切替・静的表示にフォールバックする\n- 75・79・80・81 は `localStorage` に下書き・キュー・レイアウト・作業状態を保存する（キーは `ui-guide.*`）。85 は `BroadcastChannel` と `storage` イベントの2経路で同期する\n\n## 新しいデモを追加する\n`section.demo` を1つ追加し、その中に `<style data-code>` と `\u003cscript data-code>` を置くだけで、目次とコード表示は自動生成される。\n```html\n<section class=\"demo\" id=\"n63\">\n  <h2><span class=\"no\">63\u003c/span>名称 <small>English\u003c/small>\u003c/h2>\n  <p class=\"what\">動作の意味\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>…\u003c/p>\n  <div class=\"stage\">…\u003c/div>\n  <style data-code>…\u003c/style>\n  \u003cscript data-code>(() => { … })();\u003c/script>\n\u003c/section>\n```\n","docs/ui-guide/assets/catalog-data.js":"// カタログのデータ（01 と 11 クイズが共有）。{ tier, no?, ja, en, desc, api }\nwindow.ITEMS = [\n  // ===== A: 一般的なUI操作 =====\n  { tier:'A', ja:'スクロール', en:'Scroll', desc:'コンテンツが表示領域より大きい時に、表示位置を縦横に移動する。ホイール・タッチ・キーボードで発生。', api:'<code>overflow\u003c/code>, <code>scrollTo()\u003c/code>, <code>scroll-behavior: smooth\u003c/code>, <code>scroll\u003c/code> イベント' },\n  { tier:'A', ja:'パン', en:'Pan', desc:'ドラッグで「視点」を平行移動する。スクロールと違い、コンテンツ自体を掴んで動かす感覚（地図・図面・キャンバス）。', api:'<code>pointerdown/move/up\u003c/code> で差分を <code>transform: translate()\u003c/code> に反映' },\n  { tier:'A', ja:'ズーム', en:'Zoom', desc:'表示倍率を変える。ホイール、ピンチ、＋−ボタン。「どこを中心に拡大するか」が実装の要。', api:'<code>wheel\u003c/code> イベント（<code>ctrlKey\u003c/code>でピンチ判定）, <code>transform: scale()\u003c/code>' },\n  { tier:'A', ja:'クリック / タップ', en:'Click / Tap', desc:'最も基本の操作。マウスとタッチで発火順序が異なる点に注意（touch→mouse合成イベント）。', api:'<code>click\u003c/code>, <code>pointerup\u003c/code>' },\n  { tier:'A', ja:'ダブルクリック / 長押し', en:'Double click / Long press', desc:'同じ位置での連続操作、または一定時間押し続ける操作。長押しは標準イベントがなくタイマーで判定する。', api:'<code>dblclick\u003c/code>, <code>setTimeout\u003c/code> + <code>pointerdown/up\u003c/code>' },\n  { tier:'A', ja:'ホバー', en:'Hover', desc:'ポインタが要素上にある状態。タッチ端末には存在しないため、ホバー依存の情報提示は避ける。', api:'<code>:hover\u003c/code>, <code>pointerenter/leave\u003c/code>, <code>@media (hover: hover)\u003c/code>' },\n  { tier:'A', ja:'フォーカス', en:'Focus', desc:'キーボード入力の受け先。Tabで移動。可視化（focus ring）はアクセシビリティ上必須。', api:'<code>:focus-visible\u003c/code>, <code>tabindex\u003c/code>, <code>element.focus()\u003c/code>' },\n  { tier:'A', ja:'ドラッグ&ドロップ', en:'Drag and Drop', desc:'要素を掴んで別の場所へ移す。HTML標準DnD APIと、Pointer Eventsで自作する方式の2系統がある。', api:'<code>draggable\u003c/code>, <code>dragstart/dragover/drop\u003c/code> / または Pointer Events 自作' },\n  { tier:'A', ja:'スワイプ / フリック', en:'Swipe / Flick', desc:'指を素早く払う操作。移動量と速度で判定する。カルーセル、ページ送り、削除UIなどで使う。', api:'<code>touchstart/end\u003c/code> または <code>pointer*\u003c/code> の座標差と経過時間' },\n  { tier:'A', ja:'リサイズ', en:'Resize', desc:'パネルやウィンドウ、テキストエリアの大きさを変える。ハンドル（つまみ）をドラッグする方式が一般的。', api:'<code>resize: both\u003c/code>, <code>ResizeObserver\u003c/code>, ハンドル＋Pointer Events' },\n  { tier:'A', ja:'選択', en:'Select', desc:'項目を1つ／複数選ぶ。Shift（範囲）、Ctrl/Cmd（追加）の修飾キー慣習を守ると業務ユーザーに馴染む。', api:'<code>aria-selected\u003c/code>, <code>shiftKey / ctrlKey / metaKey\u003c/code>' },\n  { tier:'A', ja:'フェードイン / フェードアウト', en:'Fade in / out', desc:'不透明度を徐々に変えて出現・消失させる。最も安価で違和感の少ない演出。', api:'<code>opacity\u003c/code> + <code>transition\u003c/code>, <code>animation\u003c/code>, <code>transitionend\u003c/code>' },\n  { tier:'A', ja:'スライドイン / スライドアウト', en:'Slide in / out', desc:'画面端から滑り込む／出ていく。サイドパネル、ドロワー、通知で多用。', api:'<code>transform: translateX()\u003c/code> + <code>transition\u003c/code>' },\n  { tier:'A', ja:'トランジション / イージング', en:'Transition / Easing', desc:'状態変化を時間で補間する仕組みと、その速度カーブ。ease-out は「素早く出て静かに止まる」ためUI向き。', api:'<code>transition\u003c/code>, <code>transition-timing-function\u003c/code>, <code>cubic-bezier()\u003c/code>' },\n  { tier:'A', ja:'モーダル / ダイアログ', en:'Modal / Dialog', desc:'背後の操作を止めて前面で確認・入力させる。フォーカス閉じ込め（focus trap）とEscで閉じるのが作法。', api:'<code>&lt;dialog&gt;\u003c/code>, <code>showModal()\u003c/code>, <code>::backdrop\u003c/code>' },\n  { tier:'A', ja:'トースト / スナックバー', en:'Toast / Snackbar', desc:'操作結果を短時間だけ隅に表示し自動で消える通知。操作を妨げない。', api:'<code>position: fixed\u003c/code> + フェード/スライド + <code>setTimeout\u003c/code>, <code>aria-live\u003c/code>' },\n  { tier:'A', ja:'ツールチップ / ポップオーバー', e addEventListener('scroll', () => out.textContent = `scrollTop: ${Math.round(box.scrollTop)}`);\\n  $('#s01-top').onclick = () => box.scrollTo({ top: 0, behavior: 'smooth' });\\n  $('#s01-mid').onclick = () => box.children[49].scrollIntoView({ block: 'start' });\\n  $('#s01-end').onclick = () => box.scrollTo({ top: box.scrollHeight, behavior: 'smooth' });\\n})();\"},{\"page\":\"02-basic.html\",\"pageTitle\":\"第2弾 A：一般的なUI操作（01〜22）動くデモ\",\"id\":\"n02\",\"title\":\"02パン Pan\",\"what\":\"中身を「掴んで」平行移動する。スクロールと違い、境界がなく（無限に動かせる）、ドラッグ量＝移動量になる。地図・図面・キャンバスの基本操作。\",\"how\":\"操作：方眼をドラッグ。transform: translate() に差分を足すだけ。\",\"html\":\"<div class=\\\"stage tall\\\" style=\\\"padding:0\\\">\\n    <div id=\\\"s02-view\\\" class=\\\"s02-view\\\">\\n      <div id=\\\"s02-world\\\" class=\\\"s02-world grid-bg\\\">\\n        <div class=\\\"s02-item\\\" style=\\\"left:60px;top:40px\\\">A\u003c/div>\\n        <div class=\\\"s02-item\\\" style=\\\"left:300px;top:150px\\\">B\u003c/div>\\n        <div class=\\\"s02-item\\\" style=\\\"left:520px;top:60px\\\">C\u003c/div>\\n      \u003c/div>\\n      <span class=\\\"readout\\\" id=\\\"s02-out\\\" style=\\\"position:absolute;left:8px;top:8px\\\">tx: 0, ty: 0\u003c/span>\\n    \u003c/div>\\n  \u003c/div>\",\"css\":\".s02-view { position: relative; height: 260px; overflow: hidden; cursor: grab; touch-action: none; user-select: none; }\\n.s02-view.dragging { cursor: grabbing; }\\n.s02-world { position: absolute; inset: -2000px; transform-origin: 0 0; } /* 見た目上\\\"無限\\\"にする */\\n.s02-item { position: absolute; margin: 2000px; width: 60px; height: 60px; background: var(--accent); color: #fff; border-radius: 8px; display: grid; place-items: center; }\",\"js\":\"(() => {\\n  const view = $('#s02-view'), world = $('#s02-world'), out = $('#s02-out');\\n  let tx = 0, ty = 0, dragging = null;\\n  view.addEventListener('pointerdown', e => {\\n    dragging = { x: e.clientX - tx, y: e.clientY - ty }; // 押した瞬間の「オフセット」を覚える\\n    view.setPointerCapture(e.pointerId);\\n    view.classList.add('dragging');\\n  });\\n  view.addEventListener('pointermove', e => {\\n    if (!dragging) return;\\n    tx = e.clientX - dragging.x;\\n    ty = e.clientY - dragging.y;\\n    world.style.transform = `translate(${tx}px, ${ty}px)`;\\n    out.textContent = `tx: ${Math.round(tx)}, ty: ${Math.round(ty)}`;\\n  });\\n  view.addEventListener('pointerup', () => { dragging = null; view.classList.remove('dragging'); });\\n  view.addEventListener('pointercancel', () => { dragging = null; view.classList.remove('dragging'); });\\n})();\"},{\"page\":\"02-basic.html\",\"pageTitle\":\"第2弾 A：一般的なUI操作（01〜22）動くデモ\",\"id\":\"n03\",\"title\":\"03ズーム Zoom\",\"what\":\"表示倍率を変える。ここでは「枠の中心」を基準に拡大縮小する最も単純な形。ホイール位置を基準にする本格版は 44。\",\"how\":\"操作：枠内でホイール（トラックパッドはピンチ＝ctrlKey 付き wheel）、またはボタン。\",\"html\":\"<div class=\\\"stage\\\">\\n    <div class=\\\"row\\\">\\n      <button id=\\\"s03-minus\\\">−\u003c/button><button id=\\\"s03-plus\\\">＋\u003c/button><button id=\\\"s03-reset\\\">100%\u003c/button>\\n      <span class=\\\"readout\\\" id=\\\"s03-out\\\">scale: 1.00\u003c/span>\\n    \u003c/div>\\n    <div id=\\\"s03-view\\\" class=\\\"s03-view grid-bg\\\"><div id=\\\"s03-content\\\" class=\\\"s03-content\\\"><div class=\\\"box\\\">ZOOM\u003c/div>\u003c/div>\u003c/div>\\n  \u003c/div>\",\"css\":\".s03-view { height: 180px; display: grid; place-items: center; overflow: hidden; border: 1px solid #cbd5e1; border-radius: 6px; }\\n.s03-content { transition: transform .12s ease-out; }\",\"js\":\"(() => {\\n  const view = $('#s03-view'), content = $('#s03-content'), out = $('#s03-out');\\n  let scale = 1;\\n  const apply = () => {\\n    scale = Math.min(5, Math.max(0.2, scale)); // 上下限を必ず設ける\\n    content.style.transform = `scale(${scale})`;\\n    out.textContent = `scale: ${scale.toFixed(2)}`;\\n  };\\n  // passive:false にしないと preventDefault が効かずページごとスクロールしてしまう\\n  view.addEventListener('wheel', e => {\\n    e.preventDefault();\\n    const factor = Math.exp(-e.deltaY * 0.002); // 乗算で変えると上下対称になる\\n    scale *= factor; apply();\\n  }, { passive: false });\\n  $('#s03-plus').onclick = () => { scale *= 1.25; apply(); };\\n  $('#s03-minus').onclick = () => { scale /= 1.25; apply(); };\\n  $('#s03-reset').onclick = () => { scale = 1; apply(); };\\n})();\"},{\"page\":\"02-basic.html\",\"pageTitle\":\"第2弾 A：一般的なUI操作（01〜22）動くデモ\",\"id\":\"n04\",\"title\":\"04クリック / タップ Click / Tap\",\"what\":\"最も基本の操作だが、1回の操作で複数のイベントが順に発火する。マウスとタッチで順序・種類が違うことを見て覚える。\",\"how\":\"操作：青い箱をクリック／タップ。発火順がログに出る。pointer* を使えば入力装置を問わず1系統で書ける。\",\"html\":\"<div class=\\\"stage\\\">\\n    <div class=\\\"row\\\"><div id=\\\"s04-target\\\" class=\\\"box\\\">押す\u003c/div><button id=\\\"s04-clear\\\">ログ消去\u003c/button>\u003c/div>\\n    <div class=\\\"log\\\" id=\\\"s04-log\\\">\u003c/div>\\n  \u003c/div>\",\"css\":\"\",\"js\":\"(() => {\\n  const t = $('#s04-target'), log = $('#s04-log');\\n  ['pointerdown','pointerup','mousedown','mouseup','touchstart','touchend','click']\\n    .forEach(type => t.addEventListener(type, e => logTo(log, `${type}` + (e.pointerType ? ` (pointerType=${e.pointerType})` : ''))));\\n  $('#s04-clear').onclick = () => log.textContent = '';\\n})();\"},{\"page\":\"02-basic.html\",\"pageTitle\":\"第2弾 A：一般的なUI操作（01〜22）動くデモ\",\"id\":\"n05\",\"title\":\"05ダブルクリック / 長押し Double click / Long press\",\"what\":\"ダブルクリックは標準イベントがある。長押しは標準イベントが無いので「押してから一定時間、動かさずに離さない」をタイマーで判定する。\",\"how\":\"操作：左はダブルクリック。右は500ms押し続ける（動かすとキャンセル）。\",\"html\":\"<div class=\\\"stage\\\">\\n    <div class=\\\"row\\\">\\n      <div id=\\\"s05-dbl\\\" class=\\\"box\\\">dblclick\u003c/div>\\n      <div id=\\\"s05-long\\\" class=\\\"box s05-long\\\">長押し\u003c/div>\\n      <span class=\\\"readout\\\" id=\\\"s05-out\\\">-\u003c/span>\\n    \u003c/div>\\n  \u003c/div>\",\"css\":\".s05-long { background: linear-gradient(to top, #1e40af var(--p, 0%), var(--accent) 0); }\",\"js\":\"(() => {\\n  const out = $('#s05-out'), lp = $('#s05-long');\\n  $('#s05-dbl').addEventListener('dblclick', () => out.textContent = 'ダブルクリック検出');\\n  let timer = null, start = 0, raf = 0;\\n  const cancel = () => { clearTimeout(timer); cancelAnimationFrame(raf); timer = null; lp.style.setProperty('--p', '0%'); };\\n  lp.addEventListener('pointerdown', e => {\\n    start = performance.now();\\n    const tick = () => { lp.style.setProperty('--p', Math.min(100, (performance.now() - start) / 5) + '%'); raf = requestAnimationFrame(tick); };\\n    tick();\\n    timer = setTimeout(() => { cancel(); out.textContent = '長押し検出（500ms）'; }, 500);\\n  });\\n  lp.addEventListener('pointerup', cancel);\\n  lp.addEventListener('pointerleave', cancel);\\n  lp.addEventListener('pointermove', e => { if (timer && (Math.abs(e.movementX) + Math.abs(e.movementY)) > 4) cancel(); });\\n  lp.addEventListener('contextmenu', e => e.preventDefault()); // タッチ長押しのOSメニュー抑止\\n})();\"},{\"page\":\"02-basic.html\",\"pageTitle\":\"第2弾 A：一般的なUI操作（01〜22）動くデモ\",\"id\":\"n06\",\"title\":\"06ホバー Hover\",\"what\":\"ポインタが要素上にある状態。タッチ端末には「ホバー」が存在しないため、ホバーでしか出ない情報を作らない。\",\"how\":\"操作：箱にポインタを乗せる。@media (hover: hover) でホバー可能な環境か判定できる。\",\"html\":\"<div class=\\\"stage\\\">\\n    <div class=\\\"row\\\"><div id=\\\"s06-target\\\" class=\\\"box s06\\\">hover\u003c/div><span class=\\\"readout\\\" id=\\\"s06-out\\\">\u003c/span>\u003c/div>\\n  \u003c/div>\",\"css\":\"@media (hover: hover) { .s06:hover { transform: translateY(-4px); box-shadow: 0 8px 16px rgba(37,99,235,.35); } }\\n.s06 { transition: transform .15s, box-shadow .15s; }\",\"js\":\"(() => {\\n  const t = $('#s06-target'), out = $('#s06-out');\\n  const canHover = matchMedia('(hover: hover)').matches;\\n  out.textContent = `この環境のホバー: ${canHover ? '可能' : '不可（タッチ主体）'}`;\\n  t.addEventListener('pointerenter', () => t.textContent = 'enter');\\n  t.addEventListener('pointerleave', () => t.textContent = 'leave');\\n})();\"},{\"page\":\"02-basic.html\",\"pageTitle\":\"第2弾 A：一般的なUI操作（01〜22）動くデモ\",\"id\":\"n07\",\"title\":\"07フォーカス Focus\",\"what\":\"キーボード入力を受け取る要素は常に1つ。Tabで順に移動する。:focus-visible はキーボード操作時だけ枠を出すので、マウス時に枠が邪魔にならない。\",\"how\":\"操作：最初のボタンを押した後 Tab / Shift+Tab。div は tabindex=\\\"0\\\" を付けて初めてフォーカスできる。\",\"html\":\"<div class=\\\"stage\\\">\\n    <div class=\\\"row s07\\\">\\n      <button>1\u003c/button><button>2\u003c/button><div class=\\\"box\\\" tabindex=\\\"0\\\" style=\\\"width:60px;height:34px\\\">div(tabindex=0)\u003c/div><input type=\\\"text\\\" placeholder=\\\"4\\\" style=\\\"width:80px\\\">\\n      <button id=\\\"s07-go\\\">プログラムから4へ\u003c/button>\\n      <span class=\\\"readout\\\" id=\\\"s07-out\\\">activeElement: -\u003c/span>\\n    \u003c/div>\\n  \u003c/div>\",\"css\":\".s07 :focus-visible { outline: 3px solid #f59e0b; outline-offset: 2px; }\",\"js\":\"(() => {\\n  const out = $('#s07-out');\\n  document.addEventListener('focusin', () => {\\n    const a = document.activeElement;\\n    out.textContent = `activeElement: ${a.tagName.toLowerCase()}${a.textContent ? '「' + a.textContent.trim().slice(0, 12) + '」' : ''}`;\\n  });\\n  $('#s07-go').onclick = () => $('.s07 input').focus();\\n})();\"},{\"page\":\"02-basic.html\",\"pageTitle\":\"第2弾 A：一般的なUI操作（01〜22）動くデモ\",\"id\":\"n08\",\"title\":\"08ドラッグ&ドロップ Drag and Drop（HTML標準API）\",\"what\":\"要素を掴んで別の場所へ移す。ここはブラウザ標準のDnD API版。見た目のゴーストはブラウザ任せで簡単だが、タッチ非対応・細かい制御不可。自作版は 32。\",\"how\":\"操作：左のカードを右へドラッグ。dragover で preventDefault() しないとドロップできない、が最大の罠。\",\"html\":\"<div class=\\\"stage\\\">\\n    <div class=\\\"row\\\" style=\\\"align-items:stretch\\\">\\n      <div class=\\\"s08-zone\\\" id=\\\"s08-a\\\"><div draggable=\\\"true\\\" class=\\\"s08-card\\\">受注 #1001\u003c/div><div draggable=\\\"true\\\" class=\\\"s08-card\\\">受注 #1002\u003c/div><div draggable=\\\"true\\\" class=\\\"s08-card\\\">受注 #1003\u003c/div>\u003c/div>\\n      <div class=\\\"s08-zone\\\" id=\\\"s08-b\\\">\u003c/div>\\n    \u003c/div>\\n  \u003c/div>\",\"css\":\".s08-zone { flex: 1; min-height: 120px; background: #fff; border: 2px dashed #cbd5e1; border-radius: 8px; padding: 8px; }\\n.s08-zone.over { border-color: var(--accent); background: var(--accent-soft); }\\n.s08-card { padding: 6px 10px; margin-bottom: 6px; background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; cursor: grab; font-size: 13px; }\\n.s08-card.dragging { opacity: .4; }\",\"js\":\"(() => {\\n  let dragged = null;\\n  $$('.s08-card').forEach(card => {\\n    card.addEventListener('dragstart', e => { dragged = card; card.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });\\n    card.addEventListener('dragend', () => card.classList.remove('dragging'));\\n  });\\n  $$('.s08-zone').forEach(zone => {\\n    zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('over'); }); // ← 必須\\n    zone.addEventListener('dragleave', () => zone.classList.remove('over'));\\n    zone.addEventListener('drop', e => { e.preventDefault(); zone.classList.remove('over'); if (dragged) zone.appendChild(dragged); });\\n  });\\n})();\"},{\"page\":\"02-basic.html\",\"pageTitle\":\"第2弾 A：一般的なUI操作（01〜22）動くデモ\",\"id\":\"n09\",\"title\":\"09スワイプ / フリック Swipe / Flick\",\"what\":\"指（ポインタ）を素早く払う操作。「移動距離」と「速度」の両方を見て判定する。距離だけだとゆっくりのドラッグと区別がつかない。\",\"how\":\"操作：灰色の帯を左右に素早く払う。マウスでもドラッグで再現できる。\",\"html\":\"<div class=\\\"stage\\\">\\n    <div id=\\\"s09-area\\\" class=\\\"s09-area\\\">ここを払う\u003c/div>\\n    <div class=\\\"row\\\"><span class=\\\"readout\\\" id=\\\"s09-out\\\">-\u003c/span>\u003c/div>\\n  \u003c/div>\",\"css\":\".s09-area { height: 90px; background: #e2e8f0; border-radius: 8px; display: grid; place-items: center; color: var(--muted); touch-action: pan-y; user-select: none; }\",\"js\":\"(() => {\\n  const area = $('#s09-area'), out = $('#s09-out');\\n  let s = null;\\n  area.addEventListener('pointerdown', e => s = { x: e.clientX, y: e.clientY, t: performance.now() });\\n  area.addEventListener('pointerup', e => {\\n    if (!s) return;\\n    const dx = e.clientX - s.x, dy = e.clientY - s.y, dt = performance.now() - s.t;\\n    const v = Math.abs(dx) / dt; // px/ms\\n    let r = `dx=${Math.round(dx)}px dt=${Math.round(dt)}ms v=${v.toFixed(2)}px/ms → `;\\n    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) && v > 0.3) r += dx > 0 ? 'スワイプ右' : 'スワイプ左';\\n    else r += '判定なし（距離不足 or 遅い）';\\n    out.textContent = r; s = null;\\n  });\\n})();\"},{\"page\":\"02-basic.html\",\"pageTitle\":\"第2弾 A：一般的なUI操作（01〜22）動くデモ\",\"id\":\"n10\",\"title\":\"10リサイズ Resize\",\"what\":\"つまみ（ハンドル）をドラッグして大きさを変える。サイズ変化の検知は ResizeObserver が正解（window.resize は要素の変化を拾えない）。\",\"how\":\"操作：右下の角をドラッグ。最小サイズで止まる。\",\"html\":\"<div class=\\\"stage\\\">\\n    <div class=\\\"row\\\" style=\\\"align-items:flex-start\\\">\\n      <div id=\\\"s10-panel\\\" class=\\\"s10-panel\\\">パネル<div id=\\\"s10-handle\\\" class=\\\"s10-handle\\\">\u003c/div>\u003c/div>\\n      <span class=\\\"readout\\\" id=\\\"s10-out\\\">\u003c/span>\\n    \u003c/div>\\n  \u003c/div>\",\"css\":\".s10-panel { position: relative; width: 200px; height: 100px; background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; padding: 8px; font-size: 13px; }\\n.s10-handle { position: absolute; right: 0; bottom: 0; width: 16px; height: 16px; cursor: nwse-resize; background: linear-gradient(135deg, transparent 50%, #94a3b8 50%); border-radius: 0 0 6px 0; touch-action: none; }\",\"js\":\"(() => {\\n  const panel = $('#s10-panel'), handle = $('#s10-handle'), out = $('#s10-out');\\n  new ResizeObserver(entries => {\\n    const r = entries[0].contentRect;\\n    out.textContent = `ResizeObserver: ${Math.round(r.width)} × ${Math.round(r.height)}`;\\n  }).observe(panel);\\n  let st = null;\\n  handle.addEventListener('pointerdown', e => {\\n    st = { x: e.clientX, y: e.clientY, w: panel.offsetWidth, h: panel.offsetHeight };\\n    handle.setPointerCapture(e.pointerId);\\n  });\\n  handle.addEventListener('pointermove', e => {\\n    if (!st) return;\\n    panel.style.width = Math.max(120, st.w + e.clientX - st.x) + 'px';\\n    panel.style.height = Math.max(60, st.h + e.clientY - st.y) + 'px';\\n  });\\n  handle.addEventListener('pointerup', () => st = null);\\n})();\"},{\"page\":\"02-basic.html\",\"pageTitle\":\"第2弾 A：一般的なUI操作（01〜22）動くデモ\",\"id\":\"n11\",\"title\":\"11選択 Select（単一 / Ctrl追加 / Shift範囲）\",\"what\":\"項目を選ぶ。Excelやエクスプローラと同じ修飾キー慣習（Ctrl=追加/解除、Shift=範囲）に合わせると業務ユーザーは説明なしで使える。\",\"how\":\"操作：行をクリック。Ctrl/⌘ や Shift を押しながらクリック。\",\"html\":\"<div class=\\\"stage\\\">\\n    <div id=\\\"s11-list\\\" class=\\\"s11-list\\\" role=\\\"listbox\\\" aria-multiselectable=\\\"true\\\">\u003c/div>\\n    <div class=\\\"row\\\"><span class=\\\"readout\\\" id=\\\"s11-out\\\">選択: なし\u003c/span>\u003c/div>\\n  \u003c/div>\",\"css\":\".s11-list { background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; user-select: none; }\\n.s11-list div { padding: 5px 10px; font-size: 13px; border-bottom: 1px solid #f1f5f9; cursor: default; }\\n.s11-list div[aria-selected=\\\"true\\\"] { background: var(--accent-soft); color: #1e3a8a; }\",\"js\":\"(() => {\\n  const list = $('#s11-list'), out = $('#s11-out');\\n  for (let i = 1; i <= 8; i++) list.insertAdjacentHTML('beforeend', `<div role=\\\"option\\\" aria-selected=\\\"false\\\">品目 ${i}\u003c/div>`);\\n  const items = $$('div', list);\\n  let anchor = 0; const selected = new Set();\\n  const paint = () => {\\n    items.forEach((el, i) => el.setAttribute('aria-selected', selected.has(i)));\\n    out.textContent = '選択: ' + ([...selected].sort((a, b) => a - b).map(i => i + 1).join(', ') || 'なし');\\n  };\\n  list.addEventListener('click', e => {\\n    const i = items.indexOf(e.target); if (i < 0) return;\\n    if (e.shiftKey) {                 // 範囲：アンカーからここまで\\n      selected.clear();\\n      for (let k = Math.min(anchor, i); k <= Math.max(anchor, i); k++) selected.add(k);\\n    } else if (e.ctrlKey || e.metaKey) { // 追加/解除\\n      selected.has(i) ? selected.delete(i) : selected.add(i); anchor = i;\\n    } else {                           // 単一\\n      selected.clear(); selected.add(i); anchor = i;\\n    }\\n    paint();\\n  });\\n})();\"},{\"page\":\"02-basic.html\",\"pageTitle\":\"第2弾 A：一般的なUI操作（01〜22）動くデモ\",\"id\":\"n12\",\"title\":\"12フェードイン / フェードアウト Fade in / out\",\"what\":\"不透明度（opacity）を時間で補間する。最も安価で自然な出現・消失。注意点は「opacity:0 でも要素はそこに在る（クリックできる）」こと。消した後は display:none か visibility:hidden にする。\",\"how\":\"操作：トグル。transitionend で「完全に消えた瞬間」を拾って非表示化している。\",\"html\":\"<div class=\\\"stage\\\">\\n    <div class=\\\"row\\\"><button id=\\\"s12-btn\\\">フェード切替\u003c/button><span class=\\\"readout\\\" id=\\\"s12-out\\\">state: visible\u003c/span>\u003c/div>\\n    <div id=\\\"s12-box\\\" class=\\\"box s12\\\">通知パネル\u003c/div>\\n  \u003c/div>\",\"css\":\".s12 { width: 160px; transition: opacity .4s ease; }\\n.s12.hidden { opacity: 0; pointer-events: none; }  /* 消えている間は操作不可に */\",\"js\":\"(() => {\\n  const box = $('#s12-box'), out = $('#s12-out');\\n  $('#s12-btn').onclick = () => {\\n    box.classList.toggle('hidden');\\n    out.textContent = 'state: transitioning...';\\n  };\\n  box.addEventListener('transitionend', () => out.textContent = 'state: ' + (box.classList.contains('hidden') ? 'hidden（ここで display:none にしてよい）' : 'visible'));\\n})();\"},{\"page\":\"02-basic.html\",\"pageTitle\":\"第2弾 A：一般的なUI操作（01〜22）動くデモ\",\"id\":\"n13\",\"title\":\"13スライドイン / スライドアウト Slide in / out\",\"what\":\"画面端から滑り込む。left や margin ではなく transform を動かす（レイアウト計算が走らず滑らか）。ドロワー・サイドパネル・通知の基本。\",\"how\":\"操作：ボタンで右からパネルが出る。背景クリックでも閉じる。\",\"html\":\"<div class=\\\"stage tall\\\" style=\\\"padding:0\\\">\\n    <div class=\\\"s13-frame\\\">\\n      <div class=\\\"row\\\" style=\\\"padding:10px\\\"><button id=\\\"s13-open\\\">パネルを開く\u003c/button>\u003c/div>\\n      <div id=\\\"s13-backdrop\\\" class=\\\"s13-backdrop\\\">\u003c/div>\\n      <div id=\\\"s13-panel\\\" class=\\\"s13-panel\\\"><b>設定パネル\u003c/b><p style=\\\"font-size:13px\\\">transform: translateX(100%) → 0\u003c/p><button id=\\\"s13-close\\\">閉じる\u003c/button>\u003c/div>\\n    \u003c/div>\\n  \u003c/div>\",\"css\":\".s13-frame { position: relative; height: 260px; overflow: hidden; }\\n.s13-panel { position: absolute; top: 0; right: 0; bottom: 0; width: 240px; background: #fff; border-left: 1px solid #cbd5e1; padding: 14px; box-shadow: -8px 0 24px rgba(0,0,0,.08);\\n  transform: translateX(100%); transition: transform .3s cubic-bezier(.2,.8,.2,1); }\\n.s13-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .3s; }\\n.s13-frame.open .s13-panel { transform: translateX(0); }\\n.s13-frame.open .s13-backdrop { opacity: 1; pointer-events: auto; }\",\"js\":\"(() => {\\n  const frame = $('.s13-frame');\\n  $('#s13-open').onclick = () => frame.classList.add('open');\\n  $('#s13-close').onclick = $('#s13-backdrop').onclick = () => frame.classList.remove('open');\\n})();\"},{\"page\":\"02-basic.html\",\"pageTitle\":\"第2弾 A：一般的なUI操作（01〜22）動くデモ\",\"id\":\"n14\",\"title\":\"14トランジション / イージング Transition / Easing\",\"what\":\"状態AからBへ「時間をかけて」変える仕組みがトランジション。その途中の速度配分がイージング。UIでは ease-out（速く出て静かに止まる）が基本。ease-in は「反応が遅い」と感じさせる。\",\"how\":\"操作：ボタンで4つの玉を同時に走らせ、違いを見る。\",\"html\":\"<div class=\\\"stage\\\">\\n    <div class=\\\"row\\\"><button id=\\\"s14-run\\\">走らせる\u003c/button>\u003c/div>\\n    <div class=\\\"s14-lane\\\"><span>linear\u003c/span><div class=\\\"s14-ball\\\" style=\\\"transition-timing-function:linear\\\">\u003c/div>\u003c/div>\\n    <div class=\\\"s14-lane\\\"><span>ease-out\u003c/span><div class=\\\"s14-ball\\\" style=\\\"transition-timing-function:ease-out\\\">\u003c/div>\u003c/div>\\n    <div class=\\\"s14-lane\\\"><span>ease-in\u003c/span><div class=\\\"s14-ball\\\" style=\\\"transition-timing-function:ease-in\\\">\u003c/div>\u003c/div>\\n    <div class=\\\"s14-lane\\\"><span>cubic-bezier(.2,.8,.2,1)\u003c/span><div class=\\\"s14-ball\\\" style=\\\"transition-timing-function:cubic-bezier(.2,.8,.2,1)\\\">\u003c/div>\u003c/div>\\n  \u003c/div>\",\"css\":\".s14-lane { position: relative; height: 30px; margin-bottom: 4px; background: #fff; border: 1px solid #e5e7eb; border-radius: 6px; }\\n.s14-lane span { position: absolute; left: 8px; top: 5px; font-size: 12px; color: var(--muted); }\\n.s14-ball { position: absolute; top: 4px; left: 4px; width: 22px; height: 22px; border-radius: 50%; background: var(--accent);\\n  transition-property: transform; transition-duration: .9s; }\\n.s14-lane.go .s14-ball { transform: translateX(calc(100% * 14)); }\",\"js\":\"(() => {\\n  $('#s14-run').onclick = () => {\\n    const lanes = $$('.s14-lane');\\n    lanes.forEach(l => l.classList.remove('go'));\\n    void document.body.offsetWidth; // 再フロー強制：クラスを外した状態を確定させてから再付与\\n    lanes.forEach(l => l.classList.add('go'));\\n  };\\n})();\"},{\"page\":\"02-basic.html\",\"pageTitle\":\"第2弾 A：一般的なUI操作（01〜22）動くデモ\",\"id\":\"n15\",\"title\":\"15モーダル / ダイアログ Modal / Dialog\",\"what\":\"背後の操作を止めて前面で確認・入力させる。標準の &lt;dialog&gt; を showModal() で開くと、背景の暗幕・Escで閉じる・フォーカス閉じ込め・背面の不活性化が全部ついてくる。\",\"how\":\"操作：開いて Esc や暗幕クリックで閉じる。戻り値は returnValue で受け取る。\",\"html\":\"<div class=\\\"stage\\\">\\n    <div class=\\\"row\\\"><button id=\\\"s15-open\\\" class=\\\"primary\\\">削除確認を開く\u003c/button><span class=\\\"readout\\\" id=\\\"s15-out\\\">returnValue: -\u003c/span>\u003c/div>\\n    <dialog id=\\\"s15-dlg\\\" class=\\\"s15-dlg\\\">\\n      <form method=\\\"dialog\\\">\\n        <p><b>レコードを削除しますか？\u003c/b>\u003c/p>\\n        <p style=\\\"font-size:13px;color:var(--muted)\\\">この操作は取り消せません。\u003c/p>\\n        <div class=\\\"row\\\" style=\\\"justify-content:flex-end\\\"><button value=\\\"cancel\\\">キャンセル\u003c/button><button value=\\\"delete\\\" class=\\\"primary\\\">削除\u003c/button>\u003c/div>\\n      \u003c/form>\\n    \u003c/dialog>\\n  \u003c/div>\",\"css\":\".s15-dlg { border: none; border-radius: 10px; padding: 18px 20px; width: 320px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }\\n.s15-dlg::backdrop { background: rgba(15,23,42,.45); }\",\"js\":\"(() => {\\n  const dlg = $('#s15-dlg'), out = $('#s15-out');\\n  $('#s15-open').onclick = () => dlg.showModal();\\n  dlg.addEventListener('close', () => out.textContent = 'returnValue: ' + (dlg.returnValue || '(Esc)'));\\n  dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close('backdrop'); }); // 暗幕クリックで閉じる\\n})();\"},{\"page\":\"02-basic.html\",\"pageTitle\":\"第2弾 A：一般的なUI操作（01〜22）動くデモ\",\"id\":\"n16\",\"title\":\"16トースト / スナックバー Toast / Snackbar\",\"what\":\"操作結果を隅に短時間表示し、自動で消える。作業を中断させない通知。読み上げ対応のため aria-live を付ける。\",\"how\":\"操作：連打すると積み上がる。ホバー中は消えない（読む時間を確保）。\",\"html\":\"<div class=\\\"stage\\\">\\n    <div class=\\\"row\\\"><button id=\\\"s16-ok\\\">保存成功を通知\u003c/button><button id=\\\"s16-ng\\\">エラーを通知\u003c/button>\u003c/div>\\n    <div id=\\\"s16-host\\\" class=\\\"s16-host\\\" aria-live=\\\"polite\\\">\u003c/div>\\n  \u003c/div>\",\"css\":\".s16-host { position: absolute; right: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 8px; }\\n.s16-toast { min-width: 200px; padding: 10px 14px; border-radius: 8px; color: #fff; background: #0f172a; font-size: 13px; box-shadow: 0 8px 20px rgba(0,0,0,.2);\\n  animation: s16-in .25s ease-out; }\\n.s16-toast.error { background: #dc2626; }\\n.s16-toast.leaving { animation: s16-out .25s ease-in forwards; }\\n@keyframes s16-in { from { opacity: 0; transform: translateY(12px); } }\\n@keyframes s16-out { to { opacity: 0; transform: translateY(12px); } }\",\"js\":\"(() => {\\n  const host = $('#s16-host');\\n  function toast(msg, { error = false, ms = 2500 } = {}) {\\n    const el = document.createElement('div');\\n    el.className = 's16-toast' + (error ? ' error' : ''); el.textContent = msg;\\n    host.appendChild(el);\\n    let timer;\\n    const arm = () => timer = setTimeout(() => { el.classList.add('leaving'); el.addEventListener('animationend', () => el.remove(), { once: true }); }, ms);\\n    el.addEventListener('pointerenter', () => clearTimeout(timer)); // 読んでいる間は消さない\\n    el.addEventListener('pointerleave', arm);\\n    arm();\\n  }\\n  let n = 0;\\n  $('#s16-ok').onclick = () => toast(`レコード #${++n} を保存しました`);\\n  $('#s16-ng').onclick = () => toast('保存に失敗しました（通信エラー）', { error: true, ms: 4000 });\\n})();\"},{\"page\":\"02-basic.html\",\"pageTitle\":\"第2弾 A：一般的なUI操作（01〜22）動くデモ\",\"id\":\"n17\",\"title\":\"17ツールチップ / ポップオーバー Tooltip / Popover\",\"what\":\"補足情報を小さく浮かせて出す。難しいのは位置決め：画面端では上下・左右を反転させる。getBoundingClientRect() で対象の位置を取り、はみ出すなら反対側へ。\",\"how\":\"操作：ボタンにホバー／フォーカス。右端のボタンでは反転する。\",\"html\":\"<div class=\\\"stage\\\">\\n    <div class=\\\"row\\\" style=\\\"justify-content:space-between\\\">\\n      <button data-tip=\\\"左側のボタン。上に出る。\\\">左\u003c/button>\\n      <button data-tip=\\\"中央。これも上。\\\">中央\u003c/button>\\n      <button data-tip=\\\"右端は幅が足りないので左寄せに補正される。\\\">右端\u003c/button>\\n    \u003c/div>\\n    <div id=\\\"s17-tip\\\" class=\\\"s17-tip\\\" role=\\\"tooltip\\\" hidden>\u003c/div>\\n  \u003c/div>\",\"css\":\".s17-tip { position: absolute; max-width: 200px; padding: 6px 10px; background: #0f172a; color: #fff; font-size: 12px; border-radius: 6px; pointer-events: none; z-index: 5; }\",\"js\":\"(() => {\\n  const tip = $('#s17-tip'), stage = tip.parentElement;\\n  const show = btn => {\\n    tip.textContent = btn.dataset.tip; tip.hidden = false;\\n    const b = btn.getBoundingClientRect(), s = stage.getBoundingClientRect(), t = tip.getBoundingClientRect();\\n    let left = b.left - s.left + b.width / 2 - t.width / 2;   // 中央揃え\\n    left = Math.max(4, Math.min(left, s.width - t.width - 4)); // 枠内に収める\\n    let top = b.top - s.top - t.height - 6;                     // 上に出す\\n    if (top < 0) top = b.bottom - s.top + 6;                    // 上に余白が無ければ下へ\\n    tip.style.left = left + 'px'; tip.style.top = top + 'px';\\n  };\\n  $$('[data-tip]', stage).forEach(btn => {\\n    btn.addEventListener('pointerenter', () => show(btn));\\n    btn.addEventListener('focus', () => show(btn));\\n    btn.addEventListener('pointerleave', () => tip.hidden = true);\\n    btn.addEventListener('blur', () => tip.hidden = true);\\n  });\\n})();\"},{\"page\":\"02-basic.html\",\"pageTitle\":\"第2弾 A：一般的なUI操作（01〜22）動くデモ\",\"id\":\"n18\",\"title\":\"18アコーディオン / 折りたたみ Accordion / Collapse\",\"what\":\"セクションの開閉。height: auto へは CSS transition が効かない、が定番の壁。解決策は grid の 0fr → 1fr（JS不要・内容の高さを知らなくてよい）。\",\"how\":\"操作：見出しをクリック。\",\"html\":\"<div class=\\\"stage\\\">\\n    <div class=\\\"s18\\\">\\n      <button class=\\\"s18-head\\\" aria-expanded=\\\"false\\\">出荷条件 <span>▾\u003c/span>\u003c/button>\\n      <div class=\\\"s18-body\\\"><div>納期は受注後5営業日。分納可。梱包は標準仕様。\u003c/div>\u003c/div>\\n    \u003c/div>\\n    <div class=\\\"s18\\\">\\n      <button class=\\\"s18-head\\\" aria-expanded=\\\"false\\\">支払条件 <span>▾\u003c/span>\u003c/button>\\n      <div class=\\\"s18-body\\\"><div>月末締め翌月末払い。<br>手形不可。\u003c/div>\u003c/div>\\n    \u003c/div>\\n  \u003c/div>\",\"css\":\".s18 { background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; margin-bottom: 6px; overflow: hidden; }\\n.s18-head { width: 100%; text-align: left; border: none; border-radius: 0; display: flex; justify-content: space-between; }\\n.s18-head span { transition: transform .25s; }\\n.s18-head[aria-expanded=\\\"true\\\"] span { transform: rotate(180deg); }\\n.s18-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .25s ease; }\\n.s18-body > div { overflow: hidden; padding: 0 12px; font-size: 13px; }\\n.s18-head[aria-expanded=\\\"true\\\"] + .s18-body { grid-template-rows: 1fr; }\\n.s18-head[aria-expanded=\\\"true\\\"] + .s18-body > div { padding-bottom: 10px; }\",\"js\":\"(() => {\\n  $$('.s18-head').forEach(h => h.onclick = () => h.setAttribute('aria-expanded', h.getAttribute('aria-expanded') !== 'true'));\\n})();\"},{\"page\":\"02-basic.html\",\"pageTitle\":\"第2弾 A：一般的なUI操作（01〜22）動くデモ\",\"id\":\"n19\",\"title\":\"19タブ Tabs\",\"what\":\"同じ領域を複数のビューで切り替える。WAI-ARIAの作法：タブ列は role=tablist、Tabキーでは選択中タブに止まり、←→ で隣へ移動。\",\"how\":\"操作：クリック、またはタブにフォーカスして矢印キー。\",\"html\":\"<div class=\\\"stage\\\">\\n    <div class=\\\"s19-tabs\\\" role=\\\"tablist\\\">\\n      <button role=\\\"tab\\\" aria-selected=\\\"true\\\" aria-controls=\\\"s19-p1\\\" id=\\\"s19-t1\\\">基本情報\u003c/button>\\n      <button role=\\\"tab\\\" aria-selected=\\\"false\\\" aria-controls=\\\"s19-p2\\\" id=\\\"s19-t2\\\" tabindex=\\\"-1\\\">明細\u003c/button>\\n      <button role=\\\"tab\\\" aria-selected=\\\"false\\\" aria-controls=\\\"s19-p3\\\" id=\\\"s19-t3\\\" tabindex=\\\"-1\\\">履歴\u003c/button>\\n    \u003c/div>\\n    <div role=\\\"tabpanel\\\" id=\\\"s19-p1\\\" class=\\\"s19-panel\\\">顧客名・納品先などの基本情報。\u003c/div>\\n    <div role=\\\"tabpanel\\\" id=\\\"s19-p2\\\" class=\\\"s19-panel\\\" hidden>品目・数量・単価の明細。\u003c/div>\\n    <div role=\\\"tabpanel\\\" id=\\\"s19-p3\\\" class=\\\"s19-panel\\\" hidden>変更履歴のタイムライン。\u003c/div>\\n  \u003c/div>\",\"css\":\".s19-tabs { display: flex; gap: 2px; border-bottom: 1px solid #cbd5e1; }\\n.s19-tabs [role=tab] { border: none; border-bottom: 2px solid transparent; border-radius: 0; background: none; margin-bottom: -1px; }\\n.s19-tabs [role=tab][aria-selected=\\\"true\\\"] { border-bottom-color: var(--accent); color: var(--accent); font-weight: 600; }\\n.s19-panel { padding: 12px 4px; font-size: 13px; }\",\"js\":\"(() => {\\n  const tabs = $$('.s19-tabs [role=tab]');\\n  const select = i => tabs.forEach((t, k) => {\\n    const on = k === i;\\n    t.setAttribute('aria-selected', on); t.tabIndex = on ? 0 : -1;\\n    document.getElementById(t.getAttribute('aria-controls')).hidden = !on;\\n    if (on) t.focus();\\n  });\\n  tabs.forEach((t, i) => {\\n    t.addEventListener('click', () => select(i));\\n    t.addEventListener('keydown', e => {\\n      if (e.key === 'ArrowRight') select((i + 1) % tabs.length);\\n      if (e.key === 'ArrowLeft') select((i - 1 + tabs.length) % tabs.length);\\n    });\\n  });\\n})();\"},{\"page\":\"02-basic.html\",\"pageTitle\":\"第2弾 A：一般的なUI操作（01〜22）動くデモ\",\"id\":\"n20\",\"title\":\"20ドロップダウン / メニュー Dropdown / Menu\",\"what\":\"ボタン押下で選択肢を展開する。自作するときの必須処理は3つ：外側クリックで閉じる、Escで閉じる、項目選択で閉じる。\",\"how\":\"操作：ボタンを押し、外をクリックや Esc で閉じる。\",\"html\":\"<div class=\\\"stage\\\" style=\\\"min-height:170px\\\">\\n    <div class=\\\"s20-wrap\\\">\\n      <button id=\\\"s20-btn\\\" aria-haspopup=\\\"menu\\\" aria-expanded=\\\"false\\\">操作 ▾\u003c/button>\\n      <div id=\\\"s20-menu\\\" class=\\\"s20-menu\\\" role=\\\"menu\\\" hidden>\\n        <button role=\\\"menuitem\\\">複製\u003c/button><button role=\\\"menuitem\\\">CSV出力\u003c/button><button role=\\\"menuitem\\\" style=\\\"color:#dc2626\\\">削除\u003c/button>\\n      \u003c/div>\\n    \u003c/div>\\n    <div class=\\\"row\\\"><span class=\\\"readout\\\" id=\\\"s20-out\\\">選択: -\u003c/span>\u003c/div>\\n  \u003c/div>\",\"css\":\".s20-wrap { position: relative; display: inline-block; margin-bottom: 8px; }\\n.s20-menu { position: absolute; top: 100%; left: 0; margin-top: 4px; min-width: 140px; background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; padding: 4px; box-shadow: 0 10px 24px rgba(0,0,0,.12); z-index: 5; }\\n.s20-menu button { display: block; width: 100%; text-align: left; border: none; border-radius: 4px; }\",\"js\":\"(() => {\\n  const btn = $('#s20-btn'), menu = $('#s20-menu'), out = $('#s20-out');\\n  const set = open => { menu.hidden = !open; btn.setAttribute('aria-expanded', open); };\\n  btn.onclick = () => set(menu.hidden);\\n  document.addEventListener('click', e => { if (!btn.contains(e.target) && !menu.contains(e.target)) set(false); }); // 外側クリック\\n  document.addEventListener('keydown', e => { if (e.key === 'Escape') set(false); });\\n  $$('[role=menuitem]', menu).forEach(m => m.onclick = () => { out.textContent = '選択: ' + m.textContent; set(false); });\\n})();\"},{\"page\":\"02-basic.html\",\"pageTitle\":\"第2弾 A：一般的なUI操作（01〜22）動くデモ\",\"id\":\"n21\",\"title\":\"21ページネーション / 無限スクロール Pagination / Infinite scroll\",\"what\":\"大量データを分割して取得・表示する2方式。ページ番号は「位置が分かる」、無限スクロールは「操作が要らない」。kintoneのレコード取得（offset/limit、またはカーソルAPI）はこの下で動く。\",\"how\":\"操作：左は番号で切替。右は末尾までスクロールすると IntersectionObserver が「番兵」を検知して追加読み込みする。\",\"html\":\"<div class=\\\"stage\\\">\\n    <div class=\\\"row\\\" style=\\\"align-items:flex-start\\\">\\n      <div style=\\\"flex:1\\\">\\n        <div id=\\\"s21-page\\\" class=\\\"s21-list\\\">\u003c/div>\\n        <div class=\\\"row\\\" id=\\\"s21-pager\\\">\u003c/div>\\n      \u003c/div>\\n      <div style=\\\"flex:1\\\">\\n        <div id=\\\"s21-inf\\\" class=\\\"s21-list\\\" style=\\\"height:150px;overflow:auto\\\">\u003c/div>\\n        <span class=\\\"readout\\\" id=\\\"s21-out\\\">読込: 0件\u003c/span>\\n      \u003c/div>\\n    \u003c/div>\\n  \u003c/div>\",\"css\":\".s21-list { background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; margin-bottom: 6px; }\\n.s21-list div { padding: 3px 10px; border-bottom: 1px solid #f1f5f9; }\\n.s21-list .sentinel { color: var(--muted); text-align: center; }\",\"js\":\"(() => {\\n  // 疑似API：offset/limit で取る（kintone の records.json と同じ形）\\n  const fetchRecords = (offset, limit) => new Promise(r => setTimeout(() => r(\\n    Array.from({ length: limit }, (_, i) => `レコード ${offset + i + 1}`)), 300));\\n\\n  // --- ページネーション ---\\n  const page = $('#s21-page'), pager = $('#s21-pager'), PER = 5, TOTAL = 23;\\n  async function goto(p) {\\n    page.innerHTML = '<div>読込中…\u003c/div>';\\n    const rows = await fetchRecords((p - 1) * PER, Math.min(PER, TOTAL - (p - 1) * PER));\\n    page.innerHTML = rows.map(r => `<div>${r}\u003c/div>`).join('');\\n    pager.innerHTML = '';\\n    for (let i = 1; i <= Math.ceil(TOTAL / PER); i++) {\\n      const b = document.createElement('button'); b.textContent = i; if (i === p) b.className = 'primary';\\n      b.onclick = () => goto(i); pager.appendChild(b);\\n    }\\n  }\\n  goto(1);\\n\\n  // --- 無限スクロール ---\\n  const inf = $('#s21-inf'), out = $('#s21-out');\\n  const sentinel = document.createElement('div'); sentinel.className = 'sentinel'; sentinel.textContent = '…';\\n  inf.appendChild(sentinel);\\n  let loaded = 0, busy = false;\\n  const io = new IntersectionObserver(async ([e]) => {\\n    if (!e.isIntersecting || busy) return;\\n    busy = true;\\n    const rows = await fetchRecords(loaded, 10); loaded += rows.length;\\n    rows.forEach(r => sentinel.insertAdjacentHTML('beforebegin', `<div>${r}\u003c/div>`));\\n    out.textContent = `読込: ${loaded}件`; busy = false;\\n    if (loaded >= 60) { io.disconnect(); sentinel.textContent = '終端'; }\\n  }, { root: inf });\\n  io.observe(sentinel);\\n})();\"},{\"page\":\"02-basic.html\",\"pageTitle\":\"第2弾 A：一般的なUI操作（01〜22）動くデモ\",\"id\":\"n22\",\"title\":\"22ローディング表示 Loading / Skeleton / Spinner\",\"what\":\"待ち時間を可視化する。スピナーは「何か待っている」しか伝えないが、スケルトン（内容の形の灰色）は「何が来るか」を先に見せるので体感が速い。\",\"how\":\"操作：再読込で2秒待ち。どちらの待ち方が楽か比べる。\",\"html\":\"<div class=\\\"stage\\\">\\n    <div class=\\\"row\\\"><button id=\\\"s22-reload\\\">再読込（2秒）\u003c/button>\u003c/div>\\n    <div class=\\\"row\\\" style=\\\"align-items:flex-start\\\">\\n      <div class=\\\"s22-card\\\" id=\\\"s22-spin\\\"><div class=\\\"s22-spinner\\\">\u003c/div>\u003c/div>\\n      <div class=\\\"s22-card\\\" id=\\\"s22-skel\\\"><div class=\\\"s22-line w60\\\">\u003c/div><div class=\\\"s22-line\\\">\u003c/div><div class=\\\"s22-line w80\\\">\u003c/div>\u003c/div>\\n    \u003c/div>\\n  \u003c/div>\",\"css\":\".s22-card { flex: 1; min-height: 90px; background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; padding: 12px; font-size: 13px; display: grid; align-content: start; gap: 8px; }\\n.s22-spinner { width: 26px; height: 26px; border: 3px solid #e5e7eb; border-top-color: var(--accent); border-radius: 50%; animation: s22-spin .8s linear infinite; justify-self: center; align-self: center; margin-top: 18px; }\\n@keyframes s22-spin { to { transform: rotate(360deg); } }\\n.s22-line { height: 12px; border-radius: 6px; background: linear-gradient(90deg, #e5e7eb 25%, #f3f4f6 50%, #e5e7eb 75%); background-size: 200% 100%; animation: s22-shimmer 1.2s infinite; }\\n.s22-line.w60 { width: 60%; } .s22-line.w80 { width: 80%; }\\n@keyframes s22-shimmer { to { background-position: -200% 0; } }\",\"js\":\"(() => {\\n  const spin = $('#s22-spin'), skel = $('#s22-skel');\\n  const loading = [spin.innerHTML, skel.innerHTML];\\n  const loaded = ['<b>受注 #1001\u003c/b><div>株式会社サンプル\u003c/div><div>納期 2026-09-12\u003c/div>', '<b>受注 #1001\u003c/b><div>株式会社サンプル\u003c/div><div>納期 2026-09-12\u003c/div>'];\\n  const load = () => {\\n    spin.innerHTML = loading[0]; skel.innerHTML = loading[1];\\n    spin.setAttribute('aria-busy', 'true'); skel.setAttribute('aria-busy', 'true');\\n    setTimeout(() => { spin.innerHTML = loaded[0]; skel.innerHTML = loaded[1]; spin.removeAttribute('aria-busy'); skel.removeAttribute('aria-busy'); }, 2000);\\n  };\\n  $('#s22-reload').onclick = load; load();\\n})();\"},{\"page\":\"03-custom.html\",\"pageTitle\":\"第2弾 B：カスタマイズ性の高いUI（23〜42）動くデモ\",\"id\":\"n23\",\"title\":\"23仮想スクロール Virtual scroll / Windowing\",\"what\":\"10万行あっても DOM は「見えている行＋少し」だけ作る。スクロール位置から開始行を割り算で求め、上に「行高×開始行」の余白を置いて位置を合わせる。\",\"how\":\"操作：スクロールしても DOM 行数は約20のまま。\",\"html\":\"<div class=\\\"stage\\\">\\n    <div class=\\\"row\\\"><span class=\\\"readout\\\" id=\\\"s23-out\\\">\u003c/span>\u003c/div>\\n    <div id=\\\"s23-view\\\" class=\\\"s23-view\\\"><div id=\\\"s23-spacer\\\"><div id=\\\"s23-rows\\\">\u003c/div>\u003c/div>\u003c/div>\\n  \u003c/div>\",\"css\":\".s23-view { height: 200px; overflow-y: auto; background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; }\\n.s23-view .r { height: 28px; line-height: 28px; padding: 0 10px; font-size: 13px; border-bottom: 1px solid #f1f5f9; }\\n.s23-view .r:nth-child(even) { background: #f8fafc; }\",\"js\":\"(() => {\\n  const TOTAL = 100000, H = 28, view = $('#s23-view'), spacer = $('#s23-spacer'), rows = $('#s23-rows'), out = $('#s23-out');\\n  spacer.style.height = TOTAL * H + 'px';              // 全体の高さだけ確保（DOMは作らない）\\n  function render() {\\n    const start = Math.floor(view.scrollTop / H);\\n    const count = Math.ceil(view.clientHeight / H) + 2;  // 画面分＋余裕\\n    rows.style.transform = `translateY(${start * H}px)`; // 表示行を正しい位置へ\\n    let html = '';\\n    for (let i = start; i < Math.min(start + count, TOTAL); i++) html += `<div class=\\\"r\\\">行 ${i + 1}（DOMは使い回し）\u003c/div>`;\\n    rows.innerHTML = html;\\n    out.textContent = `全 ${TOTAL.toLocaleString()} 行 / DOM行数 ${rows.children.length} / 表示開始 ${start + 1}`;\\n  }\\n  view.addEventListener('scroll', render); render();\\n})();\"},{\"page\":\"03-custom.html\",\"pageTitle\":\"第2弾 B：カスタマイズ性の高いUI（23〜42）動くデモ\",\"id\":\"n24\",\"title\":\"24スティッキー（固定ヘッダー / 固定列） Sticky header / column\",\"what\":\"スクロールしても見出しが留まる。position: sticky だけで実現でき、JSは不要。左上のセルは top と left の両方を指定して両方向に固定する。\",\"how\":\"操作：表を縦横にスクロール。\",\"html\":\"<div class=\\\"stage\\\">\\n    <div id=\\\"s24-wrap\\\" class=\\\"s24-wrap\\\"><table id=\\\"s24-table\\\" class=\\\"s24\\\">\u003c/table>\u003c/div>\\n  \u003c/div>\",\"css\":\".s24-wrap { height: 200px; overflow: auto; background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; }\\n.s24 { border-collapse: separate; border-spacing: 0; font-size: 13px; }\\n.s24 th, .s24 td { padding: 5px 12px; border-bottom: 1px solid #e5e7eb; border-right: 1px solid #e5e7eb; white-space: nowrap; background: #fff; }\\n.s24 thead th { position: sticky; top: 0; background: #f1f5f9; z-index: 2; }\\n.s24 td:first-child, .s24 th:first-child { position: sticky; left: 0; background: #f1f5f9; z-index: 1; }\\n.s24 thead th:first-child { z-index: 3; } /* 左上：両方向固定・最前面 */\",\"js\":\"(() => {\\n  const t = $('#s24-table');\\n  let h = '<thead><tr><th>品番\u003c/th>' + Array.from({ length: 12 }, (_, i) => `<th>${i + 1}月\u003c/th>`).join('') + '\u003c/tr>\u003c/thead><tbody>';\\n  for (let r = 1; r <= 30; r++) h += `<tr><td>P-${String(r).padStart(3, '0')}\u003c/td>` + Array.from({ length: 12 }, () => `<td>${Math.floor(Math.random() * 900 + 100)}\u003c/td>`).join('') + '\u003c/tr>';\\n  t.innerHTML = h + '\u003c/tbody>';\\n})();\"},{\"page\":\"03-custom.html\",\"pageTitle\":\"第2弾 B：カスタマイズ性の高いUI（23〜42）動くデモ\",\"id\":\"n25\",\"title\":\"25スクロールスナップ Scroll snap\",\"what\":\"スクロールを止めた時、区切り位置に吸着する。CSSだけで「カルーセル」「ページ単位の閲覧」ができ、慣性・タッチ対応もブラウザ任せ。\",\"how\":\"操作：横にスクロール（Shift+ホイール or トラックパッド）。どこで止めてもカードの先頭に揃う。\",\"html\":\"<div class=\\\"stage\\\">\\n    <div class=\\\"s25-track\\\" id=\\\"s25-track\\\">\u003c/div>\\n  \u003c/div>\",\"css\":\".s25-track { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 4px; scroll-padding: 4px; }\\n.s25-card { flex: 0 0 200px; height: 110px; scroll-snap-align: start; background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; display: grid; place-items: center; font-size: 15px; }\",\"js\":\"(() => {\\n  $('#s25-track').innerHTML = Array.from({ length: 8 }, (_, i) => `<div class=\\\"s25-card\\\">カード ${i + 1}\u003c/div>`).join('');\\n})();\"},{\"page\":\"03-custom.html\",\"pageTitle\":\"第2弾 B：カスタマイズ性の高いUI（23〜42）動くデモ\",\"id\":\"n26\",\"title\":\"26パララックス Parallax\",\"what\":\"前景と背景を異なる速度で動かして奥行きを出す。実装は「スクロール量 × 係数」を transform に入れるだけ。業務アプリでは酔いやすいので控えめに。\",\"how\":\"操作：枠内をスクロール。背景の丸は 0.3 倍の速度で動く。\",\"html\":\"<div class=\\\"stage\\\" style=\\\"padding:0\\\">\\n    <div id=\\\"s26-view\\\" class=\\\"s26-view\\\">\\n      <div id=\\\"s26-bg\\\" class=\\\"s26-bg\\\">\u003c/div>\\n      <div class=\\\"s26-content\\\"><p>前景（等速）\u003c/p><p>スクロールに合わせて…\u003c/p><p>背景がゆっくり動く\u003c/p><p>係数 0.3\u003c/p><p>終わり\u003c/p>\u003c/div>\\n    \u003c/div>\\n  \u003c/div>\",\"css\":\".s26-view { position: relative; height: 220px; overflow: auto; background: #1e293b; color: #fff; }\\n.s26-bg { position: absolute; left: 0; right: 0; top: 0; height: 800px; pointer-events: none;\\n  background-image: radial-gradient(circle, rgba(255,255,255,.25) 12px, transparent 13px); background-size: 120px 120px; will-change: transform; }\\n.s26-content { position: relative; padding: 20px 30px; } .s26-content p { margin: 0 0 120px; font-size: 18px; }\",\"js\":\"(() => {\\n  const view = $('#s26-view'), bg = $('#s26-bg');\\n  view.addEventListener('scroll', () => bg.style.transform = `translateY(${view.scrollTop * 0.7}px)`); // 0.7px戻す＝0.3倍で動く\\n})();\"},{\"page\":\"03-custom.html\",\"pageTitle\":\"第2弾 B：カスタマイズ性の高いUI（23〜42）動くデモ\",\"id\":\"n27\",\"title\":\"27スクロール連動アニメーション Scroll-driven reveal\",\"what\":\"要素が画面に入った瞬間をトリガーにする。scroll イベントで毎回位置計算せず、IntersectionObserver に「入った／出た」だけ教えてもらう。\",\"how\":\"操作：枠内をスクロール。入ったカードがフェード＋上昇で現れる。\",\"html\":\"<div class=\\\"stage\\\" style=\\\"padding:0\\\">\\n    <div id=\\\"s27-view\\\" class=\\\"s27-view\\\">\u003c/div>\\n  \u003c/div>\",\"css\":\".s27-view { height: 220px; overflow: auto; padding: 14px; }\\n.s27-card { background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; padding: 14px; margin-bottom: 60px; font-size: 13px;\\n  opacity: 0; transform: translateY(20px); transition: opacity .5s, transform .5s; }\\n.s27-card.in { opacity: 1; transform: none; }\",\"js\":\"(() => {\\n  const view = $('#s27-view');\\n  view.innerHTML = Array.from({ length: 8 }, (_, i) => `<div class=\\\"s27-card\\\">カード ${i + 1}：画面に入ると現れる\u003c/div>`).join('');\\n  const io = new IntersectionObserver(es => es.forEach(e => e.target.classList.toggle('in', e.isIntersecting)), { root: view, threshold: 0.3 });\\n  $$('.s27-card', view).forEach(c => io.observe(c));\\n})();\"},{\"page\":\"03-custom.html\",\"pageTitle\":\"第2弾 B：カスタマイズ性の高いUI（23〜42）動くデモ\",\"id\":\"n28\",\"title\":\"28慣性 / モーメンタム Inertia / Momentum\",\"what\":\"指を離した後も速度を保ちながら減速して止まる。「離した瞬間の速度」を記録し、毎フレーム速度に減衰係数（0.95など）を掛けて位置を進める。パン（02）にこれを足すと「気持ちよさ」が出る。\",\"how\":\"操作：方眼を素早くドラッグして離す。壁で跳ね返る。\",\"html\":\"<div class=\\\"stage tall\\\" style=\\\"padding:0\\\">\\n    <div id=\\\"s28-view\\\" class=\\\"s28-view grid-bg\\\"><div id=\\\"s28-ball\\\" class=\\\"box\\\" style=\\\"border-radius:50%;position:absolute;left:0;top:0\\\">投げる\u003c/div><span class=\\\"readout\\\" id=\\\"s28-out\\\" style=\\\"position:absolute;left:8px;top:8px\\\">v: 0\u003c/span>\u003c/div>\\n  \u003c/div>\",\"css\":\".s28-view { position: relative; height: 260px; overflow: hidden; touch-action: none; user-select: none; }\",\"js\":\"(() => {\\n  const view = $('#s28-view'), ball = $('#s28-ball'), out = $('#s28-out');\\n  let x = 100, y = 80, vx = 0, vy = 0, drag = null, raf = 0, last = null;\\n  const paint = () => { ball.style.transform = `translate(${x}px, ${y}px)`; out.textContent = `v: ${Math.hypot(vx, vy).toFixed(2)} px/frame`; };\\n  ball.addEventListener('pointerdown', e => { cancelAnimationFrame(raf); drag = { dx: e.clientX - x, dy: e.clientY - y }; last = { x: e.clientX, y: e.clientY, t: performance.now() }; ball.setPointerCapture(e.pointerId); });\\n  ball.addEventListener('pointermove', e => {\\n    if (!drag) return;\\n    x = e.clientX - drag.dx; y = e.clientY - drag.dy;\\n    const now = performance.now(), dt = Math.max(1, now - last.t);\\n    vx = (e.clientX - last.x) / dt * 16; vy = (e.clientY - last.y) / dt * 16; // 1フレーム(16ms)あたりの速度\\n    last = { x: e.clientX, y: e.clientY, t: now }; paint();\\n  });\\n  ball.addEventListener('pointerup', () => { drag = null; fling(); });\\n  function fling() {\\n    const W = view.clientWidth - 80, H = view.clientHeight - 80;\\n    const step = () => {\\n      vx *= 0.95; vy *= 0.95;                      // 減衰\\n      x += vx; y += vy;\\n      if (x < 0) { x = 0; vx = -vx * 0.6; } if (x > W) { x = W; vx = -vx * 0.6; } // 壁で反射\\n      if (y < 0) { y = 0; vy = -vy * 0.6; } if (y > H) { y = H; vy = -vy * 0.6; }\\n      paint();\\n      if (Math.abs(vx) + Math.abs(vy) > 0.05) raf = requestAnimationFrame(step); // 十分遅くなったら止める\\n    };\\n    raf = requestAnimationFrame(step);\\n  }\\n  paint();\\n})();\"},{\"page\":\"03-custom.html\",\"pageTitle\":\"第2弾 B：カスタマイズ性の高いUI（23〜42）動くデモ\",\"id\":\"n29\",\"title\":\"29スプリング物理 Spring animation\",\"what\":\"目標との差に比例した力（バネ）と速度に比例した抵抗（減衰）で動かす。時間固定のトランジションと違い、途中で目標が変わっても不自然にならない。\",\"how\":\"操作：枠内をクリック。連続でクリックして途中変更の滑らかさを見る。剛性・減衰を変えてみる。\",\"html\":\"<div class=\\\"stage tall\\\" style=\\\"padding:0\\\">\\n    <div id=\\\"s29-view\\\" class=\\\"s29-view grid-bg\\\">\\n      <div id=\\\"s29-ball\\\" class=\\\"box\\\" style=\\\"border-radius:50%;position:absolute;left:0;top:0;width:40px;height:40px\\\">\u003c/div>\\n      <div class=\\\"row\\\" style=\\\"position:absolute;left:8px;top:8px;background:#fff;padding:4px 8px;border-radius:6px;font-size:12px\\\">\\n        剛性 <input id=\\\"s29-k\\\" type=\\\"range\\\" min=\\\"0.02\\\" max=\\\"0.4\\\" step=\\\"0.01\\\" value=\\\"0.12\\\"> 減衰 <input id=\\\"s29-d\\\" type=\\\"range\\\" min=\\\"0.5\\\" max=\\\"0.98\\\" step=\\\"0.01\\\" value=\\\"0.8\\\">\\n      \u003c/div>\\n    \u003c/div>\\n  \u003c/div>\",\"css\":\".s29-view { position: relative; height: 260px; overflow: hidden; cursor: crosshair; }\",\"js\":\"(() => {\\n  const view = $('#s29-view'), ball = $('#s29-ball');\\n  let x = 200, y = 120, tx = x, ty = y, vx = 0, vy = 0, raf = 0;\\n  view.addEventListener('pointerdown', e => {\\n    const r = view.getBoundingClientRect(); tx = e.clientX - r.left - 20; ty = e.clientY - r.top - 20;\\n    if (!raf) tick();\\n  });\\n  function tick() {\\n    const k = +$('#s29-k').value, d = +$('#s29-d').value;\\n    vx = (vx + (tx - x) * k) * d; vy = (vy + (ty - y) * k) * d; // 力＝差×剛性、速度に減衰\\n    x += vx; y += vy;\\n    ball.style.transform = `translate(${x}px, ${y}px)`;\\n    const settled = Math.abs(vx) + Math.abs(vy) < 0.01 && Math.abs(tx - x) + Math.abs(ty - y) < 0.1;\\n    raf = settled ? 0 : requestAnimationFrame(tick);\\n  }\\n  ball.style.transform = `translate(${x}px, ${y}px)`;\\n})();\"},{\"page\":\"03-custom.html\",\"pageTitle\":\"第2弾 B：カスタマイズ性の高いUI（23〜42）動くデモ\",\"id\":\"n30\",\"title\":\"30FLIPアニメーション First-Last-Invert-Play\",\"what\":\"レイアウトが変わる（並べ替え・追加・削除）ときの定石。①変更前の位置を測る（First）②DOMを変える③変更後の位置を測る（Last）④差分だけ transform で元の位置に戻す（Invert）⑤transformを0へアニメーション（Play）。\",\"how\":\"操作：シャッフル。DOMは一瞬で並び替わっているが、見た目は滑らかに移動する。\",\"html\":\"<div class=\\\"stage\\\">\\n    <div class=\\\"row\\\"><button id=\\\"s30-shuffle\\\">シャッフル\u003c/button><button id=\\\"s30-sort\\\">並び順に戻す\u003c/button>\u003c/div>\\n    <div id=\\\"s30-grid\\
