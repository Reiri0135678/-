nder); // 対応ブラウザ\n        else render();                                                            // フォールバック\n      };\n      render();\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 32 ===================== -->\n<section class=\"demo\" id=\"n32\">\n  <h2><span class=\"no\">32\u003c/span>ドラッグ並べ替え <small>Sortable / Reorder（Pointer Events自作）\u003c/small>\u003c/h2>\n  <p class=\"what\">HTML標準DnD（08）を使わず Pointer Events で自作すると、タッチ対応・見た目の完全制御・FLIPとの併用ができる。掴んだ要素は transform で追従させ、他要素との重なりで挿入位置を決める。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>行をドラッグして並べ替え。\u003c/p>\n  <div class=\"stage\">\n    <div id=\"s32-list\" class=\"s32-list\">\u003c/div>\n  \u003c/div>\n  <style data-code>\n    .s32-list { background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; user-select: none; }\n    .s32-item { padding: 8px 12px; border-bottom: 1px solid #f1f5f9; font-size: 13px; cursor: grab; touch-action: none; background: #fff; }\n    .s32-item.lifted { position: relative; z-index: 2; box-shadow: 0 8px 20px rgba(0,0,0,.15); cursor: grabbing; }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const list = $('#s32-list');\n      list.innerHTML = ['切断', '曲げ', '溶接', '塗装', '検査', '梱包'].map(s => `<div class=\"s32-item\">⋮⋮ 工程：${s}\u003c/div>`).join('');\n      let lifted = null, startY = 0, naturalTop = 0; // naturalTop: transformなしの本来の位置\n      const animating = new WeakSet();               // FLIP 中の兄弟は判定から外す（アニメ中の rect で判定すると往復する）\n      list.addEventListener('pointerdown', e => {\n        lifted = e.target.closest('.s32-item'); if (!lifted) return;\n        startY = e.clientY; naturalTop = lifted.getBoundingClientRect().top;\n        lifted.classList.add('lifted'); lifted.setPointerCapture(e.pointerId);\n      });\n      list.addEventListener('pointermove', e => {\n        if (!lifted) return;\n        let dy = e.clientY - startY;\n        lifted.style.transform = `translateY(${dy}px)`;\n        const cy = naturalTop + dy + lifted.offsetHeight / 2; // 持ち上げ中要素の見た目の中心\n        for (const sib of list.children) {\n          if (sib === lifted || animating.has(sib)) continue;\n          const r = sib.getBoundingClientRect();\n          if (cy < r.top || cy > r.bottom) continue;\n          // 兄弟の中心を越えたので DOM 上で入れ替える\n          const before = r;\n          const liftedIsAfter = sib.compareDocumentPosition(lifted) & Node.DOCUMENT_POSITION_FOLLOWING;\n          liftedIsAfter ? list.insertBefore(lifted, sib) : list.insertBefore(lifted, sib.nextSibling);\n          const after = sib.getBoundingClientRect();\n          const anim = sib.animate([{ transform: `translateY(${before.top - after.top}px)` }, { transform: 'none' }], { duration: 150 }); // FLIP\n          animating.add(sib); anim.finished.then(() => animating.delete(sib));\n          // 持ち上げ中要素の本来位置が変わったので、見た目が飛ばないよう基準をずらす\n          const newNatural = lifted.getBoundingClientRect().top - dy;\n          startY += newNatural - naturalTop; naturalTop = newNatural;\n          lifted.style.transform = `translateY(${e.clientY - startY}px)`;\n          break;\n        }\n      });\n      const drop = () => { if (!lifted) return; lifted.style.transform = ''; lifted.classList.remove('lifted'); lifted = null; };\n      list.addEventListener('pointerup', drop); list.addEventListener('pointercancel', drop);\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 33 ===================== -->\n<section class=\"demo\" id=\"n33\">\n  <h2><span class=\"no\">33\u003c/span>分割パネル / ドッキング <small>Split pane / Dock layout\u003c/small>\u003c/h2>\n  <p class=\"what\">境界（ガター）をドラッグして領域比率を変える。IDE風レイアウトの基礎。grid の列幅を書き換えるだけで、中身のレイアウトは自動で追従する。慣習：最小幅で止まる、ガターのダブルクリックで初期比率に戻す。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>中央の縦棒をドラッグ。ダブルクリックでリセット。\u003c/p>\n  <div class=\"stage\" style=\"padding:0\">\n    <div id=\"s33-split\" class=\"s33-split\">\n      <div class=\"s33-pane\">サイドバー\u003c/div>\n      <div id=\"s33-gutter\" class=\"s33-gutter\" title=\"ドラッグ / ダブルクリックで初期化\">\u003c/div>\n      <div class=\"s33-pane\">メイン領域<br><span class=\"readout\" id=\"s33-out\">\u003c/span>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n  <style data-code>\n    .s33-split { display: grid; grid-template-columns: 220px 6px 1fr; height: 200px; }\n    .s33-pane { padding: 12px; font-size: 13px; overflow: hidden; }\n    .s33-gutter { background: #cbd5e1; cursor: col-resize; touch-action: none; }\n    .s33-gutter:hover, .s33-gutter.active { background: var(--accent); }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const split = $('#s33-split'), g = $('#s33-gutter'), out = $('#s33-out');\n      const MIN = 120, apply = w => { split.style.gridTemplateColumns = `${w}px 6px 1fr`; out.textContent = `左: ${Math.round(w)}px`; };\n      let st = null;\n      g.addEventListener('pointerdown', e => { st = { x: e.clientX, w: split.children[0].offsetWidth }; g.setPointerCapture(e.pointerId); g.classList.add('active'); });\n      g.addEventListener('pointermove', e => { if (st) apply(Math.min(split.clientWidth - MIN - 6, Math.max(MIN, st.w + e.clientX - st.x))); });\n      g.addEventListener('pointerup', () => { st = null; g.classList.remove('active'); });\n      g.addEventListener('dblclick', () => apply(220));\n      apply(220);\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 34 ===================== -->\n<section class=\"demo\" id=\"n34\">\n  <h2><span class=\"no\">34\u003c/span>キーボードナビゲーション <small>Roving tabindex\u003c/small>\u003c/h2>\n  <p class=\"what\">ツールバーやグリッドの中は矢印キーで移動し、<kbd>Tab\u003c/kbd> は「グループごと」に抜ける。実現方法は「今の項目だけ <code>tabindex=0\u003c/code>、他は <code>-1\u003c/code>」に付け替え続けること（roving = 巡回）。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>最初のボタンにフォーカス（クリック）→ <kbd>←\u003c/kbd><kbd>→\u003c/kbd><kbd>Home\u003c/kbd><kbd>End\u003c/kbd>。<kbd>Tab\u003c/kbd> で次のグループへ一気に抜ける。\u003c/p>\n  <div class=\"stage\">\n    <div class=\"s34-bar\" role=\"toolbar\" aria-label=\"書式\"><button tabindex=\"0\">太字\u003c/button><button tabindex=\"-1\">斜体\u003c/button><button tabindex=\"-1\">下線\u003c/button><button tabindex=\"-1\">取消線\u003c/button>\u003c/div>\n    <div class=\"s34-bar\" role=\"toolbar\" aria-label=\"配置\"><button tabindex=\"0\">左\u003c/button><button tabindex=\"-1\">中央\u003c/button><button tabindex=\"-1\">右\u003c/button>\u003c/div>\n    <div class=\"row\"><span class=\"readout\" id=\"s34-out\">-\u003c/span>\u003c/div>\n  \u003c/div>\n  <style data-code>\n    .s34-bar { display: inline-flex; gap: 2px; padding: 4px; background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; margin: 0 8px 8px 0; }\n    .s34-bar button:focus-visible { outline: 3px solid #f59e0b; }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      $$('.s34-bar').forEach(bar => {\n        const btns = $$('button', bar);\n        const go = i => { btns.forEach((b, k) => b.tabIndex = k === i ? 0 : -1); btns[i].focus(); $('#s34-out').textContent = `${bar.getAttribute('aria-label')} → ${btns[i].textContent}`; };\n        bar.addEventListener('keydown', e => {\n          const i = btns.indexOf(document.activeElement); if (i < 0) return;\n          const map = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: btns.length - 1 };\n          if (e.key in map) { e.preventDefault(); go((map[e.key] + btns.length) % btns.length); }\n        });\n        btns.forEach((b, i) => b.addEventListener('focus', () => go(i)));\n      });\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 35 ===================== -->\n<section class=\"demo\" id=\"n35\">\n  <h2><span class=\"no\">35\u003c/span>ショートカットキー <small>Hotkeys\u003c/small>\u003c/h2>\n  <p class=\"what\">キー組合せで機能を呼ぶ。要点：①ブラウザ既定動作を <code>preventDefault()\u003c/code> で止める ②入力欄にフォーカス中は単独キーのショートカットを無効化 ③Mac は <code>metaKey\u003c/code>、Windows は <code>ctrlKey\u003c/code>。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>このページ上で <kbd>Ctrl/⌘\u003c/kbd>+<kbd>S\u003c/kbd>、<kbd>Ctrl/⌘\u003c/kbd>+<kbd>K\u003c/kbd>（36へ）、単独 <kbd>N\u003c/kbd>。入力欄内で <kbd>N\u003c/kbd> を打つと無視される。\u003c/p>\n  <div class=\"stage\">\n    <div class=\"row\"><input type=\"text\" placeholder=\"ここで N を打っても発火しない\"><span class=\"readout\" id=\"s35-out\">-\u003c/span>\u003c/div>\n  \u003c/div>\n  \u003cscript data-code>\n    (() => {\n      const out = $('#s35-out');\n      const isTyping = () => /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) || document.activeElement.isContentEditable;\n      document.addEventListener('keydown', e => {\n        const mod = e.ctrlKey || e.metaKey;\n        if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); out.textContent = 'Ctrl/⌘+S → 保存（ブラウザの保存ダイアログは抑止）'; }\n        else if (!mod && e.key.toLowerCase() === 'n' && !isTyping()) { out.textContent = 'N → 新規作成'; }\n      });\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 36 ===================== -->\n<section class=\"demo\" id=\"n36\">\n  <h2><span class=\"no\">36\u003c/span>コマンドパレット <small>Command palette\u003c/small>\u003c/h2>\n  <p class=\"what\"><kbd>Ctrl\u003c/kbd>+<kbd>K\u003c/kbd> で検索窓を開き、機能を文字で呼び出す。あいまい検索 → 矢印で選択 → Enter で実行。機能が増えてもメニューを掘らずに済む。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>ボタンか <kbd>Ctrl/⌘\u003c/kbd>+<kbd>K\u003c/kbd>。「csv」「削」などで絞り込み。\u003c/p>\n  <div class=\"stage\">\n    <div class=\"row\"><button id=\"s36-open\">コマンドパレットを開く\u003c/button><span class=\"readout\" id=\"s36-out\">-\u003c/span>\u003c/div>\n    <dialog id=\"s36-dlg\" class=\"s36-dlg\">\n      <input id=\"s36-q\" type=\"text\" placeholder=\"コマンドを検索…\" autocomplete=\"off\">\n      <div id=\"s36-list\" class=\"s36-list\">\u003c/div>\n    \u003c/dialog>\n  \u003c/div>\n  <style data-code>\n    .s36-dlg { border: none; border-radius: 10px; padding: 0; width: 380px; box-shadow: 0 20px 50px rgba(0,0,0,.3); }\n    .s36-dlg::backdrop { background: rgba(15,23,42,.35); }\n    .s36-dlg input { width: 100%; border: none; border-bottom: 1px solid #e5e7eb; border-radius: 10px 10px 0 0; padding: 12px 14px; font-size: 15px; outline: none; }\n    .s36-list div { padding: 8px 14px; font-size: 13px; cursor: pointer; }\n    .s36-list div.active { background: var(--accent-soft); }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const CMDS = ['新規レコード作成', 'CSV出力', 'CSV取込', '選択行を削除', '選択行を複製', '設定を開く', 'ログアウト'];\n      const dlg = $('#s36-dlg'), q = $('#s36-q'), list = $('#s36-list'), out = $('#s36-out');\n      let idx = 0, hits = [];\n      const render = () => {\n        const s = q.value.trim().toLowerCase();\n        hits = CMDS.filter(c => c.toLowerCase().includes(s)); idx = Math.min(idx, Math.max(0, hits.length - 1));\n        list.innerHTML = hits.map((c, i) => `<div class=\"${i === idx ? 'active' : ''}\">${c}\u003c/div>`).join('') || '<div style=\"color:#6b7280\">該当なし\u003c/div>';\n      };\n      const open = () => { q.value = ''; idx = 0; render(); dlg.showModal(); };\n      const run = () => { if (hits[idx]) out.textContent = '実行: ' + hits[idx]; dlg.close(); };\n      $('#s36-open').onclick = open;\n      document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); open(); } });\n      q.addEventListener('input', () => { idx = 0; render(); });\n      q.addEventListener('keydown', e => {\n        if (e.key === 'ArrowDown') { idx = (idx + 1) % hits.length; render(); e.preventDefault(); }\n        if (e.key === 'ArrowUp') { idx = (idx - 1 + hits.length) % hits.length; render(); e.preventDefault(); }\n        if (e.key === 'Enter') run();\n      });\n      list.addEventListener('click', e => { idx = [...list.children].indexOf(e.target); run(); });\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 37 ===================== -->\n<section class=\"demo\" id=\"n37\">\n  <h2><span class=\"no\">37\u003c/span>アンドゥ / リドゥ <small>Undo / Redo\u003c/small>\u003c/h2>\n  <p class=\"what\">操作履歴を積んで巻き戻す。ここは「状態のスナップショット」方式（過去の状態を丸ごと配列に保存）。単純で確実。状態が大きいなら「逆操作コマンド」方式を検討する。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>丸を追加／色替え → <kbd>Ctrl/⌘\u003c/kbd>+<kbd>Z\u003c/kbd> / <kbd>Ctrl/⌘\u003c/kbd>+<kbd>Shift\u003c/kbd>+<kbd>Z\u003c/kbd> またはボタン。\u003c/p>\n  <div class=\"stage\">\n    <div class=\"row\">\n      <button id=\"s37-add\">丸を追加\u003c/button><button id=\"s37-color\">全部の色を変える\u003c/button><button id=\"s37-clear\">全消去\u003c/button>\n      <button id=\"s37-undo\">↶ Undo\u003c/button><button id=\"s37-redo\">↷ Redo\u003c/button><span class=\"readout\" id=\"s37-out\">\u003c/span>\n    \u003c/div>\n    <div id=\"s37-canvas\" class=\"s37-canvas\">\u003c/div>\n  \u003c/div>\n  <style data-code>\n    .s37-canvas { height: 90px; background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; display: flex; gap: 6px; padding: 8px; flex-wrap: wrap; }\n    .s37-canvas i { width: 24px; height: 24px; border-radius: 50%; }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      let state = [], past = [], future = [];\n      const canvas = $('#s37-canvas'), out = $('#s37-out');\n      const render = () => { canvas.innerHTML = state.map(c => `<i style=\"background:${c}\">\u003c/i>`).join(''); out.textContent = `past:${past.length} future:${future.length}`; };\n      const commit = next => { past.push(state); future = []; state = next; render(); };  // 新操作で redo 履歴は捨てる\n      const undo = () => { if (!past.length) return; future.push(state); state = past.pop(); render(); };\n      const redo = () => { if (!future.length) return; past.push(state); state = future.pop(); render(); };\n      const rnd = () => `hsl(${Math.random() * 360},70%,55%)`;\n      $('#s37-add').onclick = () => commit([...state, rnd()]);\n      $('#s37-color').onclick = () => commit(state.map(rnd));\n      $('#s37-clear').onclick = () => commit([]);\n      $('#s37-undo').onclick = undo; $('#s37-redo').onclick = redo;\n      document.addEventListener('keydown', e => {\n        if (!(e.ctrlKey || e.metaKey) || e.key.toLowerCase() !== 'z') return;\n        e.preventDefault(); e.shiftKey ? redo() : undo();\n      });\n      render();\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 38 ===================== -->\n<section class=\"demo\" id=\"n38\">\n  <h2><span class=\"no\">38\u003c/span>インライン編集 <small>Inline editing\u003c/small>\u003c/h2>\n  <p class=\"what\">表示中の値をその場で編集状態に切り替える。終了経路を3つ揃える：<kbd>Enter\u003c/kbd>=確定、<kbd>Esc\u003c/kbd>=取消、フォーカスが外れた=確定。どれか欠けると「戻れない」UIになる。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>セルをダブルクリック（またはフォーカスして Enter）。\u003c/p>\n  <div class=\"stage\">\n    <table class=\"s38\"><tr><th>品名\u003c/th><th>数量\u003c/th>\u003c/tr><tr><td tabindex=\"0\">六角ボルト M8\u003c/td><td tabindex=\"0\">120\u003c/td>\u003c/tr><tr><td tabindex=\"0\">平ワッシャー\u003c/td><td tabindex=\"0\">300\u003c/td>\u003c/tr>\u003c/table>\n    <div class=\"row\"><span class=\"readout\" id=\"s38-out\">-\u003c/span>\u003c/div>\n  \u003c/div>\n  <style data-code>\n    .s38 { border-collapse: collapse; background: #fff; font-size: 13px; margin-bottom: 8px; }\n    .s38 th, .s38 td { border: 1px solid #cbd5e1; padding: 4px 10px; min-width: 120px; }\n    .s38 td input { width: 100%; font: inherit; border: 2px solid var(--accent); padding: 2px 4px; margin: -4px -6px; }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const out = $('#s38-out');\n      function edit(td) {\n        const old = td.textContent;\n        const input = document.createElement('input'); input.value = old;\n        td.textContent = ''; td.appendChild(input); input.focus(); input.select();\n        let done = false;\n        const finish = (commit) => {\n          if (done) return; done = true;\n          td.textContent = commit ? input.value : old;\n          out.textContent = commit ? `確定: 「${old}」→「${input.value}」` : '取消';\n          td.focus();\n        };\n        input.addEventListener('keydown', e => { if (e.key === 'Enter') finish(true); if (e.key === 'Escape') finish(false); });\n        input.addEventListener('blur', () => finish(true));\n      }\n      $$('.s38 td').forEach(td => {\n        td.addEventListener('dblclick', () => edit(td));\n        td.addEventListener('keydown', e => { if (e.key === 'Enter' && !td.querySelector('input')) edit(td); });\n      });\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 39 ===================== -->\n<section class=\"demo\" id=\"n39\">\n  <h2><span class=\"no\">39\u003c/span>カスタムコンテキストメニュー <small>Custom context menu\u003c/small>\u003c/h2>\n  <p class=\"what\">右クリックで独自メニューを出す。<code>contextmenu\u003c/code> イベントを止め、クリック位置に出す。画面端では反転して枠内に収める。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>灰色の領域で右クリック（タッチは長押し）。端の方で試す。\u003c/p>\n  <div class=\"stage\" style=\"padding:0\">\n    <div id=\"s39-area\" class=\"s39-area\">右クリック\u003c/div>\n    <div id=\"s39-menu\" class=\"s39-menu\" role=\"menu\" hidden><button>コピー\u003c/button><button>貼り付け\u003c/button><button>行を挿入\u003c/button>\u003c/div>\n    <span class=\"readout\" id=\"s39-out\" style=\"position:absolute;left:8px;bottom:8px\">-\u003c/span>\n  \u003c/div>\n  <style data-code>\n    .s39-area { height: 180px; display: grid; place-items: center; color: var(--muted); }\n    .s39-menu { position: absolute; background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; padding: 4px; box-shadow: 0 10px 24px rgba(0,0,0,.15); z-index: 5; }\n    .s39-menu button { display: block; width: 100%; text-align: left; border: none; }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const area = $('#s39-area'), menu = $('#s39-menu'), stage = area.parentElement, out = $('#s39-out');\n      area.addEventListener('contextmenu', e => {\n        e.preventDefault();\n        menu.hidden = false;\n        const s = stage.getBoundingClientRect();\n        let x = e.clientX - s.left, y = e.clientY - s.top;\n        if (x + menu.offsetWidth > s.width) x -= menu.offsetWidth;    // 右にはみ出す → 左へ\n        if (y + menu.offsetHeight > s.height) y -= menu.offsetHeight; // 下にはみ出す → 上へ\n        menu.style.left = x + 'px'; menu.style.top = y + 'px';\n      });\n      const close = () => menu.hidden = true;\n      document.addEventListener('click', close);\n      document.addEventListener('keydown', e => e.key === 'Escape' && close());\n      $$('button', menu).forEach(b => b.onclick = () => out.textContent = '実行: ' + b.textContent);\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 40 ===================== -->\n<section class=\"demo\" id=\"n40\">\n  <h2><span class=\"no\">40\u003c/span>進捗表示 <small>Progress（determinate / indeterminate）\u003c/small>\u003c/h2>\n  <p class=\"what\">完了率が分かるなら確定型（バー）、分からないなら不定型（流れるだけ）。長い処理には必ずキャンセル手段を添える。<code>AbortController\u003c/code> で中断できる作りにしておく。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>開始 → 途中でキャンセル。\u003c/p>\n  <div class=\"stage\">\n    <div class=\"row\"><button id=\"s40-start\">1000件処理を開始\u003c/button><button id=\"s40-cancel\" disabled>キャンセル\u003c/button><span class=\"readout\" id=\"s40-out\">待機\u003c/span>\u003c/div>\n    <progress id=\"s40-bar\" max=\"100\" value=\"0\" style=\"width:100%\">\u003c/progress>\n    <div class=\"s40-indet\" id=\"s40-indet\" hidden>\u003c/div>\n  \u003c/div>\n  <style data-code>\n    .s40-indet { height: 6px; margin-top: 8px; border-radius: 3px; background: linear-gradient(90deg, transparent, var(--accent), transparent); background-size: 40% 100%; animation: s40 1s linear infinite; }\n    @keyframes s40 { from { background-position: -40% 0; } to { background-position: 140% 0; } }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const bar = $('#s40-bar'), out = $('#s40-out'), indet = $('#s40-indet'), start = $('#s40-start'), cancel = $('#s40-cancel');\n      let ctrl = null;\n      start.onclick = async () => {\n        ctrl = new AbortController(); start.disabled = true; cancel.disabled = false; indet.hidden = false; out.textContent = '準備中（不定型）';\n        await new Promise(r => setTimeout(r, 800));\n        indet.hidden = true;\n        for (let i = 1; i <= 100; i++) {\n          if (ctrl.signal.aborted) { out.textContent = `キャンセル（${i * 10}件で中断）`; break; }\n          await new Promise(r => setTimeout(r, 30));\n          bar.value = i; out.textContent = `${i * 10} / 1000 件`;\n        }\n        start.disabled = false; cancel.disabled = true;\n      };\n      cancel.onclick = () => ctrl?.abort();\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 41 ===================== -->\n<section class=\"demo\" id=\"n41\">\n  <h2><span class=\"no\">41\u003c/span>ジェスチャー競合の解決 <small>touch-action / 方向ロック\u003c/small>\u003c/h2>\n  <p class=\"what\">「縦にスクロールしたいのか、横にスワイプしたいのか」をブラウザと取り合わない。<code>touch-action: pan-y\u003c/code> で縦はブラウザに任せ、横は自分で取る。さらに初動数pxの方向で「今回はどちらか」を確定（方向ロック）する。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>カードを横にドラッグ（削除アクションが出る）。縦に動かすと枠がスクロールする。タッチ端末で差がよく分かる。\u003c/p>\n  <div class=\"stage\" style=\"padding:0\">\n    <div id=\"s41-list\" class=\"s41-list\">\u003c/div>\n  \u003c/div>\n  <style data-code>\n    .s41-list { height: 200px; overflow-y: auto; }\n    .s41-row { position: relative; background: #dc2626; color: #fff; }\n    .s41-row::after { content: '削除'; position: absolute; right: 14px; top: 10px; font-size: 13px; }\n    .s41-card { position: relative; background: #fff; padding: 10px 14px; border-bottom: 1px solid #e5e7eb; font-size: 13px; color: var(--text); touch-action: pan-y; user-select: none; }\n    .s41-card.snap { transition: transform .2s; }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const list = $('#s41-list');\n      list.innerHTML = Array.from({ length: 8 }, (_, i) => `<div class=\"s41-row\"><div class=\"s41-card\">通知 ${i + 1}：横スワイプで削除、縦でスクロール\u003c/div>\u003c/div>`).join('');\n      $$('.s41-card', list).forEach(card => {\n        let st = null, lock = null; // lock: 'x' | 'y' | null\n        card.addEventListener('pointerdown', e => { st = { x: e.clientX, y: e.clientY }; lock = null; card.classList.remove('snap'); });\n        card.addEventListener('pointermove', e => {\n          if (!st) return;\n          const dx = e.clientX - st.x, dy = e.clientY - st.y;\n          if (!lock && Math.hypot(dx, dy) > 6) lock = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y'; // 初動で方向確定\n          if (lock !== 'x') return;                    // 縦ならブラウザのスクロールに任せる\n          card.setPointerCapture(e.pointerId);\n          card.style.transform = `translateX(${Math.min(0, dx)}px)`;\n        });\n        const end = e => {\n          if (!st) return;\n          const dx = e.clientX - st.x; st = null; card.classList.add('snap');\n          if (lock === 'x' && dx < -100) card.style.transform = 'translateX(-100%)'; else card.style.transform = '';\n        };\n        card.addEventListener('pointerup', end); card.addEventListener('pointercancel', end);\n      });\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 42 ===================== -->\n<section class=\"demo\" id=\"n42\">\n  <h2><span class=\"no\">42\u003c/span>モーション低減対応 <small>prefers-reduced-motion\u003c/small>\u003c/h2>\n  <p class=\"what\">OS設定で「視覚効果を減らす」を選んだユーザーには、動きを短縮・省略する。CSSのメディアクエリ1つで全アニメーションを止められる。JSからも <code>matchMedia\u003c/code> で判定できる。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>ボタンで動かす。OS設定を変えるとこのページの動きが止まる（右の表示で確認）。\u003c/p>\n  <div class=\"stage\">\n    <div class=\"row\"><button id=\"s42-run\">動かす\u003c/button><span class=\"readout\" id=\"s42-out\">\u003c/span>\u003c/div>\n    <div id=\"s42-ball\" class=\"box s42-ball\">●\u003c/div>\n  \u003c/div>\n  <style data-code>\n    .s42-ball { transition: transform .8s cubic-bezier(.2,.8,.2,1); }\n    .s42-ball.moved { transform: translateX(300px) rotate(360deg); }\n    @media (prefers-reduced-motion: reduce) {\n      .s42-ball { transition: none; }  /* 移動はするが、動きは付けない */\n    }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const mq = matchMedia('(prefers-reduced-motion: reduce)'), out = $('#s42-out');\n      const show = () => out.textContent = `OS設定: ${mq.matches ? 'モーション低減 ON（アニメーション省略）' : '通常'}`;\n      mq.addEventListener('change', show); show();\n      $('#s42-run').onclick = () => $('#s42-ball').classList.toggle('moved');\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c/main>\n\u003c/div>\n\u003c/body>\n\u003c/html>\n","docs/ui-guide/04-pro.html":"<!DOCTYPE html>\n<html lang=\"ja\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>第2弾 C：プロ志向のUI（43〜62）動くデモ\u003c/title>\n<link rel=\"stylesheet\" href=\"assets/guide.css\">\n\u003cscript src=\"assets/guide.js\">\u003c/script>\n\u003c/head>\n<body>\n<header class=\"top\">\n  <h1>C：プロ志向のUI <span class=\"tier tierC\">43〜62\u003c/span>\u003c/h1>\n  <nav><a href=\"00-index.html\">⌂ 入口\u003c/a><a href=\"08-foundations.html\">基礎\u003c/a><a href=\"01-ui-operations-catalog.html\">カタログ\u003c/a><a href=\"02-basic.html\">A：一般 →\u003c/a><a href=\"03-custom.html\">B：カスタマイズ →\u003c/a><a href=\"09-exercises.html\">課題\u003c/a><a href=\"10-accessibility.html\">a11y\u003c/a><a href=\"11-quiz.html\">クイズ\u003c/a>\u003c/nav>\n\u003c/header>\n<div class=\"layout\">\n<aside class=\"toc\">\u003c/aside>\n<main>\n<div class=\"lead\">C層は「座標変換」「状態機械」「描画ループ」「アクセシビリティ」の4本柱。43〜46 は同じ座標変換の考え方を段階的に積み上げる。61・62 は Electron 専用のため、このページでは動作の模擬とコードの提示になる。\u003c/div>\n\n\u003c!-- ===================== 43 ===================== -->\n<section class=\"demo\" id=\"n43\">\n  <h2><span class=\"no\">43\u003c/span>無限キャンバス <small>Infinite canvas（パン＋ズーム＋座標変換）\u003c/small>\u003c/h2>\n  <p class=\"what\">画面座標（ピクセル）とワールド座標（図面上の位置）を分けて持つ。表示は <code>screen = world × scale + offset\u003c/code>、入力は逆算 <code>world = (screen − offset) ÷ scale\u003c/code>。この2つの式だけで、パン・ズーム・クリック位置の特定が全部つながる。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>ドラッグでパン、ホイールでズーム（カーソル基準）、ダブルクリックでその位置に点を置く。右上にカーソルのワールド座標が出る。\u003c/p>\n  <div class=\"stage tall\" style=\"padding:0\">\n    <div id=\"s43-view\" class=\"s43-view\">\n      <div id=\"s43-world\" class=\"s43-world\">\u003c/div>\n      <span class=\"readout\" id=\"s43-out\" style=\"position:absolute;right:8px;top:8px\">-\u003c/span>\n    \u003c/div>\n  \u003c/div>\n  <style data-code>\n    .s43-view { position: relative; height: 300px; overflow: hidden; background: #fff; touch-action: none; user-select: none; cursor: grab;\n      background-image: radial-gradient(#cbd5e1 1px, transparent 1px); background-size: 24px 24px; }\n    .s43-world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }\n    .s43-node { position: absolute; width: 80px; height: 40px; margin: -20px 0 0 -40px; background: var(--accent); color: #fff; border-radius: 6px; display: grid; place-items: center; font-size: 12px; }\n    .s43-dot { position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: #dc2626; }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const view = $('#s43-view'), world = $('#s43-world'), out = $('#s43-out');\n      const cam = { x: 40, y: 40, s: 1 };                               // offset と scale ＝「カメラ」\n      const toWorld = (sx, sy) => ({ x: (sx - cam.x) / cam.s, y: (sy - cam.y) / cam.s });\n      const apply = () => world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.s})`;\n      const local = e => { const r = view.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };\n\n      [[100, 80, '受注'], [320, 160, '製造'], [540, 90, '出荷']].forEach(([x, y, t]) =>\n        world.insertAdjacentHTML('beforeend', `<div class=\"s43-node\" style=\"left:${x}px;top:${y}px\">${t}<br>(${x},${y})\u003c/div>`));\n\n      let drag = null;\n      view.addEventListener('pointerdown', e => { const p = local(e); drag = { x: p.x - cam.x, y: p.y - cam.y }; view.setPointerCapture(e.pointerId); });\n      view.addEventListener('pointermove', e => {\n        const p = local(e), w = toWorld(p.x, p.y);\n        out.textContent = `screen(${Math.round(p.x)},${Math.round(p.y)}) → world(${Math.round(w.x)},${Math.round(w.y)}) scale=${cam.s.toFixed(2)}`;\n        if (drag) { cam.x = p.x - drag.x; cam.y = p.y - drag.y; apply(); }\n      });\n      view.addEventListener('pointerup', () => drag = null);\n      view.addEventListener('wheel', e => {                                // ズーム：カーソル位置を不動点にする（44参照）\n        e.preventDefault();\n        const p = local(e), before = toWorld(p.x, p.y);\n        cam.s = Math.min(4, Math.max(0.25, cam.s * Math.exp(-e.deltaY * 0.002)));\n        cam.x = p.x - before.x * cam.s; cam.y = p.y - before.y * cam.s;  // 同じワールド点がカーソル下に来るよう offset を補正\n        apply(); out.textContent = `scale=${cam.s.toFixed(2)}（カーソル下の world は不変）`;\n      }, { passive: false });\n      view.addEventListener('dblclick', e => { const w = toWorld(local(e).x, local(e).y); world.insertAdjacentHTML('beforeend', `<div class=\"s43-dot\" style=\"left:${w.x}px;top:${w.y}px\">\u003c/div>`); });\n      apply();\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 44 ===================== -->\n<section class=\"demo\" id=\"n44\">\n  <h2><span class=\"no\">44\u003c/span>ズーム中心の維持 <small>Zoom-to-cursor\u003c/small>\u003c/h2>\n  <p class=\"what\">「ズームすると見ていた場所がズレる」の正体は、原点基準で scale しているから。カーソル下のワールド座標を先に求め、scale 変更後も同じ点がカーソル下に来るよう offset を計算し直す。式：<code>offset = cursor − world × newScale\u003c/code>。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>方式を切り替えて、同じ位置でホイールしてみる。「原点基準」だと図がカーソルから逃げる。\u003c/p>\n  <div class=\"stage\" style=\"padding:0\">\n    <div class=\"row\" style=\"padding:8px\"><label><input type=\"radio\" name=\"s44\" value=\"cursor\" checked> カーソル基準（正）\u003c/label><label><input type=\"radio\" name=\"s44\" value=\"origin\"> 原点基準（ズレる）\u003c/label><button id=\"s44-reset\">リセット\u003c/button>\u003c/div>\n    <div id=\"s44-view\" class=\"s44-view\"><div id=\"s44-world\" class=\"s44-world grid-bg\"><div class=\"box\" style=\"position:absolute;left:150px;top:60px\">ここで<br>ホイール\u003c/div>\u003c/div>\u003c/div>\n  \u003c/div>\n  <style data-code>\n    .s44-view { position: relative; height: 220px; overflow: hidden; background: #fff; }\n    .s44-world { position: absolute; left: 0; top: 0; width: 600px; height: 400px; transform-origin: 0 0; border: 2px solid #94a3b8; }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const view = $('#s44-view'), world = $('#s44-world');\n      const cam = { x: 0, y: 0, s: 1 };\n      const apply = () => world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.s})`;\n      view.addEventListener('wheel', e => {\n        e.preventDefault();\n        const r = view.getBoundingClientRect(), cx = e.clientX - r.left, cy = e.clientY - r.top;\n        const newS = Math.min(4, Math.max(0.3, cam.s * Math.exp(-e.deltaY * 0.002)));\n        if ($('input[name=s44]:checked').value === 'cursor') {\n          const wx = (cx - cam.x) / cam.s, wy = (cy - cam.y) / cam.s;  // カーソル下のワールド座標\n          cam.x = cx - wx * newS; cam.y = cy - wy * newS;               // その点が同じ画面位置に来る offset\n        }\n        cam.s = newS; apply();\n      }, { passive: false });\n      $('#s44-reset').onclick = () => { cam.x = cam.y = 0; cam.s = 1; apply(); };\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 45 ===================== -->\n<section class=\"demo\" id=\"n45\">\n  <h2><span class=\"no\">45\u003c/span>ミニマップ <small>Minimap\u003c/small>\u003c/h2>\n  <p class=\"what\">全体を縮小して描き、現在の表示範囲を枠で示す。枠のドラッグでも移動できる。同じワールド座標を「別の縮尺」で描いているだけなので、43 の式がそのまま使える。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>大きい方をドラッグでパン、または右下のミニマップの枠をドラッグ。\u003c/p>\n  <div class=\"stage tall\" style=\"padding:0\">\n    <div id=\"s45-view\" class=\"s45-view\">\n      <div id=\"s45-world\" class=\"s45-world grid-bg\">\u003c/div>\n      <div id=\"s45-mini\" class=\"s45-mini\"><div id=\"s45-rect\" class=\"s45-rect\">\u003c/div>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n  <style data-code>\n    .s45-view { position: relative; height: 280px; overflow: hidden; background: #fff; touch-action: none; user-select: none; cursor: grab; }\n    .s45-world { position: absolute; left: 0; top: 0; width: 1600px; height: 1000px; }\n    .s45-world i { position: absolute; width: 60px; height: 40px; background: var(--accent); border-radius: 6px; opacity: .8; }\n    .s45-mini { position: absolute; right: 10px; bottom: 10px; width: 160px; height: 100px; background: rgba(255,255,255,.9); border: 1px solid #94a3b8; border-radius: 4px; overflow: hidden; cursor: move; }\n    .s45-mini i { position: absolute; width: 6px; height: 4px; background: var(--accent); }\n    .s45-rect { position: absolute; border: 2px solid #dc2626; background: rgba(220,38,38,.1); box-sizing: border-box; }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const view = $('#s45-view'), world = $('#s45-world'), mini = $('#s45-mini'), rect = $('#s45-rect');\n      const W = 1600, H = 1000, K = 160 / W;                             // ミニマップの縮尺\n      const items = Array.from({ length: 25 }, () => [Math.random() * (W - 60), Math.random() * (H - 40)]);\n      world.innerHTML = items.map(([x, y]) => `<i style=\"left:${x}px;top:${y}px\">\u003c/i>`).join('');\n      mini.insertAdjacentHTML('afterbegin', items.map(([x, y]) => `<i style=\"left:${x * K}px;top:${y * K}px\">\u003c/i>`).join(''));\n      const cam = { x: -300, y: -200 };\n      const clamp = () => { cam.x = Math.min(0, Math.max(view.clientWidth - W, cam.x)); cam.y = Math.min(0, Math.max(view.clientHeight - H, cam.y)); };\n      const apply = () => {\n        clamp(); world.style.transform = `translate(${cam.x}px, ${cam.y}px)`;\n        rect.style.left = -cam.x * K + 'px'; rect.style.top = -cam.y * K + 'px';   // 表示範囲 ＝ (-offset, viewサイズ) を縮尺で\n        rect.style.width = view.clientWidth * K + 'px'; rect.style.height = view.clientHeight * K + 'px';\n      };\n      let drag = null;\n      view.addEventListener('pointerdown', e => { if (mini.contains(e.target)) return; drag = { x: e.clientX - cam.x, y: e.clientY - cam.y }; view.setPointerCapture(e.pointerId); });\n      view.addEventListener('pointermove', e => { if (drag) { cam.x = e.clientX - drag.x; cam.y = e.clientY - drag.y; apply(); } });\n      view.addEventListener('pointerup', () => drag = null);\n      let mdrag = null;                                                   // ミニマップ側：動きを 1/K 倍して逆向きに\n      mini.addEventListener('pointerdown', e => { mdrag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y }; mini.setPointerCapture(e.pointerId); e.stopPropagation(); });\n      mini.addEventListener('pointermove', e => { if (mdrag) { cam.x = mdrag.cx - (e.clientX - mdrag.x) / K; cam.y = mdrag.cy - (e.clientY - mdrag.y) / K; apply(); } });\n      mini.addEventListener('pointerup', () => mdrag = null);\n      apply();\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 46 ===================== -->\n<section class=\"demo\" id=\"n46\">\n  <h2><span class=\"no\">46\u003c/span>ノードエディタ <small>Node graph / Wiring\u003c/small>\u003c/h2>\n  <p class=\"what\">ノード（箱）のポート同士を線で結ぶ。線は SVG のベジェ曲線 <code>M x1 y1 C x1+d y1, x2−d y2, x2 y2\u003c/code>。出力ポートからドラッグ→入力ポートで離すと接続。ノードを動かすと線を引き直す。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>右側の●から左側の●へドラッグして接続。ノード本体をドラッグで移動。線をクリックで削除。\u003c/p>\n  <div class=\"stage tall\" style=\"padding:0\">\n    <div id=\"s46-view\" class=\"s46-view grid-bg\">\n      <svg id=\"s46-svg\" class=\"s46-svg\">\u003c/svg>\n    \u003c/div>\n  \u003c/div>\n  <style data-code>\n    .s46-view { position: relative; height: 300px; overflow: hidden; user-select: none; touch-action: none; }\n    .s46-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }\n    .s46-svg path { fill: none; stroke: #475569; stroke-width: 2.5; pointer-events: stroke; cursor: pointer; }\n    .s46-svg path:hover { stroke: #dc2626; } .s46-svg path.temp { stroke: var(--accent); stroke-dasharray: 6 4; }\n    .s46-node { position: absolute; width: 140px; background: #fff; border: 1px solid #94a3b8; border-radius: 8px; font-size: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.08); }\n    .s46-node header { padding: 6px 10px; background: #f1f5f9; border-radius: 8px 8px 0 0; cursor: grab; font-weight: 600; }\n    .s46-node .ports { display: flex; justify-content: space-between; padding: 8px 0; }\n    .s46-port { width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 2px solid var(--accent); cursor: crosshair; }\n    .s46-port.in { margin-left: -7px; } .s46-port.out { margin-right: -7px; }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const view = $('#s46-view'), svg = $('#s46-svg');\n      const nodes = [['n1', 30, 40, '受注データ'], ['n2', 230, 140, '在庫引当'], ['n3', 430, 60, '出荷指示']];\n      nodes.forEach(([id, x, y, t]) => view.insertAdjacentHTML('beforeend',\n        `<div class=\"s46-node\" id=\"${id}\" style=\"left:${x}px;top:${y}px\"><header>${t}\u003c/header><div class=\"ports\"><div class=\"s46-port in\" data-node=\"${id}\">\u003c/div><div class=\"s46-port out\" data-node=\"${id}\">\u003c/div>\u003c/div>\u003c/div>`));\n      const edges = [['n1', 'n2']];\n      const portPos = (id, side) => { const p = $(`#${id} .s46-port.${side}`).getBoundingClientRect(), v = view.getBoundingClientRect(); return { x: p.left - v.left + 6, y: p.top - v.top + 6 }; };\n      const curve = (a, b) => `M ${a.x} ${a.y} C ${a.x + 60} ${a.y}, ${b.x - 60} ${b.y}, ${b.x} ${b.y}`;\n      const draw = () => {\n        svg.innerHTML = edges.map(([f, t], i) => `<path data-i=\"${i}\" d=\"${curve(portPos(f, 'out'), portPos(t, 'in'))}\">\u003c/path>`).join('') + '<path class=\"temp\" id=\"s46-temp\" d=\"\">\u003c/path>';\n      };\n      svg.addEventListener('click', e => { if (e.target.dataset.i) { edges.splice(+e.target.dataset.i, 1); draw(); } });\n      let mode = null;\n      view.addEventListener('pointerdown', e => {\n        const v = view.getBoundingClientRect();\n        if (e.target.classList.contains('out')) mode = { type: 'wire', from: e.target.dataset.node, start: portPos(e.target.dataset.node, 'out') };\n        else if (e.target.tagName === 'HEADER') { const n = e.target.parentElement; mode = { type: 'move', node: n, dx: e.clientX - n.offsetLeft, dy: e.clientY - n.offsetTop }; }\n        if (mode) view.setPointerCapture(e.pointerId);\n      });\n      view.addEventListener('pointermove', e => {\n        if (!mode) return;\n        const v = view.getBoundingClientRect();\n        if (mode.type === 'wire') $('#s46-temp').setAttribute('d', curve(mode.start, { x: e.clientX - v.left, y: e.clientY - v.top }));\n        else { mode.node.style.left = e.clientX - mode.dx + 'px'; mode.node.style.top = e.clientY - mode.dy + 'px'; draw(); }\n      });\n      view.addEventListener('pointerup', e => {\n        if (mode?.type === 'wire') {\n          const t = document.elementFromPoint(e.clientX, e.clientY);            // 離した場所の要素を調べる\n          if (t?.classList.contains('in') && t.dataset.node !== mode.from) edges.push([mode.from, t.dataset.node]);\n        }\n        mode = null; draw();\n      });\n      draw();\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 47 ===================== -->\n<section class=\"demo\" id=\"n47\">\n  <h2><span class=\"no\">47\u003c/span>スナップ / スマートガイド <small>Snapping / Smart guides\u003c/small>\u003c/h2>\n  <p class=\"what\">ドラッグ中、他要素の端・中心と一定距離（しきい値）以内なら、その座標に吸着してガイド線を出す。候補座標を全部列挙して「最も近いものが閾値内か」を見るだけ。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>青い箱をドラッグして灰色の箱の端・中心に近づける。<kbd>Ctrl\u003c/kbd> を押しながらだとスナップ無効。\u003c/p>\n  <div class=\"stage tall\" style=\"padding:0\">\n    <div id=\"s47-view\" class=\"s47-view\">\n      <div class=\"s47-fixed\" style=\"left:60px;top:40px;width:120px;height:80px\">\u003c/div>\n      <div class=\"s47-fixed\" style=\"left:340px;top:150px;width:100px;height:100px\">\u003c/div>\n      <div id=\"s47-box\" class=\"s47-box\">drag\u003c/div>\n      <div id=\"s47-gx\" class=\"s47-guide v\" hidden>\u003c/div><div id=\"s47-gy\" class=\"s47-guide h\" hidden>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n  <style data-code>\n    .s47-view { position: relative; height: 280px; background: #fff; overflow: hidden; touch-action: none; user-select: none; }\n    .s47-fixed { position: absolute; background: #e2e8f0; border-radius: 6px; }\n    .s47-box { position: absolute; left: 200px; top: 180px; width: 80px; height: 60px; background: var(--accent); color: #fff; border-radius: 6px; display: grid; place-items: center; cursor: grab; font-size: 12px; }\n    .s47-guide { position: absolute; background: #ec4899; pointer-events: none; }\n    .s47-guide.v { top: 0; bottom: 0; width: 1px; } .s47-guide.h { left: 0; right: 0; height: 1px; }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const view = $('#s47-view'), box = $('#s47-box'), gx = $('#s47-gx'), gy = $('#s47-gy'), TH = 6;\n      const targets = $$('.s47-fixed', view).map(f => ({ l: f.offsetLeft, t: f.offsetTop, w: f.offsetWidth, h: f.offsetHeight }));\n      const xs = [], ys = [];                                               // スナップ候補（端と中心）\n      targets.forEach(r => { xs.push(r.l, r.l + r.w / 2, r.l + r.w); ys.push(r.t, r.t + r.h / 2, r.t + r.h); });\n      const snap = (val, cands, size) => {                                  // 自分の左端/中心/右端のどれかが候補に近いか\n        let best = null;\n        for (const c of cands) for (const off of [0, size / 2, size]) { const d = c - (val + off); if (Math.abs(d) <= TH && (!best || Math.abs(d) < Math.abs(best.d))) best = { d, line: c }; }\n        return best;\n      };\n      let drag = null;\n      box.addEventListener('pointerdown', e => { drag = { dx: e.clientX - box.offsetLeft, dy: e.clientY - box.offsetTop }; box.setPointerCapture(e.pointerId); });\n      box.addEventListener('pointermove', e => {\n        if (!drag) return;\n        let x = e.clientX - drag.dx, y = e.clientY - drag.dy;\n        const sx = e.ctrlKey ? null : snap(x, xs, box.offsetWidth), sy = e.ctrlKey ? null : snap(y, ys, box.offsetHeight);\n        if (sx) { x += sx.d; gx.style.left = sx.line + 'px'; } gx.hidden = !sx;\n        if (sy) { y += sy.d; gy.style.top = sy.line + 'px'; } gy.hidden = !sy;\n        box.style.left = x + 'px'; box.style.top = y + 'px';\n      });\n      box.addEventListener('pointerup', () => { drag = null; gx.hidden = gy.hidden = true; });\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 48 ===================== -->\n<section class=\"demo\" id=\"n48\">\n  <h2><span class=\"no\">48\u003c/span>矩形選択 <small>Rubber band selection\u003c/small>\u003c/h2>\n  <p class=\"what\">空白からドラッグして矩形を描き、重なった要素をまとめて選ぶ。判定は「矩形同士が交差するか」の4比較。<kbd>Shift\u003c/kbd> 併用で既存選択に追加。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>空白からドラッグ。Shift+ドラッグで追加選択。\u003c/p>\n  <div class=\"stage tall\" style=\"padding:0\">\n    <div id=\"s48-view\" class=\"s48-view\"><div id=\"s48-band\" class=\"s48-band\" hidden>\u003c/div>\u003c/div>\n    <span class=\"readout\" id=\"s48-out\" style=\"position:absolute;left:8px;bottom:8px\">選択: 0\u003c/span>\n  \u003c/div>\n  <style data-code>\n    .s48-view { position: relative; height: 280px; background: #fff; overflow: hidden; touch-action: none; user-select: none; }\n    .s48-item { position: absolute; width: 44px; height: 44px; border-radius: 8px; background: #e2e8f0; display: grid; place-items: center; font-size: 12px; }\n    .s48-item.sel { background: var(--accent); color: #fff; }\n    .s48-band { position: absolute; border: 1px solid var(--accent); background: rgba(37,99,235,.15); pointer-events: none; }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const view = $('#s48-view'), band = $('#s48-band'), out = $('#s48-out');\n      for (let i = 0; i < 24; i++) view.insertAdjacentHTML('afterbegin', `<div class=\"s48-item\" style=\"left:${20 + (i % 8) * 70}px;top:${30 + Math.floor(i / 8) * 80}px\">${i + 1}\u003c/div>`);\n      const items = $$('.s48-item', view);\n      const hit = (a, b) => !(a.right < b.left || a.left > b.right || a.bottom < b.top || a.top > b.bottom); // 交差判定\n      let st = null, keep = new Set();\n      view.addEventListener('pointerdown', e => {\n        if (e.target !== view) return;\n        keep = e.shiftKey ? new Set(items.filter(i => i.classList.contains('sel'))) : new Set();\n        const r = view.getBoundingClientRect(); st = { x: e.clientX - r.left, y: e.clientY - r.top }; band.hidden = false; view.setPointerCapture(e.pointerId);\n      });\n      view.addEventListener('pointermove', e => {\n        if (!st) return;\n        const r = view.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;\n        const b = { left: Math.min(st.x, x), top: Math.min(st.y, y), right: Math.max(st.x, x), bottom: Math.max(st.y, y) };\n        Object.assign(band.style, { left: b.left + 'px', top: b.top + 'px', width: b.right - b.left + 'px', height: b.bottom - b.top + 'px' });\n        items.forEach(it => {\n          const ir = { left: it.offsetLeft, top: it.offsetTop, right: it.offsetLeft + it.offsetWidth, bottom: it.offsetTop + it.offsetHeight };\n          it.classList.toggle('sel', keep.has(it) || hit(b, ir));\n        });\n        out.textContent = '選択: ' + items.filter(i => i.classList.contains('sel')).length;\n      });\n      view.addEventListener('pointerup', () => { st = null; band.hidden = true; });\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 49 ===================== -->\n<section class=\"demo\" id=\"n49\">\n  <h2><span class=\"no\">49\u003c/span>ポインタキャプチャ <small>setPointerCapture\u003c/small>\u003c/h2>\n  <p class=\"what\">ドラッグ中にポインタが要素の外に出ても、その要素がイベントを受け続けるようにする。これが無いと「速く動かすと箱が置いていかれる」「外で離すと pointerup が来ない」が起きる。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>2つの箱を素早くドラッグして比べる。左はキャプチャなし（外に出た瞬間止まる）。\u003c/p>\n  <div class=\"stage tall\" style=\"padding:0\">\n    <div class=\"s49-view\">\n      <div id=\"s49-a\" class=\"box s49-box\" style=\"left:40px\">なし\u003c/div>\n      <div id=\"s49-b\" class=\"box s49-box\" style=\"left:200px\">capture\u003c/div>\n      <span class=\"readout\" id=\"s49-out\" style=\"position:absolute;left:8px;bottom:8px\">-\u003c/span>\n    \u003c/div>\n  \u003c/div>\n  <style data-code>\n    .s49-view { position: relative; height: 240px; }\n    .s49-box { position: absolute; top: 60px; cursor: grab; }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const out = $('#s49-out');\n      const setup = (el, capture) => {\n        let d = null, moves = 0;\n        el.addEventListener('pointerdown', e => { d = { x: e.clientX - el.offsetLeft, y: e.clientY - el.offsetTop }; moves = 0; if (capture) el.setPointerCapture(e.pointerId); });\n        el.addEventListener('pointermove', e => { if (!d) return; moves++; el.style.left = e.clientX - d.x + 'px'; el.style.top = e.clientY - d.y + 'px'; });\n        el.addEventListener('pointerup', () => { d = null; out.textContent = `${el.textContent}: pointermove ${moves} 回, pointerup 受信`; });\n        el.addEventListener('lostpointercapture', () => d = null);\n      };\n      setup($('#s49-a'), false); setup($('#s49-b'), true);\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 50 ===================== -->\n<section class=\"demo\" id=\"n50\">\n  <h2><span class=\"no\">50\u003c/span>マルチタッチジェスチャー <small>Pinch / Rotate / 2-finger pan\u003c/small>\u003c/h2>\n  <p class=\"what\">2本の指の「距離」「角度」「中点」の変化量から、拡大率・回転角・移動量を同時に求める。<code>pointerId\u003c/code> ごとに座標を Map で持てば、Pointer Events だけで書ける。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>タッチ端末なら2本指でピンチ／回転。マウスなら <kbd>Shift\u003c/kbd> を押しながらドラッグすると「2本目の指が箱の中心に固定されている」扱いで模擬できる。\u003c/p>\n  <div class=\"stage tall\" style=\"padding:0\">\n    <div id=\"s50-view\" class=\"s50-view grid-bg\"><div id=\"s50-box\" class=\"box\" style=\"width:120px;height:120px;position:absolute;left:180px;top:70px\">multi<br>touch\u003c/div><span class=\"readout\" id=\"s50-out\" style=\"position:absolute;left:8px;top:8px\">-\u003c/span>\u003c/div>\n  \u003c/div>\n  <style data-code>\n    .s50-view { position: relative; height: 280px; overflow: hidden; touch-action: none; user-select: none; }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const view = $('#s50-view'), box = $('#s50-box'), out = $('#s50-out');\n      const pts = new Map(); let base = null, anchor = null;   // anchor: マウス模擬用の「固定された2本目の指」\n      const T = { x: 0, y: 0, s: 1, r: 0 };\n      const apply = () => { box.style.transform = `translate(${T.x}px, ${T.y}px) rotate(${T.r}deg) scale(${T.s})`; out.textContent = `scale=${T.s.toFixed(2)} rotate=${T.r.toFixed(0)}° pointers=${pts.size}`; };\n      const center = () => { const r = box.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; };\n      const gesture = () => {                                  // 2点から「距離・角度・中点」を出す\n        const p = [...pts.values()], a = p[0], b = p.length >= 2 ? p[1] : anchor;  // 1本なら固定点を2本目に\n        return { d: Math.hypot(b.x - a.x, b.y - a.y), ang: Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, p0: { ...a } };\n      };\n      const rebase = () => base = pts.size ? { g: gesture(), T: { ...T } } : null;\n      view.addEventListener('pointerdown', e => { if (!pts.size) anchor = center(); pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); view.setPointerCapture(e.pointerId); rebase(); });\n      view.addEventListener('pointermove', e => {\n        if (!pts.has(e.pointerId) || !base) return;\n        pts.set(e.pointerId, { x: e.clientX, y: e.clientY });\n        const g = gesture();\n        if (pts.size >= 2 || e.shiftKey) {                       // ピンチ・回転・2本指パン\n          T.s = base.T.s * g.d / base.g.d; T.r = base.T.r + (g.ang - base.g.ang);\n          T.x = base.T.x + (g.mx - base.g.mx); T.y = base.T.y + (g.my - base.g.my);\n        } else {                                                 // 1本指：パンのみ\n          T.x = base.T.x + (g.p0.x - base.g.p0.x); T.y = base.T.y + (g.p0.y - base.g.p0.y);\n        }\n        apply();\n      });\n      const up = e => { pts.delete(e.pointerId); rebase(); apply(); };\n      view.addEventListener('pointerup', up); view.addEventListener('pointercancel', up);\n      apply();\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 51 ===================== -->\n<section class=\"demo\" id=\"n51\">\n  <h2><span class=\"no\">51\u003c/span>修飾キーによる制約 <small>Constrained drag（Shift / Alt / Ctrl）\u003c/small>\u003c/h2>\n  <p class=\"what\">ツール系アプリの共通作法：<kbd>Shift\u003c/kbd>=軸固定（水平か垂直のみ）、<kbd>Alt\u003c/kbd>=グリッド吸着、<kbd>Ctrl\u003c/kbd>=吸着解除。移動量の計算の最後に、押されているキーで補正を掛けるだけ。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>箱をドラッグしながら Shift / Alt を押す。\u003c/p>\n  <div class=\"stage tall\" style=\"padding:0\">\n    <div class=\"s51-view grid-bg\" style=\"background-size:20px 20px\"><div id=\"s51-box\" class=\"box\" style=\"position:absolute;left:100px;top:60px\">drag\u003c/div><span class=\"readout\" id=\"s51-out\" style=\"position:absolute;left:8px;top:8px\">-\u003c/span>\u003c/div>\n  \u003c/div>\n  <style data-code>\n    .s51-view { position: relative; height: 240px; overflow: hidden; touch-action: none; user-select: none; }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const box = $('#s51-box'), out = $('#s51-out'), GRID = 20;\n      let st = null;\n      box.addEventListener('pointerdown', e => { st = { x: e.clientX, y: e.clientY, l: box.offsetLeft, t: box.offsetTop }; box.setPointerCapture(e.pointerId); });\n      box.addEventListener('pointermove', e => {\n        if (!st) return;\n        let dx = e.clientX - st.x, dy = e.clientY - st.y, mods = [];\n        if (e.shiftKey) { Math.abs(dx) > Math.abs(dy) ? dy = 0 : dx = 0; mods.push('Shift: 軸固定'); } // 大きい方の軸だけ残す\n        let x = st.l + dx, y = st.t + dy;\n        if (e.altKey) { x = Math.round(x / GRID) * GRID; y = Math.round(y / GRID) * GRID; mods.push('Alt: グリッド吸着'); }\n        box.style.left = x + 'px'; box.style.top = y + 'px';\n        out.textContent = `(${x}, ${y}) ${mods.join(' / ') || '制約なし'}`;\n      });\n      box.addEventListener('pointerup', () => st = null);\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 52 ===================== -->\n<section class=\"demo\" id=\"n52\">\n  <h2><span class=\"no\">52\u003c/span>状態機械駆動UI <small>State-machine driven interaction\u003c/small>\u003c/h2>\n  <p class=\"what\">「押した」「動かした」「離した」を場当たり的に処理するとバグが出る。状態を明示（idle → pressed → dragging → idle）し、各イベントで「今の状態で何が起きたら次はどこか」だけを書く。押しただけ（pressed→idle）はクリック、閾値を超えたらドラッグ、と分岐が自然に決まる。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>箱をクリック／少しだけ動かす／大きく動かす。右の図で現在状態が光る。\u003c/p>\n  <div class=\"stage\">\n    <div class=\"row\" style=\"align-items:flex-start\">\n      <div class=\"s52-view grid-bg\"><div id=\"s52-box\" class=\"box\" style=\"position:absolute;left:40px;top:40px\">箱\u003c/div>\u003c/div>\n      <div style=\"flex:1\">\n        <div class=\"s52-states\"><span data-s=\"idle\" class=\"on\">idle\u003c/span>→<span data-s=\"pressed\">pressed\u003c/span>→<span data-s=\"dragging\">dragging\u003c/span>\u003c/div>\n        <div class=\"log\" id=\"s52-log\">\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n  <style data-code>\n    .s52-view { position: relative; width: 240px; height: 170px; touch-action: none; user-select: none; }\n    .s52-states { font-family: ui-monospace, monospace; font-size: 13px; margin-bottom: 6px; }\n    .s52-states span { padding: 2px 8px; border-radius: 4px; background: #e2e8f0; margin: 0 4px; }\n    .s52-states span.on { background: var(--accent); color: #fff; }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const box = $('#s52-box'), log = $('#s52-log'), TH = 5;\n      let state = 'idle', ctx = {};\n      const go = (next, why) => { logTo(log, `${state} --(${why})--> ${next}`); state = next; $$('.s52-states span').forEach(s => s.classList.toggle('on', s.dataset.s === next)); };\n      box.addEventListener('pointerdown', e => {\n        if (state !== 'idle') return;\n        ctx = { x: e.clientX, y: e.clientY, l: box.offsetLeft, t: box.offsetTop }; box.setPointerCapture(e.pointerId); go('pressed', 'pointerdown');\n      });\n      box.addEventListener('pointermove', e => {\n        const dx = e.clientX - ctx.x, dy = e.clientY - ctx.y;\n        if (state === 'pressed' && Math.hypot(dx, dy) > TH) go('dragging', `移動 > ${TH}px`);\n        if (state === 'dragging') { box.style.left = ctx.l + dx + 'px'; box.style.top = ctx.t + dy + 'px'; }\n      });\n      box.addEventListener('pointerup', () => {\n        if (state === 'pressed') { go('idle', 'pointerup → クリック扱い'); }\n        else if (state === 'dragging') { go('idle', 'pointerup → ドロップ確定'); }\n      });\n      box.addEventListener('pointercancel', () => { if (state !== 'idle') { box.style.left = ctx.l + 'px'; box.style.top = ctx.t + 'px'; go('idle', 'cancel → 元に戻す'); } });\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 53 ===================== -->\n<section class=\"demo\" id=\"n53\">\n  <h2><span class=\"no\">53\u003c/span>Web Animations API <small>WAAPI\u003c/small>\u003c/h2>\n  <p class=\"what\">JS からアニメーションを生成し、一時停止・逆再生・速度変更・完了待ち（Promise）ができる。CSS transition では「途中で止めて戻す」が書きにくいが、WAAPI なら <code>animation.reverse()\u003c/code> の1行。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>ボタンで制御。「完了待ち」は <code>await anim.finished\u003c/code> の後にログが出る。\u003c/p>\n  <div class=\"stage\">\n    <div class=\"row\"><button id=\"s53-play\">再生\u003c/button><button id=\"s53-pause\">一時停止\u003c/button><button id=\"s53-reverse\">逆再生\u003c/button><button id=\"s53-fast\">速度×3\u003c/button><span class=\"readout\" id=\"s53-out\">-\u003c/span>\u003c/div>\n    <div id=\"s53-box\" class=\"box\">WAAPI\u003c/div>\n  \u003c/div>\n  \u003cscript data-code>\n    (() => {\n      const box = $('#s53-box'), out = $('#s53-out');\n      const anim = box.animate(\n        [{ transform: 'translateX(0) rotate(0)' }, { transform: 'translateX(320px) rotate(360deg)' }],\n        { duration: 1500, easing: 'ease-in-out', fill: 'both' });\n      anim.pause();\n      const watch = async () => { out.textContent = `state: ${anim.playState}`; try { await anim.finished; out.textContent = 'finished（Promise 解決）'; } catch { /* cancel 時 */ } };\n      $('#s53-play').onclick = () => { anim.playbackRate = 1; anim.play(); watch(); };\n      $('#s53-pause').onclick = () => { anim.pause(); out.textContent = `state: ${anim.playState} @ ${Math.round(anim.currentTime)}ms`; };\n      $('#s53-reverse').onclick = () => { anim.reverse(); watch(); };\n      $('#s53-fast').onclick = () => { anim.playbackRate = 3; anim.play(); watch(); };\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 54 ===================== -->\n<section class=\"demo\" id=\"n54\">\n  <h2><span class=\"no\">54\u003c/span>描画ループ最適化 <small>rAF batching\u003c/small>\u003c/h2>\n  <p class=\"what\"><code>pointermove\u003c/code> は 1フレームに複数回来ることがある（高レートマウス・タッチ）。イベントごとに描画すると無駄。「最新の値だけ保存し、描画は <code>requestAnimationFrame\u003c/code> で1フレーム1回」にまとめる。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>方眼の上でマウスを素早く動かす。イベント回数と描画回数の差を見る。\u003c/p>\n  <div class=\"stage\">\n    <div class=\"row\"><label><input type=\"checkbox\" id=\"s54-batch\" checked> rAF でまとめる\u003c/label><span class=\"readout\" id=\"s54-out\">-\u003c/span>\u003c/div>\n    <div id=\"s54-view\" class=\"s54-view grid-bg\"><div id=\"s54-dot\" class=\"s54-dot\">\u003c/div>\u003c/div>\n  \u003c/div>\n  <style data-code>\n    .s54-view { position: relative; height: 140px; overflow: hidden; }\n    .s54-dot { position: absolute; width: 16px; height: 16px; margin: -8px; border-radius: 50%; background: #dc2626; pointer-events: none; }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const view = $('#s54-view'), dot = $('#s54-dot'), out = $('#s54-out'), batch = $('#s54-batch');\n      let events = 0, paints = 0, pending = false, last = null;\n      const paint = () => { paints++; dot.style.transform = `translate(${last.x}px, ${last.y}px)`; out.textContent = `pointermove ${events} 回 / 描画 ${paints} 回`; pending = false; };\n      view.addEventListener('pointermove', e => {\n        events++;\n        const r = view.getBoundingClientRect(); last = { x: e.clientX - r.left, y: e.clientY - r.top }; // 最新値だけ保持\n        if (!batch.checked) return paint();                     // 毎イベント描画（比較用）\n        if (!pending) { pending = true; requestAnimationFrame(paint); } // 1フレーム1回だけ\n      });\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 55 ===================== -->\n<section class=\"demo\" id=\"n55\">\n  <h2><span class=\"no\">55\u003c/span>Canvas 描画 <small>Canvas rendering + ヒットテスト + devicePixelRatio\u003c/small>\u003c/h2>\n  <p class=\"what\">DOM要素を数万個作ると重いが、Canvas ならビットマップに描くだけなので軽い。代わりに「どれをクリックしたか」は自分で計算する（ヒットテスト）。高解像度画面では <code>devicePixelRatio\u003c/code> 分だけ内部解像度を上げないとぼやける。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>点の上にマウスを乗せると赤くなる（距離計算でヒット判定）。\u003c/p>\n  <div class=\"stage\" style=\"padding:0\">\n    <canvas id=\"s55-c\" class=\"s55-c\">\u003c/canvas>\n    <span class=\"readout\" id=\"s55-out\" style=\"position:absolute;left:8px;top:8px\">-\u003c/span>\n  \u003c/div>\n  <style data-code>\n    .s55-c { display: block; width: 100%; height: 240px; background: #fff; }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const c = $('#s55-c'), ctx = c.getContext('2d'), out = $('#s55-out'), N = 20000;\n      const dpr = devicePixelRatio || 1;\n      let W, H, pts = [], hover = -1;\n      const resize = () => {\n        W = c.clientWidth; H = c.clientHeight;\n        c.width = W * dpr; c.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);  // 内部解像度を DPR 倍に\n        pts = Array.from({ length: N }, () => ({ x: Math.random() * W, y: Math.random() * H }));\n        draw();\n      };\n      const draw = () => {\n        const t0 = performance.now();\n        ctx.clearRect(0, 0, W, H); ctx.fillStyle = '#93c5fd';\n        for (const p of pts) ctx.fillRect(p.x, p.y, 2, 2);\n        if (hover >= 0) { ctx.fillStyle = '#dc2626'; ctx.beginPath(); ctx.arc(pts[hover].x + 1, pts[hover].y + 1, 6, 0, Math.PI * 2); ctx.fill(); }\n        out.textContent = `${N.toLocaleString()} 点を ${(performance.now() - t0).toFixed(1)}ms で描画 / dpr=${dpr}` + (hover >= 0 ? ` / hit #${hover}` : '');\n      };\n      c.addEventListener('pointermove', e => {\n        const r = c.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;\n        let best = -1, bd = 64;                                              // 8px 以内で最も近い点\n        for (let i = 0; i < pts.length; i++) { const d = (pts[i].x - x) ** 2 + (pts[i].y - y) ** 2; if (d < bd) { bd = d; best = i; } }\n        if (best !== hover) { hover = best; draw(); }\n      });\n      new ResizeObserver(resize).observe(c);\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 56 ===================== -->\n<section class=\"demo\" id=\"n56\">\n  <h2><span class=\"no\">56\u003c/span>データグリッド操作 <small>セル範囲選択 / 列幅変更 / フィルハンドル / 貼り付け\u003c/small>\u003c/h2>\n  <p class=\"what\">業務アプリの中核。Excel の作法をどこまで再現するかで使い勝手が決まる。ここでは4つ：①ドラッグでセル範囲選択 ②列見出しの境界ドラッグで列幅変更 ③選択範囲右下の■を下にドラッグで値を埋める ④Excelからコピーした表を <kbd>Ctrl\u003c/kbd>+<kbd>V\u003c/kbd> で流し込む（TSV解析）。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>セルをドラッグ、列境界をドラッグ、右下■を下へドラッグ、Excel等の表をコピーしてグリッド上で貼り付け。\u003c/p>\n  <div class=\"stage\">\n    <div class=\"row\"><span class=\"readout\" id=\"s56-out\">-\u003c/span>\u003c/div>\n    <div id=\"s56-wrap\" class=\"s56-wrap\" tabindex=\"0\"><table id=\"s56-t\" class=\"s56\">\u003c/table><div id=\"s56-fill\" class=\"s56-fill\" hidden>\u003c/div>\u003c/div>\n  \u003c/div>\n  <style data-code>\n    .s56-wrap { position: relative; overflow: auto; background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; user-select: none; }\n    .s56 { border-collapse: collapse; font-size: 13px; table-layout: fixed; }\n    .s56 th, .s56 td { border: 1px solid #e5e7eb; padding: 3px 8px; overflow: hidden; white-space: nowrap; position: relative; }\n    .s56 th { background: #f1f5f9; font-weight: 600; }\n    .s56 th .rs { position: absolute; right: 0; top: 0; bottom: 0; width: 6px; cursor: col-resize; touch-action: none; }\n    .s56 td.sel { background: var(--accent-soft); }\n    .s56-fill { position: absolute; width: 8px; height: 8px; background: var(--accent); cursor: crosshair; touch-action: none; }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const wrap = $('#s56-wrap'), t = $('#s56-t'), fill = $('#s56-fill'), out = $('#s56-out');\n      const COLS = ['品番', '品名', '数量', '単価'], data = Array.from({ length: 6 }, (_, r) => [`P-${100 + r}`, `部品${r + 1}`, String((r + 1) * 10), '250']);\n      let sel = null; // {r1,c1,r2,c2}\n      const render = () => {\n        t.innerHTML = '<tr>' + COLS.map((c, i) => `<th style=\"width:${[80, 120, 70, 70][i]}px\">${c}<span class=\"rs\" data-c=\"${i}\">\u003c/span>\u003c/th>`).join('') + '\u003c/tr>' +\n          data.map((row, r) => '<tr>' + row.map((v, c) => `<td data-r=\"${r}\" data-c=\"${c}\">${v}\u003c/td>`).join('') + '\u003c/tr>').join('');\n        paintSel();\n      };\n      const norm = s => ({ r1: Math.min(s.r1, s.r2), r2: Math.max(s.r1, s.r2), c1: Math.min(s.c1, s.c2), c2: Math.max(s.c1, s.c2) });\n      const paintSel = () => {\n        $$('td', t).forEach(td => td.classList.remove('sel')); fill.hidden = !sel; if (!sel) return;\n        const n = norm(sel);\n        $$('td', t).forEach(td => { const r = +td.dataset.r, c = +td.dataset.c; if (r >= n.r1 && r <= n.r2 && c >= n.c1 && c <= n.c2) td.classList.add('sel'); });\n        const last = $(`td[data-r=\"${n.r2}\"][data-c=\"${n.c2}\"]`, t);\n        fill.style.left = last.offsetLeft + last.offsetWidth - 5 + 'px'; fill.style.top = last.offsetTop + last.offsetHeight - 5 + 'px';\n        out.textContent = `選択: R${n.r1 + 1}C${n.c1 + 1} 〜 R${n.r2 + 1}C${n.c2 + 1}`;\n      };\n      let mode = null;\n      wrap.addEventListener('pointerdown', e => {\n        const td = e.target.closest('td');\n        if (e.target.classList.contains('rs')) { const th = e.target.parentElement; mode = { type: 'resize', th, x: e.clientX, w: th.offsetWidth }; }\n        else if (e.target === fill) { mode = { type: 'fill', from: norm(sel) }; }\n        else if (td) { sel = { r1: +td.dataset.r, c1: +td.dataset.c, r2: +td.dataset.r, c2: +td.dataset.c }; mode = { type: 'select' }; paintSel(); }\n        if (mode) wrap.setPointerCapture(e.pointerId);\n        wrap.focus();\n      });\n      wrap.addEventListener('pointermove', e => {\n        if (!mode) return;\n        const td = document.elementFromPoint(e.clientX, e.clientY)?.closest('td');\n        if (mode.type === 'resize') mode.th.style.width = Math.max(40, mode.w + e.clientX - mode.x) + 'px';\n        else if (mode.type === 'select' && td) { sel.r2 = +td.dataset.r; sel.c2 = +td.dataset.c; paintSel(); }\n        else if (mode.type === 'fill' && td) { sel = { ...mode.from, r2: Math.max(mode.from.r2, +td.dataset.r) }; paintSel(); }\n      });\n      wrap.addEventListener('pointerup', () => {\n        if (mode?.type === 'fill') {                                            // 選択範囲の最終行の値を下へコピー\n          const f = mode.from, n = norm(sel);\n          for (let r = f.r2 + 1; r <= n.r2; r++) for (let c = f.c1; c <= f.c2; c++) data[r][c] = data[f.r2][c];\n          render();\n        }\n        mode = null;\n      });\n      wrap.addEventListener('paste', e => {                                     // Excel → TSV\n        if (!sel) return; e.preventDefault();\n        const rows = e.clipboardData.getData('text/plain').replace(/\\r/g, '').split('\\n').filter(Boolean).map(l => l.split('\\t'));\n        const n = norm(sel);\n        rows.forEach((row, i) => row.forEach((v, j) => { if (data[n.r1 + i] && n.c1 + j < COLS.length) data[n.r1 + i][n.c1 + j] = v; }));\n        sel = { r1: n.r1, c1: n.c1, r2: Math.min(data.length - 1, n.r1 + rows.length - 1), c2: Math.min(COLS.length - 1, n.c1 + rows[0].length - 1) };\n        render(); out.textContent += `（${rows.length}行貼り付け）`;\n      });\n      render();\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 57 ===================== -->\n<section class=\"demo\" id=\"n57\">\n  <h2><span class=\"no\">57\u003c/span>楽観的更新 <small>Optimistic UI\u003c/small>\u003c/h2>\n  <p class=\"what\">サーバ応答を待たずに画面を先に更新し、失敗したら元に戻す。kintone の <code>PUT /k/v1/record.json\u003c/code> のような更新系で、体感の遅さを消す。ロールバックとエラー通知が必須。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>チェックを切り替える（即反映）。「失敗させる」をONにすると 1.2秒後に巻き戻る。\u003c/p>\n  <div class=\"stage\">\n    <div class=\"row\"><label><input type=\"checkbox\" id=\"s57-fail\"> API を失敗させる\u003c/label><span class=\"readout\" id=\"s57-out\">-\u003c/span>\u003c/div>\n    <div id=\"s57-list\" class=\"s57-list\">\u003c/div>\n  \u003c/div>\n  <style data-code>\n    .s57-list label { display: flex; gap: 8px; padding: 6px 10px; background: #fff; border: 1px solid #e5e7eb; border-radius: 6px; margin-bottom: 4px; font-size: 13px; }\n    .s57-list label.pending { opacity: .6; }\n    .s57-list label.error { border-color: #dc2626; background: #fef2f2; }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const list = $('#s57-list'), out = $('#s57-out');\n      const items = [{ id: 1, name: '図面確認', done: true }, { id: 2, name: '材料手配', done: false }, { id: 3, name: '治具準備', done: false }];\n      const fakeApi = (id, done) => new Promise((ok, ng) => setTimeout(() => $('#s57-fail').checked ? ng(new Error('500')) : ok(), 1200));\n      const render = () => list.innerHTML = items.map(i => `<label data-id=\"${i.id}\" class=\"${i.state || ''}\"><input type=\"checkbox\" ${i.done ? 'checked' : ''}> ${i.name}\u003c/label>`).join('');\n      list.addEventListener('change', async e => {\n        const item = items.find(i => i.id === +e.target.closest('label').dataset.id);\n        const prev = item.done;\n        item.done = e.target.checked; item.state = 'pending'; render();        // ① 先に画面を更新\n        out.textContent = `#${item.id} を送信中…（画面は更新済み）`;\n        try { await fakeApi(item.id, item.done); item.state = ''; out.textContent = `#${item.id} 保存成功`; }\n        catch (err) { item.done = prev; item.state = 'error'; out.textContent = `#${item.id} 失敗 → 元に戻しました (${err.message})`; } // ② 失敗なら巻き戻す\n        render();\n      });\n      render();\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 58 ===================== -->\n<section class=\"demo\" id=\"n58\">\n  <h2><span class=\"no\">58\u003c/span>フォーカス管理 / ライブリージョン <small>Focus trap / inert / aria-live\u003c/small>\u003c/h2>\n  <p class=\"what\">自作モーダルでは3つ必要：①開いたら中にフォーカスを移す ②背面を <code>inert\u003c/code> にして Tab が抜けないようにする ③閉じたら元の要素へフォーカスを戻す。非同期の結果は <code>aria-live\u003c/code> 領域に書くと読み上げソフトが通知する。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>開いて <kbd>Tab\u003c/kbd> を連打（外に出ない）→ 閉じると「開く」ボタンにフォーカスが戻る。\u003c/p>\n  <div class=\"stage\" style=\"min-height:160px\">\n    <div id=\"s58-main\">\n      <div class=\"row\"><button id=\"s58-open\">自作モーダルを開く\u003c/button><button>背面のボタン（開いている間は inert）\u003c/button>\u003c/div>\n      <div id=\"s58-live\" aria-live=\"polite\" class=\"readout\">（ここが aria-live 領域）\u003c/div>\n    \u003c/div>\n    <div id=\"s58-modal\" class=\"s58-modal\" role=\"dialog\" aria-modal=\"true\" hidden>\n      <div class=\"s58-panel\"><b>自作モーダル\u003c/b><div class=\"row\" style=\"margin-top:8px\"><input type=\"text\" placeholder=\"項目\"><button id=\"s58-save\">保存\u003c/button><button id=\"s58-close\">閉じる\u003c/button>\u003c/div>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n  <style data-code>\n    .s58-modal { position: absolute; inset: 0; background: rgba(15,23,42,.4); display: grid; place-items: center; }\n    .s58-modal[hidden] { display: none; }  /* display を指定すると hidden 属性が負けるので明示する */\n    .s58-panel { background: #fff; padding: 16px; border-radius: 10px; width: 300px; }\n    .s58-panel :focus-visible { outline: 3px solid #f59e0b; }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const main = $('#s58-main'), modal = $('#s58-modal'), live = $('#s58-live');\n      let opener = null;\n      const open = () => { opener = document.activeElement; modal.hidden = false; main.inert = true; $('input', modal).focus(); };  // ①②\n      const close = () => { modal.hidden = true; main.inert = false; opener?.focus(); };                                         // ③\n      $('#s58-open').onclick = open; $('#s58-close').onclick = close;\n      modal.addEventListener('keydown', e => e.key === 'Escape' && close());\n      $('#s58-save').onclick = () => { close(); live.textContent = `保存しました（${new Date().toLocaleTimeString()}）← 読み上げ対象`; };\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 59 ===================== -->\n<section class=\"demo\" id=\"n59\">\n  <h2><span class=\"no\">59\u003c/span>ファイルドロップ <small>File drop / DataTransfer\u003c/small>\u003c/h2>\n  <p class=\"what\">OSのエクスプローラからファイルをドラッグして受け取る。<code>dragover\u003c/code> で <code>preventDefault()\u003c/code> しないとブラウザがファイルを開いてしまう。ドロップ領域のハイライトと、種別・サイズの検証をここで行う。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>デスクトップからファイルを枠に落とす（クリックで選択も可）。\u003c/p>\n  <div class=\"stage\">\n    <div id=\"s59-zone\" class=\"s59-zone\">ここにファイルをドロップ（またはクリック）<input id=\"s59-input\" type=\"file\" multiple hidden>\u003c/div>\n    <div class=\"log\" id=\"s59-log\">\u003c/div>\n  \u003c/div>\n  <style data-code>\n    .s59-zone { border: 2px dashed #94a3b8; border-radius: 8px; padding: 24px; text-align: center; color: var(--muted); cursor: pointer; margin-bottom: 8px; }\n    .s59-zone.over { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const zone = $('#s59-zone'), input = $('#s59-input'), log = $('#s59-log');\n      const accept = files => [...files].forEach(f => {\n        const ok = f.size < 5 * 1024 * 1024;                                       // 検証例：5MB 未満\n        logTo(log, `${ok ? '✔' : '✖'} ${f.name}  ${(f.size / 1024).toFixed(1)} KB  ${f.type || '(type不明)'}` + (ok ? '' : '  → サイズ超過'));\n      });\n      zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('over'); }); // ← 必須\n      zone.addEventListener('dragleave', () => zone.classList.remove('over'));\n      zone.addEventListener('drop', e => { e.preventDefault(); zone.classList.remove('over'); accept(e.dataTransfer.files); });\n      zone.addEventListener('click', () => input.click());\n      input.addEventListener('change', () => accept(input.files));\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 60 ===================== -->\n<section class=\"demo\" id=\"n60\">\n  <h2><span class=\"no\">60\u003c/span>コンテナクエリ <small>Container queries\u003c/small>\u003c/h2>\n  <p class=\"what\">画面幅ではなく「自分が置かれた枠の幅」でレイアウトを切り替える。同じカード部品を、広いメイン領域では横並び、狭いサイドパネルでは縦積みにできる。ドッキングレイアウト（33）の中身に必須。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>枠の右下をドラッグして幅を変える。420px を境にカード内のレイアウトが変わる。\u003c/p>\n  <div class=\"stage\">\n    <div id=\"s60-box\" class=\"s60-box\">\n      <div class=\"s60-card\"><div class=\"s60-img\">\u003c/div><div><b>受注 #1001\u003c/b><p>株式会社サンプル / 納期 2026-09-12 / 数量 120\u003c/p>\u003c/div>\u003c/div>\n      <span class=\"readout\" id=\"s60-out\">\u003c/span>\n    \u003c/div>\n  \u003c/div>\n  <style data-code>\n    .s60-box { container-type: inline-size; resize: horizontal; overflow: auto; width: 520px; max-width: 100%; min-width: 200px; padding: 10px; background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; }\n    .s60-card { display: flex; gap: 12px; align-items: center; font-size: 13px; } .s60-card p { margin: 2px 0 0; color: var(--muted); }\n    .s60-img { flex: 0 0 90px; height: 60px; background: var(--accent); border-radius: 6px; }\n    @container (max-width: 420px) {\n      .s60-card { flex-direction: column; align-items: stretch; }   /* 枠が狭ければ縦積み */\n      .s60-img { flex-basis: auto; height: 40px; }\n    }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const box = $('#s60-box'), out = $('#s60-out');\n      new ResizeObserver(([e]) => out.textContent = `枠の幅: ${Math.round(e.contentRect.width)}px → ${e.contentRect.width <= 420 ? '縦積み' : '横並び'}`).observe(box);\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 61 ===================== -->\n<section class=\"demo\" id=\"n61\">\n  <h2><span class=\"no\">61\u003c/span>Electron：フレームレスウィンドウの操作 <small>-webkit-app-region\u003c/small>\u003c/h2>\n  <p class=\"what\">OS標準のタイトルバーを消して自前のヘッダーを作る場合、「ここを掴んだらウィンドウごと動く」領域を CSS で宣言する。ボタンなど押したい要素は <code>no-drag\u003c/code> で除外しないとクリックできなくなる。<b>ブラウザでは効かない\u003c/b>ため、ここでは同じCSSを当てたモック（枠内でウィンドウを動かす模擬）を置いている。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>模擬ウィンドウのタイトルバーをドラッグ（Electron では本物のウィンドウが動く）。ボタン部分は掴めない。\u003c/p>\n  <div class=\"stage tall\" style=\"padding:0\">\n    <div class=\"s61-desktop\">\n      <div id=\"s61-win\" class=\"s61-win\">\n        <div class=\"s61-titlebar\" id=\"s61-tb\"><span>Mission Bridge\u003c/span><span class=\"s61-btns\"><button>—\u003c/button><button>▢\u003c/button><button>✕\u003c/button>\u003c/span>\u003c/div>\n        <div class=\"s61-body\">frameless window（模擬）\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n  <style data-code>\n    /* Electron の renderer にそのまま使える CSS */\n    .s61-titlebar { -webkit-app-region: drag; }            /* ここを掴むとウィンドウが動く */\n    .s61-titlebar button { -webkit-app-region: no-drag; }  /* ボタンは除外（さもないと押せない） */\n\n    /* 以下はこのページ用の見た目・模擬 */\n    .s61-desktop { position: relative; height: 280px; background: #334155; overflow: hidden; }\n    .s61-win { position: absolute; left: 60px; top: 40px; width: 360px; background: #fff; border-radius: 8px; box-shadow: 0 20px 40px rgba(0,0,0,.4); overflow: hidden; }\n    .s61-titlebar { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: #0f172a; color: #fff; font-size: 13px; cursor: default; user-select: none; touch-action: none; }\n    .s61-btns button { background: none; border: none; color: #fff; padding: 2px 8px; }\n    .s61-body { padding: 24px; font-size: 13px; color: var(--muted); }\n  \u003c/style>\n  \u003cscript data-code=\"main.js（Electron メインプロセス側。このページでは実行されない）\" type=\"text/plain\">\n    const { BrowserWindow } = require('electron');\n    const win = new BrowserWindow({\n      width: 1200, height: 800,\n      frame: false,                 // OS のタイトルバーを消す\n      titleBarStyle: 'hidden',      // macOS: 信号機ボタンだけ残す場合は 'hiddenInset'\n      webPreferences: { preload: path.join(__dirname, 'preload.js') }\n    });\n  \u003c/script>\n  \u003cscript data-code=\"このページ用の模擬（Electron では不要）\">\n    (() => {\n      const win = $('#s61-win'), tb = $('#s61-tb'); let d = null;\n      tb.addEventListener('pointerdown', e => { if (e.target.tagName === 'BUTTON') return; d = { x: e.clientX - win.offsetLeft, y: e.clientY - win.offsetTop }; tb.setPointerCapture(e.pointerId); });\n      tb.addEventListener('pointermove', e => { if (d) { win.style.left = e.clientX - d.x + 'px'; win.style.top = e.clientY - d.y + 'px'; } });\n      tb.addEventListener('pointerup', () => d = null);\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 62 ===================== -->\n<section class=\"demo\" id=\"n62\">\n  <h2><span class=\"no\">62\u003c/span>Electron：ネイティブメニュー / ショートカット <small>Menu / accelerator / IPC\u003c/small>\u003c/h2>\n  <p class=\"what\">OSのメニューバー（ファイル・編集…）とショートカットはメインプロセスで定義し、押されたら IPC で renderer に通知する。renderer 側は「メニューから来た」「ボタンから来た」を区別せず同じ関数を呼ぶ設計にする。<b>ブラウザでは動かない\u003c/b>ため、下のボタンで「メニューが押された通知が来た」状況を模擬している。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>「メニュー: 新規作成 を模擬」を押すと、renderer の受信ハンドラが動く。\u003c/p>\n  <div class=\"stage\">\n    <div class=\"row\"><button id=\"s62-sim\">メニュー: 新規作成 を模擬（Ctrl+N）\u003c/button><button id=\"s62-btn\">画面のボタンから新規作成\u003c/button>\u003c/div>\n    <div class=\"log\" id=\"s62-log\">\u003c/div>\n  \u003c/div>\n  \u003cscript data-code=\"main.js（メインプロセス：メニュー定義と通知）\" type=\"text/plain\">\n    const { Menu, ipcMain } = require('electron');\n    const template = [{\n      label: 'ファイル',\n      submenu: [\n        { label: '新規作成', accelerator: 'CmdOrCtrl+N', click: () => win.webContents.send('menu:new') },\n        { label: 'CSV出力',  accelerator: 'CmdOrCtrl+E', click: () => win.webContents.send('menu:export') },\n        { type: 'separator' },\n        { role: 'quit' }\n      ]\n    }];\n    Menu.setApplicationMenu(Menu.buildFromTemplate(template));\n  \u003c/script>\n  \u003cscript data-code=\"preload.js（contextBridge で安全に橋渡し）\" type=\"text/plain\">\n    const { contextBridge, ipcRenderer } = require('electron');\n    contextBridge.exposeInMainWorld('api', {\n      onMenu: (name, handler) => ipcRenderer.on('menu:' + name, () => handler())\n    });\n  \u003c/script>\n  \u003cscript data-code=\"renderer.js（画面側：メニューもボタンも同じ関数へ）\">\n    (() => {\n      const log = $('#s62-log');\n      const createNew = from => logTo(log, `新規作成を実行（呼び出し元: ${from}）`);\n      // Electron では: window.api.onMenu('new', () => createNew('メニュー'));\n      // ブラウザ模擬: ボタンで同じハンドラを呼ぶ\n      const api = window.api || { onMenu: (name, h) => $('#s62-sim').addEventListener('click', h) };\n      api.onMenu('new', () => createNew('メニュー / Ctrl+N'));\n      $('#s62-btn').onclick = () => createNew('画面のボタン');\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c/main>\n\u003c/div>\n\u003c/body>\n\u003c/html>\n","docs/ui-guide/05-advanced.html":"<!DOCTYPE html>\n<html lang=\"ja\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>第3弾 D：業務アプリの上位UI（71〜85 抜粋）動くデモ\u003c/title>\n<link rel=\"stylesheet\" href=\"assets/guide.css\">\n\u003cscript src=\"assets/guide.js\">\u003c/script>\n<style>\n  .tierD { background: #7c3aed; }\n  table.mini { border-collapse: collapse; font-size: 12.5px; background: #fff; }\n  table.mini th, table.mini td { border: 1px solid #e5e7eb; padding: 3px 8px; }\n  table.mini th { background: #f1f5f9; }\n\u003c
