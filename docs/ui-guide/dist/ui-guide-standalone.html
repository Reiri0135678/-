<script>window.__BUNDLE = {"files":{"docs/ui-guide/00-index.html":"<!DOCTYPE html>\n<html lang=\"ja\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>UI操作レクチャー 入口\u003c/title>\n<link rel=\"stylesheet\" href=\"assets/guide.css\">\n\u003cscript src=\"assets/guide.js\">\u003c/script>\n\u003cscript src=\"assets/search-index.js\">\u003c/script>\n<style>\n  main.single { max-width: 900px; margin: 0 auto; padding: 24px; }\n  .path { counter-reset: step; }\n  .step { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px 14px 56px; margin-bottom: 10px; position: relative; }\n  .step::before { counter-increment: step; content: counter(step); position: absolute; left: 16px; top: 14px; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 14px; }\n  .step h3 { margin: 0 0 4px; font-size: 15px; } .step p { margin: 0; font-size: 13.5px; color: var(--muted); }\n  .step .t { display: inline-block; font-size: 11px; color: #fff; padding: 1px 7px; border-radius: 4px; margin-left: 6px; vertical-align: middle; }\n  table { border-collapse: collapse; width: 100%; font-size: 13.5px; background: var(--card); }\n  th, td { border: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: top; }\n  th { background: #f1f5f9; }\n  .gres { display: grid; gap: 6px; margin-bottom: 8px; } .gres a { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; text-decoration: none; color: var(--text); font-size: 13px; }\n  .gres a b { color: var(--accent); } .gres a small { color: var(--muted); } .gres mark { background: #fde68a; padding: 0; }\n  .tierD { background: #7c3aed; } .tierE { background: #db2777; } .tierF { background: #475569; }\n\u003c/style>\n\u003c/head>\n<body>\n<header class=\"top\"><h1>UI操作レクチャー資料（バニラJS / HTML）\u003c/h1>\u003c/header>\n<main class=\"single\">\n  <div class=\"lead\">フロントエンドUIの「操作の名称」と「実際の動き」を対応づける教材。依存ライブラリなし。すべてのページはこのフォルダをそのままブラウザで開けば動く（サーバ不要）。\u003c/div>\n\n  <h2 style=\"font-size:17px\">横断検索\u003c/h2>\n  <div class=\"row\"><input id=\"gq\" type=\"search\" placeholder=\"全ページの見出し・説明を検索（例: 慣性, revision, stopPropagation, z-index）\" style=\"flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:14px\"><span class=\"readout\" id=\"gcount\">\u003c/span>\u003c/div>\n  <div id=\"gres\" class=\"gres\">\u003c/div>\n\n  <h2 style=\"font-size:17px\">おすすめの順路 <small style=\"font-weight:400;font-size:13px;color:var(--muted)\">（時間配分つきの <a href=\"15-curriculum.html\">学習カリキュラム\u003c/a> もある）\u003c/small>\u003c/h2>\n  <div class=\"path\">\n    <div class=\"step\"><h3><a href=\"08-foundations.html\">基礎知識\u003c/a> <span class=\"t tierF\">土台\u003c/span>\u003c/h3><p>座標系、イベントの発火順、transform と left/top の違い、passive/touch-action、そして「混同しやすい用語の対比表」。全デモの前提になる。\u003c/p>\u003c/div>\n    <div class=\"step\"><h3><a href=\"01-ui-operations-catalog.html\">カタログ\u003c/a> <span class=\"t tierF\">索引\u003c/span>\u003c/h3><p>86項目の名称・英語名・一言説明・実装手段。検索と層フィルタ。各項目から動くデモへ飛べる。\u003c/p>\u003c/div>\n    <div class=\"step\"><h3><a href=\"02-basic.html\">A：一般的なUI操作（01〜22）\u003c/a> <span class=\"t tierA\">A\u003c/span>\u003c/h3><p>スクロール、パン、ズーム、DnD、フェード、モーダル…。ブラウザ標準で賄える基本。\u003c/p>\u003c/div>\n    <div class=\"step\"><h3><a href=\"03-custom.html\">B：カスタマイズ性の高いUI（23〜42）\u003c/a> <span class=\"t tierB\">B\u003c/span>\u003c/h3><p>仮想スクロール、慣性、スプリング、FLIP、並べ替え、Undo/Redo…。標準挙動を自前で制御する。\u003c/p>\u003c/div>\n    <div class=\"step\"><h3><a href=\"04-pro.html\">C：プロ志向のUI（43〜62）\u003c/a> <span class=\"t tierC\">C\u003c/span>\u003c/h3><p>無限キャンバス、ミニマップ、ノードエディタ、データグリッド、Electron連携…。ツール系アプリの高度操作。\u003c/p>\u003c/div>\n    <div class=\"step\"><h3><a href=\"05-advanced.html\">D：業務アプリの設計パターン（71〜86）\u003c/a> <span class=\"t tierD\">D\u003c/span>\u003c/h3><p>大規模グリッド、検索・フォームの型、バッチ操作、競合解決、オフライン、ドッキング、マルチウィンドウ…。A〜Cの部品の組み合わせ方。\u003c/p>\u003c/div>\n    <div class=\"step\"><h3><a href=\"06-effects.html\">E：演出・体感の上位効果（63〜70）\u003c/a> <span class=\"t tierE\">E\u003c/span>\u003c/h3><p>シェアードエレメント遷移、スタガー、マイクロインタラクション、ぼかしと性能…。最後に、控えめに。\u003c/p>\u003c/div>\n    <div class=\"step\"><h3><a href=\"10-accessibility.html\">アクセシビリティ\u003c/a> <span class=\"t tierF\">検査\u003c/span>\u003c/h3><p>キーボード順路の可視化、名前のない操作要素の検出、コントラスト計算、aria-live、環境設定の検出、チェックリスト。\u003c/p>\u003c/div>\n    <div class=\"step\"><h3><a href=\"11-quiz.html\">名称当てクイズ\u003c/a> <span class=\"t tierF\">確認\u003c/span>\u003c/h3><p>説明文から名称を4択で当てる。間違えた項目はデモへのリンクが残る。層と問題数を選べる。\u003c/p>\u003c/div>\n    <div class=\"step\"><h3><a href=\"14-playground.html\">プレイグラウンド\u003c/a> <span class=\"t tierF\">実験\u003c/span>\u003c/h3><p>デモのHTML／CSS／JSをその場で書き換えて実行。各デモの「コードを見る」からも飛べる。練習課題の解答を試す場所。\u003c/p>\u003c/div>\n    <div class=\"step\"><h3><a href=\"09-exercises.html\">練習課題\u003c/a> <span class=\"t tierF\">演習\u003c/span>\u003c/h3><p>デモのコードを改変して仕様を満たす12問。ヒントと解答例つき。\u003c/p>\u003c/div>\n  \u003c/div>\n\n  <h2 style=\"font-size:17px\">各デモページの読み方\u003c/h2>\n  <table>\n    <tr><th style=\"width:160px\">見出し\u003c/th><th>意味\u003c/th>\u003c/tr>\n    <tr><td>番号＋名称＋英語名\u003c/td><td>カタログの通し番号。英語名は検索・調査時のキーワード\u003c/td>\u003c/tr>\n    <tr><td>動作の意味\u003c/td><td>その操作が何をするものか、何と混同しやすいか、実装の要点\u003c/td>\u003c/tr>\n    <tr><td>操作：\u003c/td><td>ページ上で実際に試す手順\u003c/td>\u003c/tr>\n    <tr><td>コードを見る\u003c/td><td>そのデモを動かしている CSS / JS の<b>実物\u003c/b>。写しではないので、ブラウザの開発者ツールで書き換えればその場で挙動が変わる\u003c/td>\u003c/tr>\n  \u003c/table>\n\n  <h2 style=\"font-size:17px\">付属物\u003c/h2>\n  <table>\n    <tr><th style=\"width:200px\">場所\u003c/th><th>内容\u003c/th>\u003c/tr>\n    <tr><td><a href=\"12-electron.html\">12-electron.html\u003c/a>\u003c/td><td>Electron 実装リファレンス（構成、ウィンドウ状態、フレームレス、メニュー、IPC、ファイル、認証情報の保存）\u003c/td>\u003c/tr>\n    <tr><td><a href=\"13-kintone.html\">13-kintone.html\u003c/a>\u003c/td><td>kintone 連携リファレンス（取得方式、リビジョン、一括更新、検索、フィールド型と UI の対応、上限早見表）\u003c/td>\u003c/tr>\n    <tr><td><code>../ui-kit/\u003c/code>\u003c/td><td>デモから切り出した再利用部品（15モジュール、依存なしESM、テスト26件）。<code>dist/ui-kit.js\u003c/code> は file:// でも使える単一ファイル版\u003c/td>\u003c/tr>\n    <tr><td><a href=\"16-bundler.html\">16-bundler.html\u003c/a>\u003c/td><td>この資料一式を「外部ファイルを参照しない1枚のHTML」にまとめるバンドラ。Node もビルドツールも使わず、ブラウザだけで生成できる（生成済みのものは <code>dist/ui-guide-standalone.html\u003c/code>）\u003c/td>\u003c/tr>\n    <tr><td><a href=\"../../ui-kit/example/index.html\">../ui-kit/example/index.html\u003c/a>\u003c/td><td>部品を組み合わせた実例アプリ（受注一覧）。ブラウザで開くだけで動く\u003c/td>\u003c/tr>\n    <tr><td><code>07-implementation-plan.md\u003c/code>\u003c/td><td>部品化と実アプリ適用の計画書（Markdown）\u003c/td>\u003c/tr>\n    <tr><td><code>README.md\u003c/code>\u003c/td><td>索引・前提・デモの追加方法（Markdown）\u003c/td>\u003c/tr>\n  \u003c/table>\n  <p class=\"note\">動作確認は Chromium 系ブラウザ。View Transitions・<code>animation-timeline\u003c/code>・<code>popover\u003c/code> は対応ブラウザでのみ本来の動きになり、非対応では即時切替・静的表示にフォールバックする。\u003c/p>\n\u003c/main>\n\u003cscript>\n(() => {\n  const q = document.getElementById('gq'), res = document.getElementById('gres'), count = document.getElementById('gcount');\n  const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));\n  const mark = (text, terms) => { let h = esc(text); terms.forEach(t => { h = h.replace(new RegExp(esc(t).replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&'), 'gi'), m => `<mark>${m}\u003c/mark>`); }); return h; };\n  let timer;\n  q.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => {\n    const terms = q.value.trim().toLowerCase().split(/\\s+/).filter(Boolean);\n    if (!terms.length) { res.innerHTML = ''; count.textContent = ''; return; }\n    const hits = SEARCH_INDEX.map(e => { const hay = (e.title + ' ' + e.text).toLowerCase(); const score = terms.reduce((a, t) => a + (e.title.toLowerCase().includes(t) ? 3 : 0) + (hay.includes(t) ? 1 : 0), 0); return { e, score }; })\n      .filter(h => terms.every(t => (h.e.title + ' ' + h.e.text).toLowerCase().includes(t))).sort((a, b) => b.score - a.score).slice(0, 30);\n    count.textContent = `${hits.length} 件`;\n    res.innerHTML = hits.map(({ e }) => `<a href=\"${e.page}${e.id ? '#' + e.id : ''}\"><b>${mark(e.title, terms)}\u003c/b> <small>— ${e.pageTitle}\u003c/small><br>${mark(e.text.slice(0, 160), terms)}…\u003c/a>`).join('') || '<div class=\"note\">該当なし\u003c/div>';\n  }, 200); });\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","docs/ui-guide/01-ui-operations-catalog.html":"<!DOCTYPE html>\n<html lang=\"ja\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>UI操作カタログ（第1弾：分類リスト）\u003c/title>\n<link rel=\"stylesheet\" href=\"assets/guide.css\">\n\u003cscript src=\"assets/guide.js\">\u003c/script>\n<style>\n  :root { --tierD: #7c3aed; --tierE: #db2777; }\n  * { box-sizing: border-box; }\n  body { margin: 0; font-family: system-ui, -apple-system, \"Segoe UI\", \"Noto Sans JP\", sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }\n  header { position: sticky; top: 0; background: var(--card); border-bottom: 1px solid var(--line); padding: 12px 20px; z-index: 10; }\n  header.top .controls { flex: 1 1 100%; order: 10; }   /* 2行目に回し、テーマ切替は1行目の右端に残す */\n  header h1 { font-size: 18px; margin: 0 0 8px; }\n  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }\n  .controls input { flex: 1 1 240px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; font-size: 14px; }\n  .chip { padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); cursor: pointer; font-size: 13px; user-select: none; white-space: nowrap; flex: 0 0 auto; color: var(--text); }\n  .chip.active { border-color: var(--accent); color: var(--accent); font-weight: 600; }\n  .count { color: var(--muted); font-size: 13px; margin-left: auto; }\n  main { max-width: 1100px; margin: 0 auto; padding: 20px; }\n  .intro { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px 18px; margin-bottom: 20px; font-size: 14px; }\n  .intro table { border-collapse: collapse; width: 100%; margin-top: 8px; }\n  .intro th, .intro td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; font-size: 13px; }\n  .intro th { background: var(--accent-soft); }\n  section h2 { font-size: 16px; margin: 28px 0 10px; padding-left: 10px; border-left: 4px solid; }\n  section[data-tier=\"A\"] h2 { border-color: var(--tierA); }\n  section[data-tier=\"B\"] h2 { border-color: var(--tierB); }\n  section[data-tier=\"C\"] h2 { border-color: var(--tierC); }\n  section[data-tier=\"D\"] h2 { border-color: var(--tierD); }\n  section[data-tier=\"E\"] h2 { border-color: var(--tierE); }\n  .item { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; margin-bottom: 8px; display: grid; grid-template-columns: 56px 1fr; gap: 4px 12px; }\n  .item.hidden { display: none; }\n  .num { font-weight: 700; color: var(--muted); font-size: 14px; grid-row: 1 / span 3; padding-top: 2px; }\n  .name { font-weight: 600; font-size: 15px; }\n  .name small { color: var(--muted); font-weight: 400; margin-left: 6px; }\n  .desc { font-size: 14px; }\n  .api { font-size: 12.5px; color: var(--muted); }\n  .api code { background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; font-size: 12px; }\n  .tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 4px; margin-left: 6px; vertical-align: middle; color: #fff; }\n  .kit { margin-left: 10px; font-size: 11.5px; color: #6d28d9; } .kit a { color: inherit; }\n  .done-cb { margin-left: 10px; font-size: 12px; color: var(--muted); cursor: pointer; user-select: none; } .item.done { opacity: .6; } .item.done .name::after { content: ' ✓'; color: var(--tierA); }\n  .demo-link { margin-left: 8px; font-size: 12px; text-decoration: none; color: var(--accent); font-weight: 600; }\n  .tag-A { background: var(--tierA); } .tag-B { background: var(--tierB); } .tag-C { background: var(--tierC); } .tag-D { background: var(--tierD); } .tag-E { background: var(--tierE); }\n  footer { color: var(--muted); font-size: 12px; text-align: center; padding: 30px 0; }\n  @media (max-width: 600px) { .item { grid-template-columns: 40px 1fr; } }\n  @media print {\n    header, .controls, .demo-link, nav { display: none !important; }\n    body { background: #fff; } main { max-width: none; padding: 0; }\n    .intro { border: none; padding: 0; }\n    .item { break-inside: avoid; border: none; border-bottom: 1px solid #ddd; border-radius: 0; padding: 4px 0; margin: 0; grid-template-columns: 36px 1fr; gap: 0 8px; }\n    .item.hidden { display: none; }\n    .desc { font-size: 11.5px; } .api { font-size: 10.5px; } .name { font-size: 12.5px; }\n    section h2 { font-size: 13px; margin: 14px 0 4px; break-after: avoid; }\n  }\n\u003c/style>\n\u003c/head>\n<body>\n<header class=\"top\">\n  <h1>UI操作カタログ（分類リスト）\u003c/h1>\n  <nav style=\"margin-bottom:8px;font-size:13px\"><a href=\"00-index.html\">⌂ 入口\u003c/a> ・ <a href=\"08-foundations.html\">基礎知識\u003c/a> ・ <a href=\"02-basic.html\">A\u003c/a> / <a href=\"03-custom.html\">B\u003c/a> / <a href=\"04-pro.html\">C\u003c/a> / <a href=\"05-advanced.html\">D\u003c/a> / <a href=\"06-effects.html\">E\u003c/a> ・ <a href=\"09-exercises.html\">練習課題\u003c/a> ・ <a href=\"10-accessibility.html\">アクセシビリティ\u003c/a> ・ <a href=\"11-quiz.html\">クイズ\u003c/a> ・ <a href=\"12-electron.html\">Electron\u003c/a> / <a href=\"13-kintone.html\">kintone\u003c/a>\u003c/nav>\n  <div class=\"controls\">\n    <input id=\"q\" type=\"search\" placeholder=\"検索：番号 / 名称 / 英語名 / API / 部品名（例: 43, pan, fade, virtual-list）\">\n    <span class=\"chip active\" data-tier=\"all\">すべて\u003c/span>\n    <span class=\"chip\" data-tier=\"A\">A: 一般\u003c/span>\n    <span class=\"chip\" data-tier=\"B\">B: カスタマイズ\u003c/span>\n    <span class=\"chip\" data-tier=\"C\">C: プロ志向\u003c/span>\n    <span class=\"chip\" data-tier=\"D\">D: 業務アプリ設計\u003c/span>\n    <span class=\"chip\" data-tier=\"E\">E: 演出・体感\u003c/span>\n    <label class=\"chip\" style=\"display:inline-flex;gap:4px;align-items:center\"><input type=\"checkbox\" id=\"only-todo\"> 未習得のみ\u003c/label>\n    <span class=\"count\" id=\"count\">\u003c/span>\n    <span class=\"count\" id=\"progress\" title=\"「理解した」にチェックした数。この端末のブラウザに保存される\">\u003c/span>\n    <button class=\"chip\" onclick=\"window.print()\" title=\"フィルタ結果を早見表として印刷\">🖨 印刷\u003c/button>\n  \u003c/div>\n\u003c/header>\n\n<main>\n  <div class=\"intro\">\n    <strong>この資料の位置づけ\u003c/strong>：UI操作の「名称」と「動作」を対応づけるための索引。各項目の「▶ デモ」から、第2弾の動くデモ（<a href=\"02-basic.html\">A\u003c/a> / <a href=\"03-custom.html\">B\u003c/a> / <a href=\"04-pro.html\">C\u003c/a> / <a href=\"05-advanced.html\">D\u003c/a> / <a href=\"06-effects.html\">E\u003c/a>）へ飛べる。\n    <table>\n      <tr><th style=\"width:120px\">層\u003c/th><th>意味\u003c/th><th>実装の主な手段\u003c/th>\u003c/tr>\n      <tr><td><span class=\"tag tag-A\">A\u003c/span> 一般\u003c/td><td>ほぼ全てのアプリで使う基本操作・演出。ブラウザ標準で大半が賄える\u003c/td><td>CSS / 標準DOM API\u003c/td>\u003c/tr>\n      <tr><td><span class=\"tag tag-B\">B\u003c/span> カスタマイズ\u003c/td><td>標準挙動を自前で制御・拡張するもの。業務アプリの「使いやすさ」はここで決まる\u003c/td><td>Pointer Events / Observer系 / rAF\u003c/td>\u003c/tr>\n      <tr><td><span class=\"tag tag-C\">C\u003c/span> プロ志向\u003c/td><td>エディタ・キャンバス・グリッド等、ツール系アプリに必要な高度操作\u003c/td><td>座標変換 / 状態機械 / Canvas / Electron連携\u003c/td>\u003c/tr>\n      <tr><td><span class=\"tag tag-D\">D\u003c/span> 業務アプリ設計\u003c/td><td>A〜Cの部品を組み合わせた設計パターン（第3弾・第4弾）。番号は提案リストの通り\u003c/td><td>状態オブジェクト集約 / localStorage / BroadcastChannel / History API\u003c/td>\u003c/tr>\n      <tr><td><span class=\"tag tag-E\">E\u003c/span> 演出・体感\u003c/td><td>見た目の気持ちよさを作る上位効果（第4弾）。短く・控えめに・止められるように\u003c/td><td>View Transitions / WAAPI / animation-timeline / backdrop-filter\u003c/td>\u003c/tr>\n    \u003c/table>\n  \u003c/div>\n  <div id=\"list\">\u003c/div>\n\u003c/main>\n<footer>docs/ui-guide/01-ui-operations-catalog.html ・ バニラJS / 依存なし\u003c/footer>\n\n\u003cscript src=\"assets/catalog-data.js\">\u003c/script>\n\u003cscript>\nconst $ = s => document.querySelector(s);\nconst listEl = document.getElementById('list');\nconst qEl = document.getElementById('q');\nconst countEl = document.getElementById('count');\nlet tierFilter = 'all';\nconst PKEY = 'ui-guide.progress'; let done = new Set(); try { done = new Set(JSON.parse(localStorage.getItem(PKEY) || '[]')); } catch {}\nconst saveProgress = () => { try { localStorage.setItem(PKEY, JSON.stringify([...done])); } catch {} };\n\nfunction render() {\n  listEl.innerHTML = '';\n  let n = 0;\n  for (const t of ['A','B','C','D','E']) {\n    const sec = document.createElement('section');\n    sec.dataset.tier = t;\n    sec.innerHTML = `<h2>${TIER_NAME[t]}\u003c/h2>`;\n    ITEMS.map((it, i) => [it, i]).filter(([it]) => it.tier === t).sort((a, b) => (a[0].no ?? a[1] + 1) - (b[0].no ?? b[1] + 1)).forEach(([it, i]) => {\n      n++;\n      const el = document.createElement('div');\n      const no = itemNo(it, i), kit = (window.KIT || {})[no];\n      el.className = 'item' + (done.has(no) ? ' done' : '');\n      el.dataset.tier = t;\n      el.dataset.text = (String(no).padStart(2, '0') + ' ' + no + ' ' + it.ja + ' ' + it.en + ' ' + it.desc + ' ' + it.api + ' ' + (kit || '')).toLowerCase();\n      el.innerHTML = `\n        <div class=\"num\">${String(no).padStart(2, '0')}\u003c/div>\n        <div class=\"name\">${it.ja}<small>${it.en}\u003c/small><span class=\"tag tag-${t}\">${t}\u003c/span>\u003c/div>\n        <div class=\"desc\">${it.desc}\u003c/div>\n        <div class=\"api\">実装手段：${it.api} <a class=\"demo-link\" href=\"${TIER_FILE[t]}#n${String(no).padStart(2, '0')}\">▶ デモ\u003c/a>${kit ? `<span class=\"kit\" title=\"ui-kit の部品\">部品: ${kit.split(', ').map(k => `<a href=\"../../ui-kit/${k}.js\">${k}\u003c/a>`).join(', ')}\u003c/span>` : ''}<label class=\"done-cb\"><input type=\"checkbox\" data-no=\"${no}\" ${done.has(no) ? 'checked' : ''}> 理解した\u003c/label>\u003c/div>`;\n      sec.appendChild(el);\n    });\n    listEl.appendChild(sec);\n  }\n  applyFilter();\n}\n\nfunction applyFilter() {\n  const q = qEl.value.trim().toLowerCase();\n  let visible = 0;\n  document.querySelectorAll('.item').forEach(el => {\n    const okTier = tierFilter === 'all' || el.dataset.tier === tierFilter;\n    const okQ = !q || el.dataset.text.includes(q);\n    const okTodo = !$('#only-todo').checked || !el.classList.contains('done');\n    el.classList.toggle('hidden', !(okTier && okQ && okTodo));\n    if (okTier && okQ && okTodo) visible++;\n  });\n  document.querySelectorAll('section').forEach(sec => {\n    const any = sec.querySelector('.item:not(.hidden)');\n    sec.style.display = any ? '' : 'none';\n  });\n  countEl.textContent = `${visible} / ${ITEMS.length} 件`;\n  $('#progress').textContent = `理解した: ${done.size} / ${ITEMS.length}`;\n}\n\nqEl.addEventListener('input', applyFilter);\n$('#only-todo').addEventListener('change', applyFilter);\nlistEl.addEventListener('change', e => { const no = +e.target.dataset.no; if (!no) return; e.target.checked ? done.add(no) : done.delete(no); e.target.closest('.item').classList.toggle('done', e.target.checked); saveProgress(); applyFilter(); });\ndocument.querySelectorAll('.chip').forEach(chip => {\n  chip.addEventListener('click', () => {\n    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));\n    chip.classList.add('active');\n    tierFilter = chip.dataset.tier;\n    applyFilter();\n  });\n});\n\nrender();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","docs/ui-guide/02-basic.html":"<!DOCTYPE html>\n<html lang=\"ja\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>第2弾 A：一般的なUI操作（01〜22）動くデモ\u003c/title>\n<link rel=\"stylesheet\" href=\"assets/guide.css\">\n\u003cscript src=\"assets/guide.js\">\u003c/script>\n\u003c/head>\n<body>\n<header class=\"top\">\n  <h1>A：一般的なUI操作 <span class=\"tier tierA\">01〜22\u003c/span>\u003c/h1>\n  <nav><a href=\"00-index.html\">⌂ 入口\u003c/a><a href=\"08-foundations.html\">基礎\u003c/a><a href=\"01-ui-operations-catalog.html\">カタログ\u003c/a><a href=\"03-custom.html\">B：カスタマイズ →\u003c/a><a href=\"04-pro.html\">C：プロ志向 →\u003c/a><a href=\"09-exercises.html\">課題\u003c/a><a href=\"10-accessibility.html\">a11y\u003c/a><a href=\"11-quiz.html\">クイズ\u003c/a>\u003c/nav>\n\u003c/header>\n<div class=\"layout\">\n<aside class=\"toc\">\u003c/aside>\n<main>\n<div class=\"lead\">各項目は「動作の意味」→「操作してみる」→「動いているコード」の順。コードは表示用の写しではなく、このページで実際に動いているものをそのまま表示している。\u003c/div>\n\n\u003c!-- ===================== 01 ===================== -->\n<section class=\"demo\" id=\"n01\">\n  <h2><span class=\"no\">01\u003c/span>スクロール <small>Scroll\u003c/small>\u003c/h2>\n  <p class=\"what\">内容が枠より大きいとき、枠の中で表示位置を動かす。「枠（ビューポート）は動かず、中身が動く」。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>枠内でホイール／ドラッグ／ボタン。右の数値が <code>scrollTop\u003c/code>。\u003c/p>\n  <div class=\"stage\">\n    <div class=\"row\">\n      <button id=\"s01-top\">先頭へ（smooth）\u003c/button>\n      <button id=\"s01-mid\">50行目へ（即時）\u003c/button>\n      <button id=\"s01-end\">末尾へ（smooth）\u003c/button>\n      <span class=\"readout\" id=\"s01-out\">scrollTop: 0\u003c/span>\n    \u003c/div>\n    <div id=\"s01-box\" class=\"s01-box\">\u003c/div>\n  \u003c/div>\n  <style data-code>\n    .s01-box { height: 160px; overflow-y: auto; background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; }\n    .s01-box div { padding: 4px 10px; border-bottom: 1px solid #f1f5f9; font-size: 13px; }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const box = $('#s01-box'), out = $('#s01-out');\n      for (let i = 1; i <= 100; i++) box.insertAdjacentHTML('beforeend', `<div>行 ${i}\u003c/div>`);\n      // scroll イベントは高頻度で発火する。重い処理は入れない。\n      box.addEventListener('scroll', () => out.textContent = `scrollTop: ${Math.round(box.scrollTop)}`);\n      $('#s01-top').onclick = () => box.scrollTo({ top: 0, behavior: 'smooth' });\n      $('#s01-mid').onclick = () => box.children[49].scrollIntoView({ block: 'start' });\n      $('#s01-end').onclick = () => box.scrollTo({ top: box.scrollHeight, behavior: 'smooth' });\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 02 ===================== -->\n<section class=\"demo\" id=\"n02\">\n  <h2><span class=\"no\">02\u003c/span>パン <small>Pan\u003c/small>\u003c/h2>\n  <p class=\"what\">中身を「掴んで」平行移動する。スクロールと違い、境界がなく（無限に動かせる）、ドラッグ量＝移動量になる。地図・図面・キャンバスの基本操作。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>方眼をドラッグ。<code>transform: translate()\u003c/code> に差分を足すだけ。\u003c/p>\n  <div class=\"stage tall\" style=\"padding:0\">\n    <div id=\"s02-view\" class=\"s02-view\">\n      <div id=\"s02-world\" class=\"s02-world grid-bg\">\n        <div class=\"s02-item\" style=\"left:60px;top:40px\">A\u003c/div>\n        <div class=\"s02-item\" style=\"left:300px;top:150px\">B\u003c/div>\n        <div class=\"s02-item\" style=\"left:520px;top:60px\">C\u003c/div>\n      \u003c/div>\n      <span class=\"readout\" id=\"s02-out\" style=\"position:absolute;left:8px;top:8px\">tx: 0, ty: 0\u003c/span>\n    \u003c/div>\n  \u003c/div>\n  <style data-code>\n    .s02-view { position: relative; height: 260px; overflow: hidden; cursor: grab; touch-action: none; user-select: none; }\n    .s02-view.dragging { cursor: grabbing; }\n    .s02-world { position: absolute; inset: -2000px; transform-origin: 0 0; } /* 見た目上\"無限\"にする */\n    .s02-item { position: absolute; margin: 2000px; width: 60px; height: 60px; background: var(--accent); color: #fff; border-radius: 8px; display: grid; place-items: center; }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const view = $('#s02-view'), world = $('#s02-world'), out = $('#s02-out');\n      let tx = 0, ty = 0, dragging = null;\n      view.addEventListener('pointerdown', e => {\n        dragging = { x: e.clientX - tx, y: e.clientY - ty }; // 押した瞬間の「オフセット」を覚える\n        view.setPointerCapture(e.pointerId);\n        view.classList.add('dragging');\n      });\n      view.addEventListener('pointermove', e => {\n        if (!dragging) return;\n        tx = e.clientX - dragging.x;\n        ty = e.clientY - dragging.y;\n        world.style.transform = `translate(${tx}px, ${ty}px)`;\n        out.textContent = `tx: ${Math.round(tx)}, ty: ${Math.round(ty)}`;\n      });\n      view.addEventListener('pointerup', () => { dragging = null; view.classList.remove('dragging'); });\n      view.addEventListener('pointercancel', () => { dragging = null; view.classList.remove('dragging'); });\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 03 ===================== -->\n<section class=\"demo\" id=\"n03\">\n  <h2><span class=\"no\">03\u003c/span>ズーム <small>Zoom\u003c/small>\u003c/h2>\n  <p class=\"what\">表示倍率を変える。ここでは「枠の中心」を基準に拡大縮小する最も単純な形。ホイール位置を基準にする本格版は <a href=\"04-pro.html#n44\">44\u003c/a>。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>枠内でホイール（トラックパッドはピンチ＝<code>ctrlKey\u003c/code> 付き wheel）、またはボタン。\u003c/p>\n  <div class=\"stage\">\n    <div class=\"row\">\n      <button id=\"s03-minus\">−\u003c/button><button id=\"s03-plus\">＋\u003c/button><button id=\"s03-reset\">100%\u003c/button>\n      <span class=\"readout\" id=\"s03-out\">scale: 1.00\u003c/span>\n    \u003c/div>\n    <div id=\"s03-view\" class=\"s03-view grid-bg\"><div id=\"s03-content\" class=\"s03-content\"><div class=\"box\">ZOOM\u003c/div>\u003c/div>\u003c/div>\n  \u003c/div>\n  <style data-code>\n    .s03-view { height: 180px; display: grid; place-items: center; overflow: hidden; border: 1px solid #cbd5e1; border-radius: 6px; }\n    .s03-content { transition: transform .12s ease-out; }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const view = $('#s03-view'), content = $('#s03-content'), out = $('#s03-out');\n      let scale = 1;\n      const apply = () => {\n        scale = Math.min(5, Math.max(0.2, scale)); // 上下限を必ず設ける\n        content.style.transform = `scale(${scale})`;\n        out.textContent = `scale: ${scale.toFixed(2)}`;\n      };\n      // passive:false にしないと preventDefault が効かずページごとスクロールしてしまう\n      view.addEventListener('wheel', e => {\n        e.preventDefault();\n        const factor = Math.exp(-e.deltaY * 0.002); // 乗算で変えると上下対称になる\n        scale *= factor; apply();\n      }, { passive: false });\n      $('#s03-plus').onclick = () => { scale *= 1.25; apply(); };\n      $('#s03-minus').onclick = () => { scale /= 1.25; apply(); };\n      $('#s03-reset').onclick = () => { scale = 1; apply(); };\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 04 ===================== -->\n<section class=\"demo\" id=\"n04\">\n  <h2><span class=\"no\">04\u003c/span>クリック / タップ <small>Click / Tap\u003c/small>\u003c/h2>\n  <p class=\"what\">最も基本の操作だが、1回の操作で複数のイベントが順に発火する。マウスとタッチで順序・種類が違うことを見て覚える。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>青い箱をクリック／タップ。発火順がログに出る。<code>pointer*\u003c/code> を使えば入力装置を問わず1系統で書ける。\u003c/p>\n  <div class=\"stage\">\n    <div class=\"row\"><div id=\"s04-target\" class=\"box\">押す\u003c/div><button id=\"s04-clear\">ログ消去\u003c/button>\u003c/div>\n    <div class=\"log\" id=\"s04-log\">\u003c/div>\n  \u003c/div>\n  \u003cscript data-code>\n    (() => {\n      const t = $('#s04-target'), log = $('#s04-log');\n      ['pointerdown','pointerup','mousedown','mouseup','touchstart','touchend','click']\n        .forEach(type => t.addEventListener(type, e => logTo(log, `${type}` + (e.pointerType ? ` (pointerType=${e.pointerType})` : ''))));\n      $('#s04-clear').onclick = () => log.textContent = '';\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 05 ===================== -->\n<section class=\"demo\" id=\"n05\">\n  <h2><span class=\"no\">05\u003c/span>ダブルクリック / 長押し <small>Double click / Long press\u003c/small>\u003c/h2>\n  <p class=\"what\">ダブルクリックは標準イベントがある。長押しは標準イベントが無いので「押してから一定時間、動かさずに離さない」をタイマーで判定する。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>左はダブルクリック。右は500ms押し続ける（動かすとキャンセル）。\u003c/p>\n  <div class=\"stage\">\n    <div class=\"row\">\n      <div id=\"s05-dbl\" class=\"box\">dblclick\u003c/div>\n      <div id=\"s05-long\" class=\"box s05-long\">長押し\u003c/div>\n      <span class=\"readout\" id=\"s05-out\">-\u003c/span>\n    \u003c/div>\n  \u003c/div>\n  <style data-code>\n    .s05-long { background: linear-gradient(to top, #1e40af var(--p, 0%), var(--accent) 0); }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const out = $('#s05-out'), lp = $('#s05-long');\n      $('#s05-dbl').addEventListener('dblclick', () => out.textContent = 'ダブルクリック検出');\n      let timer = null, start = 0, raf = 0;\n      const cancel = () => { clearTimeout(timer); cancelAnimationFrame(raf); timer = null; lp.style.setProperty('--p', '0%'); };\n      lp.addEventListener('pointerdown', e => {\n        start = performance.now();\n        const tick = () => { lp.style.setProperty('--p', Math.min(100, (performance.now() - start) / 5) + '%'); raf = requestAnimationFrame(tick); };\n        tick();\n        timer = setTimeout(() => { cancel(); out.textContent = '長押し検出（500ms）'; }, 500);\n      });\n      lp.addEventListener('pointerup', cancel);\n      lp.addEventListener('pointerleave', cancel);\n      lp.addEventListener('pointermove', e => { if (timer && (Math.abs(e.movementX) + Math.abs(e.movementY)) > 4) cancel(); });\n      lp.addEventListener('contextmenu', e => e.preventDefault()); // タッチ長押しのOSメニュー抑止\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 06 ===================== -->\n<section class=\"demo\" id=\"n06\">\n  <h2><span class=\"no\">06\u003c/span>ホバー <small>Hover\u003c/small>\u003c/h2>\n  <p class=\"what\">ポインタが要素上にある状態。タッチ端末には「ホバー」が存在しないため、ホバーでしか出ない情報を作らない。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>箱にポインタを乗せる。<code>@media (hover: hover)\u003c/code> でホバー可能な環境か判定できる。\u003c/p>\n  <div class=\"stage\">\n    <div class=\"row\"><div id=\"s06-target\" class=\"box s06\">hover\u003c/div><span class=\"readout\" id=\"s06-out\">\u003c/span>\u003c/div>\n  \u003c/div>\n  <style data-code>\n    @media (hover: hover) { .s06:hover { transform: translateY(-4px); box-shadow: 0 8px 16px rgba(37,99,235,.35); } }\n    .s06 { transition: transform .15s, box-shadow .15s; }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const t = $('#s06-target'), out = $('#s06-out');\n      const canHover = matchMedia('(hover: hover)').matches;\n      out.textContent = `この環境のホバー: ${canHover ? '可能' : '不可（タッチ主体）'}`;\n      t.addEventListener('pointerenter', () => t.textContent = 'enter');\n      t.addEventListener('pointerleave', () => t.textContent = 'leave');\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 07 ===================== -->\n<section class=\"demo\" id=\"n07\">\n  <h2><span class=\"no\">07\u003c/span>フォーカス <small>Focus\u003c/small>\u003c/h2>\n  <p class=\"what\">キーボード入力を受け取る要素は常に1つ。Tabで順に移動する。<code>:focus-visible\u003c/code> はキーボード操作時だけ枠を出すので、マウス時に枠が邪魔にならない。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>最初のボタンを押した後 <kbd>Tab\u003c/kbd> / <kbd>Shift\u003c/kbd>+<kbd>Tab\u003c/kbd>。<code>div\u003c/code> は <code>tabindex=\"0\"\u003c/code> を付けて初めてフォーカスできる。\u003c/p>\n  <div class=\"stage\">\n    <div class=\"row s07\">\n      <button>1\u003c/button><button>2\u003c/button><div class=\"box\" tabindex=\"0\" style=\"width:60px;height:34px\">div(tabindex=0)\u003c/div><input type=\"text\" placeholder=\"4\" style=\"width:80px\">\n      <button id=\"s07-go\">プログラムから4へ\u003c/button>\n      <span class=\"readout\" id=\"s07-out\">activeElement: -\u003c/span>\n    \u003c/div>\n  \u003c/div>\n  <style data-code>\n    .s07 :focus-visible { outline: 3px solid #f59e0b; outline-offset: 2px; }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const out = $('#s07-out');\n      document.addEventListener('focusin', () => {\n        const a = document.activeElement;\n        out.textContent = `activeElement: ${a.tagName.toLowerCase()}${a.textContent ? '「' + a.textContent.trim().slice(0, 12) + '」' : ''}`;\n      });\n      $('#s07-go').onclick = () => $('.s07 input').focus();\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 08 ===================== -->\n<section class=\"demo\" id=\"n08\">\n  <h2><span class=\"no\">08\u003c/span>ドラッグ&ドロップ <small>Drag and Drop（HTML標準API）\u003c/small>\u003c/h2>\n  <p class=\"what\">要素を掴んで別の場所へ移す。ここはブラウザ標準のDnD API版。見た目のゴーストはブラウザ任せで簡単だが、タッチ非対応・細かい制御不可。自作版は <a href=\"03-custom.html#n32\">32\u003c/a>。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>左のカードを右へドラッグ。<code>dragover\u003c/code> で <code>preventDefault()\u003c/code> しないとドロップできない、が最大の罠。\u003c/p>\n  <div class=\"stage\">\n    <div class=\"row\" style=\"align-items:stretch\">\n      <div class=\"s08-zone\" id=\"s08-a\"><div draggable=\"true\" class=\"s08-card\">受注 #1001\u003c/div><div draggable=\"true\" class=\"s08-card\">受注 #1002\u003c/div><div draggable=\"true\" class=\"s08-card\">受注 #1003\u003c/div>\u003c/div>\n      <div class=\"s08-zone\" id=\"s08-b\">\u003c/div>\n    \u003c/div>\n  \u003c/div>\n  <style data-code>\n    .s08-zone { flex: 1; min-height: 120px; background: #fff; border: 2px dashed #cbd5e1; border-radius: 8px; padding: 8px; }\n    .s08-zone.over { border-color: var(--accent); background: var(--accent-soft); }\n    .s08-card { padding: 6px 10px; margin-bottom: 6px; background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; cursor: grab; font-size: 13px; }\n    .s08-card.dragging { opacity: .4; }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      let dragged = null;\n      $$('.s08-card').forEach(card => {\n        card.addEventListener('dragstart', e => { dragged = card; card.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });\n        card.addEventListener('dragend', () => card.classList.remove('dragging'));\n      });\n      $$('.s08-zone').forEach(zone => {\n        zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('over'); }); // ← 必須\n        zone.addEventListener('dragleave', () => zone.classList.remove('over'));\n        zone.addEventListener('drop', e => { e.preventDefault(); zone.classList.remove('over'); if (dragged) zone.appendChild(dragged); });\n      });\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 09 ===================== -->\n<section class=\"demo\" id=\"n09\">\n  <h2><span class=\"no\">09\u003c/span>スワイプ / フリック <small>Swipe / Flick\u003c/small>\u003c/h2>\n  <p class=\"what\">指（ポインタ）を素早く払う操作。「移動距離」と「速度」の両方を見て判定する。距離だけだとゆっくりのドラッグと区別がつかない。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>灰色の帯を左右に素早く払う。マウスでもドラッグで再現できる。\u003c/p>\n  <div class=\"stage\">\n    <div id=\"s09-area\" class=\"s09-area\">ここを払う\u003c/div>\n    <div class=\"row\"><span class=\"readout\" id=\"s09-out\">-\u003c/span>\u003c/div>\n  \u003c/div>\n  <style data-code>\n    .s09-area { height: 90px; background: #e2e8f0; border-radius: 8px; display: grid; place-items: center; color: var(--muted); touch-action: pan-y; user-select: none; }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const area = $('#s09-area'), out = $('#s09-out');\n      let s = null;\n      area.addEventListener('pointerdown', e => s = { x: e.clientX, y: e.clientY, t: performance.now() });\n      area.addEventListener('pointerup', e => {\n        if (!s) return;\n        const dx = e.clientX - s.x, dy = e.clientY - s.y, dt = performance.now() - s.t;\n        const v = Math.abs(dx) / dt; // px/ms\n        let r = `dx=${Math.round(dx)}px dt=${Math.round(dt)}ms v=${v.toFixed(2)}px/ms → `;\n        if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) && v > 0.3) r += dx > 0 ? 'スワイプ右' : 'スワイプ左';\n        else r += '判定なし（距離不足 or 遅い）';\n        out.textContent = r; s = null;\n      });\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 10 ===================== -->\n<section class=\"demo\" id=\"n10\">\n  <h2><span class=\"no\">10\u003c/span>リサイズ <small>Resize\u003c/small>\u003c/h2>\n  <p class=\"what\">つまみ（ハンドル）をドラッグして大きさを変える。サイズ変化の検知は <code>ResizeObserver\u003c/code> が正解（<code>window.resize\u003c/code> は要素の変化を拾えない）。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>右下の角をドラッグ。最小サイズで止まる。\u003c/p>\n  <div class=\"stage\">\n    <div class=\"row\" style=\"align-items:flex-start\">\n      <div id=\"s10-panel\" class=\"s10-panel\">パネル<div id=\"s10-handle\" class=\"s10-handle\">\u003c/div>\u003c/div>\n      <span class=\"readout\" id=\"s10-out\">\u003c/span>\n    \u003c/div>\n  \u003c/div>\n  <style data-code>\n    .s10-panel { position: relative; width: 200px; height: 100px; background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; padding: 8px; font-size: 13px; }\n    .s10-handle { position: absolute; right: 0; bottom: 0; width: 16px; height: 16px; cursor: nwse-resize; background: linear-gradient(135deg, transparent 50%, #94a3b8 50%); border-radius: 0 0 6px 0; touch-action: none; }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const panel = $('#s10-panel'), handle = $('#s10-handle'), out = $('#s10-out');\n      new ResizeObserver(entries => {\n        const r = entries[0].contentRect;\n        out.textContent = `ResizeObserver: ${Math.round(r.width)} × ${Math.round(r.height)}`;\n      }).observe(panel);\n      let st = null;\n      handle.addEventListener('pointerdown', e => {\n        st = { x: e.clientX, y: e.clientY, w: panel.offsetWidth, h: panel.offsetHeight };\n        handle.setPointerCapture(e.pointerId);\n      });\n      handle.addEventListener('pointermove', e => {\n        if (!st) return;\n        panel.style.width = Math.max(120, st.w + e.clientX - st.x) + 'px';\n        panel.style.height = Math.max(60, st.h + e.clientY - st.y) + 'px';\n      });\n      handle.addEventListener('pointerup', () => st = null);\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 11 ===================== -->\n<section class=\"demo\" id=\"n11\">\n  <h2><span class=\"no\">11\u003c/span>選択 <small>Select（単一 / Ctrl追加 / Shift範囲）\u003c/small>\u003c/h2>\n  <p class=\"what\">項目を選ぶ。Excelやエクスプローラと同じ修飾キー慣習（<kbd>Ctrl\u003c/kbd>=追加/解除、<kbd>Shift\u003c/kbd>=範囲）に合わせると業務ユーザーは説明なしで使える。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>行をクリック。Ctrl/⌘ や Shift を押しながらクリック。\u003c/p>\n  <div class=\"stage\">\n    <div id=\"s11-list\" class=\"s11-list\" role=\"listbox\" aria-multiselectable=\"true\">\u003c/div>\n    <div class=\"row\"><span class=\"readout\" id=\"s11-out\">選択: なし\u003c/span>\u003c/div>\n  \u003c/div>\n  <style data-code>\n    .s11-list { background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; user-select: none; }\n    .s11-list div { padding: 5px 10px; font-size: 13px; border-bottom: 1px solid #f1f5f9; cursor: default; }\n    .s11-list div[aria-selected=\"true\"] { background: var(--accent-soft); color: #1e3a8a; }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const list = $('#s11-list'), out = $('#s11-out');\n      for (let i = 1; i <= 8; i++) list.insertAdjacentHTML('beforeend', `<div role=\"option\" aria-selected=\"false\">品目 ${i}\u003c/div>`);\n      const items = $$('div', list);\n      let anchor = 0; const selected = new Set();\n      const paint = () => {\n        items.forEach((el, i) => el.setAttribute('aria-selected', selected.has(i)));\n        out.textContent = '選択: ' + ([...selected].sort((a, b) => a - b).map(i => i + 1).join(', ') || 'なし');\n      };\n      list.addEventListener('click', e => {\n        const i = items.indexOf(e.target); if (i < 0) return;\n        if (e.shiftKey) {                 // 範囲：アンカーからここまで\n          selected.clear();\n          for (let k = Math.min(anchor, i); k <= Math.max(anchor, i); k++) selected.add(k);\n        } else if (e.ctrlKey || e.metaKey) { // 追加/解除\n          selected.has(i) ? selected.delete(i) : selected.add(i); anchor = i;\n        } else {                           // 単一\n          selected.clear(); selected.add(i); anchor = i;\n        }\n        paint();\n      });\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 12 ===================== -->\n<section class=\"demo\" id=\"n12\">\n  <h2><span class=\"no\">12\u003c/span>フェードイン / フェードアウト <small>Fade in / out\u003c/small>\u003c/h2>\n  <p class=\"what\">不透明度（opacity）を時間で補間する。最も安価で自然な出現・消失。注意点は「opacity:0 でも要素はそこに在る（クリックできる）」こと。消した後は <code>display:none\u003c/code> か <code>visibility:hidden\u003c/code> にする。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>トグル。<code>transitionend\u003c/code> で「完全に消えた瞬間」を拾って非表示化している。\u003c/p>\n  <div class=\"stage\">\n    <div class=\"row\"><button id=\"s12-btn\">フェード切替\u003c/button><span class=\"readout\" id=\"s12-out\">state: visible\u003c/span>\u003c/div>\n    <div id=\"s12-box\" class=\"box s12\">通知パネル\u003c/div>\n  \u003c/div>\n  <style data-code>\n    .s12 { width: 160px; transition: opacity .4s ease; }\n    .s12.hidden { opacity: 0; pointer-events: none; }  /* 消えている間は操作不可に */\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const box = $('#s12-box'), out = $('#s12-out');\n      $('#s12-btn').onclick = () => {\n        box.classList.toggle('hidden');\n        out.textContent = 'state: transitioning...';\n      };\n      box.addEventListener('transitionend', () => out.textContent = 'state: ' + (box.classList.contains('hidden') ? 'hidden（ここで display:none にしてよい）' : 'visible'));\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 13 ===================== -->\n<section class=\"demo\" id=\"n13\">\n  <h2><span class=\"no\">13\u003c/span>スライドイン / スライドアウト <small>Slide in / out\u003c/small>\u003c/h2>\n  <p class=\"what\">画面端から滑り込む。<code>left\u003c/code> や <code>margin\u003c/code> ではなく <code>transform\u003c/code> を動かす（レイアウト計算が走らず滑らか）。ドロワー・サイドパネル・通知の基本。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>ボタンで右からパネルが出る。背景クリックでも閉じる。\u003c/p>\n  <div class=\"stage tall\" style=\"padding:0\">\n    <div class=\"s13-frame\">\n      <div class=\"row\" style=\"padding:10px\"><button id=\"s13-open\">パネルを開く\u003c/button>\u003c/div>\n      <div id=\"s13-backdrop\" class=\"s13-backdrop\">\u003c/div>\n      <div id=\"s13-panel\" class=\"s13-panel\"><b>設定パネル\u003c/b><p style=\"font-size:13px\">transform: translateX(100%) → 0\u003c/p><button id=\"s13-close\">閉じる\u003c/button>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n  <style data-code>\n    .s13-frame { position: relative; height: 260px; overflow: hidden; }\n    .s13-panel { position: absolute; top: 0; right: 0; bottom: 0; width: 240px; background: #fff; border-left: 1px solid #cbd5e1; padding: 14px; box-shadow: -8px 0 24px rgba(0,0,0,.08);\n      transform: translateX(100%); transition: transform .3s cubic-bezier(.2,.8,.2,1); }\n    .s13-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .3s; }\n    .s13-frame.open .s13-panel { transform: translateX(0); }\n    .s13-frame.open .s13-backdrop { opacity: 1; pointer-events: auto; }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const frame = $('.s13-frame');\n      $('#s13-open').onclick = () => frame.classList.add('open');\n      $('#s13-close').onclick = $('#s13-backdrop').onclick = () => frame.classList.remove('open');\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 14 ===================== -->\n<section class=\"demo\" id=\"n14\">\n  <h2><span class=\"no\">14\u003c/span>トランジション / イージング <small>Transition / Easing\u003c/small>\u003c/h2>\n  <p class=\"what\">状態AからBへ「時間をかけて」変える仕組みがトランジション。その途中の速度配分がイージング。UIでは <b>ease-out\u003c/b>（速く出て静かに止まる）が基本。ease-in は「反応が遅い」と感じさせる。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>ボタンで4つの玉を同時に走らせ、違いを見る。\u003c/p>\n  <div class=\"stage\">\n    <div class=\"row\"><button id=\"s14-run\">走らせる\u003c/button>\u003c/div>\n    <div class=\"s14-lane\"><span>linear\u003c/span><div class=\"s14-ball\" style=\"transition-timing-function:linear\">\u003c/div>\u003c/div>\n    <div class=\"s14-lane\"><span>ease-out\u003c/span><div class=\"s14-ball\" style=\"transition-timing-function:ease-out\">\u003c/div>\u003c/div>\n    <div class=\"s14-lane\"><span>ease-in\u003c/span><div class=\"s14-ball\" style=\"transition-timing-function:ease-in\">\u003c/div>\u003c/div>\n    <div class=\"s14-lane\"><span>cubic-bezier(.2,.8,.2,1)\u003c/span><div class=\"s14-ball\" style=\"transition-timing-function:cubic-bezier(.2,.8,.2,1)\">\u003c/div>\u003c/div>\n  \u003c/div>\n  <style data-code>\n    .s14-lane { position: relative; height: 30px; margin-bottom: 4px; background: #fff; border: 1px solid #e5e7eb; border-radius: 6px; }\n    .s14-lane span { position: absolute; left: 8px; top: 5px; font-size: 12px; color: var(--muted); }\n    .s14-ball { position: absolute; top: 4px; left: 4px; width: 22px; height: 22px; border-radius: 50%; background: var(--accent);\n      transition-property: transform; transition-duration: .9s; }\n    .s14-lane.go .s14-ball { transform: translateX(calc(100% * 14)); }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      $('#s14-run').onclick = () => {\n        const lanes = $$('.s14-lane');\n        lanes.forEach(l => l.classList.remove('go'));\n        void document.body.offsetWidth; // 再フロー強制：クラスを外した状態を確定させてから再付与\n        lanes.forEach(l => l.classList.add('go'));\n      };\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 15 ===================== -->\n<section class=\"demo\" id=\"n15\">\n  <h2><span class=\"no\">15\u003c/span>モーダル / ダイアログ <small>Modal / Dialog\u003c/small>\u003c/h2>\n  <p class=\"what\">背後の操作を止めて前面で確認・入力させる。標準の <code>&lt;dialog&gt;\u003c/code> を <code>showModal()\u003c/code> で開くと、背景の暗幕・Escで閉じる・フォーカス閉じ込め・背面の不活性化が全部ついてくる。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>開いて <kbd>Esc\u003c/kbd> や暗幕クリックで閉じる。戻り値は <code>returnValue\u003c/code> で受け取る。\u003c/p>\n  <div class=\"stage\">\n    <div class=\"row\"><button id=\"s15-open\" class=\"primary\">削除確認を開く\u003c/button><span class=\"readout\" id=\"s15-out\">returnValue: -\u003c/span>\u003c/div>\n    <dialog id=\"s15-dlg\" class=\"s15-dlg\">\n      <form method=\"dialog\">\n        <p><b>レコードを削除しますか？\u003c/b>\u003c/p>\n        <p style=\"font-size:13px;color:var(--muted)\">この操作は取り消せません。\u003c/p>\n        <div class=\"row\" style=\"justify-content:flex-end\"><button value=\"cancel\">キャンセル\u003c/button><button value=\"delete\" class=\"primary\">削除\u003c/button>\u003c/div>\n      \u003c/form>\n    \u003c/dialog>\n  \u003c/div>\n  <style data-code>\n    .s15-dlg { border: none; border-radius: 10px; padding: 18px 20px; width: 320px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }\n    .s15-dlg::backdrop { background: rgba(15,23,42,.45); }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const dlg = $('#s15-dlg'), out = $('#s15-out');\n      $('#s15-open').onclick = () => dlg.showModal();\n      dlg.addEventListener('close', () => out.textContent = 'returnValue: ' + (dlg.returnValue || '(Esc)'));\n      dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close('backdrop'); }); // 暗幕クリックで閉じる\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 16 ===================== -->\n<section class=\"demo\" id=\"n16\">\n  <h2><span class=\"no\">16\u003c/span>トースト / スナックバー <small>Toast / Snackbar\u003c/small>\u003c/h2>\n  <p class=\"what\">操作結果を隅に短時間表示し、自動で消える。作業を中断させない通知。読み上げ対応のため <code>aria-live\u003c/code> を付ける。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>連打すると積み上がる。ホバー中は消えない（読む時間を確保）。\u003c/p>\n  <div class=\"stage\">\n    <div class=\"row\"><button id=\"s16-ok\">保存成功を通知\u003c/button><button id=\"s16-ng\">エラーを通知\u003c/button>\u003c/div>\n    <div id=\"s16-host\" class=\"s16-host\" aria-live=\"polite\">\u003c/div>\n  \u003c/div>\n  <style data-code>\n    .s16-host { position: absolute; right: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 8px; }\n    .s16-toast { min-width: 200px; padding: 10px 14px; border-radius: 8px; color: #fff; background: #0f172a; font-size: 13px; box-shadow: 0 8px 20px rgba(0,0,0,.2);\n      animation: s16-in .25s ease-out; }\n    .s16-toast.error { background: #dc2626; }\n    .s16-toast.leaving { animation: s16-out .25s ease-in forwards; }\n    @keyframes s16-in { from { opacity: 0; transform: translateY(12px); } }\n    @keyframes s16-out { to { opacity: 0; transform: translateY(12px); } }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const host = $('#s16-host');\n      function toast(msg, { error = false, ms = 2500 } = {}) {\n        const el = document.createElement('div');\n        el.className = 's16-toast' + (error ? ' error' : ''); el.textContent = msg;\n        host.appendChild(el);\n        let timer;\n        const arm = () => timer = setTimeout(() => { el.classList.add('leaving'); el.addEventListener('animationend', () => el.remove(), { once: true }); }, ms);\n        el.addEventListener('pointerenter', () => clearTimeout(timer)); // 読んでいる間は消さない\n        el.addEventListener('pointerleave', arm);\n        arm();\n      }\n      let n = 0;\n      $('#s16-ok').onclick = () => toast(`レコード #${++n} を保存しました`);\n      $('#s16-ng').onclick = () => toast('保存に失敗しました（通信エラー）', { error: true, ms: 4000 });\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 17 ===================== -->\n<section class=\"demo\" id=\"n17\">\n  <h2><span class=\"no\">17\u003c/span>ツールチップ / ポップオーバー <small>Tooltip / Popover\u003c/small>\u003c/h2>\n  <p class=\"what\">補足情報を小さく浮かせて出す。難しいのは位置決め：画面端では上下・左右を反転させる。<code>getBoundingClientRect()\u003c/code> で対象の位置を取り、はみ出すなら反対側へ。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>ボタンにホバー／フォーカス。右端のボタンでは反転する。\u003c/p>\n  <div class=\"stage\">\n    <div class=\"row\" style=\"justify-content:space-between\">\n      <button data-tip=\"左側のボタン。上に出る。\">左\u003c/button>\n      <button data-tip=\"中央。これも上。\">中央\u003c/button>\n      <button data-tip=\"右端は幅が足りないので左寄せに補正される。\">右端\u003c/button>\n    \u003c/div>\n    <div id=\"s17-tip\" class=\"s17-tip\" role=\"tooltip\" hidden>\u003c/div>\n  \u003c/div>\n  <style data-code>\n    .s17-tip { position: absolute; max-width: 200px; padding: 6px 10px; background: #0f172a; color: #fff; font-size: 12px; border-radius: 6px; pointer-events: none; z-index: 5; }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const tip = $('#s17-tip'), stage = tip.parentElement;\n      const show = btn => {\n        tip.textContent = btn.dataset.tip; tip.hidden = false;\n        const b = btn.getBoundingClientRect(), s = stage.getBoundingClientRect(), t = tip.getBoundingClientRect();\n        let left = b.left - s.left + b.width / 2 - t.width / 2;   // 中央揃え\n        left = Math.max(4, Math.min(left, s.width - t.width - 4)); // 枠内に収める\n        let top = b.top - s.top - t.height - 6;                     // 上に出す\n        if (top < 0) top = b.bottom - s.top + 6;                    // 上に余白が無ければ下へ\n        tip.style.left = left + 'px'; tip.style.top = top + 'px';\n      };\n      $$('[data-tip]', stage).forEach(btn => {\n        btn.addEventListener('pointerenter', () => show(btn));\n        btn.addEventListener('focus', () => show(btn));\n        btn.addEventListener('pointerleave', () => tip.hidden = true);\n        btn.addEventListener('blur', () => tip.hidden = true);\n      });\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 18 ===================== -->\n<section class=\"demo\" id=\"n18\">\n  <h2><span class=\"no\">18\u003c/span>アコーディオン / 折りたたみ <small>Accordion / Collapse\u003c/small>\u003c/h2>\n  <p class=\"what\">セクションの開閉。<code>height: auto\u003c/code> へは CSS transition が効かない、が定番の壁。解決策は grid の <code>0fr → 1fr\u003c/code>（JS不要・内容の高さを知らなくてよい）。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>見出しをクリック。\u003c/p>\n  <div class=\"stage\">\n    <div class=\"s18\">\n      <button class=\"s18-head\" aria-expanded=\"false\">出荷条件 <span>▾\u003c/span>\u003c/button>\n      <div class=\"s18-body\"><div>納期は受注後5営業日。分納可。梱包は標準仕様。\u003c/div>\u003c/div>\n    \u003c/div>\n    <div class=\"s18\">\n      <button class=\"s18-head\" aria-expanded=\"false\">支払条件 <span>▾\u003c/span>\u003c/button>\n      <div class=\"s18-body\"><div>月末締め翌月末払い。<br>手形不可。\u003c/div>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n  <style data-code>\n    .s18 { background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; margin-bottom: 6px; overflow: hidden; }\n    .s18-head { width: 100%; text-align: left; border: none; border-radius: 0; display: flex; justify-content: space-between; }\n    .s18-head span { transition: transform .25s; }\n    .s18-head[aria-expanded=\"true\"] span { transform: rotate(180deg); }\n    .s18-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .25s ease; }\n    .s18-body > div { overflow: hidden; padding: 0 12px; font-size: 13px; }\n    .s18-head[aria-expanded=\"true\"] + .s18-body { grid-template-rows: 1fr; }\n    .s18-head[aria-expanded=\"true\"] + .s18-body > div { padding-bottom: 10px; }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      $$('.s18-head').forEach(h => h.onclick = () => h.setAttribute('aria-expanded', h.getAttribute('aria-expanded') !== 'true'));\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 19 ===================== -->\n<section class=\"demo\" id=\"n19\">\n  <h2><span class=\"no\">19\u003c/span>タブ <small>Tabs\u003c/small>\u003c/h2>\n  <p class=\"what\">同じ領域を複数のビューで切り替える。WAI-ARIAの作法：タブ列は <code>role=tablist\u003c/code>、Tabキーでは選択中タブに止まり、<kbd>←\u003c/kbd><kbd>→\u003c/kbd> で隣へ移動。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>クリック、またはタブにフォーカスして矢印キー。\u003c/p>\n  <div class=\"stage\">\n    <div class=\"s19-tabs\" role=\"tablist\">\n      <button role=\"tab\" aria-selected=\"true\" aria-controls=\"s19-p1\" id=\"s19-t1\">基本情報\u003c/button>\n      <button role=\"tab\" aria-selected=\"false\" aria-controls=\"s19-p2\" id=\"s19-t2\" tabindex=\"-1\">明細\u003c/button>\n      <button role=\"tab\" aria-selected=\"false\" aria-controls=\"s19-p3\" id=\"s19-t3\" tabindex=\"-1\">履歴\u003c/button>\n    \u003c/div>\n    <div role=\"tabpanel\" id=\"s19-p1\" class=\"s19-panel\">顧客名・納品先などの基本情報。\u003c/div>\n    <div role=\"tabpanel\" id=\"s19-p2\" class=\"s19-panel\" hidden>品目・数量・単価の明細。\u003c/div>\n    <div role=\"tabpanel\" id=\"s19-p3\" class=\"s19-panel\" hidden>変更履歴のタイムライン。\u003c/div>\n  \u003c/div>\n  <style data-code>\n    .s19-tabs { display: flex; gap: 2px; border-bottom: 1px solid #cbd5e1; }\n    .s19-tabs [role=tab] { border: none; border-bottom: 2px solid transparent; border-radius: 0; background: none; margin-bottom: -1px; }\n    .s19-tabs [role=tab][aria-selected=\"true\"] { border-bottom-color: var(--accent); color: var(--accent); font-weight: 600; }\n    .s19-panel { padding: 12px 4px; font-size: 13px; }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const tabs = $$('.s19-tabs [role=tab]');\n      const select = i => tabs.forEach((t, k) => {\n        const on = k === i;\n        t.setAttribute('aria-selected', on); t.tabIndex = on ? 0 : -1;\n        document.getElementById(t.getAttribute('aria-controls')).hidden = !on;\n        if (on) t.focus();\n      });\n      tabs.forEach((t, i) => {\n        t.addEventListener('click', () => select(i));\n        t.addEventListener('keydown', e => {\n          if (e.key === 'ArrowRight') select((i + 1) % tabs.length);\n          if (e.key === 'ArrowLeft') select((i - 1 + tabs.length) % tabs.length);\n        });\n      });\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 20 ===================== -->\n<section class=\"demo\" id=\"n20\">\n  <h2><span class=\"no\">20\u003c/span>ドロップダウン / メニュー <small>Dropdown / Menu\u003c/small>\u003c/h2>\n  <p class=\"what\">ボタン押下で選択肢を展開する。自作するときの必須処理は3つ：外側クリックで閉じる、Escで閉じる、項目選択で閉じる。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>ボタンを押し、外をクリックや <kbd>Esc\u003c/kbd> で閉じる。\u003c/p>\n  <div class=\"stage\" style=\"min-height:170px\">\n    <div class=\"s20-wrap\">\n      <button id=\"s20-btn\" aria-haspopup=\"menu\" aria-expanded=\"false\">操作 ▾\u003c/button>\n      <div id=\"s20-menu\" class=\"s20-menu\" role=\"menu\" hidden>\n        <button role=\"menuitem\">複製\u003c/button><button role=\"menuitem\">CSV出力\u003c/button><button role=\"menuitem\" style=\"color:#dc2626\">削除\u003c/button>\n      \u003c/div>\n    \u003c/div>\n    <div class=\"row\"><span class=\"readout\" id=\"s20-out\">選択: -\u003c/span>\u003c/div>\n  \u003c/div>\n  <style data-code>\n    .s20-wrap { position: relative; display: inline-block; margin-bottom: 8px; }\n    .s20-menu { position: absolute; top: 100%; left: 0; margin-top: 4px; min-width: 140px; background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; padding: 4px; box-shadow: 0 10px 24px rgba(0,0,0,.12); z-index: 5; }\n    .s20-menu button { display: block; width: 100%; text-align: left; border: none; border-radius: 4px; }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const btn = $('#s20-btn'), menu = $('#s20-menu'), out = $('#s20-out');\n      const set = open => { menu.hidden = !open; btn.setAttribute('aria-expanded', open); };\n      btn.onclick = () => set(menu.hidden);\n      document.addEventListener('click', e => { if (!btn.contains(e.target) && !menu.contains(e.target)) set(false); }); // 外側クリック\n      document.addEventListener('keydown', e => { if (e.key === 'Escape') set(false); });\n      $$('[role=menuitem]', menu).forEach(m => m.onclick = () => { out.textContent = '選択: ' + m.textContent; set(false); });\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 21 ===================== -->\n<section class=\"demo\" id=\"n21\">\n  <h2><span class=\"no\">21\u003c/span>ページネーション / 無限スクロール <small>Pagination / Infinite scroll\u003c/small>\u003c/h2>\n  <p class=\"what\">大量データを分割して取得・表示する2方式。ページ番号は「位置が分かる」、無限スクロールは「操作が要らない」。kintoneのレコード取得（offset/limit、またはカーソルAPI）はこの下で動く。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>左は番号で切替。右は末尾までスクロールすると <code>IntersectionObserver\u003c/code> が「番兵」を検知して追加読み込みする。\u003c/p>\n  <div class=\"stage\">\n    <div class=\"row\" style=\"align-items:flex-start\">\n      <div style=\"flex:1\">\n        <div id=\"s21-page\" class=\"s21-list\">\u003c/div>\n        <div class=\"row\" id=\"s21-pager\">\u003c/div>\n      \u003c/div>\n      <div style=\"flex:1\">\n        <div id=\"s21-inf\" class=\"s21-list\" style=\"height:150px;overflow:auto\">\u003c/div>\n        <span class=\"readout\" id=\"s21-out\">読込: 0件\u003c/span>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n  <style data-code>\n    .s21-list { background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; margin-bottom: 6px; }\n    .s21-list div { padding: 3px 10px; border-bottom: 1px solid #f1f5f9; }\n    .s21-list .sentinel { color: var(--muted); text-align: center; }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      // 疑似API：offset/limit で取る（kintone の records.json と同じ形）\n      const fetchRecords = (offset, limit) => new Promise(r => setTimeout(() => r(\n        Array.from({ length: limit }, (_, i) => `レコード ${offset + i + 1}`)), 300));\n\n      // --- ページネーション ---\n      const page = $('#s21-page'), pager = $('#s21-pager'), PER = 5, TOTAL = 23;\n      async function goto(p) {\n        page.innerHTML = '<div>読込中…\u003c/div>';\n        const rows = await fetchRecords((p - 1) * PER, Math.min(PER, TOTAL - (p - 1) * PER));\n        page.innerHTML = rows.map(r => `<div>${r}\u003c/div>`).join('');\n        pager.innerHTML = '';\n        for (let i = 1; i <= Math.ceil(TOTAL / PER); i++) {\n          const b = document.createElement('button'); b.textContent = i; if (i === p) b.className = 'primary';\n          b.onclick = () => goto(i); pager.appendChild(b);\n        }\n      }\n      goto(1);\n\n      // --- 無限スクロール ---\n      const inf = $('#s21-inf'), out = $('#s21-out');\n      const sentinel = document.createElement('div'); sentinel.className = 'sentinel'; sentinel.textContent = '…';\n      inf.appendChild(sentinel);\n      let loaded = 0, busy = false;\n      const io = new IntersectionObserver(async ([e]) => {\n        if (!e.isIntersecting || busy) return;\n        busy = true;\n        const rows = await fetchRecords(loaded, 10); loaded += rows.length;\n        rows.forEach(r => sentinel.insertAdjacentHTML('beforebegin', `<div>${r}\u003c/div>`));\n        out.textContent = `読込: ${loaded}件`; busy = false;\n        if (loaded >= 60) { io.disconnect(); sentinel.textContent = '終端'; }\n      }, { root: inf });\n      io.observe(sentinel);\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 22 ===================== -->\n<section class=\"demo\" id=\"n22\">\n  <h2><span class=\"no\">22\u003c/span>ローディング表示 <small>Loading / Skeleton / Spinner\u003c/small>\u003c/h2>\n  <p class=\"what\">待ち時間を可視化する。スピナーは「何か待っている」しか伝えないが、スケルトン（内容の形の灰色）は「何が来るか」を先に見せるので体感が速い。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>再読込で2秒待ち。どちらの待ち方が楽か比べる。\u003c/p>\n  <div class=\"stage\">\n    <div class=\"row\"><button id=\"s22-reload\">再読込（2秒）\u003c/button>\u003c/div>\n    <div class=\"row\" style=\"align-items:flex-start\">\n      <div class=\"s22-card\" id=\"s22-spin\"><div class=\"s22-spinner\">\u003c/div>\u003c/div>\n      <div class=\"s22-card\" id=\"s22-skel\"><div class=\"s22-line w60\">\u003c/div><div class=\"s22-line\">\u003c/div><div class=\"s22-line w80\">\u003c/div>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n  <style data-code>\n    .s22-card { flex: 1; min-height: 90px; background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; padding: 12px; font-size: 13px; display: grid; align-content: start; gap: 8px; }\n    .s22-spinner { width: 26px; height: 26px; border: 3px solid #e5e7eb; border-top-color: var(--accent); border-radius: 50%; animation: s22-spin .8s linear infinite; justify-self: center; align-self: center; margin-top: 18px; }\n    @keyframes s22-spin { to { transform: rotate(360deg); } }\n    .s22-line { height: 12px; border-radius: 6px; background: linear-gradient(90deg, #e5e7eb 25%, #f3f4f6 50%, #e5e7eb 75%); background-size: 200% 100%; animation: s22-shimmer 1.2s infinite; }\n    .s22-line.w60 { width: 60%; } .s22-line.w80 { width: 80%; }\n    @keyframes s22-shimmer { to { background-position: -200% 0; } }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const spin = $('#s22-spin'), skel = $('#s22-skel');\n      const loading = [spin.innerHTML, skel.innerHTML];\n      const loaded = ['<b>受注 #1001\u003c/b><div>株式会社サンプル\u003c/div><div>納期 2026-09-12\u003c/div>', '<b>受注 #1001\u003c/b><div>株式会社サンプル\u003c/div><div>納期 2026-09-12\u003c/div>'];\n      const load = () => {\n        spin.innerHTML = loading[0]; skel.innerHTML = loading[1];\n        spin.setAttribute('aria-busy', 'true'); skel.setAttribute('aria-busy', 'true');\n        setTimeout(() => { spin.innerHTML = loaded[0]; skel.innerHTML = loaded[1]; spin.removeAttribute('aria-busy'); skel.removeAttribute('aria-busy'); }, 2000);\n      };\n      $('#s22-reload').onclick = load; load();\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c/main>\n\u003c/div>\n\u003c/body>\n\u003c/html>\n","docs/ui-guide/03-custom.html":"<!DOCTYPE html>\n<html lang=\"ja\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>第2弾 B：カスタマイズ性の高いUI（23〜42）動くデモ\u003c/title>\n<link rel=\"stylesheet\" href=\"assets/guide.css\">\n\u003cscript src=\"assets/guide.js\">\u003c/script>\n\u003c/head>\n<body>\n<header class=\"top\">\n  <h1>B：カスタマイズ性の高いUI <span class=\"tier tierB\">23〜42\u003c/span>\u003c/h1>\n  <nav><a href=\"00-index.html\">⌂ 入口\u003c/a><a href=\"08-foundations.html\">基礎\u003c/a><a href=\"01-ui-operations-catalog.html\">カタログ\u003c/a><a href=\"02-basic.html\">A：一般 →\u003c/a><a href=\"04-pro.html\">C：プロ志向 →\u003c/a><a href=\"09-exercises.html\">課題\u003c/a><a href=\"10-accessibility.html\">a11y\u003c/a><a href=\"11-quiz.html\">クイズ\u003c/a>\u003c/nav>\n\u003c/header>\n<div class=\"layout\">\n<aside class=\"toc\">\u003c/aside>\n<main>\n<div class=\"lead\">B層は「ブラウザ標準の挙動を自分で制御する」領域。Pointer Events・Observer系・requestAnimationFrame の3つが道具の中心になる。\u003c/div>\n\n\u003c!-- ===================== 23 ===================== -->\n<section class=\"demo\" id=\"n23\">\n  <h2><span class=\"no\">23\u003c/span>仮想スクロール <small>Virtual scroll / Windowing\u003c/small>\u003c/h2>\n  <p class=\"what\">10万行あっても DOM は「見えている行＋少し」だけ作る。スクロール位置から開始行を割り算で求め、上に「行高×開始行」の余白を置いて位置を合わせる。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>スクロールしても DOM 行数は約20のまま。\u003c/p>\n  <div class=\"stage\">\n    <div class=\"row\"><span class=\"readout\" id=\"s23-out\">\u003c/span>\u003c/div>\n    <div id=\"s23-view\" class=\"s23-view\"><div id=\"s23-spacer\"><div id=\"s23-rows\">\u003c/div>\u003c/div>\u003c/div>\n  \u003c/div>\n  <style data-code>\n    .s23-view { height: 200px; overflow-y: auto; background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; }\n    .s23-view .r { height: 28px; line-height: 28px; padding: 0 10px; font-size: 13px; border-bottom: 1px solid #f1f5f9; }\n    .s23-view .r:nth-child(even) { background: #f8fafc; }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const TOTAL = 100000, H = 28, view = $('#s23-view'), spacer = $('#s23-spacer'), rows = $('#s23-rows'), out = $('#s23-out');\n      spacer.style.height = TOTAL * H + 'px';              // 全体の高さだけ確保（DOMは作らない）\n      function render() {\n        const start = Math.floor(view.scrollTop / H);\n        const count = Math.ceil(view.clientHeight / H) + 2;  // 画面分＋余裕\n        rows.style.transform = `translateY(${start * H}px)`; // 表示行を正しい位置へ\n        let html = '';\n        for (let i = start; i < Math.min(start + count, TOTAL); i++) html += `<div class=\"r\">行 ${i + 1}（DOMは使い回し）\u003c/div>`;\n        rows.innerHTML = html;\n        out.textContent = `全 ${TOTAL.toLocaleString()} 行 / DOM行数 ${rows.children.length} / 表示開始 ${start + 1}`;\n      }\n      view.addEventListener('scroll', render); render();\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 24 ===================== -->\n<section class=\"demo\" id=\"n24\">\n  <h2><span class=\"no\">24\u003c/span>スティッキー（固定ヘッダー / 固定列） <small>Sticky header / column\u003c/small>\u003c/h2>\n  <p class=\"what\">スクロールしても見出しが留まる。<code>position: sticky\u003c/code> だけで実現でき、JSは不要。左上のセルは <code>top\u003c/code> と <code>left\u003c/code> の両方を指定して両方向に固定する。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>表を縦横にスクロール。\u003c/p>\n  <div class=\"stage\">\n    <div id=\"s24-wrap\" class=\"s24-wrap\"><table id=\"s24-table\" class=\"s24\">\u003c/table>\u003c/div>\n  \u003c/div>\n  <style data-code>\n    .s24-wrap { height: 200px; overflow: auto; background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; }\n    .s24 { border-collapse: separate; border-spacing: 0; font-size: 13px; }\n    .s24 th, .s24 td { padding: 5px 12px; border-bottom: 1px solid #e5e7eb; border-right: 1px solid #e5e7eb; white-space: nowrap; background: #fff; }\n    .s24 thead th { position: sticky; top: 0; background: #f1f5f9; z-index: 2; }\n    .s24 td:first-child, .s24 th:first-child { position: sticky; left: 0; background: #f1f5f9; z-index: 1; }\n    .s24 thead th:first-child { z-index: 3; } /* 左上：両方向固定・最前面 */\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const t = $('#s24-table');\n      let h = '<thead><tr><th>品番\u003c/th>' + Array.from({ length: 12 }, (_, i) => `<th>${i + 1}月\u003c/th>`).join('') + '\u003c/tr>\u003c/thead><tbody>';\n      for (let r = 1; r <= 30; r++) h += `<tr><td>P-${String(r).padStart(3, '0')}\u003c/td>` + Array.from({ length: 12 }, () => `<td>${Math.floor(Math.random() * 900 + 100)}\u003c/td>`).join('') + '\u003c/tr>';\n      t.innerHTML = h + '\u003c/tbody>';\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 25 ===================== -->\n<section class=\"demo\" id=\"n25\">\n  <h2><span class=\"no\">25\u003c/span>スクロールスナップ <small>Scroll snap\u003c/small>\u003c/h2>\n  <p class=\"what\">スクロールを止めた時、区切り位置に吸着する。CSSだけで「カルーセル」「ページ単位の閲覧」ができ、慣性・タッチ対応もブラウザ任せ。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>横にスクロール（Shift+ホイール or トラックパッド）。どこで止めてもカードの先頭に揃う。\u003c/p>\n  <div class=\"stage\">\n    <div class=\"s25-track\" id=\"s25-track\">\u003c/div>\n  \u003c/div>\n  <style data-code>\n    .s25-track { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 4px; scroll-padding: 4px; }\n    .s25-card { flex: 0 0 200px; height: 110px; scroll-snap-align: start; background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; display: grid; place-items: center; font-size: 15px; }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      $('#s25-track').innerHTML = Array.from({ length: 8 }, (_, i) => `<div class=\"s25-card\">カード ${i + 1}\u003c/div>`).join('');\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 26 ===================== -->\n<section class=\"demo\" id=\"n26\">\n  <h2><span class=\"no\">26\u003c/span>パララックス <small>Parallax\u003c/small>\u003c/h2>\n  <p class=\"what\">前景と背景を異なる速度で動かして奥行きを出す。実装は「スクロール量 × 係数」を <code>transform\u003c/code> に入れるだけ。業務アプリでは酔いやすいので控えめに。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>枠内をスクロール。背景の丸は 0.3 倍の速度で動く。\u003c/p>\n  <div class=\"stage\" style=\"padding:0\">\n    <div id=\"s26-view\" class=\"s26-view\">\n      <div id=\"s26-bg\" class=\"s26-bg\">\u003c/div>\n      <div class=\"s26-content\"><p>前景（等速）\u003c/p><p>スクロールに合わせて…\u003c/p><p>背景がゆっくり動く\u003c/p><p>係数 0.3\u003c/p><p>終わり\u003c/p>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n  <style data-code>\n    .s26-view { position: relative; height: 220px; overflow: auto; background: #1e293b; color: #fff; }\n    .s26-bg { position: absolute; left: 0; right: 0; top: 0; height: 800px; pointer-events: none;\n      background-image: radial-gradient(circle, rgba(255,255,255,.25) 12px, transparent 13px); background-size: 120px 120px; will-change: transform; }\n    .s26-content { position: relative; padding: 20px 30px; } .s26-content p { margin: 0 0 120px; font-size: 18px; }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const view = $('#s26-view'), bg = $('#s26-bg');\n      view.addEventListener('scroll', () => bg.style.transform = `translateY(${view.scrollTop * 0.7}px)`); // 0.7px戻す＝0.3倍で動く\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 27 ===================== -->\n<section class=\"demo\" id=\"n27\">\n  <h2><span class=\"no\">27\u003c/span>スクロール連動アニメーション <small>Scroll-driven reveal\u003c/small>\u003c/h2>\n  <p class=\"what\">要素が画面に入った瞬間をトリガーにする。<code>scroll\u003c/code> イベントで毎回位置計算せず、<code>IntersectionObserver\u003c/code> に「入った／出た」だけ教えてもらう。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>枠内をスクロール。入ったカードがフェード＋上昇で現れる。\u003c/p>\n  <div class=\"stage\" style=\"padding:0\">\n    <div id=\"s27-view\" class=\"s27-view\">\u003c/div>\n  \u003c/div>\n  <style data-code>\n    .s27-view { height: 220px; overflow: auto; padding: 14px; }\n    .s27-card { background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; padding: 14px; margin-bottom: 60px; font-size: 13px;\n      opacity: 0; transform: translateY(20px); transition: opacity .5s, transform .5s; }\n    .s27-card.in { opacity: 1; transform: none; }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const view = $('#s27-view');\n      view.innerHTML = Array.from({ length: 8 }, (_, i) => `<div class=\"s27-card\">カード ${i + 1}：画面に入ると現れる\u003c/div>`).join('');\n      const io = new IntersectionObserver(es => es.forEach(e => e.target.classList.toggle('in', e.isIntersecting)), { root: view, threshold: 0.3 });\n      $$('.s27-card', view).forEach(c => io.observe(c));\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 28 ===================== -->\n<section class=\"demo\" id=\"n28\">\n  <h2><span class=\"no\">28\u003c/span>慣性 / モーメンタム <small>Inertia / Momentum\u003c/small>\u003c/h2>\n  <p class=\"what\">指を離した後も速度を保ちながら減速して止まる。「離した瞬間の速度」を記録し、毎フレーム速度に減衰係数（0.95など）を掛けて位置を進める。パン（02）にこれを足すと「気持ちよさ」が出る。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>方眼を素早くドラッグして離す。壁で跳ね返る。\u003c/p>\n  <div class=\"stage tall\" style=\"padding:0\">\n    <div id=\"s28-view\" class=\"s28-view grid-bg\"><div id=\"s28-ball\" class=\"box\" style=\"border-radius:50%;position:absolute;left:0;top:0\">投げる\u003c/div><span class=\"readout\" id=\"s28-out\" style=\"position:absolute;left:8px;top:8px\">v: 0\u003c/span>\u003c/div>\n  \u003c/div>\n  <style data-code>\n    .s28-view { position: relative; height: 260px; overflow: hidden; touch-action: none; user-select: none; }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const view = $('#s28-view'), ball = $('#s28-ball'), out = $('#s28-out');\n      let x = 100, y = 80, vx = 0, vy = 0, drag = null, raf = 0, last = null;\n      const paint = () => { ball.style.transform = `translate(${x}px, ${y}px)`; out.textContent = `v: ${Math.hypot(vx, vy).toFixed(2)} px/frame`; };\n      ball.addEventListener('pointerdown', e => { cancelAnimationFrame(raf); drag = { dx: e.clientX - x, dy: e.clientY - y }; last = { x: e.clientX, y: e.clientY, t: performance.now() }; ball.setPointerCapture(e.pointerId); });\n      ball.addEventListener('pointermove', e => {\n        if (!drag) return;\n        x = e.clientX - drag.dx; y = e.clientY - drag.dy;\n        const now = performance.now(), dt = Math.max(1, now - last.t);\n        vx = (e.clientX - last.x) / dt * 16; vy = (e.clientY - last.y) / dt * 16; // 1フレーム(16ms)あたりの速度\n        last = { x: e.clientX, y: e.clientY, t: now }; paint();\n      });\n      ball.addEventListener('pointerup', () => { drag = null; fling(); });\n      function fling() {\n        const W = view.clientWidth - 80, H = view.clientHeight - 80;\n        const step = () => {\n          vx *= 0.95; vy *= 0.95;                      // 減衰\n          x += vx; y += vy;\n          if (x < 0) { x = 0; vx = -vx * 0.6; } if (x > W) { x = W; vx = -vx * 0.6; } // 壁で反射\n          if (y < 0) { y = 0; vy = -vy * 0.6; } if (y > H) { y = H; vy = -vy * 0.6; }\n          paint();\n          if (Math.abs(vx) + Math.abs(vy) > 0.05) raf = requestAnimationFrame(step); // 十分遅くなったら止める\n        };\n        raf = requestAnimationFrame(step);\n      }\n      paint();\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 29 ===================== -->\n<section class=\"demo\" id=\"n29\">\n  <h2><span class=\"no\">29\u003c/span>スプリング物理 <small>Spring animation\u003c/small>\u003c/h2>\n  <p class=\"what\">目標との差に比例した力（バネ）と速度に比例した抵抗（減衰）で動かす。時間固定のトランジションと違い、途中で目標が変わっても不自然にならない。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>枠内をクリック。連続でクリックして途中変更の滑らかさを見る。剛性・減衰を変えてみる。\u003c/p>\n  <div class=\"stage tall\" style=\"padding:0\">\n    <div id=\"s29-view\" class=\"s29-view grid-bg\">\n      <div id=\"s29-ball\" class=\"box\" style=\"border-radius:50%;position:absolute;left:0;top:0;width:40px;height:40px\">\u003c/div>\n      <div class=\"row\" style=\"position:absolute;left:8px;top:8px;background:#fff;padding:4px 8px;border-radius:6px;font-size:12px\">\n        剛性 <input id=\"s29-k\" type=\"range\" min=\"0.02\" max=\"0.4\" step=\"0.01\" value=\"0.12\"> 減衰 <input id=\"s29-d\" type=\"range\" min=\"0.5\" max=\"0.98\" step=\"0.01\" value=\"0.8\">\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n  <style data-code>\n    .s29-view { position: relative; height: 260px; overflow: hidden; cursor: crosshair; }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const view = $('#s29-view'), ball = $('#s29-ball');\n      let x = 200, y = 120, tx = x, ty = y, vx = 0, vy = 0, raf = 0;\n      view.addEventListener('pointerdown', e => {\n        const r = view.getBoundingClientRect(); tx = e.clientX - r.left - 20; ty = e.clientY - r.top - 20;\n        if (!raf) tick();\n      });\n      function tick() {\n        const k = +$('#s29-k').value, d = +$('#s29-d').value;\n        vx = (vx + (tx - x) * k) * d; vy = (vy + (ty - y) * k) * d; // 力＝差×剛性、速度に減衰\n        x += vx; y += vy;\n        ball.style.transform = `translate(${x}px, ${y}px)`;\n        const settled = Math.abs(vx) + Math.abs(vy) < 0.01 && Math.abs(tx - x) + Math.abs(ty - y) < 0.1;\n        raf = settled ? 0 : requestAnimationFrame(tick);\n      }\n      ball.style.transform = `translate(${x}px, ${y}px)`;\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 30 ===================== -->\n<section class=\"demo\" id=\"n30\">\n  <h2><span class=\"no\">30\u003c/span>FLIPアニメーション <small>First-Last-Invert-Play\u003c/small>\u003c/h2>\n  <p class=\"what\">レイアウトが変わる（並べ替え・追加・削除）ときの定石。①変更前の位置を測る（First）②DOMを変える③変更後の位置を測る（Last）④差分だけ transform で元の位置に戻す（Invert）⑤transformを0へアニメーション（Play）。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>シャッフル。DOMは一瞬で並び替わっているが、見た目は滑らかに移動する。\u003c/p>\n  <div class=\"stage\">\n    <div class=\"row\"><button id=\"s30-shuffle\">シャッフル\u003c/button><button id=\"s30-sort\">並び順に戻す\u003c/button>\u003c/div>\n    <div id=\"s30-grid\" class=\"s30-grid\">\u003c/div>\n  \u003c/div>\n  <style data-code>\n    .s30-grid { display: flex; flex-wrap: wrap; gap: 8px; }\n    .s30-grid .box { width: 60px; height: 60px; }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const grid = $('#s30-grid');\n      grid.innerHTML = Array.from({ length: 10 }, (_, i) => `<div class=\"box\" data-i=\"${i}\">${i + 1}\u003c/div>`).join('');\n      function flip(mutate) {\n        const items = $$('.box', grid);\n        const first = new Map(items.map(el => [el, el.getBoundingClientRect()])); // First\n        mutate();                                                                  // DOM変更\n        items.forEach(el => {\n          const f = first.get(el), l = el.getBoundingClientRect();               // Last\n          const dx = f.left - l.left, dy = f.top - l.top;\n          if (!dx && !dy) return;\n          el.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'none' }], // Invert → Play\n            { duration: 350, easing: 'cubic-bezier(.2,.8,.2,1)' });\n        });\n      }\n      $('#s30-shuffle').onclick = () => flip(() => $$('.box', grid).sort(() => Math.random() - .5).forEach(el => grid.appendChild(el)));\n      $('#s30-sort').onclick = () => flip(() => $$('.box', grid).sort((a, b) => a.dataset.i - b.dataset.i).forEach(el => grid.appendChild(el)));\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 31 ===================== -->\n<section class=\"demo\" id=\"n31\">\n  <h2><span class=\"no\">31\u003c/span>ビュー遷移 <small>View Transitions API\u003c/small>\u003c/h2>\n  <p class=\"what\">DOM更新の「前」と「後」をブラウザがスナップショットし、自動でクロスフェードする。<code>view-transition-name\u003c/code> を付けた要素は位置・サイズの移動もアニメーションする。未対応ブラウザでは即時切替にフォールバック。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>「一覧」と「詳細」を切り替える。画像だけは同じ名前を持つので位置が繋がる。\u003c/p>\n  <div class=\"stage\" style=\"min-height:180px\">\n    <div class=\"row\"><button id=\"s31-toggle\">一覧 ⇄ 詳細\u003c/button><span class=\"readout\" id=\"s31-out\">\u003c/span>\u003c/div>\n    <div id=\"s31-root\">\u003c/div>\n  \u003c/div>\n  <style data-code>\n    .s31-thumb { width: 50px; height: 50px; background: var(--accent); border-radius: 8px; view-transition-name: hero; }\n    .s31-hero { width: 100%; height: 90px; background: var(--accent); border-radius: 8px; view-transition-name: hero; }\n    ::view-transition-old(root), ::view-transition-new(root) { animation-duration: .35s; }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const root = $('#s31-root'), out = $('#s31-out');\n      let detail = false;\n      const render = () => root.innerHTML = detail\n        ? `<div class=\"s31-hero\">\u003c/div><p style=\"font-size:13px\">詳細画面：受注 #1001 の内容\u003c/p>`\n        : `<div class=\"row\"><div class=\"s31-thumb\">\u003c/div><span style=\"font-size:13px\">受注 #1001（一覧の1行）\u003c/span>\u003c/div>`;\n      out.textContent = document.startViewTransition ? 'View Transitions: 対応' : 'View Transitions: 非対応 → 即時切替';\n      $('#s31-toggle').onclick = () => {\n        detail = !detail;\n        if (document.startViewTransition) document.startViewTransition(re
