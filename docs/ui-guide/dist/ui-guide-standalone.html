out\" style=\"position:absolute;right:8px;top:8px\">-\u003c/span>\u003c/div>\n  \u003c/div>\n  <style data-code>\n    .s69-view { position: relative; height: 240px; overflow: hidden; background: #0f172a; }\n    .s69-bg { position: absolute; inset: -50%; background: conic-gradient(from 0deg, #2563eb, #db2777, #d97706, #16a34a, #2563eb); animation: s69-spin 6s linear infinite; }\n    @keyframes s69-spin { to { transform: rotate(360deg); } }\n    .s69-glass { position: absolute; left: 30px; top: 40px; width: 300px; padding: 16px; border-radius: 12px; color: #fff; font-size: 13px;\n      background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.35); }\n    .s69-glass.blur { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const glass = $('#s69-glass'), out = $('#s69-out');\n      $('#s69-toggle').onchange = e => glass.classList.toggle('blur', e.target.checked);\n      let last = performance.now(), acc = 0, n = 0;                      // フレーム時間の移動平均\n      const tick = t => { acc += t - last; n++; last = t; if (n === 30) { out.textContent = `平均 ${(acc / n).toFixed(1)} ms/frame`; acc = n = 0; } requestAnimationFrame(tick); };\n      requestAnimationFrame(tick);\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== 70 ===================== -->\n<section class=\"demo\" id=\"n70\">\n  <h2><span class=\"no\">70\u003c/span>ダークモード切替のクロスフェード <small>Theme transition with View Transitions\u003c/small>\u003c/h2>\n  <p class=\"what\">テーマ切替時に全画面がパッと変わるのを、View Transitions で滑らかにする。標準は全体クロスフェード。<code>::view-transition-new(root)\u003c/code> に <code>clip-path: circle()\u003c/code> をアニメーションさせると「クリック位置から広がる」演出になる。テーマ自体は <code>data-theme\u003c/code> 属性と CSS 変数で。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>ボタンを押す（押した位置から広がる）。このデモ枠内だけがテーマ切替の対象。\u003c/p>\n  <div class=\"stage\" style=\"padding:0\">\n    <div id=\"s70-app\" class=\"s70-app\" data-theme=\"light\"><div class=\"row\" style=\"padding:10px\"><button id=\"s70-btn\">🌙 ダークに切替\u003c/button><span class=\"readout\" id=\"s70-out\">\u003c/span>\u003c/div><div class=\"s70-body\"><b>ダッシュボード\u003c/b><p>CSS変数を data-theme で切り替え、View Transitions で遷移をつなぐ。\u003c/p>\u003c/div>\u003c/div>\n  \u003c/div>\n  <style data-code>\n    .s70-app { --bg: #fff; --fg: #1d1f23; background: var(--bg); color: var(--fg); height: 170px; transition: none; }\n    .s70-app[data-theme=\"dark\"] { --bg: #0f172a; --fg: #e2e8f0; }\n    .s70-body { padding: 0 14px; font-size: 13px; }\n    ::view-transition-old(root) { animation: none; }                                     /* 旧画面は静止、新画面を円で広げる */\n    ::view-transition-new(root) { animation: s70-reveal .5s ease-out; clip-path: circle(150% at var(--x) var(--y)); }\n    @keyframes s70-reveal { from { clip-path: circle(0 at var(--x) var(--y)); } }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const app = $('#s70-app'), btn = $('#s70-btn'), out = $('#s70-out');\n      out.textContent = document.startViewTransition ? 'View Transitions: 対応' : '非対応 → 即時切替';\n      btn.onclick = e => {\n        document.documentElement.style.setProperty('--x', e.clientX + 'px'); document.documentElement.style.setProperty('--y', e.clientY + 'px'); // クリック位置を中心に\n        const swap = () => { const dark = app.dataset.theme !== 'dark'; app.dataset.theme = dark ? 'dark' : 'light'; btn.textContent = dark ? '☀ ライトに切替' : '🌙 ダークに切替'; };\n        document.startViewTransition ? document.startViewTransition(swap) : swap();\n      };\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c/main>\n\u003c/div>\n\u003c/body>\n\u003c/html>\n","docs/ui-guide/07-implementation-plan.md":"# 実装計画：レクチャー資料 → 部品ライブラリ → Mission Bridge への適用\n\n## 結論\n- デモ（01〜86）のうち、業務アプリの骨格になる10機能を **`ui-kit/`（依存なし・ESモジュール）に切り出し、テスト付きで実装済み**（Phase 0 完了）\n- Mission Bridge の画面ごとの適用（Phase 2）は、**実物の画面構成が不明なため未着手**。下の「確認事項」が埋まり次第、対応表を確定して着手する\n- 演出系（E層）は最後。採否は実機のフレーム時間で決める\n\n## 前提と不明点\n| 項目 | 状態 |\n|---|---|\n| Mission Bridge のリポジトリ | このセッションからは不可視。見えるのは `Reiri0135678/-`（本リポジトリ）と `Reiri0135678/arpoi-field-app` のみ。後者が該当するかは **不明** |\n| 画面一覧・遷移 | 不明 |\n| 既存の技術構成（素の JS か、フレームワーク使用か、TypeScript か） | 不明。ui-kit は素の ESM なので、どちらでも import できる |\n| kintone 連携の方式（REST 直叩き / 独自プロキシ / 認証方法） | 不明。ui-kit は通信層を持たず、`send` 関数を注入する設計にして依存を切っている |\n| 対象端末の性能（現場PC・タブレット） | 不明。E層の採否に影響 |\n\n## 方針\n1. **デモはデモのまま残す**（教材・仕様の確認用）。本番コードはデモをコピーせず `ui-kit/` を import する\n2. **通信・保存は注入**する。`ui-kit` は `fetch` も kintone も知らない。`send`, `storage`, `isOnline` を外から渡す\n3. **状態は1つのオブジェクトに集約**し、画面はそれを描画する（75・80・81 の作法）。Undo・永続化・同期がすべてこの前提で動く\n\n## Phase 0：部品ライブラリの切り出し（完了）\n| モジュール | 元デモ | 提供するもの | Mission Bridge での想定用途 |\n|---|---|---|---|\n| `drag.js` | 02, 49, 51, 52 | 状態機械付きドラッグ、ポインタキャプチャ、修飾キー制約 | 一覧の並べ替え、パネル境界、図面上の要素移動 |\n| `camera.js` | 43, 44, 45, 84 | 画面⇄ワールド座標変換、カーソル基準ズーム、パン取り付け | 図面ビュー、工程タイムライン、ガント |\n| `virtual-list.js` | 23, 71, 72 | 固定行高の仮想スクロール、ツリー平坦化 | kintone レコード数千〜数万件の一覧、BOM ツリー |\n| `undo.js` | 37 | スナップショット履歴 | 編集画面、レイアウト編集 |\n| `hotkeys.js` | 35, 36 | mod+キー登録、入力中の単独キー無視 | 保存・検索・新規作成のショートカット、コマンドパレット |\n| `search.js` | 74 | デバウンス、部分/あいまい一致、ハイライト、一括検索 | 一覧の絞り込み、コマンドパレット、レコード検索 |\n| `offline-queue.js` | 79, 57 | 操作キュー、復帰時の順送、失敗停止 | 現場端末からの kintone 更新（通信不安定時） |\n| `merge.js` | 78, 77 | 3方向マージ、単語差分 | revision 不一致時の競合解決、変更履歴表示 |\n| `store.js` | 75, 80, 81 | デバウンス付き永続化ストア | 下書き、レイアウト、ワークスペース状態 |\n| `sync.js` | 85 | BroadcastChannel + storage の2経路同期 | 複数ウィンドウ（一覧と詳細を別窓で開く等） |\n\n- 追加モジュール（第5弾）: `focus-trap` `position` `toast` `sortable` `split`。単一ファイル版 `dist/ui-kit.js`（`npm run build`）と実例 `example/index.html`\n- 実行: `npm test`（Playwright と Chromium が必要。26件）、`npm run test:docs`（教材ページの検証）\n- 副作用: `createDrag` は要素の `touch-action` を `none` にする。`store.js` / `offline-queue.js` は `localStorage` に書く。`sync.js` は `localStorage` に最終メッセージを残す\n\n## Phase 1：Mission Bridge 側の受け入れ準備（要リポジトリ）\n1. 現状の画面一覧と、各画面で「重い・使いにくい」と感じている操作を列挙する\n2. ビルド構成に ESM が通るか確認（Electron renderer なら通常そのまま import 可能）\n3. kintone 通信層を `send(job)` の形に揃える（`PUT /k/v1/record.json` を job として表現し、revision を持たせる）\n4. 状態オブジェクトの置き場所を決める（画面ごとの `store`）\n\n**受け入れ基準**：既存画面を壊さずに `ui-kit` を 1 つ import して動くこと（最初は `hotkeys.js` の Ctrl+S が最小）\n\n## Phase 2：画面 × 番号の対応表（仮。実物確認後に確定）\nkintone 連携の Electron 業務アプリで典型的な画面を仮置きしている。**Mission Bridge の実画面名に置き換えて確定する**。\n\n| 典型画面 | 最優先で入れる番号 | 次点 | 使う ui-kit |\n|---|---|---|---|\n| レコード一覧 | 71 大規模グリッド、11 選択、74 検索、21 ページング | 24 固定列、32 並べ替え、76 バッチ操作 | virtual-list, search, drag, hotkeys |\n| レコード詳細・編集 | 75 フォームの型、38 インライン編集、78 競合解決 | 37 Undo、77 差分表示、57 楽観的更新 | store, undo, merge, offline-queue |\n| ダッシュボード・監視 | 86 監視ボード、73 ピボット | 22 ローディング、16 トースト | search（集計は別）, store |\n| 図面・工程ビュー（あれば） | 43 無限キャンバス、47 スナップ、84 ガント | 45 ミニマップ、48 矩形選択 | camera, drag |\n| アプリ全体の骨格 | 33/80 ドッキング、81 ワークスペース永続化、35 ショートカット、36 コマンドパレット | 82 履歴、85 マルチウィンドウ、61/62 Electron | store, hotkeys, sync, drag |\n\n## Phase 3：演出（E層）\n- 入れる候補：66 マイクロインタラクション（保存ボタン）、64 スタガー（一覧の初回表示のみ）、65 スケルトンモーフ\n- 入れない候補：69 ぼかし（端末性能次第）、67 ジェスチャー物理（タッチ端末が主でなければ不要）\n- 必須：42 モーション低減の尊重。全アニメーションを `prefers-reduced-motion` で止められること\n\n## 検証方法\n- 部品単体：`ui-kit/test/run.mjs`\n- 画面適用後：対象端末で 54 のフレーム計測（rAF）と 69 の方法で実測。一覧は 71 の「DOM行数」を確認\n- 通信：78 の revision 不一致、79 のオフライン→復帰を実際の kintone で再現\n\n## 確認事項（これが埋まれば Phase 1 に入れる）\n1. Mission Bridge のリポジトリはどれか（`arpoi-field-app` か、別か）。別ならこのセッションに追加が必要\n2. 画面一覧（名称と役割）と、現状の不満点\n3. 技術構成（素の JS / フレームワーク / TypeScript、ビルドツール）\n4. kintone 連携の方式と認証\n5. 対象端末（OS・性能・タッチの有無）\n","docs/ui-guide/08-foundations.html":"<!DOCTYPE html>\n<html lang=\"ja\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>基礎知識：座標系・イベント・描画の土台\u003c/title>\n<link rel=\"stylesheet\" href=\"assets/guide.css\">\n\u003cscript src=\"assets/guide.js\">\u003c/script>\n<style>\n  .tierF { background: #475569; }\n  table.cmp { border-collapse: collapse; width: 100%; font-size: 13px; background: #fff; }\n  table.cmp th, table.cmp td { border: 1px solid var(--line); padding: 6px 10px; vertical-align: top; text-align: left; }\n  table.cmp th { background: #f1f5f9; white-space: nowrap; }\n  table.cmp td.k { font-weight: 600; white-space: nowrap; }\n\u003c/style>\n\u003c/head>\n<body>\n<header class=\"top\">\n  <h1>基礎知識 <span class=\"tier tierF\">全デモの土台\u003c/span>\u003c/h1>\n  <nav><a href=\"00-index.html\">⌂ 入口\u003c/a><a href=\"01-ui-operations-catalog.html\">カタログ\u003c/a><a href=\"02-basic.html\">A\u003c/a><a href=\"03-custom.html\">B\u003c/a><a href=\"04-pro.html\">C\u003c/a><a href=\"05-advanced.html\">D\u003c/a><a href=\"06-effects.html\">E\u003c/a><a href=\"09-exercises.html\">課題\u003c/a><a href=\"10-accessibility.html\">a11y\u003c/a><a href=\"11-quiz.html\">クイズ\u003c/a>\u003c/nav>\n\u003c/header>\n<div class=\"layout\">\n<aside class=\"toc\">\u003c/aside>\n<main>\n<div class=\"lead\">86項目のデモを読むときに必ず出てくる「前提」をまとめた。座標系、イベントの順序、描画の仕組み、そして混同しやすい用語の対比表。ここが曖昧だと、デモのコードは動いても「なぜそう書くか」が分からない。\u003c/div>\n\n\u003c!-- ===================== F1 ===================== -->\n<section class=\"demo\" id=\"f1\">\n  <h2><span class=\"no\">F1\u003c/span>座標系の違い <small>clientX / pageX / offsetX / screenX / getBoundingClientRect\u003c/small>\u003c/h2>\n  <p class=\"what\">マウス位置には5種類の「原点」がある。ドラッグやズームで一番よく使うのは <b>clientX と getBoundingClientRect().left の差\u003c/b>（＝要素内のローカル座標）。<code>offsetX\u003c/code> は「イベントが当たった要素」基準なので、子要素の上で値が飛ぶ。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>枠内でマウスを動かす。枠は少しスクロールしてある。青い子要素の上で offsetX がどう変わるか見る。\u003c/p>\n  <div class=\"stage\">\n    <div id=\"f1-view\" class=\"f1-view\"><div class=\"f1-inner\"><div class=\"box\" style=\"position:absolute;left:120px;top:60px\">子要素\u003c/div>\u003c/div>\u003c/div>\n    <table class=\"cmp\" id=\"f1-t\" style=\"margin-top:8px\">\u003c/table>\n  \u003c/div>\n  <style data-code>\n    .f1-view { height: 150px; overflow: auto; border: 1px solid #cbd5e1; background: #fff; }\n    .f1-inner { position: relative; width: 900px; height: 400px; background-image: linear-gradient(#f1f5f9 1px, transparent 1px), linear-gradient(90deg, #f1f5f9 1px, transparent 1px); background-size: 40px 40px; }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const view = $('#f1-view'), t = $('#f1-t');\n      view.scrollTop = 30; view.scrollLeft = 20;\n      const rows = [\n        ['clientX/Y', 'ブラウザの表示領域（ビューポート）左上が原点。スクロールしても要素は動くが原点は動かない', e => [e.clientX, e.clientY]],\n        ['pageX/Y', 'ページ全体の左上が原点。client + ページのスクロール量', e => [e.pageX, e.pageY]],\n        ['offsetX/Y', 'イベントが当たった要素（target）の左上が原点。子要素の上では値が飛ぶ → ドラッグには使わない', e => [e.offsetX, e.offsetY]],\n        ['screenX/Y', '画面（モニタ）左上が原点。UIではほぼ使わない', e => [e.screenX, e.screenY]],\n        ['client − rect', '要素の getBoundingClientRect() を引く → 要素内ローカル座標。ドラッグ・ズーム・キャンバスはこれ', e => { const r = view.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }],\n        ['+ scroll', 'ローカル座標 + 要素のスクロール量 → スクロール内容上の座標', e => { const r = view.getBoundingClientRect(); return [e.clientX - r.left + view.scrollLeft, e.clientY - r.top + view.scrollTop]; }],\n      ];\n      const render = e => t.innerHTML = '<tr><th>値\u003c/th><th>原点\u003c/th><th>x, y\u003c/th>\u003c/tr>' + rows.map(([k, d, f]) => { const [x, y] = e ? f(e).map(Math.round) : ['-', '-']; return `<tr><td class=\"k\">${k}\u003c/td><td>${d}\u003c/td><td>${x}, ${y}\u003c/td>\u003c/tr>`; }).join('');\n      view.addEventListener('pointermove', render); render(null);\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== F2 ===================== -->\n<section class=\"demo\" id=\"f2\">\n  <h2><span class=\"no\">F2\u003c/span>イベントの発火順と伝播 <small>capture → target → bubble / stopPropagation\u003c/small>\u003c/h2>\n  <p class=\"what\">イベントは「外側から内側へ（capture）→ 当たった要素（target）→ 内側から外側へ（bubble）」の順に流れる。<code>addEventListener(type, fn, true)\u003c/code> で capture 側に登録できる。<code>stopPropagation()\u003c/code> はそこから先へ流さない。<code>preventDefault()\u003c/code> は伝播ではなく「ブラウザの既定動作」を止める。この2つの違いが最重要。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>内側の箱をクリック。ログに順序が出る。チェックで「中央で stopPropagation」を有効にすると、外側の bubble が来なくなる。\u003c/p>\n  <div class=\"stage\">\n    <div class=\"row\"><label><input type=\"checkbox\" id=\"f2-stop\"> 中央（bubble）で stopPropagation()\u003c/label><button id=\"f2-clear\">ログ消去\u003c/button>\u003c/div>\n    <div class=\"row\" style=\"align-items:flex-start\">\n      <div id=\"f2-outer\" class=\"f2-box\">外側<div id=\"f2-mid\" class=\"f2-box\">中央<div id=\"f2-inner\" class=\"f2-box\" style=\"background:var(--accent);color:#fff\">内側\u003c/div>\u003c/div>\u003c/div>\n      <div class=\"log\" id=\"f2-log\" style=\"flex:1\">\u003c/div>\n    \u003c/div>\n  \u003c/div>\n  <style data-code>\n    .f2-box { padding: 14px; border: 1px solid #94a3b8; border-radius: 8px; background: #fff; font-size: 12px; user-select: none; cursor: pointer; }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const log = $('#f2-log');\n      ['outer', 'mid', 'inner'].forEach(id => {\n        const el = $('#f2-' + id);\n        el.addEventListener('click', e => logTo(log, `capture: ${id}`), true);                 // capture 側\n        el.addEventListener('click', e => { logTo(log, `bubble:  ${id}` + (e.target === el ? '（target）' : '')); if (id === 'mid' && $('#f2-stop').checked) { e.stopPropagation(); logTo(log, '  → stopPropagation: ここで止める'); } });\n      });\n      $('#f2-inner').addEventListener('click', () => logTo(log, '---'));\n      $('#f2-clear').onclick = () => log.textContent = '';\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== F3 ===================== -->\n<section class=\"demo\" id=\"f3\">\n  <h2><span class=\"no\">F3\u003c/span>transform と left/top の違い <small>レイアウト vs 合成\u003c/small>\u003c/h2>\n  <p class=\"what\">位置を動かす方法は2つあるが、コストが違う。<code>left/top\u003c/code> を変えるとブラウザは<b>レイアウト計算\u003c/b>（周囲の要素の位置も再計算）をやり直す。<code>transform\u003c/code> は最終的な<b>合成\u003c/b>段階で動かすだけで、レイアウトは走らない。だからデモは全部 transform で動かしている。<code>opacity\u003c/code> も同じく安い。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>300個の箱を同じ動きで走らせ、フレーム時間を比べる。差が小さい端末もあるが、要素数が増えるほど開く。\u003c/p>\n  <div class=\"stage\">\n    <div class=\"row\"><button id=\"f3-left\">left/top で動かす\u003c/button><button id=\"f3-tf\">transform で動かす\u003c/button><span class=\"readout\" id=\"f3-out\">-\u003c/span>\u003c/div>\n    <div id=\"f3-field\" class=\"f3-field\">\u003c/div>\n  \u003c/div>\n  <style data-code>\n    .f3-field { position: relative; height: 120px; overflow: hidden; background: #fff; border: 1px solid #cbd5e1; }\n    .f3-field i { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); left: 0; top: 0; }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const field = $('#f3-field'), out = $('#f3-out'), N = 300;\n      field.innerHTML = Array.from({ length: N }, () => '<i>\u003c/i>').join('');\n      const dots = $$('i', field);\n      const run = mode => {\n        const t0 = performance.now(); let frames = 0, worst = 0, last = t0;\n        const step = now => {\n          const p = (now - t0) / 1500; worst = Math.max(worst, now - last); last = now; frames++;\n          dots.forEach((d, i) => {\n            const x = p * 400 + (i % 30) * 6, y = 10 + Math.floor(i / 30) * 10 + Math.sin(p * 6 + i) * 4;\n            if (mode === 'left') { d.style.left = x + 'px'; d.style.top = y + 'px'; d.style.transform = ''; }\n            else { d.style.transform = `translate(${x}px, ${y}px)`; d.style.left = d.style.top = ''; }\n          });\n          if (p < 1) requestAnimationFrame(step); else out.textContent = `${mode}: 平均 ${((now - t0) / frames).toFixed(1)} ms/frame, 最悪 ${worst.toFixed(1)} ms`;\n        };\n        requestAnimationFrame(step);\n      };\n      $('#f3-left').onclick = () => run('left'); $('#f3-tf').onclick = () => run('transform');\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== F4 ===================== -->\n<section class=\"demo\" id=\"f4\">\n  <h2><span class=\"no\">F4\u003c/span>passive リスナーと touch-action <small>スクロールを止めたいのに止まらない理由\u003c/small>\u003c/h2>\n  <p class=\"what\">ブラウザは <code>wheel\u003c/code> / <code>touchmove\u003c/code> を「既定で passive（preventDefault が効かない）」として扱うことがある。自前でズームやパンをするなら <code>{ passive: false }\u003c/code> を明示する。タッチでは加えて CSS の <code>touch-action\u003c/code> で「どの方向をブラウザに任せるか」を宣言する方が確実。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>左右の枠でホイール。左は preventDefault が無視されてページがスクロールする。右は止まる。\u003c/p>\n  <div class=\"stage\">\n    <div class=\"row\" style=\"align-items:stretch\">\n      <div id=\"f4-a\" class=\"f4-box\">passive: true<br><small>preventDefault は無視される\u003c/small><br><span class=\"readout\" id=\"f4-a-out\">-\u003c/span>\u003c/div>\n      <div id=\"f4-b\" class=\"f4-box\">passive: false<br><small>ページは動かない\u003c/small><br><span class=\"readout\" id=\"f4-b-out\">-\u003c/span>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n  <style data-code>\n    .f4-box { flex: 1; padding: 14px; background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; text-align: center; touch-action: none; }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      $('#f4-a').addEventListener('wheel', e => { e.preventDefault(); $('#f4-a-out').textContent = `defaultPrevented=${e.defaultPrevented}`; }, { passive: true });   // 効かない（コンソールに警告）\n      $('#f4-b').addEventListener('wheel', e => { e.preventDefault(); $('#f4-b-out').textContent = `defaultPrevented=${e.defaultPrevented}`; }, { passive: false });  // 効く\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== F5 ===================== -->\n<section class=\"demo\" id=\"f5\">\n  <h2><span class=\"no\">F5\u003c/span>動かし方の4手段 <small>transition / CSS animation / WAAPI / requestAnimationFrame\u003c/small>\u003c/h2>\n  <p class=\"what\">同じ「右に300px動かす」でも手段が4つある。使い分けの軸は「<b>誰が時間を管理するか\u003c/b>」と「<b>途中で介入したいか\u003c/b>」。迷ったら transition、JSで止めたり戻したりするなら WAAPI、毎フレーム値を計算するなら rAF。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>再生。4つが同じ動きをするのを確認し、下の表で選び方を見る。\u003c/p>\n  <div class=\"stage\">\n    <div class=\"row\"><button id=\"f5-run\">再生\u003c/button>\u003c/div>\n    <div class=\"f5-lane\"><span>1. transition\u003c/span><div class=\"f5-ball f5-tr\">\u003c/div>\u003c/div>\n    <div class=\"f5-lane\"><span>2. CSS animation\u003c/span><div class=\"f5-ball f5-an\">\u003c/div>\u003c/div>\n    <div class=\"f5-lane\"><span>3. WAAPI\u003c/span><div class=\"f5-ball f5-wa\">\u003c/div>\u003c/div>\n    <div class=\"f5-lane\"><span>4. rAF\u003c/span><div class=\"f5-ball f5-raf\">\u003c/div>\u003c/div>\n    <table class=\"cmp\" style=\"margin-top:8px\">\n      <tr><th>手段\u003c/th><th>時間管理\u003c/th><th>向いている場面\u003c/th><th>途中介入\u003c/th><th>デモ\u003c/th>\u003c/tr>\n      <tr><td class=\"k\">transition\u003c/td><td>ブラウザ\u003c/td><td>状態AとBの間を補間する。ホバー、開閉、表示切替\u003c/td><td>弱い（クラスを外すと戻るだけ）\u003c/td><td><a href=\"02-basic.html#n14\">14\u003c/a>\u003c/td>\u003c/tr>\n      <tr><td class=\"k\">CSS animation\u003c/td><td>ブラウザ\u003c/td><td>繰り返し、複数キーフレーム、ローディング\u003c/td><td>弱い\u003c/td><td><a href=\"02-basic.html#n22\">22\u003c/a>, <a href=\"06-effects.html#n64\">64\u003c/a>\u003c/td>\u003c/tr>\n      <tr><td class=\"k\">WAAPI\u003c/td><td>ブラウザ（JSから制御）\u003c/td><td>一時停止・逆再生・速度変更・完了待ちが要る\u003c/td><td>強い\u003c/td><td><a href=\"04-pro.html#n53\">53\u003c/a>, <a href=\"03-custom.html#n30\">30\u003c/a>\u003c/td>\u003c/tr>\n      <tr><td class=\"k\">rAF\u003c/td><td>自分\u003c/td><td>物理（慣性・スプリング）、入力追従、Canvas\u003c/td><td>完全\u003c/td><td><a href=\"03-custom.html#n28\">28\u003c/a>, <a href=\"03-custom.html#n29\">29\u003c/a>\u003c/td>\u003c/tr>\n    \u003c/table>\n  \u003c/div>\n  <style data-code>\n    .f5-lane { position: relative; height: 28px; margin-bottom: 4px; background: #fff; border: 1px solid #e5e7eb; border-radius: 6px; }\n    .f5-lane span { position: absolute; left: 8px; top: 4px; font-size: 12px; color: var(--muted); }\n    .f5-ball { position: absolute; top: 3px; left: 4px; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); }\n    .f5-tr { transition: transform .8s ease-out; } .f5-tr.go { transform: translateX(300px); }\n    @keyframes f5-move { to { transform: translateX(300px); } } .f5-an.go { animation: f5-move .8s ease-out forwards; }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      $('#f5-run').onclick = () => {\n        const tr = $('.f5-tr'), an = $('.f5-an'), wa = $('.f5-wa'), raf = $('.f5-raf');\n        tr.classList.remove('go'); an.classList.remove('go'); void tr.offsetWidth;                       // リセット\n        tr.classList.add('go');                                                                          // 1. transition：クラス付与\n        an.classList.add('go');                                                                          // 2. CSS animation：クラス付与\n        wa.animate([{ transform: 'none' }, { transform: 'translateX(300px)' }], { duration: 800, easing: 'ease-out', fill: 'forwards' }); // 3. WAAPI\n        const t0 = performance.now(), ease = p => 1 - (1 - p) ** 3;                                    // 4. rAF：自分で補間\n        const step = now => { const p = Math.min(1, (now - t0) / 800); raf.style.transform = `translateX(${ease(p) * 300}px)`; if (p < 1) requestAnimationFrame(step); };\n        requestAnimationFrame(step);\n      };\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== F6 ===================== -->\n<section class=\"demo\" id=\"f6\">\n  <h2><span class=\"no\">F6\u003c/span>スロットルとデバウンス <small>Throttle / Debounce\u003c/small>\u003c/h2>\n  <p class=\"what\">高頻度イベント（scroll, pointermove, input, resize）の間引き方は2種類。<b>デバウンス\u003c/b>＝止まってから1回（検索、保存）。<b>スロットル\u003c/b>＝一定間隔で1回（スクロール連動、進捗表示）。描画目的なら 54 の rAF バッチが第3の選択肢。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>灰色の帯でマウスを動かす。3つのカウンタの増え方を比べる。\u003c/p>\n  <div class=\"stage\">\n    <div id=\"f6-area\" class=\"f6-area\">ここでマウスを動かす\u003c/div>\n    <div class=\"row\"><span class=\"readout\" id=\"f6-raw\">raw: 0\u003c/span><span class=\"readout\" id=\"f6-th\">throttle(100ms): 0\u003c/span><span class=\"readout\" id=\"f6-db\">debounce(300ms): 0\u003c/span>\u003c/div>\n  \u003c/div>\n  <style data-code>\n    .f6-area { height: 70px; background: #e2e8f0; border-radius: 8px; display: grid; place-items: center; color: var(--muted); margin-bottom: 8px; }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const throttle = (fn, ms) => { let last = 0; return (...a) => { const now = Date.now(); if (now - last >= ms) { last = now; fn(...a); } }; };\n      const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };\n      let raw = 0, th = 0, db = 0;\n      const onTh = throttle(() => $('#f6-th').textContent = `throttle(100ms): ${++th}`, 100);\n      const onDb = debounce(() => $('#f6-db').textContent = `debounce(300ms): ${++db}`, 300);\n      $('#f6-area').addEventListener('pointermove', () => { $('#f6-raw').textContent = `raw: ${++raw}`; onTh(); onDb(); });\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== F7 ===================== -->\n<section class=\"demo\" id=\"f7\">\n  <h2><span class=\"no\">F7\u003c/span>重なり順とスタッキングコンテキスト <small>z-index が効かない理由\u003c/small>\u003c/h2>\n  <p class=\"what\"><code>z-index\u003c/code> は「同じスタッキングコンテキスト内」でしか比較されない。親に <code>transform\u003c/code>・<code>opacity&lt;1\u003c/code>・<code>filter\u003c/code>・<code>position + z-index\u003c/code> などがあると、そこで新しいコンテキストができ、子の z-index がいくら大きくても親の外の要素を追い越せない。ツールチップやドロップダウンが「下に潜る」原因の9割はこれ。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>チェックで左の親に <code>transform\u003c/code> を付ける。子の z-index:999 が右の z-index:1 に負ける。\u003c/p>\n  <div class=\"stage\">\n    <div class=\"row\"><label><input type=\"checkbox\" id=\"f7-tf\"> 左の親に transform: translateZ(0) を付ける（新しいスタッキングコンテキスト）\u003c/label>\u003c/div>\n    <div class=\"row\" style=\"align-items:flex-start;position:relative;height:90px\">\n      <div id=\"f7-parent\" class=\"f7-parent\">親<div class=\"f7-child\">子 z-index:999\u003c/div>\u003c/div>\n      <div class=\"f7-other\">隣 z-index:1\u003c/div>\n    \u003c/div>\n  \u003c/div>\n  <style data-code>\n    .f7-parent { position: relative; width: 140px; height: 60px; background: #fff; border: 1px solid #94a3b8; font-size: 12px; padding: 4px; }\n    .f7-parent.ctx { transform: translateZ(0); }\n    .f7-child { position: absolute; left: 60px; top: 20px; width: 150px; height: 50px; background: var(--accent); color: #fff; z-index: 999; padding: 4px; }\n    .f7-other { position: absolute; left: 120px; top: 30px; width: 140px; height: 50px; background: #fde68a; z-index: 1; font-size: 12px; padding: 4px; }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => { $('#f7-tf').onchange = e => $('#f7-parent').classList.toggle('ctx', e.target.checked); })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== F9 ===================== -->\n<section class=\"demo\" id=\"f9\">\n  <h2><span class=\"no\">F9\u003c/span>レイアウトスラッシング <small>読み取りと書き込みを交互にすると遅くなる\u003c/small>\u003c/h2>\n  <p class=\"what\">DOM の「幅を読む（<code>offsetWidth\u003c/code>, <code>getBoundingClientRect\u003c/code>）」と「スタイルを書く」を1要素ずつ交互にやると、ブラウザは書くたびにレイアウトをやり直してから読む（強制同期レイアウト）。<b>先に全部読んでから、全部書く\u003c/b>だけで桁違いに速くなる。FLIP（30）の「First を全部測ってから DOM を変える」もこの原則。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>500要素で2つの方式を実行し、時間を比べる。\u003c/p>\n  <div class=\"stage\">\n    <div class=\"row\"><button id=\"f9-bad\">交互（読→書→読→書…）\u003c/button><button id=\"f9-good\">分離（全部読む→全部書く）\u003c/button><span class=\"readout\" id=\"f9-out\">-\u003c/span>\u003c/div>\n    <div id=\"f9-field\" class=\"f9-field\">\u003c/div>\n  \u003c/div>\n  <style data-code>\n    .f9-field { display: flex; flex-wrap: wrap; gap: 2px; background: #fff; border: 1px solid #cbd5e1; padding: 4px; max-height: 90px; overflow: hidden; }\n    .f9-field i { display: block; width: 12px; height: 12px; background: var(--accent); }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const field = $('#f9-field'), out = $('#f9-out');\n      field.innerHTML = Array.from({ length: 500 }, () => '<i>\u003c/i>').join('');\n      const items = $$('i', field);\n      $('#f9-bad').onclick = () => {\n        const t0 = performance.now();\n        items.forEach(el => { const w = el.offsetWidth; el.style.width = (w % 2 ? 12 : 13) + 'px'; });   // 読→書 を交互：毎回レイアウト\n        out.textContent = `交互: ${(performance.now() - t0).toFixed(1)} ms`;\n      };\n      $('#f9-good').onclick = () => {\n        const t0 = performance.now();\n        const widths = items.map(el => el.offsetWidth);                                              // 全部読む（レイアウト1回）\n        items.forEach((el, i) => el.style.width = (widths[i] % 2 ? 12 : 13) + 'px');                // 全部書く\n        out.textContent = `分離: ${(performance.now() - t0).toFixed(1)} ms`;\n      };\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== F10 ===================== -->\n<section class=\"demo\" id=\"f10\">\n  <h2><span class=\"no\">F10\u003c/span>計測の道具 <small>performance.now / PerformanceObserver(longtask) / rAF フレーム時間\u003c/small>\u003c/h2>\n  <p class=\"what\">「重い気がする」を数字にする3つの道具。①<code>performance.now()\u003c/code> で区間時間 ②<code>PerformanceObserver\u003c/code> の <code>longtask\u003c/code> で 50ms を超えてメインスレッドを塞いだ処理を検出 ③rAF の間隔でフレーム落ちを見る。開発者ツールの Performance タブが本命だが、実機で常時出しておくならこれ。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>「重い処理を実行」で意図的に 120ms ブロックする。longtask が検出され、フレーム時間が跳ねる。\u003c/p>\n  <div class=\"stage\">\n    <div class=\"row\"><button id=\"f10-heavy\">重い処理を実行（120ms ブロック）\u003c/button><span class=\"readout\" id=\"f10-frame\">frame: -\u003c/span><span class=\"readout\" id=\"f10-long\">longtask: 0 件\u003c/span>\u003c/div>\n    <div class=\"log\" id=\"f10-log\" style=\"height:80px\">\u003c/div>\n  \u003c/div>\n  \u003cscript data-code>\n    (() => {\n      const log = $('#f10-log'); let n = 0;\n      // ② longtask 監視（対応ブラウザのみ）\n      try { new PerformanceObserver(list => list.getEntries().forEach(e => { $('#f10-long').textContent = `longtask: ${++n} 件`; logTo(log, `longtask ${e.duration.toFixed(0)}ms @ ${e.startTime.toFixed(0)}`); })).observe({ type: 'longtask', buffered: true }); }\n      catch { logTo(log, 'longtask 非対応のブラウザ'); }\n      // ③ フレーム時間（最大値を1秒ごとに表示）\n      let last = performance.now(), worst = 0, t = last;\n      const tick = now => { worst = Math.max(worst, now - last); last = now; if (now - t > 1000) { $('#f10-frame').textContent = `frame 最悪: ${worst.toFixed(1)} ms`; worst = 0; t = now; } requestAnimationFrame(tick); };\n      requestAnimationFrame(tick);\n      // ① 区間計測\n      $('#f10-heavy').onclick = () => { const t0 = performance.now(); while (performance.now() - t0 < 120) {} logTo(log, `区間: ${(performance.now() - t0).toFixed(1)}ms（同期ブロック）`); };\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== F11 ===================== -->\n<section class=\"demo\" id=\"f11\">\n  <h2><span class=\"no\">F11\u003c/span>イベントループと描画のタイミング <small>同期処理 → microtask → 描画 → setTimeout\u003c/small>\u003c/h2>\n  <p class=\"what\">JS は「今の処理が全部終わってから」描画する。だから <b>クラスを外して即付け直しても、間に描画が無いので何も起きない\u003c/b>（14・64 の <code>void el.offsetWidth\u003c/code> はレイアウトを強制して「外した状態」を確定させる裏技）。順序は：同期コード → microtask（<code>Promise.then\u003c/code>, <code>await\u003c/code> の続き）→ <code>requestAnimationFrame\u003c/code> → 描画 → <code>setTimeout\u003c/code>。「描画してから次をやりたい」なら rAF を2回重ねる。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>「順序を見る」で各コールバックの実行順をログに出す。「再アニメーション」で、リフロー強制あり／なしの違いを見る。\u003c/p>\n  <div class=\"stage\">\n    <div class=\"row\"><button id=\"f11-order\">順序を見る\u003c/button><button id=\"f11-bad\">再アニメーション（リフローなし＝動かない）\u003c/button><button id=\"f11-good\">再アニメーション（void offsetWidth）\u003c/button><button id=\"f11-raf\">再アニメーション（rAF 2回）\u003c/button>\u003c/div>\n    <div class=\"row\"><div id=\"f11-ball\" class=\"f11-ball\">\u003c/div><div class=\"log\" id=\"f11-log\" style=\"flex:1;height:120px\">\u003c/div>\u003c/div>\n  \u003c/div>\n  <style data-code>\n    .f11-ball { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); }\n    .f11-ball.pop { animation: f11-pop .5s ease-out; }\n    @keyframes f11-pop { 30% { transform: scale(1.6); } }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const log = $('#f11-log'), ball = $('#f11-ball');\n      $('#f11-order').onclick = () => {\n        log.textContent = '';\n        setTimeout(() => logTo(log, '5. setTimeout(0)（描画の後）'), 0);\n        requestAnimationFrame(() => { logTo(log, '3. requestAnimationFrame（描画の直前）'); requestAnimationFrame(() => logTo(log, '4. rAF の中の rAF（次のフレーム＝描画済み）')); });\n        Promise.resolve().then(() => logTo(log, '2. Promise.then（microtask：同期処理の直後、描画の前）'));\n        logTo(log, '1. 同期コード');\n      };\n      $('#f11-bad').onclick = () => { ball.classList.remove('pop'); ball.classList.add('pop'); };                       // 間に描画が無い → 変化なし扱い\n      $('#f11-good').onclick = () => { ball.classList.remove('pop'); void ball.offsetWidth; ball.classList.add('pop'); }; // レイアウト強制で「外れた」を確定\n      $('#f11-raf').onclick = () => { ball.classList.remove('pop'); requestAnimationFrame(() => requestAnimationFrame(() => ball.classList.add('pop'))); }; // 1フレーム描かせてから付ける\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== F8 ===================== -->\n<section class=\"demo\" id=\"f8\">\n  <h2><span class=\"no\">F8\u003c/span>混同しやすい用語の対比表 <small>名前が似ている・動きが似ている\u003c/small>\u003c/h2>\n  <p class=\"what\">「何が違うのか」を一言で。判断の軸は<b>何が動くか／誰が時間を管理するか／どこが原点か\u003c/b>。\u003c/p>\n  <div class=\"stage\" style=\"padding:0;border:none;background:none\">\n  <table class=\"cmp\">\n    <tr><th style=\"width:190px\">対比\u003c/th><th>違い\u003c/th><th style=\"width:90px\">デモ\u003c/th>\u003c/tr>\n    <tr><td class=\"k\">スクロール vs パン\u003c/td><td>スクロールは<b>枠の中で中身がずれる\u003c/b>（境界あり、ブラウザ標準）。パンは<b>視点を動かす\u003c/b>（境界なし、自前）。地図はパン、表はスクロール\u003c/td><td><a href=\"02-basic.html#n01\">01\u003c/a> <a href=\"02-basic.html#n02\">02\u003c/a>\u003c/td>\u003c/tr>\n    <tr><td class=\"k\">ズーム vs scale()\u003c/td><td>ズームは「操作」、<code>scale()\u003c/code> はそれを実現する「手段」の一つ。ズームには「どこを中心に」が必ず付く\u003c/td><td><a href=\"02-basic.html#n03\">03\u003c/a> <a href=\"04-pro.html#n44\">44\u003c/a>\u003c/td>\u003c/tr>\n    <tr><td class=\"k\">トランジション vs アニメーション\u003c/td><td>トランジションは<b>状態変化の間を補間\u003c/b>（開始と終了の2点）。アニメーションは<b>キーフレームを再生\u003c/b>（複数点、繰り返し可）\u003c/td><td><a href=\"02-basic.html#n14\">14\u003c/a> <a href=\"#f5\">F5\u003c/a>\u003c/td>\u003c/tr>\n    <tr><td class=\"k\">フェード vs 表示/非表示\u003c/td><td>フェードは opacity の補間で、<b>要素はそこに在る\u003c/b>（クリックできる、場所を取る）。display:none は存在ごと消える。組み合わせて使う\u003c/td><td><a href=\"02-basic.html#n12\">12\u003c/a>\u003c/td>\u003c/tr>\n    <tr><td class=\"k\">opacity vs visibility vs display\u003c/td><td>opacity:0 は見えないが操作できる／visibility:hidden は見えず操作不可だが場所は取る／display:none は場所も消える。アニメーションできるのは opacity だけ\u003c/td><td><a href=\"02-basic.html#n12\">12\u003c/a>\u003c/td>\u003c/tr>\n    <tr><td class=\"k\">ホバー vs フォーカス\u003c/td><td>ホバーはポインタが乗っている（タッチには無い）。フォーカスはキーボード入力の受け先（常に1つ）。情報をホバーだけに頼らない\u003c/td><td><a href=\"02-basic.html#n06\">06\u003c/a> <a href=\"02-basic.html#n07\">07\u003c/a>\u003c/td>\u003c/tr>\n    <tr><td class=\"k\">クリック vs pointerup\u003c/td><td>click は「同じ要素で down→up」が揃ったときの合成イベント。pointerup は指を離した瞬間。ドラッグ終了は pointerup で取る\u003c/td><td><a href=\"02-basic.html#n04\">04\u003c/a>\u003c/td>\u003c/tr>\n    <tr><td class=\"k\">ドラッグ vs スワイプ vs フリック\u003c/td><td>ドラッグは追従（離した位置が結果）。スワイプは方向を判定する操作。フリックは特に速いスワイプ（速度で判定）\u003c/td><td><a href=\"02-basic.html#n09\">09\u003c/a>\u003c/td>\u003c/tr>\n    <tr><td class=\"k\">慣性 vs スプリング\u003c/td><td>慣性は「離した速度を減衰させる」（止まる位置は成り行き）。スプリングは「目標に引き寄せる」（止まる位置が決まっている）\u003c/td><td><a href=\"03-custom.html#n28\">28\u003c/a> <a href=\"03-custom.html#n29\">29\u003c/a>\u003c/td>\u003c/tr>\n    <tr><td class=\"k\">モーダル vs ポップオーバー vs トースト\u003c/td><td>モーダルは背後を止めて返事を要求。ポップオーバーは要素に紐づく補足で、外側クリックで消える。トーストは通知で、勝手に消える\u003c/td><td><a href=\"02-basic.html#n15\">15\u003c/a> <a href=\"02-basic.html#n17\">17\u003c/a> <a href=\"02-basic.html#n16\">16\u003c/a>\u003c/td>\u003c/tr>\n    <tr><td class=\"k\">ツールチップ vs ポップオーバー\u003c/td><td>ツールチップはホバーで出る短い文字だけ。ポップオーバーはクリックで出て、中に操作（ボタン等）を持てる\u003c/td><td><a href=\"02-basic.html#n17\">17\u003c/a>\u003c/td>\u003c/tr>\n    <tr><td class=\"k\">ドロップダウン vs コンテキストメニュー\u003c/td><td>出し方の違い。ドロップダウンはボタン押下で下に出る。コンテキストメニューは右クリック位置に出る。中身は同じ\u003c/td><td><a href=\"02-basic.html#n20\">20\u003c/a> <a href=\"03-custom.html#n39\">39\u003c/a>\u003c/td>\u003c/tr>\n    <tr><td class=\"k\">アコーディオン vs タブ\u003c/td><td>アコーディオンは縦に積んで複数開ける。タブは同じ場所を排他で切り替える\u003c/td><td><a href=\"02-basic.html#n18\">18\u003c/a> <a href=\"02-basic.html#n19\">19\u003c/a>\u003c/td>\u003c/tr>\n    <tr><td class=\"k\">sticky vs fixed\u003c/td><td>fixed はビューポートに固定（親を無視）。sticky はスクロール親の中でだけ固定され、親が流れれば一緒に流れる。表の見出しは sticky\u003c/td><td><a href=\"03-custom.html#n24\">24\u003c/a>\u003c/td>\u003c/tr>\n    <tr><td class=\"k\">ページネーション vs 無限スクロール vs 仮想スクロール\u003c/td><td>前2つは「取得の分割」（サーバから少しずつ）。仮想スクロールは「描画の分割」（手元にある大量データのDOMを減らす）。併用できる\u003c/td><td><a href=\"02-basic.html#n21\">21\u003c/a> <a href=\"03-custom.html#n23\">23\u003c/a>\u003c/td>\u003c/tr>\n    <tr><td class=\"k\">スクロールスナップ vs スナップ（吸着）\u003c/td><td>前者はスクロール停止位置の吸着（CSS）。後者はドラッグ中の位置吸着（ガイド線、グリッド）。名前が同じだけ\u003c/td><td><a href=\"03-custom.html#n25\">25\u003c/a> <a href=\"04-pro.html#n47\">47\u003c/a>\u003c/td>\u003c/tr>\n    <tr><td class=\"k\">microtask vs rAF vs setTimeout\u003c/td><td>Promise.then は同期処理の直後（描画前）。rAF は描画の直前。setTimeout は描画の後。「描画してから」は rAF を2回\u003c/td><td><a href=\"#f11\">F11\u003c/a>\u003c/td>\u003c/tr>\n    <tr><td class=\"k\">スロットル vs デバウンス\u003c/td><td>スロットルは一定間隔で必ず1回。デバウンスは止まってから1回。描画は rAF バッチ\u003c/td><td><a href=\"#f6\">F6\u003c/a> <a href=\"04-pro.html#n54\">54\u003c/a>\u003c/td>\u003c/tr>\n    <tr><td class=\"k\">preventDefault vs stopPropagation\u003c/td><td>前者はブラウザの既定動作（スクロール、リンク遷移、右クリックメニュー）を止める。後者はイベントの伝播を止める。無関係\u003c/td><td><a href=\"#f2\">F2\u003c/a> <a href=\"#f4\">F4\u003c/a>\u003c/td>\u003c/tr>\n    <tr><td class=\"k\">FLIP vs View Transitions\u003c/td><td>FLIP は自分で before/after を測って transform で誤魔化す。View Transitions はブラウザがスナップショットして同じことを自動でやる。対応ブラウザなら後者が楽\u003c/td><td><a href=\"03-custom.html#n30\">30\u003c/a> <a href=\"03-custom.html#n31\">31\u003c/a>\u003c/td>\u003c/tr>\n    <tr><td class=\"k\">楽観的更新 vs 楽観ロック\u003c/td><td>楽観的更新は「先に画面を変えて、失敗したら戻す」（体感）。楽観ロックは「revision で競合を検知する」（整合性）。名前が似ているだけで別物\u003c/td><td><a href=\"04-pro.html#n57\">57\u003c/a> <a href=\"05-advanced.html#n78\">78\u003c/a>\u003c/td>\u003c/tr>\n  \u003c/table>\n  \u003c/div>\n\u003c/section>\n\n\u003c/main>\n\u003c/div>\n\u003c/body>\n\u003c/html>\n","docs/ui-guide/09-exercises.html":"<!DOCTYPE html>\n<html lang=\"ja\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>練習課題（12問）\u003c/title>\n<link rel=\"stylesheet\" href=\"assets/guide.css\">\n<style>\n  .tierF { background: #475569; }\n  main.single { max-width: 960px; margin: 0 auto; padding: 24px; }\n  .ex { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; margin-bottom: 14px; }\n  .ex h2 { margin: 0 0 6px; font-size: 16px; } .ex h2 .lv { font-size: 11px; color: #fff; padding: 1px 7px; border-radius: 4px; margin-left: 8px; vertical-align: middle; }\n  .lv1 { background: var(--tierA); } .lv2 { background: var(--tierB); } .lv3 { background: var(--tierC); }\n  .ex .goal { font-size: 14px; margin: 0 0 6px; } .ex .base { font-size: 13px; color: var(--muted); margin: 0 0 6px; }\n  .ex ul { font-size: 13px; margin: 4px 0 8px; padding-left: 20px; }\n  details { margin-top: 6px; } details summary { cursor: pointer; font-size: 13px; color: var(--muted); }\n  details pre { background: var(--code); color: #e2e8f0; padding: 10px 12px; border-radius: 8px; font-size: 12px; overflow: auto; margin: 6px 0 0; }\n  .pg { font-size: 12px; margin-left: 4px; }\n  .how { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; font-size: 13.5px; margin-bottom: 18px; }\n\u003c/style>\n\u003c/head>\n<body>\n<header class=\"top\">\n  <h1>練習課題 <span class=\"tier tierF\">12問\u003c/span>\u003c/h1>\n  <nav><a href=\"00-index.html\">⌂ 入口\u003c/a><a href=\"08-foundations.html\">基礎\u003c/a><a href=\"01-ui-operations-catalog.html\">カタログ\u003c/a><a href=\"02-basic.html\">A\u003c/a><a href=\"03-custom.html\">B\u003c/a><a href=\"04-pro.html\">C\u003c/a><a href=\"05-advanced.html\">D\u003c/a><a href=\"06-effects.html\">E\u003c/a>\u003c/nav>\n\u003c/header>\n<main class=\"single\">\n  <div class=\"how\"><b>やり方：\u003c/b>対象デモのページを開き、ブラウザの開発者ツール（F12）→ Sources または Elements で該当の <code>&lt;script data-code&gt;\u003c/code> / <code>&lt;style data-code&gt;\u003c/code> を書き換える。あるいはHTMLファイルをコピーして編集する。解答例は1つの書き方であり、仕様を満たせば正解。難易度：<span class=\"lv lv1\" style=\"color:#fff;padding:1px 7px;border-radius:4px;font-size:11px\">1\u003c/span> 1行〜数行、<span class=\"lv lv2\" style=\"color:#fff;padding:1px 7px;border-radius:4px;font-size:11px\">2\u003c/span> ロジックの追加、<span class=\"lv lv3\" style=\"color:#fff;padding:1px 7px;border-radius:4px;font-size:11px\">3\u003c/span> 複数デモの合成。\u003c/div>\n\n  <div class=\"ex\"><h2>課題1：パンに範囲制限を付ける<span class=\"lv lv1\">1\u003c/span>\u003c/h2>\n    <p class=\"goal\">02 パン で、ワールドが枠の外に完全に出てしまわないよう、tx/ty を ±300px に制限する。\u003c/p>\n    <p class=\"base\">対象：<a href=\"02-basic.html#n02\">02\u003c/a> <a class=\"pg\" href=\"14-playground.html#n02\">▶ プレイグラウンドで開く\u003c/a>　ヒント：pointermove で tx, ty を計算した直後に <code>Math.min/Math.max\u003c/code> で挟む。\u003c/p>\n    <details><summary>解答例\u003c/summary><pre>tx = Math.max(-300, Math.min(300, e.clientX - dragging.x));\nty = Math.max(-300, Math.min(300, e.clientY - dragging.y));\u003c/pre>\u003c/details>\u003c/div>\n\n  <div class=\"ex\"><h2>課題2：ズームの倍率を段階にする<span class=\"lv lv1\">1\u003c/span>\u003c/h2>\n    <p class=\"goal\">03 ズーム で、ホイール1回ごとに 25%・50%・100%・200%・400% の5段階だけを行き来するようにする。\u003c/p>\n    <p class=\"base\">対象：<a href=\"02-basic.html#n03\">03\u003c/a> <a class=\"pg\" href=\"14-playground.html#n03\">▶ プレイグラウンドで開く\u003c/a>　ヒント：倍率の配列と現在のインデックスを持ち、deltaY の符号でインデックスを進める。\u003c/p>\n    <details><summary>解答例\u003c/summary><pre>const STEPS = [0.25, 0.5, 1, 2, 4]; let idx = 2;\nview.addEventListener('wheel', e => {\n  e.preventDefault();\n  idx = Math.max(0, Math.min(STEPS.length - 1, idx + (e.deltaY &lt; 0 ? 1 : -1)));\n  scale = STEPS[idx]; apply();\n}, { passive: false });\u003c/pre>\u003c/details>\u003c/div>\n\n  <div class=\"ex\"><h2>課題3：トーストを最大3件に制限する<span class=\"lv lv1\">1\u003c/span>\u003c/h2>\n    <p class=\"goal\">16 トースト で、4件目が来たら一番古いものを即座に消す。\u003c/p>\n    <p class=\"base\">対象：<a href=\"02-basic.html#n16\">16\u003c/a> <a class=\"pg\" href=\"14-playground.html#n16\">▶ プレイグラウンドで開く\u003c/a>　ヒント：追加前に <code>host.children.length\u003c/code> を見る。\u003c/p>\n    <details><summary>解答例\u003c/summary><pre>function toast(msg, opts = {}) {\n  while (host.children.length >= 3) host.firstElementChild.remove();\n  // …以下同じ\n}\u003c/pre>\u003c/details>\u003c/div>\n\n  <div class=\"ex\"><h2>課題4：長押しでコンテキストメニューを出す<span class=\"lv lv2\">2\u003c/span>\u003c/h2>\n    <p class=\"goal\">39 コンテキストメニュー を、タッチ端末向けに「500ms の長押し」でも開けるようにする（05 の長押し判定を合成）。\u003c/p>\n    <p class=\"base\">対象：<a href=\"03-custom.html#n39\">39\u003c/a> <a class=\"pg\" href=\"14-playground.html#n39\">▶ プレイグラウンドで開く\u003c/a> ＋ <a href=\"02-basic.html#n05\">05\u003c/a>　ヒント：pointerdown でタイマー開始、pointermove/up でキャンセル。発火時は contextmenu と同じ位置決め関数を呼ぶ。位置決めを関数に切り出すのが先。\u003c/p>\n    <details><summary>解答例\u003c/summary><pre>const openAt = (clientX, clientY) => { /* 39 の contextmenu ハンドラの中身をここへ */ };\narea.addEventListener('contextmenu', e => { e.preventDefault(); openAt(e.clientX, e.clientY); });\nlet t = null;\narea.addEventListener('pointerdown', e => { t = setTimeout(() => openAt(e.clientX, e.clientY), 500); });\n['pointerup', 'pointermove', 'pointercancel'].forEach(ev => area.addEventListener(ev, () => clearTimeout(t)));\u003c/pre>\u003c/details>\u003c/div>\n\n  <div class=\"ex\"><h2>課題5：選択にキーボード操作を足す<span class=\"lv lv2\">2\u003c/span>\u003c/h2>\n    <p class=\"goal\">11 選択 で、↑↓ で選択を移動、Shift+↑↓ で範囲を伸ばせるようにする。\u003c/p>\n    <p class=\"base\">対象：<a href=\"02-basic.html#n11\">11\u003c/a> <a class=\"pg\" href=\"14-playground.html#n11\">▶ プレイグラウンドで開く\u003c/a> ＋ <a href=\"03-custom.html#n34\">34\u003c/a>　ヒント：list に <code>tabindex=\"0\"\u003c/code> を付けて keydown を受ける。「現在位置」を anchor とは別に持つ。\u003c/p>\n    <details><summary>解答例\u003c/summary><pre>list.tabIndex = 0; let cursor = 0;\nlist.addEventListener('keydown', e => {\n  if (e.key !== 'ArrowDown' &amp;&amp; e.key !== 'ArrowUp') return;\n  e.preventDefault();\n  cursor = Math.max(0, Math.min(items.length - 1, cursor + (e.key === 'ArrowDown' ? 1 : -1)));\n  if (e.shiftKey) { selected.clear(); for (let k = Math.min(anchor, cursor); k &lt;= Math.max(anchor, cursor); k++) selected.add(k); }\n  else { selected.clear(); selected.add(cursor); anchor = cursor; }\n  paint(); items[cursor].scrollIntoView({ block: 'nearest' });\n});\u003c/pre>\u003c/details>\u003c/div>\n\n  <div class=\"ex\"><h2>課題6：仮想スクロールの行高を可変にしない代わりに「行の選択」を保つ<span class=\"lv lv2\">2\u003c/span>\u003c/h2>\n    <p class=\"goal\">23 仮想スクロール で、行をクリックすると選択状態になり、スクロールして DOM が作り直されても選択が保たれるようにする。\u003c/p>\n    <p class=\"base\">対象：<a href=\"03-custom.html#n23\">23\u003c/a> <a class=\"pg\" href=\"14-playground.html#n23\">▶ プレイグラウンドで開く\u003c/a>　ヒント：選択は DOM ではなくデータ側（<code>Set\u003c/code> の行番号）に持ち、render で class を付け直す。DOM に状態を持たないのが仮想スクロールの原則。\u003c/p>\n    <details><summary>解答例\u003c/summary><pre>const selected = new Set();\nrows.addEventListener('click', e => { const i = +e.target.dataset.i; selected.has(i) ? selected.delete(i) : selected.add(i); render(); });\n// render 内：\nhtml += `&lt;div class=\"r ${selected.has(i) ? 'sel' : ''}\" data-i=\"${i}\"&gt;行 ${i + 1}&lt;/div&gt;`;\u003c/pre>\u003c/details>\u003c/div>\n\n  <div class=\"ex\"><h2>課題7：慣性パンにする<span class=\"lv lv2\">2\u003c/span>\u003c/h2>\n    <p class=\"goal\">02 パン に 28 慣性 を合成し、離した後も滑って止まるようにする（壁なし、減衰 0.92）。\u003c/p>\n    <p class=\"base\">対象：<a href=\"02-basic.html#n02\">02\u003c/a> <a class=\"pg\" href=\"14-playground.html#n02\">▶ プレイグラウンドで開く\u003c/a> ＋ <a href=\"03-custom.html#n28\">28\u003c/a>　ヒント：pointermove で直近の速度（px/ms）を記録。pointerup で rAF ループを開始し、毎フレーム tx += vx、vx *= 0.92。次の pointerdown でループを止める。\u003c/p>\n    <details><summary>解答例\u003c/summary><pre>let vx = 0, vy = 0, last = null, raf = 0;\nview.addEventListener('pointerdown', e => { cancelAnimationFrame(raf); dragging = {...}; last = { x: e.clientX, y: e.clientY, t: performance.now() }; });\nview.addEventListener('pointermove', e => { if (!dragging) return;\n  const now = performance.now(), dt = Math.max(1, now - last.t);\n  vx = (e.clientX - last.x) / dt * 16; vy = (e.clientY - last.y) / dt * 16; last = { x: e.clientX, y: e.clientY, t: now };\n  /* tx, ty 更新は元のまま */ });\nview.addEventListener('pointerup', () => { dragging = null;\n  const step = () => { tx += vx; ty += vy; vx *= 0.92; vy *= 0.92; world.style.transform = `translate(${tx}px, ${ty}px)`; if (Math.abs(vx) + Math.abs(vy) > 0.1) raf = requestAnimationFrame(step); };\n  raf = requestAnimationFrame(step); });\u003c/pre>\u003c/details>\u003c/div>\n\n  <div class=\"ex\"><h2>課題8：Undo をインライン編集に接続する<span class=\"lv lv2\">2\u003c/span>\u003c/h2>\n    <p class=\"goal\">38 インライン編集 の確定ごとに履歴を積み、Ctrl+Z で表の内容が戻るようにする（37 の方式）。\u003c/p>\n    <p class=\"base\">対象：<a href=\"03-custom.html#n38\">38\u003c/a> <a class=\"pg\" href=\"14-playground.html#n38\">▶ プレイグラウンドで開く\u003c/a> ＋ <a href=\"03-custom.html#n37\">37\u003c/a>　ヒント：状態＝セル文字列の2次元配列。確定時に commit、undo 時は配列から表を描き直す。<code>ui-kit/undo.js\u003c/code> の <code>createHistory\u003c/code> を使ってもよい。\u003c/p>\n    <details><summary>解答例\u003c/summary><pre>const cells = () => $$('.s38 td').map(td => td.textContent);\nlet past = [], state = cells();\nconst paint = () => $$('.s38 td').forEach((td, i) => td.textContent = state[i]);\n// finish(true) の直後に：\npast.push(state); state = cells();\ndocument.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) &amp;&amp; e.key === 'z' &amp;&amp; past.length) { e.preventDefault(); state = past.pop(); paint(); } });\u003c/pre>\u003c/details>\u003c/div>\n\n  <div class=\"ex\"><h2>課題9：矩形選択に「ワールド座標」を対応させる<span class=\"lv lv3\">3\u003c/span>\u003c/h2>\n    <p class=\"goal\">43 無限キャンバス の上で 48 矩形選択 を動かす。パン・ズームした状態でも、矩形に入ったノードだけ選ばれること。\u003c/p>\n    <p class=\"base\">対象：<a href=\"04-pro.html#n43\">43\u003c/a> <a class=\"pg\" href=\"14-playground.html#n43\">▶ プレイグラウンドで開く\u003c/a> ＋ <a href=\"04-pro.html#n48\">48\u003c/a>　ヒント：矩形の始点・終点を toWorld で<b>ワールド座標に変換してから\u003c/b>ノードのワールド座標と交差判定する。矩形の描画自体は画面座標のままでよい。空白ドラッグをパンにするか選択にするかは修飾キー（Shift）で分ける。\u003c/p>\n    <details><summary>解答例（要点）\u003c/summary><pre>// pointerdown: e.shiftKey なら選択モード、そうでなければパン\nconst a = toWorld(p.x, p.y);                       // 始点（ワールド）\n// pointermove: const b = toWorld(q.x, q.y);       // 終点（ワールド）\nconst rect = { left: Math.min(a.x, b.x), right: Math.max(a.x, b.x), top: Math.min(a.y, b.y), bottom: Math.max(a.y, b.y) };\nnodes.forEach(n => n.selected = !(n.x + n.w &lt; rect.left || n.x > rect.right || n.y + n.h &lt; rect.top || n.y > rect.bottom));\n// 画面上の帯は p, q（画面座標）で描く\u003c/pre>\u003c/details>\u003c/div>\n\n  <div class=\"ex\"><h2>課題10：バッチ操作に「中断」と「再開」を付ける<span class=\"lv lv3\">3\u003c/span>\u003c/h2>\n    <p class=\"goal\">76 バッチ操作 に、実行中の「中断」ボタンと、中断位置からの「再開」を追加する（40 の AbortController を合成）。\u003c/p>\n    <p class=\"base\">対象：<a href=\"05-advanced.html#n76\">76\u003c/a> <a class=\"pg\" href=\"14-playground.html#n76\">▶ プレイグラウンドで開く\u003c/a> ＋ <a href=\"03-custom.html#n40\">40\u003c/a>　ヒント：run に <code>signal\u003c/code> を渡し、チャンクごとに <code>signal.aborted\u003c/code> を見る。未処理の changes を残しておけば再開は同じ run を呼ぶだけ。\u003c/p>\n    <details><summary>解答例（要点）\u003c/summary><pre>let ctrl = null, remaining = [];\nasync function run(changes) { ctrl = new AbortController(); remaining = changes.slice();\n  while (remaining.length) { if (ctrl.signal.aborted) { res.innerHTML += `中断（残り ${remaining.length} 件）&lt;button id=\"resume\"&gt;再開&lt;/button&gt;`; $('#resume').onclick = () => run(remaining); return; }\n    const chunk = remaining.splice(0, CHUNK); await Promise.all(chunk.map(...)); }\n}\n$('#abort').onclick = () => ctrl?.abort();\u003c/pre>\u003c/details>\u003c/div>\n\n  <div class=\"ex\"><h2>課題11：ドッキングのタブに「閉じる」と「再表示」を付ける<span class=\"lv lv3\">3\u003c/span>\u003c/h2>\n    <p class=\"goal\">80 ドッキング で、タブの × でパネルを閉じ、ヘッダーのメニューから閉じたパネルを再表示できるようにする。レイアウト保存にも反映されること。\u003c/p>\n    <p class=\"base\">対象：<a href=\"05-advanced.html#n80\">80\u003c/a> <a class=\"pg\" href=\"14-playground.html#n80\">▶ プレイグラウンドで開く\u003c/a> ＋ <a href=\"02-basic.html#n20\">20\u003c/a>　ヒント：レイアウト JSON に <code>closed: []\u003c/code> を追加。閉じる＝ removeEverywhere して closed に push。再表示＝ closed から外して center に push。render は JSON から組み立てているので、JSON を正しく変えれば表示は追従する。\u003c/p>\n    <details><summary>解答例（要点）\u003c/summary><pre>// DEFAULT() に closed: [] を追加\n// タブ描画に &lt;i data-close=\"${p}\"&gt;×&lt;/i&gt; を追加し、pointerdown で：\nif (e.target.dataset.close) { const p = e.target.dataset.close; removeEverywhere(p); L.closed.push(p); render(); return; }\n// ヘッダーの &lt;select id=\"reopen\"&gt; を closed から生成し、change で：\nconst p = sel.value; L.closed = L.closed.filter(x => x !== p); L.zones.center.push(p); L.active.center = p; render();\u003c/pre>\u003c/details>\u003c/div>\n\n  <div class=\"ex\"><h2>課題12：オフラインキューを楽観的更新と競合解決につなぐ<span class=\"lv lv3\">3\u003c/span>\u003c/h2>\n    <p class=\"goal\">57 楽観的更新 の送信を 79 のキュー経由にし、送信時にサーバの revision が進んでいたら 78 の競合ダイアログを出す。\u003c/p>\n    <p class=\"base\">対象：<a href=\"04-pro.html#n57\">57\u003c/a> <a class=\"pg\" href=\"14-playground.html#n57\">▶ プレイグラウンドで開く\u003c/a> ＋ <a href=\"05-advanced.html#n79\">79\u003c/a> ＋ <a href=\"05-advanced.html#n78\">78\u003c/a>　ヒント：job に <code>{ id, baseRevision, patch }\u003c/code> を持たせる。send で revision 不一致なら例外ではなく「競合」として解決フローへ回し、解決後の値で job を作り直してキューの先頭に戻す。<code>ui-kit\u003c/code> の offline-queue + merge を組み合わせると短く書ける。\u003c/p>\n    <details><summary>解答例（要点）\u003c/summary><pre>import { createOfflineQueue, threeWayMerge } from '../../ui-kit/index.js';\nconst q = createOfflineQueue({ storageKey: 'ex12', send: async job => {\n  const server = await api.get(job.id);\n  if (server.revision !== job.baseRevision) {\n    const { merged, conflicts } = threeWayMerge(job.base, { ...job.base, ...job.patch }, server);\n    if (conflicts.length) { const choice = await askUser(conflicts); /* 78 のダイアログ */ Object.assign(merged, choice); }\n    return api.put(job.id, merged, server.revision);\n  }\n  return api.put(job.id, job.patch, job.baseRevision);\n}});\n// 57 の change ハンドラでは api を直接呼ばず q.push({ id, baseRevision, base, patch }) にする\u003c/pre>\u003c/details>\u003c/div>\n\u003c/main>\n\u003c/body>\n\u003c/html>\n","docs/ui-guide/10-accessibility.html":"<!DOCTYPE html>\n<html lang=\"ja\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>アクセシビリティ：キーボード・読み上げ・色・動き\u003c/title>\n<link rel=\"stylesheet\" href=\"assets/guide.css\">\n\u003cscript src=\"assets/guide.js\">\u003c/script>\n<style>\n  .tierF { background: #475569; }\n  table.cmp { border-collapse: collapse; width: 100%; font-size: 13px; background: #fff; }\n  table.cmp th, table.cmp td { border: 1px solid var(--line); padding: 6px 10px; vertical-align: top; text-align: left; }\n  table.cmp th { background: #f1f5f9; }\n  .chk li { margin-bottom: 4px; font-size: 13.5px; }\n\u003c/style>\n\u003c/head>\n<body>\n<header class=\"top\">\n  <h1>アクセシビリティ <span class=\"tier tierF\">全デモに共通\u003c/span>\u003c/h1>\n  <nav><a href=\"00-index.html\">⌂ 入口\u003c/a><a href=\"08-foundations.html\">基礎\u003c/a><a href=\"01-ui-operations-catalog.html\">カタログ\u003c/a><a href=\"09-exercises.html\">課題\u003c/a><a href=\"10-accessibility.html\">a11y\u003c/a><a href=\"11-quiz.html\">クイズ\u003c/a>\u003c/nav>\n\u003c/header>\n<div class=\"layout\">\n<aside class=\"toc\">\u003c/aside>\n<main>\n<div class=\"lead\">業務アプリでのアクセシビリティは「障害対応」だけでなく「マウスを持ち替えずに入力できる」「現場の暗い場所・老眼でも読める」「動きで酔わない」という<b>作業効率と安全\u003c/b>の話。ここでは自分で検査できる道具と、各デモがどう対応しているかをまとめる。\u003c/div>\n\n\u003c!-- ===================== A1 ===================== -->\n<section class=\"demo\" id=\"a1\">\n  <h2><span class=\"no\">A1\u003c/span>キーボードだけで操作できるか <small>フォーカス順の可視化\u003c/small>\u003c/h2>\n  <p class=\"what\">マウスなしで全機能に届くか。<kbd>Tab\u003c/kbd> の順番が見た目の順と一致しているか、フォーカスが見えるか、閉じ込められて抜けられない箇所がないか。下のボタンで、このページ内の「フォーカスできる要素」に番号を振って順路を可視化する。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>「フォーカス順を表示」→ 番号が見た目の順に並んでいるか確認。その後 <kbd>Tab\u003c/kbd> で実際に辿る。\u003c/p>\n  <div class=\"stage\">\n    <div class=\"row\"><button id=\"a1-show\">フォーカス順を表示\u003c/button><button id=\"a1-hide\">消す\u003c/button><span class=\"readout\" id=\"a1-out\">-\u003c/span>\u003c/div>\n    <div class=\"row\"><button>1つ目\u003c/button><a href=\"#a1\">リンク\u003c/a><input type=\"text\" placeholder=\"入力\"><div tabindex=\"0\" class=\"box\" style=\"width:auto;height:auto;padding:6px 10px\">tabindex=0 の div\u003c/div><div class=\"box\" style=\"width:auto;height:auto;padding:6px 10px;background:#94a3b8\">tabindex なし（届かない）\u003c/div><button tabindex=\"-1\">tabindex=-1（Tabで届かない）\u003c/button>\u003c/div>\n  \u003c/div>\n  <style data-code>\n    .a11y-badge { position: absolute; z-index: 999; background: #dc2626; color: #fff; font: 700 11px/1 system-ui; padding: 2px 5px; border-radius: 3px; pointer-events: none; }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const SEL = 'a[href], button, input, select, textarea, [tabindex]';\n      const focusable = () => $$(SEL).filter(el => !el.disabled && el.tabIndex >= 0 && el.getClientRects().length);\n      $('#a1-show').onclick = () => {\n        $$('.a11y-badge').forEach(b => b.remove());\n        const list = focusable();\n        list.forEach((el, i) => { const r = el.getBoundingClientRect(); const b = document.createElement('span'); b.className = 'a11y-badge'; b.textContent = i + 1; b.style.left = r.left + scrollX + 'px'; b.style.top = r.top + scrollY - 8 + 'px'; document.body.appendChild(b); });\n        $('#a1-out').textContent = `フォーカス可能: ${list.length} 個`;\n      };\n      $('#a1-hide').onclick = () => $$('.a11y-badge').forEach(b => b.remove());\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== A2 ===================== -->\n<section class=\"demo\" id=\"a2\">\n  <h2><span class=\"no\">A2\u003c/span>読み上げに何が伝わるか <small>アクセシブルネームと role\u003c/small>\u003c/h2>\n  <p class=\"what\">スクリーンリーダーは「役割（role）」と「名前（accessible name）」を読む。アイコンだけのボタンは名前が空になる。<code>aria-label\u003c/code> か視覚的に隠したテキストで名前を与える。下の検査は、ページ内のボタン・リンクで名前が空のものを列挙する。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>「名前のない操作要素を探す」。右の例は意図的に名前が無い。\u003c/p>\n  <div class=\"stage\">\n    <div class=\"row\"><button id=\"a2-scan\">名前のない操作要素を探す\u003c/button><span class=\"readout\" id=\"a2-out\">-\u003c/span>\u003c/div>\n    <div class=\"row\">\n      <button title=\"良い例: aria-label あり\" aria-label=\"削除\">🗑\u003c/button>\n      <button title=\"悪い例: 名前なし\">🗑\u003c/button>\n      <button title=\"良い例: 隠しテキスト\">🔍<span class=\"a2-sr\">検索\u003c/span>\u003c/button>\n      <a href=\"#a2\" title=\"悪い例: 名前なし\"><span style=\"display:inline-block;width:16px;height:16px;background:#94a3b8;border-radius:3px\">\u003c/span>\u003c/a>\n    \u003c/div>\n    <div class=\"log\" id=\"a2-log\" style=\"height:70px\">\u003c/div>\n  \u003c/div>\n  <style data-code>\n    /* 視覚的に隠すが読み上げには残す（display:none は読み上げも消える） */\n    .a2-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }\n  \u003c/style>\n  \u003cscript data-code>\n    (() => {\n      const name = el => (el.getAttribute('aria-label') || el.getAttribute('aria-labelledby') && document.getElementById(el.getAttribute('aria-labelledby'))?.textContent || el.textContent || el.getAttribute('title') || '').trim();\n      $('#a2-scan').onclick = () => {\n        const log = $('#a2-log'); log.textContent = '';\n        const bad = $$('button, a[href]').filter(el => !name(el).replace(/[\\u{1F300}-\\u{1FAFF}\\s]/gu, ''));\n        bad.forEach(el => logTo(log, `${el.tagName.toLowerCase()}: \"${el.outerHTML.slice(0, 60)}…\" → 名前なし`));\n        $('#a2-out').textContent = `名前のない要素: ${bad.length} 個（title はブラウザにより読まれないので不十分）`;\n      };\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== A3 ===================== -->\n<section class=\"demo\" id=\"a3\">\n  <h2><span class=\"no\">A3\u003c/span>コントラスト比 <small>WCAG 4.5:1（通常文字）/ 3:1（大きな文字・UI部品）\u003c/small>\u003c/h2>\n  <p class=\"what\">現場の照明や古いモニタでは、薄い灰色の文字は読めない。文字色と背景色から比率を計算し、基準を満たすか確認する。計算式は WCAG の相対輝度。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>色を変えて比率を見る。\u003c/p>\n  <div class=\"stage\">\n    <div class=\"row\">文字 <input type=\"color\" id=\"a3-fg\" value=\"#6b7280\"> 背景 <input type=\"color\" id=\"a3-bg\" value=\"#ffffff\"> <span class=\"readout\" id=\"a3-out\">\u003c/span>\u003c/div>\n    <div id=\"a3-sample\" style=\"padding:10px 14px;border-radius:6px;font-size:14px\">サンプル文字：受注 #1001 納期 2026-09-12\u003c/div>\n  \u003c/div>\n  \u003cscript data-code>\n    (() => {\n      const lum = hex => { const c = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255).map(v => v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; };\n      const ratio = (a, b) => { const [l1, l2] = [lum(a), lum(b)].sort((x, y) => y - x); return (l1 + 0.05) / (l2 + 0.05); };\n      const upd = () => { const fg = $('#a3-fg').value, bg = $('#a3-bg').value, r = ratio(fg, bg); Object.assign($('#a3-sample').style, { color: fg, background: bg }); $('#a3-out').textContent = `${r.toFixed(2)} : 1 → 通常文字 ${r >= 4.5 ? '合格' : '不合格'} / 大きな文字・UI ${r >= 3 ? '合格' : '不合格'}`; };\n      $('#a3-fg').oninput = $('#a3-bg').oninput = upd; upd();\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== A4 ===================== -->\n<section class=\"demo\" id=\"a4\">\n  <h2><span class=\"no\">A4\u003c/span>非同期結果の通知 <small>aria-live の polite / assertive\u003c/small>\u003c/h2>\n  <p class=\"what\">保存完了やエラーを画面の隅に出しても、読み上げユーザーには伝わらない。<code>aria-live\u003c/code> 領域にテキストを書くと自動で読み上げられる。<code>polite\u003c/code> は今の読み上げが終わってから、<code>assertive\u003c/code> は割り込む（エラー用）。領域は<b>最初から存在\u003c/b>させ、中身だけ変える。\u003c/p>\n  <p class=\"how\"><b>操作：\u003c/b>ボタンで通知。スクリーンリーダー（Windows: ナレーター Win+Ctrl+Enter、macOS: VoiceOver Cmd+F5）を起動して聞く。\u003c/p>\n  <div class=\"stage\">\n    <div class=\"row\"><button id=\"a4-ok\">保存成功（polite）\u003c/button><button id=\"a4-ng\">エラー（assertive）\u003c/button>\u003c/div>\n    <div class=\"readout\" id=\"a4-polite\" aria-live=\"polite\" role=\"status\">（status 領域）\u003c/div>\n    <div class=\"readout\" id=\"a4-assert\" aria-live=\"assertive\" role=\"alert\" style=\"margin-top:6px;color:#dc2626\">（alert 領域）\u003c/div>\n  \u003c/div>\n  \u003cscript data-code>\n    (() => {\n      let n = 0;\n      $('#a4-ok').onclick = () => $('#a4-polite').textContent = `レコード #${1000 + ++n} を保存しました`;\n      $('#a4-ng').onclick = () => $('#a4-assert').textContent = `保存に失敗しました（通信エラー）`;\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== A5 ===================== -->\n<section class=\"demo\" id=\"a5\">\n  <h2><span class=\"no\">A5\u003c/span>環境設定の尊重 <small>reduced-motion / contrast / color-scheme / forced-colors\u003c/small>\u003c/h2>\n  <p class=\"what\">OS の設定をメディアクエリで拾える。動きを減らす、コントラストを上げる、ダークモード、Windows のハイコントラストモード（<code>forced-colors\u003c/code>、色指定が無視される）。この環境の現在値を表示する。\u003c/p>\n  <div class=\"stage\"><table class=\"cmp\" id=\"a5-t\">\u003c/table>\u003c/div>\n  \u003cscript data-code>\n    (() => {\n      const Q = [['prefers-reduced-motion: reduce', '動きを減らす → アニメーションを短縮・省略（42）'], ['prefers-contrast: more', 'コントラストを上げる → 枠線・文字色を濃く'], ['prefers-color-scheme: dark', 'ダークモード → 配色を切替（70）'], ['forced-colors: active', 'ハイコントラストモード → 背景色で状態を表すUIは消える。枠線・アイコンで表す'], ['hover: hover', 'ホバー可能な入力装置（06）'], ['pointer: coarse', '粗いポインタ（指）→ 当たり判定を 44px 以上に']];\n      const render = () => $('#a5-t').innerHTML = '<tr><th>メディアクエリ\u003c/th><th>この環境\u003c/th><th>対応\u003c/th>\u003c/tr>' + Q.map(([q, d]) => `<tr><td><code>@media (${q})\u003c/code>\u003c/td><td>${matchMedia(`(${q})`).matches ? '<b>該当\u003c/b>' : '—'}\u003c/td><td>${d}\u003c/td>\u003c/tr>`).join('');\n      Q.forEach(([q]) => matchMedia(`(${q})`).addEventListener('change', render)); render();\n    })();\n  \u003c/script>\n\u003c/section>\n\n\u003c!-- ===================== A6 ===================== -->\n<section class=\"demo\" id=\"a6\">\n  <h2><span class=\"no\">A6\u003c/span>チェックリストと各デモの対応 <small>実装時に見る\u003c/small>\u003c/h2>\n  <div class=\"stage\" style=\"padding:0;border:none;background:none\">\n  <table class=\"cmp\">\n    <tr><th style=\"width:260px\">項目\u003c/th><th>やること\u003c/th><th style=\"width:120px\">関連デモ\u003c/th>\u003c/tr>\n    <tr><td>キーボードで全操作可能\u003c/td><td>ドラッグ操作には矢印キーの代替を用意（並べ替え、リサイズ、パン）。Tab順は見た目順\u003c/td><td><a href=\"03-custom.html#n34\">34\u003c/a> <a href=\"02-basic.html#n19\">19\u003c/a>\u003c/td>\u003c/tr>\n    <tr><td>フォーカスが見える\u003c/td><td><code>:focus-visible\u003c/code> で必ず可視化。<code>outline: none\u003c/code> だけの指定は禁止\u003c/td><td><a href=\"02-basic.html#n07\">07\u003c/a>\u003c/td>\u003c/tr>\n    <tr><td>モーダルの作法\u003c/td><td>開いたら中へフォーカス、背面は inert、Esc で閉じる、閉じたら元へ戻す\u003c/td><td><a href=\"02-basic.html#n15\">15\u003c/a> <a href=\"04-pro.html#n58\">58\u003c/a>\u003c/td>\u003c/tr>\n    <tr><td>ホバー依存を避ける\u003c/td><td>ホバーで出る情報はフォーカスやクリックでも出す（タッチ端末にホバーは無い）\u003c/td><td><a href=\"02-basic.html#n06\">06\u003c/a> <a href=\"02-basic.html#n17\">17\u003c/a>\u003c/td>\u003c/tr>\n    <tr><td>役割と状態を属性で表す\u003c/td><td><code>role\u003c/code>, <code>aria-selected\u003c/code>, <code>aria-expanded\u003c/code>, <code>aria-busy\u003c/code>, <code>aria-valuenow\u003c/code>。色や形だけで状態を表さない\u003c/td><td><a href=\"02-basic.html#n11\">11\u003c/a> <a href=\"02-basic.html#n18\">18\u003c/a> <a href=\"03-custom.html#n40\">40\u003c/a>\u003c/td>\u003c/tr>\n    <tr><td>非同期の結果を伝える\u003c/td><td><code>aria-live\u003c/code> 領域に書く。トーストも同様\u003c/td><td><a href=\"#a4\">A4\u003c/a> <a href=\"02-basic.html#n16\">16\u003c/a>\u003c/td>\u003c/tr>\n    <tr><td>動きを止められる\u003c/td><td><code>prefers-reduced-motion\u003c/code> で transition / animation を無効化。自動再生のパララックス等は特に\u003c/td><td><a href=\"03-custom.html#n42\">42\u003c/a>\u003c/td>\u003c/tr>\n    <tr><td>当たり判定の大きさ\u003c/td><td>タッチ対象は 44×44px 以上。細い境界（分割パネル）は見た目より広い判定にする\u003c/td><td><a href=\"03-custom.html#n33\">33\u003c/a>\u003c/td>\u003c/tr>\n    <tr><td>コントラスト\u003c/td><td>通常文字 4.5:1、大きな文字と UI 部品 3:1。薄い灰色の補足文が最も落ちやすい\u003c/td><td><a href=\"#a3\">A3\u003c/a>\u003c/td>\u003c/tr>\n    <tr><td>時間制限\u003c/td><td>トーストは読む時間を確保（ホバーで停止）。長い処理はキャンセル可\u003c/td><td><a href=\"02-basic.html#n16\">16\u003c/a> <a href=\"03-custom.html#n40\">40\u003c/a>\u003c/td>\u003c/tr>\n    <tr><td>エラーの伝え方\u003c/td><td>どの項目が、なぜ、どう直せばよいか。色だけで示さない。フォーカスをエラー項目へ\u003c/td><td><a href=\"05-advanced.html#n75\">75\u003c/a>\u003c/td>\u003c/tr>\n  \u003c/table>\n  \u003c/div>\n\u003c/section>\n\n\u003c/main>\n\u003c/div>\n\u003c/body>\n\u003c/html>\n","docs/ui-guide/11-quiz.html":"<!DOCTYPE html>\n<html lang=\"ja\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>名称当てクイズ\u003c/title>\n<link rel=\"stylesheet\" href=\"assets/guide.css\">\n\u003cscript src=\"assets/catalog-data.js\">\u003c/script>\n\u003cscript src=\"assets/demo-data.js\">\u003c/script>\n<style>\n  .tierF { background: #475569; }\n  main.single { max-width: 760px; margin: 0 auto; padding: 24px; }\n  .q { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; }\n  .q .desc { font-size: 15px; line-height: 1.7; margin: 0 0 14px; min-height: 3em; }\n  .q .live { width: 100%; height: 320px; border: 1px solid var(--line); border-radius: 8px; background: #fff; margin-bottom: 12px; }\n  .q .api { font-size: 12.5px; color: var(--muted); margin-bottom: 14px; }\n  .choices { display: grid; gap: 8px; }\n  .choice { text-align: left; padding: 10px 14px; font-size: 14px; border-radius: 8px; }\n  .choice.ok { background: #dcfce7; border-color: #16a34a; } .choice.ng { background: #fee2e2; border-color: #dc2626; }\n  .choice:disabled { cursor: default; }\n  .result { margin-top: 12px; font-size: 13.5px; }\n  .bar { height: 8px; background: #e5e7eb; border-radius: 4px; overflow: hidden; margin: 10px 0; } .bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }\n  .weak { font-size: 13px; } .weak li { margin-bottom: 2px; }\n\u003c/style>\n\u003c/head>\n<body>\n<header class=\"top\">\n  <h1>名称当てクイズ <span class=\"tier tierF\">説明 → 名称\u003c/span>\u003c/h1>\n  <nav><a href=\"00-index.html\">⌂ 入口\u003c/a><a href=\"08-foundations.html\">基礎\u003c/a><a href=\"01-ui-operations-catalog.html\">カタログ\u003c/a><a href=\"09-exercises.html\">課題\u003c/a><a href=\"10-accessibility.html\">a11y\u003c/a><a href=\"11-quiz.html\">クイズ\u003c/a>\u003c/nav>\n\u003c/header>\n<main class=\"single\">\n  <div class=\"lead\">「動作の説明」を読んで、その操作の<b>名称\u003c/b>を4択から選ぶ。間違えた項目はカタログとデモへのリンクが残るので、そこを読み直す。出題範囲は層で絞れる。\u003c/div>\n  <div class=\"row\">\n    <label><input type=\"checkbox\" class=\"tier-cb\" value=\"A\" checked> A\u003c/label>\n    <label><input type=\"checkbox\" class=\"tier-cb\" value=\"B\" checked> B\u003c/label>\n    <label><input type=\"checkbox\" class=\"tier-cb\" value=\"C\" checked> C\u003c/label>\n    <label><input type=\"checkbox\" class=\"tier-cb\" value=\"D\"> D\u003c/label>\n    <label><input type=\"checkbox\" class=\"tier-cb\" value=\"E\"> E\u003c/label>\n    <label>問題数 <select id=\"count\"><option>10\u003c/option><option selected>20\u003c/option><option>40\u003c/option>\u003c/select>\u003c/label>\n    <label><input type=\"checkbox\" id=\"mode-en\"> 英語名を答える\u003c/label>\n    <label title=\"説明文の代わりに、デモそのものを動かして名称を当てる（デモがある項目のみ出題）\"><input type=\"checkbox\" id=\"mode-live\"> 動きを見て当てる\u003c/label>\n    <button id=\"start\" class=\"primary\">開始\u003c/button>\n  \u003c/div>\n  <div class=\"bar\"><i id=\"prog\">\u003c/i>\u003c/div>\n  <div class=\"q\" id=\"q\" hidden>\n    <div class=\"readout\" id=\"meta\">\u003c/div>\n    <p class=\"desc\" id=\"desc\">\u003c/p>\n    <iframe id=\"live\" class=\"live\" hidden title=\"出題中のデモ\">\u003c/iframe>\n    <div class=\"api\" id=\"api\">\u003c/div>\n    <div class=\"choices\" id=\"choices\">\u003c/div>\n    <div class=\"result\" id=\"result\">\u003c/div>\n  \u003c/div>\n  <div id=\"summary\" hidden>\u003c/div>\n\u003c/main>\n\u003cscript>\n(() => {\n  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];\n  const strip = s => s.replace(/<[^>]+>/g, '');\n  let pool = [], qi = 0, score = 0, wrong = [], current = null;\n  const label = it => $('#mode-en').checked ? it.en : it.ja;\n  const shuffle = a => a.map(x => [Math.random(), x]).sort((p, q) => p[0] - q[0]).map(p => p[1]);\n  // 説明文から名称そのものを隠す（答えが書いてあることがあるため）\n  const mask = (desc, it) => { let d = desc; [it.ja, it.en].forEach(n => { n.split(/\\s*[\\/／(（]\\s*/)[0].split(/\\s+/).filter(w => w.length >= 2).forEach(w => { d = d.split(w).join('◯◯'); }); }); return d; };\n  const start = () => {\n    const tiers = $$('.tier-cb').filter(c => c.checked).map(c => c.value);\n    const live = $('#mode-live').checked, demoIds = new Set((window.DEMOS || []).map(d => d.id));\n    const all = ITEMS.map((it, i) => ({ ...it, n: itemNo(it, i) })).filter(it => tiers.includes(it.tier) && (!live || demoIds.has('n' + String(it.n).padStart(2, '0'))));\n    if (all.length < 4) { alert('層を1つ以上選んでください'); return; }\n    pool = shuffle(all).slice(0, +$('#count').value); qi = 0; score = 0; wrong = [];\n    $('#summary').hidden = true; $('#q').hidden = false; next(all);\n  };\n  const next = (all) => {\n    if (qi >= pool.length) return finish();\n    current = pool[qi];\n    const others = shuffle((all || ITEMS.map((it, i) => ({ ...it, n: itemNo(it, i) }))).filter(x => x.n !== current.n && x.tier === current.tier)).slice(0, 3);\n    const choices = shuffle([current, ...others]);\n    $('#meta').textContent = `第 ${qi + 1} / ${pool.length} 問　層 ${current.tier}`;\n    const live = $('#mode-live').checked, demo = live && (window.DEMOS || []).find(d => d.id === 'n' + String(current.n).padStart(2, '0'));\n    $('#desc').hidden = !!demo; $('#live').hidden = !demo; $('#api').hidden = !!demo;\n    if (demo) {                                        // デモを動かして「これは何という操作か」を問う（説明文は見せない）\n      $('#live').srcdoc = `<!DOCTYPE html><html lang=\"ja\"><head><meta charset=\"utf-8\"><link rel=\"stylesheet\" href=\"assets/guide.css\">\u003cscript src=\"assets/guide.js\"><\\/script><style>body{padding:12px;background:#f6f7f9}section.demo{margin:0}h2,.what,.how,details{display:none}<\\/style><style>${demo.css}<\\/style>\u003c/head><body><section class=\"demo\" id=\"${demo.id}\"><p class=\"how\" style=\"display:block\">${demo.how}\u003c/p>${demo.html}\u003c/section>\u003cscript>try{${demo.js}\\n}catch(e){}<\\/script>\u003c/body>\u003c/html>`;\n    } else {\n      $('#desc').textContent = mask(strip(current.desc), current);\n      $('#api').textContent = '実装手段：' + strip(current.api);\n    }\n    $('#result').innerHTML = '';\n    $('#choices').innerHTML = choices.map(c => `<button class=\"choice\" data-n=\"${c.n}\">${label(c)}\u003c/button>`).join('');\n    $('#prog').style.width = (qi / pool.length * 100) + '%';\n    $$('.choice').forEach(b => b.onclick = () => answer(+b.dataset.n, all));\n  };\n  const answer = (n, all) => {\n    const ok = n === current.n; if (ok) score++; else wrong.push(current);\n    $$('.choice').forEach(b => { b.disabled = true; if (+b.dataset.n === current.n) b.classList.add('ok'); else if (+b.dataset.n === n) b.classList.add('ng'); });\n    $('#result').innerHTML = `${ok ? '正解' : '不正解'}：<b>${String(current.n).padStart(2, '0')} ${current.ja}\u003c/b>（${current.en}）　<a href=\"01-ui-operations-catalog.html\">カタログ\u003c/a> / <a href=\"${TIER_FILE[current.tier]}#n${String(current.n).padStart(2, '0')}\">デモ\u003c/a>　<button id=\"nextBtn\" class=\"primary\">次へ\u003c/button>`;\n    $('#nextBtn').onclick = () => { qi++; next(all); }; $('#nextBtn').focus();\n  };\n  const finish = () => {\n    $('#q').hidden = true; $('#prog').style.width = '100%';\n    const s = $('#summary'); s.hidden = false;\n    s.innerHTML = `<div class=\"q\"><b>結果：${score} / ${pool.length}\u003c/b>` + (wrong.length ? `<p style=\"font-size:13px\">読み直す項目：\u003c/p><ul class=\"weak\">${wrong.map(w => `<li>${String(w.n).padStart(2, '0')} ${w.ja}（${w.en}）　<a href=\"${TIER_FILE[w.tier]}#n${String(w.n).padStart(2, '0')}\">デモへ\u003c/a>\u003c/li>`).join('')}\u003c/ul>` : '<p style=\"font-size:13px\">全問正解。\u003c/p>') + `<button id=\"again\">もう一度\u003c/button>\u003c/div>`;\n    $('#again').onclick = start;\n  };\n  $('#start').onclick = start;\n  document.addEventListener('keydown', e => { if (/^[1-4]$/.test(e.key) && !$('#q').hidden) $$('.choice')[+e.key - 1]?.click(); if (e.key === 'Enter' && $('#nextBtn')) $('#nextBtn').click(); });\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","docs/ui-guide/12-electron.html":"<!DOCTYPE html>\n<html lang=\"ja\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Electron 実装リファレンス\u003c/title>\n<link rel=\"stylesheet\" href=\"assets/guide.css\">\n<style>\n  .tierF { background: #475569; }\n  main.single { max-width: 960px; margin: 0 auto; padding: 24px; }\n  .ref { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; margin-bottom: 14px; }\n  .ref h2 { margin: 0 0 6px; font-size: 16px; } .ref p { font-size: 13.5px; margin: 0 0 8px; }\n  pre { background: var(--code); color: #e2e8f0; padding: 10px 12px; border-radius: 8px; font-size: 12px; overflow: auto; margin: 6px 0; line-height: 1.5; }\n  table.cmp { border-collapse: collapse; width: 100%; font-size: 13px; background: #fff; }\n  table.cmp th, table.cmp td { border: 1px solid var(--line); padding: 6px 10px; vertical-align: top; text-align: left; }\n  table.cmp th { background: #f1f5f9; }\n\u003c/style>\n\u003c/head>\n<body>\n<header class=\"top\">\n  <h1>Electron 実装リファレンス <span class=\"tier tierF\">UI操作との対応\u003c/span>\u003c/h1>\n  <nav><a href=\"00-index.html\">⌂ 入口\u003c/a><a href=\"01-ui-operations-catalog.html\">カタログ\u003c/a><a href=\"13-kintone.html\">kintone\u003c/a><a href=\"04-pro.html#n61\">61\u003c/a><a href=\"04-pro.html#n62\">62\u003c/a>\u003c/nav>\n\u003c/header>\n<main class=\"single\">\n  <div class=\"lead\">デモ 61・62 で触れた Electron 固有の部分を、業務アプリ（Mission Bridge 想定）で必要になる順にまとめる。<b>原則：renderer は普通のブラウザとして書き、OS・ファイル・通信の権限が要るものだけ main に置いて IPC で呼ぶ。\u003c/b>デモと ui-kit は renderer 側でそのまま動く。このページは参照用で、コードはこのページでは実行されない。\u003c/div>\n\n  <div class=\"ref\"><h2>0. 構成の原則（contextIsolation + preload）\u003c/h2>\n    <p>renderer から Node を直接触らせない。preload で必要な関数だけ <code>window.api\u003c/code> として公開し、renderer はそれを呼ぶ。これで UI コードはブラウザで動くものと同じになり、デモ・ui-kit がそのまま使える。\u003c/p>\n<pre>// main.js\nconst win = new BrowserWindow({ width: 1200, height: 800,\n  webPreferences: { preload: path.join(__dirname, 'preload.js'), contextIsolation: true, nodeIntegration: false, sandbox: true } });\n\n// preload.js\nconst { contextBridge, ipcRenderer } = require('electron');\ncontextBridge.exposeInMainWorld('api', {\n  kintone: (req) => ipcRenderer.invoke('kintone:request', req),         // 通信は main 経由（13 参照）\n  onMenu: (name, fn) => ipcRenderer.on('menu:' + name, () => fn()),     // 62\n  windowState: { get: () => ipcRenderer.invoke('win:getState') },\n});\n\n// renderer.js（普通のブラウザコード）\nconst records = await window.api.kintone({ method: 'GET', path: '/k/v1/records.json', params: { app: 1, query: 'limit 100' } });\u003c/pre>\u003c/div>\n\n  <div class=\"ref\"><h2>1. ウィンドウ状態の永続化（位置・サイズ・最大化）<small> ← 81 ワークスペース永続化の OS 側\u003c/small>\u003c/h2>\n    <p>閉じる前に <code>getBounds()\u003c/code> を保存し、起動時に復元する。ディスプレイ構成が変わっていると画面外に出るので、<code>screen\u003c/code> で表示範囲内か検証してから使う。\u003c/p>\n<pre>const { screen } = require('electron');\nconst saved = store.get('win');                                         // 自前の JSON 保存（electron-store 等でも可）\nconst fits = saved &amp;&amp; screen.getAllDisplays().some(d => {\n  const a = d.workArea; return saved.x >= a.x &amp;&amp; saved.y >= a.y &amp;&amp; saved.x + saved.width <= a.x + a.width &amp;&amp; saved.y + saved.height <= a.y + a.height; });\nconst win = new BrowserWindow({ ...(fits ? saved : { width: 1200, height: 800 }) });\nif (saved?.maximized) win.maximize();\nconst save = () => store.set('win', { ...win.getNormalBounds(), maximized: win.isMaximized() });\nwin.on('close', save); win.on('resize', debounce(save, 500)); win.on('move', debounce(save, 500));\u003c/pre>\u003c/div>\n\n  <div class=\"ref\"><h2>2. フレームレスウィンドウとタイトルバー <small>← 61\u003c/small>\u003c/h2>\n    <p>自前タイトルバーは <code>-webkit-app-region: drag\u003c/code>。Windows/Linux で OS の最小化・最大化・閉じるボタンだけ残したいなら <code>titleBarOverlay\u003c/code>。ダブルクリックで最大化は自前実装。\u003c/p>\n<pre>new BrowserWindow({ frame: false, titleBarStyle: 'hidden', titleBarOverlay: { color: '#0f172a', symbolColor: '#fff', height: 32 } });\n// renderer: .titlebar { -webkit-app-region: drag; height: 32px; padding-right: 140px; /* overlay のボタン分を空ける */ }\n//           .titlebar button, .titlebar input { -webkit-app-region: no-drag; }\n// preload: dblclick → ipcRenderer.send('win:toggleMaximize')\nipcMain.on('win:toggleMaximize', e => { const w = BrowserWindow.fromWebContents(e.sender); w.isMaximized() ? w.unmaximize() : w.maximize(); });\u003c/pre>\u003c/div>\n\n  <div class=\"ref\"><h2>3. メニュー・アクセラレータと画面内ショートカットの衝突 <small>← 62, 35\u003c/small>\u003c/h2>\n    <p>アプリメニューの <code>accelerator\u003c/code> は renderer の keydown より先に取られる。同じキーを両方に登録しない。方針：<b>アプリ全体の操作（新規、保存、終了）はメニュー側、画面内の操作（矢印移動、セル編集）は renderer 側\u003c/b>。<code>globalShortcut\u003c/code> はアプリが背面でも効くので、業務アプリでは基本使わない。\u003c/p>\n<pre>const template = [{ label: 'ファイル', submenu: [\n  { label: '新規', accelerator: 'CmdOrCtrl+N', click: (_, w) => w?.webContents.send('menu:new') },\n  { label: '保存', accelerator: 'CmdOrCtrl+S', click: (_, w) => w?.webContents.send('menu:save') },\n  { type: 'separator' }, { role: 'quit' } ] },\n  { label: '表示', submenu: [{ role: 'reload' }, { role: 'toggleDevTools' }, { type: 'separator' }, { role: 'resetZoom' }, { role: 'zoomIn' }, { role: 'zoomOut' }] }];\nMenu.setApplicationMenu(Menu.buildFromTemplate(template));\u003c/pre>\u003c/div>\n\n  <div class=\"ref\"><h2>4. IPC の型と失敗の扱い <small>← 57 楽観的更新, 79 オフライン\u003c/small>\u003c/h2>\n    <p><code>invoke/handle\u003c/code> は Promise を返すので、renderer 側は <code>fetch\u003c/code> と同じ感覚で <code>await\u003c/code> できる。main で throw した Error は renderer に届く（メッセージのみ）。チャンネル名は <code>'領域:動詞'\u003c/code> で統一し、一覧を1ファイルにまとめる。\u003c/p>\n<pre>// channels.js（main と preload で共有）\nmodule.exports = { KINTONE_REQUEST: 'kintone:request', WIN_GET_STATE: 'win:getState', FILE_OPEN: 'file:open' };\n// main\nipcMain.handle(CH.KINTONE_REQUEST, async (e, req) => { validate(req); return kintoneClient.request(req); }); // 入力は必ず検証\n// renderer\ntry { await window.api.kintone(req); } catch (err) { toast.show(err.message, { kind: 'error' }); /* 57: 巻き戻し */ }\u003c/pre>\u003c/div>\n\n  <div class=\"ref\"><h2>5. 複数ウィンドウ <small>← 85\u003c/small>\u003c/h2>\n    <p>同一アプリの複数 BrowserWindow は同じオリジンなので、renderer 同士は <code>BroadcastChannel\u003c/code>（ui-kit の <code>sync.js\u003c/code>）で同期できる。main が「真実の状態」を持つ設計なら、<code>BrowserWindow.getAllWindows()\u003c/code> に配信する（62 のコード）。ウィンドウごとに <code>webContents.id\u003c/code> を持つので、送信元を除外できる。\u003c/p>\u003c/div>\n\n  <div class=\"ref\"><h2>6. ファイルの受け渡し <small>← 59 ファイルドロップ\u003c/small>\u003c/h2>\n    <p>OS からのドロップは renderer の <code>drop\u003c/code> で受ける（59 と同じ）。パスが必要なら <code>webUtils.getPathForFile(file)\u003c/code>（preload 側）。逆にアプリからエクスプローラへドラッグして出すのは <code>webContents.startDrag\u003c/code>。保存ダイアログは main の <code>dialog\u003c/code>。\u003c/p>\n<pre>// preload\ncontextBridge.exposeInMainWorld('api', { pathOf: (file) => webUtils.getPathForFile(file), saveAs: (name, data) => ipcRenderer.invoke('file:saveAs', name, data) });\n// main\nipcMain.handle('file:saveAs', async (e, name, data) => { const { filePath } = await dialog.showSaveDialog({ defaultPath: name }); if (filePath) await fs.promises.writeFile(filePath, data); return filePath; });\u003c/pre>\u003c/div>\n\n  <div class=\"ref\"><h2>7. 認証情報の保存 <small>← 13 kintone\u003c/small>\u003c/h2>\n    <p>API トークンやパスワードを平文の JSON に置かない。<code>safeStorage\u003c/code> で OS のキーチェーンに紐づけて暗号化する。renderer には渡さず、main が通信時にだけ復号して使う。\u003c/p>\n<pre>const { safeStorage } = require('electron');\nconst enc = safeStorage.encryptString(token).toString('base64');     // 保存はこれ\nconst token = safeStorage.decryptString(Buffer.from(enc, 'base64'));   // 使うときだけ復号（main 内）\u003c/pre>\u003c/div>\n\n  <div class=\"ref\"><h2>8. 表示倍率・DPI <small>← 55 devicePixelRatio\u003c/small>\u003c/h2>\n    <p>Ctrl+ホイールの既定ズームは renderer の内容ごと拡大する。図面ビュー（43）で自前ズームをするなら、既定ズームと衝突しないよう <code>wheel\u003c/code> で <code>ctrlKey\u003c/code> 付きのものを <code>preventDefault\u003c/code> するか、<code>webContents.setVisualZoomLevelLimits(1, 1)\u003c/code> でピンチズームを止める。Canvas は <code>devicePixelRatio\u003c/code> を見て内部解像度を上げる（55）。\u003c/p>\u003c/div>\n\n  <div class=\"ref\"><h2>9. 二重起動・起動時間・開発者ツール\u003c/h2>\n<pre>if (!app.requestSingleInstanceLock()) app.quit();                      // 二重起動禁止。2つ目は既存ウィンドウを前面へ\napp.on('second-instance', () => { const w = BrowserWindow.getAllWindows()[0]; w?.focus(); });\nwin.once('ready-to-show', () => win.show());                            // 白い画面を見せない（show:false で作る）\nif (!app.isPackaged) win.webContents.openDevTools({ mode: 'detach' });\u003c/pre>\u003c/div>\n\n  <div class=\"ref\"><h2>10. チェックリスト\u003c/h2>\n    <table class=\"cmp\">\n      <tr><th style=\"width:280px\">項目\u003c/th><th>確認\u003c/th>\u003c/tr>\n      <tr><td>contextIsolation / sandbox / nodeIntegration:false\u003c/td><td>renderer から require できないこと\u003c/td>\u003c/tr>\n      <tr><td>IPC の入力検証\u003c/td><td>renderer から来る引数を main で必ず検証（パス・URL・app ID）\
