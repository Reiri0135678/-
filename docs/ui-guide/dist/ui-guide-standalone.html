rame(step); };\\n    requestAnimationFrame(step);\\n  };\\n})();\"},{\"page\":\"08-foundations.html\",\"pageTitle\":\"基礎知識：座標系・イベント・描画の土台\",\"id\":\"f6\",\"title\":\"F6スロットルとデバウンス Throttle / Debounce\",\"what\":\"高頻度イベント（scroll, pointermove, input, resize）の間引き方は2種類。デバウンス＝止まってから1回（検索、保存）。スロットル＝一定間隔で1回（スクロール連動、進捗表示）。描画目的なら 54 の rAF バッチが第3の選択肢。\",\"how\":\"操作：灰色の帯でマウスを動かす。3つのカウンタの増え方を比べる。\",\"html\":\"<div class=\\\"stage\\\">\\n    <div id=\\\"f6-area\\\" class=\\\"f6-area\\\">ここでマウスを動かす\u003c/div>\\n    <div class=\\\"row\\\"><span class=\\\"readout\\\" id=\\\"f6-raw\\\">raw: 0\u003c/span><span class=\\\"readout\\\" id=\\\"f6-th\\\">throttle(100ms): 0\u003c/span><span class=\\\"readout\\\" id=\\\"f6-db\\\">debounce(300ms): 0\u003c/span>\u003c/div>\\n  \u003c/div>\",\"css\":\".f6-area { height: 70px; background: #e2e8f0; border-radius: 8px; display: grid; place-items: center; color: var(--muted); margin-bottom: 8px; }\",\"js\":\"(() => {\\n  const throttle = (fn, ms) => { let last = 0; return (...a) => { const now = Date.now(); if (now - last >= ms) { last = now; fn(...a); } }; };\\n  const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };\\n  let raw = 0, th = 0, db = 0;\\n  const onTh = throttle(() => $('#f6-th').textContent = `throttle(100ms): ${++th}`, 100);\\n  const onDb = debounce(() => $('#f6-db').textContent = `debounce(300ms): ${++db}`, 300);\\n  $('#f6-area').addEventListener('pointermove', () => { $('#f6-raw').textContent = `raw: ${++raw}`; onTh(); onDb(); });\\n})();\"},{\"page\":\"08-foundations.html\",\"pageTitle\":\"基礎知識：座標系・イベント・描画の土台\",\"id\":\"f7\",\"title\":\"F7重なり順とスタッキングコンテキスト z-index が効かない理由\",\"what\":\"z-index は「同じスタッキングコンテキスト内」でしか比較されない。親に transform・opacity&lt;1・filter・position + z-index などがあると、そこで新しいコンテキストができ、子の z-index がいくら大きくても親の外の要素を追い越せない。ツールチップやドロップダウンが「下に潜る」原因の9割はこれ。\",\"how\":\"操作：チェックで左の親に transform を付ける。子の z-index:999 が右の z-index:1 に負ける。\",\"html\":\"<div class=\\\"stage\\\">\\n    <div class=\\\"row\\\"><label><input type=\\\"checkbox\\\" id=\\\"f7-tf\\\"> 左の親に transform: translateZ(0) を付ける（新しいスタッキングコンテキスト）\u003c/label>\u003c/div>\\n    <div class=\\\"row\\\" style=\\\"align-items:flex-start;position:relative;height:90px\\\">\\n      <div id=\\\"f7-parent\\\" class=\\\"f7-parent\\\">親<div class=\\\"f7-child\\\">子 z-index:999\u003c/div>\u003c/div>\\n      <div class=\\\"f7-other\\\">隣 z-index:1\u003c/div>\\n    \u003c/div>\\n  \u003c/div>\",\"css\":\".f7-parent { position: relative; width: 140px; height: 60px; background: #fff; border: 1px solid #94a3b8; font-size: 12px; padding: 4px; }\\n.f7-parent.ctx { transform: translateZ(0); }\\n.f7-child { position: absolute; left: 60px; top: 20px; width: 150px; height: 50px; background: var(--accent); color: #fff; z-index: 999; padding: 4px; }\\n.f7-other { position: absolute; left: 120px; top: 30px; width: 140px; height: 50px; background: #fde68a; z-index: 1; font-size: 12px; padding: 4px; }\",\"js\":\"(() => { $('#f7-tf').onchange = e => $('#f7-parent').classList.toggle('ctx', e.target.checked); })();\"},{\"page\":\"08-foundations.html\",\"pageTitle\":\"基礎知識：座標系・イベント・描画の土台\",\"id\":\"f9\",\"title\":\"F9レイアウトスラッシング 読み取りと書き込みを交互にすると遅くなる\",\"what\":\"DOM の「幅を読む（offsetWidth, getBoundingClientRect）」と「スタイルを書く」を1要素ずつ交互にやると、ブラウザは書くたびにレイアウトをやり直してから読む（強制同期レイアウト）。先に全部読んでから、全部書くだけで桁違いに速くなる。FLIP（30）の「First を全部測ってから DOM を変える」もこの原則。\",\"how\":\"操作：500要素で2つの方式を実行し、時間を比べる。\",\"html\":\"<div class=\\\"stage\\\">\\n    <div class=\\\"row\\\"><button id=\\\"f9-bad\\\">交互（読→書→読→書…）\u003c/button><button id=\\\"f9-good\\\">分離（全部読む→全部書く）\u003c/button><span class=\\\"readout\\\" id=\\\"f9-out\\\">-\u003c/span>\u003c/div>\\n    <div id=\\\"f9-field\\\" class=\\\"f9-field\\\">\u003c/div>\\n  \u003c/div>\",\"css\":\".f9-field { display: flex; flex-wrap: wrap; gap: 2px; background: #fff; border: 1px solid #cbd5e1; padding: 4px; max-height: 90px; overflow: hidden; }\\n.f9-field i { display: block; width: 12px; height: 12px; background: var(--accent); }\",\"js\":\"(() => {\\n  const field = $('#f9-field'), out = $('#f9-out');\\n  field.innerHTML = Array.from({ length: 500 }, () => '<i>\u003c/i>').join('');\\n  const items = $$('i', field);\\n  $('#f9-bad').onclick = () => {\\n    const t0 = performance.now();\\n    items.forEach(el => { const w = el.offsetWidth; el.style.width = (w % 2 ? 12 : 13) + 'px'; });   // 読→書 を交互：毎回レイアウト\\n    out.textContent = `交互: ${(performance.now() - t0).toFixed(1)} ms`;\\n  };\\n  $('#f9-good').onclick = () => {\\n    const t0 = performance.now();\\n    const widths = items.map(el => el.offsetWidth);                                              // 全部読む（レイアウト1回）\\n    items.forEach((el, i) => el.style.width = (widths[i] % 2 ? 12 : 13) + 'px');                // 全部書く\\n    out.textContent = `分離: ${(performance.now() - t0).toFixed(1)} ms`;\\n  };\\n})();\"},{\"page\":\"08-foundations.html\",\"pageTitle\":\"基礎知識：座標系・イベント・描画の土台\",\"id\":\"f10\",\"title\":\"F10計測の道具 performance.now / PerformanceObserver(longtask) / rAF フレーム時間\",\"what\":\"「重い気がする」を数字にする3つの道具。①performance.now() で区間時間 ②PerformanceObserver の longtask で 50ms を超えてメインスレッドを塞いだ処理を検出 ③rAF の間隔でフレーム落ちを見る。開発者ツールの Performance タブが本命だが、実機で常時出しておくならこれ。\",\"how\":\"操作：「重い処理を実行」で意図的に 120ms ブロックする。longtask が検出され、フレーム時間が跳ねる。\",\"html\":\"<div class=\\\"stage\\\">\\n    <div class=\\\"row\\\"><button id=\\\"f10-heavy\\\">重い処理を実行（120ms ブロック）\u003c/button><span class=\\\"readout\\\" id=\\\"f10-frame\\\">frame: -\u003c/span><span class=\\\"readout\\\" id=\\\"f10-long\\\">longtask: 0 件\u003c/span>\u003c/div>\\n    <div class=\\\"log\\\" id=\\\"f10-log\\\" style=\\\"height:80px\\\">\u003c/div>\\n  \u003c/div>\",\"css\":\"\",\"js\":\"(() => {\\n  const log = $('#f10-log'); let n = 0;\\n  // ② longtask 監視（対応ブラウザのみ）\\n  try { new PerformanceObserver(list => list.getEntries().forEach(e => { $('#f10-long').textContent = `longtask: ${++n} 件`; logTo(log, `longtask ${e.duration.toFixed(0)}ms @ ${e.startTime.toFixed(0)}`); })).observe({ type: 'longtask', buffered: true }); }\\n  catch { logTo(log, 'longtask 非対応のブラウザ'); }\\n  // ③ フレーム時間（最大値を1秒ごとに表示）\\n  let last = performance.now(), worst = 0, t = last;\\n  const tick = now => { worst = Math.max(worst, now - last); last = now; if (now - t > 1000) { $('#f10-frame').textContent = `frame 最悪: ${worst.toFixed(1)} ms`; worst = 0; t = now; } requestAnimationFrame(tick); };\\n  requestAnimationFrame(tick);\\n  // ① 区間計測\\n  $('#f10-heavy').onclick = () => { const t0 = performance.now(); while (performance.now() - t0 < 120) {} logTo(log, `区間: ${(performance.now() - t0).toFixed(1)}ms（同期ブロック）`); };\\n})();\"},{\"page\":\"08-foundations.html\",\"pageTitle\":\"基礎知識：座標系・イベント・描画の土台\",\"id\":\"f11\",\"title\":\"F11イベントループと描画のタイミング 同期処理 → microtask → 描画 → setTimeout\",\"what\":\"JS は「今の処理が全部終わってから」描画する。だから クラスを外して即付け直しても、間に描画が無いので何も起きない（14・64 の void el.offsetWidth はレイアウトを強制して「外した状態」を確定させる裏技）。順序は：同期コード → microtask（Promise.then, await の続き）→ requestAnimationFrame → 描画 → setTimeout。「描画してから次をやりたい」なら rAF を2回重ねる。\",\"how\":\"操作：「順序を見る」で各コールバックの実行順をログに出す。「再アニメーション」で、リフロー強制あり／なしの違いを見る。\",\"html\":\"<div class=\\\"stage\\\">\\n    <div class=\\\"row\\\"><button id=\\\"f11-order\\\">順序を見る\u003c/button><button id=\\\"f11-bad\\\">再アニメーション（リフローなし＝動かない）\u003c/button><button id=\\\"f11-good\\\">再アニメーション（void offsetWidth）\u003c/button><button id=\\\"f11-raf\\\">再アニメーション（rAF 2回）\u003c/button>\u003c/div>\\n    <div class=\\\"row\\\"><div id=\\\"f11-ball\\\" class=\\\"f11-ball\\\">\u003c/div><div class=\\\"log\\\" id=\\\"f11-log\\\" style=\\\"flex:1;height:120px\\\">\u003c/div>\u003c/div>\\n  \u003c/div>\",\"css\":\".f11-ball { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); }\\n.f11-ball.pop { animation: f11-pop .5s ease-out; }\\n@keyframes f11-pop { 30% { transform: scale(1.6); } }\",\"js\":\"(() => {\\n  const log = $('#f11-log'), ball = $('#f11-ball');\\n  $('#f11-order').onclick = () => {\\n    log.textContent = '';\\n    setTimeout(() => logTo(log, '5. setTimeout(0)（描画の後）'), 0);\\n    requestAnimationFrame(() => { logTo(log, '3. requestAnimationFrame（描画の直前）'); requestAnimationFrame(() => logTo(log, '4. rAF の中の rAF（次のフレーム＝描画済み）')); });\\n    Promise.resolve().then(() => logTo(log, '2. Promise.then（microtask：同期処理の直後、描画の前）'));\\n    logTo(log, '1. 同期コード');\\n  };\\n  $('#f11-bad').onclick = () => { ball.classList.remove('pop'); ball.classList.add('pop'); };                       // 間に描画が無い → 変化なし扱い\\n  $('#f11-good').onclick = () => { ball.classList.remove('pop'); void ball.offsetWidth; ball.classList.add('pop'); }; // レイアウト強制で「外れた」を確定\\n  $('#f11-raf').onclick = () => { ball.classList.remove('pop'); requestAnimationFrame(() => requestAnimationFrame(() => ball.classList.add('pop'))); }; // 1フレーム描かせてから付ける\\n})();\"},{\"page\":\"10-accessibility.html\",\"pageTitle\":\"アクセシビリティ：キーボード・読み上げ・色・動き\",\"id\":\"a1\",\"title\":\"A1キーボードだけで操作できるか フォーカス順の可視化\",\"what\":\"マウスなしで全機能に届くか。Tab の順番が見た目の順と一致しているか、フォーカスが見えるか、閉じ込められて抜けられない箇所がないか。下のボタンで、このページ内の「フォーカスできる要素」に番号を振って順路を可視化する。\",\"how\":\"操作：「フォーカス順を表示」→ 番号が見た目の順に並んでいるか確認。その後 Tab で実際に辿る。\",\"html\":\"<div class=\\\"stage\\\">\\n    <div class=\\\"row\\\"><button id=\\\"a1-show\\\">フォーカス順を表示\u003c/button><button id=\\\"a1-hide\\\">消す\u003c/button><span class=\\\"readout\\\" id=\\\"a1-out\\\">-\u003c/span>\u003c/div>\\n    <div class=\\\"row\\\"><button>1つ目\u003c/button><a href=\\\"#a1\\\">リンク\u003c/a><input type=\\\"text\\\" placeholder=\\\"入力\\\"><div tabindex=\\\"0\\\" class=\\\"box\\\" style=\\\"width:auto;height:auto;padding:6px 10px\\\">tabindex=0 の div\u003c/div><div class=\\\"box\\\" style=\\\"width:auto;height:auto;padding:6px 10px;background:#94a3b8\\\">tabindex なし（届かない）\u003c/div><button tabindex=\\\"-1\\\">tabindex=-1（Tabで届かない）\u003c/button>\u003c/div>\\n  \u003c/div>\",\"css\":\".a11y-badge { position: absolute; z-index: 999; background: #dc2626; color: #fff; font: 700 11px/1 system-ui; padding: 2px 5px; border-radius: 3px; pointer-events: none; }\",\"js\":\"(() => {\\n  const SEL = 'a[href], button, input, select, textarea, [tabindex]';\\n  const focusable = () => $$(SEL).filter(el => !el.disabled && el.tabIndex >= 0 && el.getClientRects().length);\\n  $('#a1-show').onclick = () => {\\n    $$('.a11y-badge').forEach(b => b.remove());\\n    const list = focusable();\\n    list.forEach((el, i) => { const r = el.getBoundingClientRect(); const b = document.createElement('span'); b.className = 'a11y-badge'; b.textContent = i + 1; b.style.left = r.left + scrollX + 'px'; b.style.top = r.top + scrollY - 8 + 'px'; document.body.appendChild(b); });\\n    $('#a1-out').textContent = `フォーカス可能: ${list.length} 個`;\\n  };\\n  $('#a1-hide').onclick = () => $$('.a11y-badge').forEach(b => b.remove());\\n})();\"},{\"page\":\"10-accessibility.html\",\"pageTitle\":\"アクセシビリティ：キーボード・読み上げ・色・動き\",\"id\":\"a2\",\"title\":\"A2読み上げに何が伝わるか アクセシブルネームと role\",\"what\":\"スクリーンリーダーは「役割（role）」と「名前（accessible name）」を読む。アイコンだけのボタンは名前が空になる。aria-label か視覚的に隠したテキストで名前を与える。下の検査は、ページ内のボタン・リンクで名前が空のものを列挙する。\",\"how\":\"操作：「名前のない操作要素を探す」。右の例は意図的に名前が無い。\",\"html\":\"<div class=\\\"stage\\\">\\n    <div class=\\\"row\\\"><button id=\\\"a2-scan\\\">名前のない操作要素を探す\u003c/button><span class=\\\"readout\\\" id=\\\"a2-out\\\">-\u003c/span>\u003c/div>\\n    <div class=\\\"row\\\">\\n      <button title=\\\"良い例: aria-label あり\\\" aria-label=\\\"削除\\\">🗑\u003c/button>\\n      <button title=\\\"悪い例: 名前なし\\\">🗑\u003c/button>\\n      <button title=\\\"良い例: 隠しテキスト\\\">🔍<span class=\\\"a2-sr\\\">検索\u003c/span>\u003c/button>\\n      <a href=\\\"#a2\\\" title=\\\"悪い例: 名前なし\\\"><span style=\\\"display:inline-block;width:16px;height:16px;background:#94a3b8;border-radius:3px\\\">\u003c/span>\u003c/a>\\n    \u003c/div>\\n    <div class=\\\"log\\\" id=\\\"a2-log\\\" style=\\\"height:70px\\\">\u003c/div>\\n  \u003c/div>\",\"css\":\"/* 視覚的に隠すが読み上げには残す（display:none は読み上げも消える） */\\n.a2-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }\",\"js\":\"(() => {\\n  const name = el => (el.getAttribute('aria-label') || el.getAttribute('aria-labelledby') && document.getElementById(el.getAttribute('aria-labelledby'))?.textContent || el.textContent || el.getAttribute('title') || '').trim();\\n  $('#a2-scan').onclick = () => {\\n    const log = $('#a2-log'); log.textContent = '';\\n    const bad = $$('button, a[href]').filter(el => !name(el).replace(/[\\\\u{1F300}-\\\\u{1FAFF}\\\\s]/gu, ''));\\n    bad.forEach(el => logTo(log, `${el.tagName.toLowerCase()}: \\\"${el.outerHTML.slice(0, 60)}…\\\" → 名前なし`));\\n    $('#a2-out').textContent = `名前のない要素: ${bad.length} 個（title はブラウザにより読まれないので不十分）`;\\n  };\\n})();\"},{\"page\":\"10-accessibility.html\",\"pageTitle\":\"アクセシビリティ：キーボード・読み上げ・色・動き\",\"id\":\"a3\",\"title\":\"A3コントラスト比 WCAG 4.5:1（通常文字）/ 3:1（大きな文字・UI部品）\",\"what\":\"現場の照明や古いモニタでは、薄い灰色の文字は読めない。文字色と背景色から比率を計算し、基準を満たすか確認する。計算式は WCAG の相対輝度。\",\"how\":\"操作：色を変えて比率を見る。\",\"html\":\"<div class=\\\"stage\\\">\\n    <div class=\\\"row\\\">文字 <input type=\\\"color\\\" id=\\\"a3-fg\\\" value=\\\"#6b7280\\\"> 背景 <input type=\\\"color\\\" id=\\\"a3-bg\\\" value=\\\"#ffffff\\\"> <span class=\\\"readout\\\" id=\\\"a3-out\\\">\u003c/span>\u003c/div>\\n    <div id=\\\"a3-sample\\\" style=\\\"padding:10px 14px;border-radius:6px;font-size:14px\\\">サンプル文字：受注 #1001 納期 2026-09-12\u003c/div>\\n  \u003c/div>\",\"css\":\"\",\"js\":\"(() => {\\n  const lum = hex => { const c = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255).map(v => v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; };\\n  const ratio = (a, b) => { const [l1, l2] = [lum(a), lum(b)].sort((x, y) => y - x); return (l1 + 0.05) / (l2 + 0.05); };\\n  const upd = () => { const fg = $('#a3-fg').value, bg = $('#a3-bg').value, r = ratio(fg, bg); Object.assign($('#a3-sample').style, { color: fg, background: bg }); $('#a3-out').textContent = `${r.toFixed(2)} : 1 → 通常文字 ${r >= 4.5 ? '合格' : '不合格'} / 大きな文字・UI ${r >= 3 ? '合格' : '不合格'}`; };\\n  $('#a3-fg').oninput = $('#a3-bg').oninput = upd; upd();\\n})();\"},{\"page\":\"10-accessibility.html\",\"pageTitle\":\"アクセシビリティ：キーボード・読み上げ・色・動き\",\"id\":\"a4\",\"title\":\"A4非同期結果の通知 aria-live の polite / assertive\",\"what\":\"保存完了やエラーを画面の隅に出しても、読み上げユーザーには伝わらない。aria-live 領域にテキストを書くと自動で読み上げられる。polite は今の読み上げが終わってから、assertive は割り込む（エラー用）。領域は最初から存在させ、中身だけ変える。\",\"how\":\"操作：ボタンで通知。スクリーンリーダー（Windows: ナレーター Win+Ctrl+Enter、macOS: VoiceOver Cmd+F5）を起動して聞く。\",\"html\":\"<div class=\\\"stage\\\">\\n    <div class=\\\"row\\\"><button id=\\\"a4-ok\\\">保存成功（polite）\u003c/button><button id=\\\"a4-ng\\\">エラー（assertive）\u003c/button>\u003c/div>\\n    <div class=\\\"readout\\\" id=\\\"a4-polite\\\" aria-live=\\\"polite\\\" role=\\\"status\\\">（status 領域）\u003c/div>\\n    <div class=\\\"readout\\\" id=\\\"a4-assert\\\" aria-live=\\\"assertive\\\" role=\\\"alert\\\" style=\\\"margin-top:6px;color:#dc2626\\\">（alert 領域）\u003c/div>\\n  \u003c/div>\",\"css\":\"\",\"js\":\"(() => {\\n  let n = 0;\\n  $('#a4-ok').onclick = () => $('#a4-polite').textContent = `レコード #${1000 + ++n} を保存しました`;\\n  $('#a4-ng').onclick = () => $('#a4-assert').textContent = `保存に失敗しました（通信エラー）`;\\n})();\"},{\"page\":\"10-accessibility.html\",\"pageTitle\":\"アクセシビリティ：キーボード・読み上げ・色・動き\",\"id\":\"a5\",\"title\":\"A5環境設定の尊重 reduced-motion / contrast / color-scheme / forced-colors\",\"what\":\"OS の設定をメディアクエリで拾える。動きを減らす、コントラストを上げる、ダークモード、Windows のハイコントラストモード（forced-colors、色指定が無視される）。この環境の現在値を表示する。\",\"how\":\"\",\"html\":\"<div class=\\\"stage\\\"><table class=\\\"cmp\\\" id=\\\"a5-t\\\">\u003c/table>\u003c/div>\",\"css\":\"\",\"js\":\"(() => {\\n  const Q = [['prefers-reduced-motion: reduce', '動きを減らす → アニメーションを短縮・省略（42）'], ['prefers-contrast: more', 'コントラストを上げる → 枠線・文字色を濃く'], ['prefers-color-scheme: dark', 'ダークモード → 配色を切替（70）'], ['forced-colors: active', 'ハイコントラストモード → 背景色で状態を表すUIは消える。枠線・アイコンで表す'], ['hover: hover', 'ホバー可能な入力装置（06）'], ['pointer: coarse', '粗いポインタ（指）→ 当たり判定を 44px 以上に']];\\n  const render = () => $('#a5-t').innerHTML = '<tr><th>メディアクエリ\u003c/th><th>この環境\u003c/th><th>対応\u003c/th>\u003c/tr>' + Q.map(([q, d]) => `<tr><td><code>@media (${q})\u003c/code>\u003c/td><td>${matchMedia(`(${q})`).matches ? '<b>該当\u003c/b>' : '—'}\u003c/td><td>${d}\u003c/td>\u003c/tr>`).join('');\\n  Q.forEach(([q]) => matchMedia(`(${q})`).addEventListener('change', render)); render();\\n})();\"}];\n","docs/ui-guide/assets/guide.css":"/* UI操作レクチャー共通スタイル（依存なし） */\n:root {\n  --bg: #f6f7f9; --card: #fff; --text: #1d1f23; --muted: #6b7280;\n  --line: #e5e7eb; --accent: #2563eb; --accent-soft: #dbeafe;\n  --tierA: #16a34a; --tierB: #d97706; --tierC: #dc2626;\n  --stage: #fafbfc; --code: #0f172a;\n}\n/* ダーク（OS設定 or 明示）。デモ領域 .stage とその中身は固定配色のまま */\n@media (prefers-color-scheme: dark) {\n  :root:not([data-theme=\"light\"]) { --bg: #0f1419; --card: #171d26; --text: #e6e9ee; --muted: #9aa4b2; --line: #2a3441; --accent: #60a5fa; --accent-soft: #1e3a5f; }\n}\n:root[data-theme=\"dark\"] { --bg: #0f1419; --card: #171d26; --text: #e6e9ee; --muted: #9aa4b2; --line: #2a3441; --accent: #60a5fa; --accent-soft: #1e3a5f; }\n* { box-sizing: border-box; }\nhtml { scroll-behavior: smooth; }\nbody { margin: 0; font-family: system-ui, -apple-system, \"Segoe UI\", \"Noto Sans JP\", sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }\na { color: var(--accent); }\ncode { background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; font-size: 0.92em; }\n.stage code { background: #f1f3f5; }\nkbd { border: 1px solid #cbd5e1; border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font-size: 12px; background: #fff; }\n\nheader.top { position: sticky; top: 0; z-index: 50; background: var(--card); border-bottom: 1px solid var(--line); padding: 10px 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }\nheader.top h1 { font-size: 17px; margin: 0; }\nheader.top .tier { font-size: 11px; padding: 2px 8px; border-radius: 4px; color: #fff; }\nheader.top nav a { font-size: 13px; margin-right: 10px; }\nheader.top .theme-toggle { margin-left: auto; font-size: 12px; padding: 4px 10px; }\n.pg-link { display: inline-block; margin: 6px 0 0; font-size: 13px; }\n\n.layout { display: grid; grid-template-columns: 240px 1fr; max-width: 1280px; margin: 0 auto; }\naside.toc { position: sticky; top: 52px; height: calc(100vh - 52px); overflow: auto; padding: 14px 10px; border-right: 1px solid var(--line); font-size: 13px; }\naside.toc a { display: block; padding: 4px 8px; border-radius: 4px; color: var(--text); text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\naside.toc a:hover { background: var(--accent-soft); }\naside.toc a.current { background: var(--accent); color: #fff; }\naside.toc a.current { background: var(--accent); color: #fff; }\nmain { padding: 20px 24px 80px; min-width: 0; }\n.lead { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; margin-bottom: 20px; font-size: 14px; }\n\nsection.demo { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px 20px; margin-bottom: 26px; scroll-margin-top: 60px; }\nsection.demo h2 { margin: 0 0 6px; font-size: 17px; display: flex; align-items: baseline; gap: 10px; }\nsection.demo h2 .no { color: var(--muted); font-size: 14px; }\nsection.demo h2 small { color: var(--muted); font-weight: 400; font-size: 13px; }\nsection.demo .what { font-size: 14px; margin: 0 0 10px; }\nsection.demo .how { font-size: 13px; color: var(--muted); margin: 0 0 12px; }\nsection.demo .how b { color: var(--text); }\n.stage { position: relative; color: #1d1f23; background: var(--stage); border: 1px dashed #cbd5e1; border-radius: 8px; padding: 14px; min-height: 120px; margin-bottom: 10px; overflow: hidden; }\n.stage.tall { min-height: 260px; }\n.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }\n.row:last-child { margin-bottom: 0; }\nbutton, .btn { font: inherit; font-size: 13px; padding: 6px 12px; border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; cursor: pointer; }\nbutton:hover { background: #f1f5f9; }\nbutton.primary { background: var(--accent); color: #fff; border-color: var(--accent); }\ninput[type=text], input[type=search], select { font: inherit; font-size: 13px; padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; }\n.readout { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; color: var(--muted); background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }\n.log { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; height: 110px; overflow: auto; white-space: pre-wrap; }\n.box { width: 80px; height: 80px; border-radius: 10px; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; user-select: none; touch-action: none; }\n.grid-bg { background-color: #fff; background-image: linear-gradient(#e5e7eb 1px, transparent 1px), linear-gradient(90deg, #e5e7eb 1px, transparent 1px); background-size: 40px 40px; }\n\ndetails.code { margin-top: 8px; }\ndetails.code summary { cursor: pointer; font-size: 13px; color: var(--muted); user-select: none; }\ndetails.code pre { margin: 8px 0 0; background: var(--code); color: #e2e8f0; padding: 12px 14px; border-radius: 8px; font-size: 12px; line-height: 1.5; overflow: auto; max-height: 420px; tab-size: 2; }\ndetails.code .label { display: inline-block; font-size: 11px; color: #94a3b8; margin: 8px 0 -4px; }\n\n.pill { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 999px; background: #eef2ff; color: #3730a3; margin-left: 4px; }\n.note { font-size: 12.5px; color: var(--muted); margin-top: 8px; }\n.tierA { background: var(--tierA); } .tierB { background: var(--tierB); } .tierC { background: var(--tierC); }\n\n@media (max-width: 800px) {\n  .layout { grid-template-columns: 1fr; }\n  aside.toc { display: none; }\n}\n@media (prefers-reduced-motion: reduce) {\n  html { scroll-behavior: auto; }\n}\n","docs/ui-guide/assets/guide.js":"// 共通ランタイム：目次生成と「動いているコードそのもの」の表示\n// 各デモは <section class=\"demo\" id=\"nXX\"> の中に <style data-code> / \u003cscript data-code> を持つ。\n// ここでは、それらの textContent を <details> に転記する（表示コード＝実行コード）。\n// 共通ヘルパ（各デモから使う。<head> で読み込む前提）\nwindow.$ = (sel, root = document) => root.querySelector(sel);\nwindow.$$ = (sel, root = document) => [...root.querySelectorAll(sel)];\nwindow.logTo = (el, msg) => {\n  el.textContent += msg + '\\n';\n  el.scrollTop = el.scrollHeight;\n};\n\n// テーマ（枠のみ。デモ領域 .stage は配色固定）: localStorage 'ui-guide.theme' = 'light' | 'dark' | ''(OS設定)\nconst THEME_KEY = 'ui-guide.theme';\nconst applyTheme = () => { let t = ''; try { t = localStorage.getItem(THEME_KEY) || ''; } catch {} document.documentElement.dataset.theme = t; };\napplyTheme();\n\ndocument.addEventListener('DOMContentLoaded', function () {\n  // ヘッダーにテーマ切替を差し込む\n  const top = document.querySelector('header.top');\n  if (top) {\n    const b = document.createElement('button'); b.className = 'theme-toggle'; b.type = 'button'; b.title = 'テーマ: OS設定 → ダーク → ライト';\n    const label = () => { const t = document.documentElement.dataset.theme; b.textContent = t === 'dark' ? '🌙 ダーク' : t === 'light' ? '☀ ライト' : '🖥 OS設定'; };\n    b.onclick = () => { const cur = document.documentElement.dataset.theme; const next = cur === '' ? 'dark' : cur === 'dark' ? 'light' : ''; try { next ? localStorage.setItem(THEME_KEY, next) : localStorage.removeItem(THEME_KEY); } catch {} applyTheme(); label(); };\n    label(); top.appendChild(b);\n  }\n  const sections = [...document.querySelectorAll('section.demo')];\n\n  // 目次\n  const toc = document.querySelector('aside.toc');\n  if (toc) {\n    sections.forEach(sec => {\n      const a = document.createElement('a');\n      a.href = '#' + sec.id;\n      a.textContent = sec.querySelector('h2').textContent.replace(/\\s+/g, ' ').trim();\n      toc.appendChild(a);\n    });\n    const links = [...toc.querySelectorAll('a')];\n    const io = new IntersectionObserver(entries => {\n      entries.forEach(e => {\n        if (!e.isIntersecting) return;\n        links.forEach(l => l.classList.toggle('current', l.hash === '#' + e.target.id));\n      });\n    }, { rootMargin: '-40% 0px -55% 0px' });\n    sections.forEach(s => io.observe(s));\n  }\n\n  // コード表示\n  const dedent = s => {\n    const lines = s.replace(/^\\n+|\\s+$/g, '').split('\\n');\n    const indent = Math.min(...lines.filter(l => l.trim()).map(l => l.match(/^\\s*/)[0].length));\n    return lines.map(l => l.slice(indent)).join('\\n');\n  };\n  sections.forEach(sec => {\n    const codes = [...sec.querySelectorAll('[data-code]')];\n    if (!codes.length) return;\n    const det = document.createElement('details');\n    det.className = 'code';\n    det.innerHTML = '<summary>コードを見る（このデモを動かしている実物）\u003c/summary>';\n    if (sec.querySelector('script[data-code]:not([type])')) {\n      const a = document.createElement('a'); a.className = 'pg-link'; a.href = '14-playground.html#' + sec.id; a.textContent = '▶ プレイグラウンドで編集して試す';\n      det.appendChild(a);\n    }\n    codes.forEach(el => {\n      const label = document.createElement('span');\n      label.className = 'label';\n      label.textContent = el.dataset.code || (el.tagName === 'STYLE' ? 'CSS' : (el.tagName === 'TEMPLATE' ? 'HTML' : 'JavaScript')); // data-code=\"任意ラベル\" で上書き可\n      const pre = document.createElement('pre');\n      pre.textContent = dedent(el.tagName === 'TEMPLATE' ? el.innerHTML : el.textContent);\n      det.appendChild(label);\n      det.appendChild(pre);\n    });\n    sec.appendChild(det);\n  });\n});\n","docs/ui-guide/assets/search-index.js":"// 自動生成（node docs/ui-guide/build.mjs）。手で編集しない。\nwindow.SEARCH_INDEX = [{\"page\":\"02-basic.html\",\"pageTitle\":\"第2弾 A：一般的なUI操作（01〜22）動くデモ\",\"id\":\"n01\",\"title\":\"01スクロール Scroll\",\"text\":\"内容が枠より大きいとき、枠の中で表示位置を動かす。「枠（ビューポート）は動かず、中身が動く」。 操作：枠内でホイール／ドラッグ／ボタン。右の数値が scrollTop。\"},{\"page\":\"02-basic.html\",\"pageTitle\":\"第2弾 A：一般的なUI操作（01〜22）動くデモ\",\"id\":\"n02\",\"title\":\"02パン Pan\",\"text\":\"中身を「掴んで」平行移動する。スクロールと違い、境界がなく（無限に動かせる）、ドラッグ量＝移動量になる。地図・図面・キャンバスの基本操作。 操作：方眼をドラッグ。transform: translate() に差分を足すだけ。\"},{\"page\":\"02-basic.html\",\"pageTitle\":\"第2弾 A：一般的なUI操作（01〜22）動くデモ\",\"id\":\"n03\",\"title\":\"03ズーム Zoom\",\"text\":\"表示倍率を変える。ここでは「枠の中心」を基準に拡大縮小する最も単純な形。ホイール位置を基準にする本格版は 44。 操作：枠内でホイール（トラックパッドはピンチ＝ctrlKey 付き wheel）、またはボタン。\"},{\"page\":\"02-basic.html\",\"pageTitle\":\"第2弾 A：一般的なUI操作（01〜22）動くデモ\",\"id\":\"n04\",\"title\":\"04クリック / タップ Click / Tap\",\"text\":\"最も基本の操作だが、1回の操作で複数のイベントが順に発火する。マウスとタッチで順序・種類が違うことを見て覚える。 操作：青い箱をクリック／タップ。発火順がログに出る。pointer* を使えば入力装置を問わず1系統で書ける。\"},{\"page\":\"02-basic.html\",\"pageTitle\":\"第2弾 A：一般的なUI操作（01〜22）動くデモ\",\"id\":\"n05\",\"title\":\"05ダブルクリック / 長押し Double click / Long press\",\"text\":\"ダブルクリックは標準イベントがある。長押しは標準イベントが無いので「押してから一定時間、動かさずに離さない」をタイマーで判定する。 操作：左はダブルクリック。右は500ms押し続ける（動かすとキャンセル）。\"},{\"page\":\"02-basic.html\",\"pageTitle\":\"第2弾 A：一般的なUI操作（01〜22）動くデモ\",\"id\":\"n06\",\"title\":\"06ホバー Hover\",\"text\":\"ポインタが要素上にある状態。タッチ端末には「ホバー」が存在しないため、ホバーでしか出ない情報を作らない。 操作：箱にポインタを乗せる。@media (hover: hover) でホバー可能な環境か判定できる。\"},{\"page\":\"02-basic.html\",\"pageTitle\":\"第2弾 A：一般的なUI操作（01〜22）動くデモ\",\"id\":\"n07\",\"title\":\"07フォーカス Focus\",\"text\":\"キーボード入力を受け取る要素は常に1つ。Tabで順に移動する。:focus-visible はキーボード操作時だけ枠を出すので、マウス時に枠が邪魔にならない。 操作：最初のボタンを押した後 Tab / Shift+Tab。div は tabindex=\\\"0\\\" を付けて初めてフォーカスできる。\"},{\"page\":\"02-basic.html\",\"pageTitle\":\"第2弾 A：一般的なUI操作（01〜22）動くデモ\",\"id\":\"n08\",\"title\":\"08ドラッグ&ドロップ Drag and Drop（HTML標準API）\",\"text\":\"要素を掴んで別の場所へ移す。ここはブラウザ標準のDnD API版。見た目のゴーストはブラウザ任せで簡単だが、タッチ非対応・細かい制御不可。自作版は 32。 操作：左のカードを右へドラッグ。dragover で preventDefault() しないとドロップできない、が最大の罠。\"},{\"page\":\"02-basic.html\",\"pageTitle\":\"第2弾 A：一般的なUI操作（01〜22）動くデモ\",\"id\":\"n09\",\"title\":\"09スワイプ / フリック Swipe / Flick\",\"text\":\"指（ポインタ）を素早く払う操作。「移動距離」と「速度」の両方を見て判定する。距離だけだとゆっくりのドラッグと区別がつかない。 操作：灰色の帯を左右に素早く払う。マウスでもドラッグで再現できる。\"},{\"page\":\"02-basic.html\",\"pageTitle\":\"第2弾 A：一般的なUI操作（01〜22）動くデモ\",\"id\":\"n10\",\"title\":\"10リサイズ Resize\",\"text\":\"つまみ（ハンドル）をドラッグして大きさを変える。サイズ変化の検知は ResizeObserver が正解（window.resize は要素の変化を拾えない）。 操作：右下の角をドラッグ。最小サイズで止まる。\"},{\"page\":\"02-basic.html\",\"pageTitle\":\"第2弾 A：一般的なUI操作（01〜22）動くデモ\",\"id\":\"n11\",\"title\":\"11選択 Select（単一 / Ctrl追加 / Shift範囲）\",\"text\":\"項目を選ぶ。Excelやエクスプローラと同じ修飾キー慣習（Ctrl=追加/解除、Shift=範囲）に合わせると業務ユーザーは説明なしで使える。 操作：行をクリック。Ctrl/⌘ や Shift を押しながらクリック。\"},{\"page\":\"02-basic.html\",\"pageTitle\":\"第2弾 A：一般的なUI操作（01〜22）動くデモ\",\"id\":\"n12\",\"title\":\"12フェードイン / フェードアウト Fade in / out\",\"text\":\"不透明度（opacity）を時間で補間する。最も安価で自然な出現・消失。注意点は「opacity:0 でも要素はそこに在る（クリックできる）」こと。消した後は display:none か visibility:hidden にする。 操作：トグル。transitionend で「完全に消えた瞬間」を拾って非表示化している。\"},{\"page\":\"02-basic.html\",\"pageTitle\":\"第2弾 A：一般的なUI操作（01〜22）動くデモ\",\"id\":\"n13\",\"title\":\"13スライドイン / スライドアウト Slide in / out\",\"text\":\"画面端から滑り込む。left や margin ではなく transform を動かす（レイアウト計算が走らず滑らか）。ドロワー・サイドパネル・通知の基本。 操作：ボタンで右からパネルが出る。背景クリックでも閉じる。\"},{\"page\":\"02-basic.html\",\"pageTitle\":\"第2弾 A：一般的なUI操作（01〜22）動くデモ\",\"id\":\"n14\",\"title\":\"14トランジション / イージング Transition / Easing\",\"text\":\"状態AからBへ「時間をかけて」変える仕組みがトランジション。その途中の速度配分がイージング。UIでは ease-out（速く出て静かに止まる）が基本。ease-in は「反応が遅い」と感じさせる。 操作：ボタンで4つの玉を同時に走らせ、違いを見る。\"},{\"page\":\"02-basic.html\",\"pageTitle\":\"第2弾 A：一般的なUI操作（01〜22）動くデモ\",\"id\":\"n15\",\"title\":\"15モーダル / ダイアログ Modal / Dialog\",\"text\":\"背後の操作を止めて前面で確認・入力させる。標準の &lt;dialog&gt; を showModal() で開くと、背景の暗幕・Escで閉じる・フォーカス閉じ込め・背面の不活性化が全部ついてくる。 操作：開いて Esc や暗幕クリックで閉じる。戻り値は returnValue で受け取る。\"},{\"page\":\"02-basic.html\",\"pageTitle\":\"第2弾 A：一般的なUI操作（01〜22）動くデモ\",\"id\":\"n16\",\"title\":\"16トースト / スナックバー Toast / Snackbar\",\"text\":\"操作結果を隅に短時間表示し、自動で消える。作業を中断させない通知。読み上げ対応のため aria-live を付ける。 操作：連打すると積み上がる。ホバー中は消えない（読む時間を確保）。\"},{\"page\":\"02-basic.html\",\"pageTitle\":\"第2弾 A：一般的なUI操作（01〜22）動くデモ\",\"id\":\"n17\",\"title\":\"17ツールチップ / ポップオーバー Tooltip / Popover\",\"text\":\"補足情報を小さく浮かせて出す。難しいのは位置決め：画面端では上下・左右を反転させる。getBoundingClientRect() で対象の位置を取り、はみ出すなら反対側へ。 操作：ボタンにホバー／フォーカス。右端のボタンでは反転する。\"},{\"page\":\"02-basic.html\",\"pageTitle\":\"第2弾 A：一般的なUI操作（01〜22）動くデモ\",\"id\":\"n18\",\"title\":\"18アコーディオン / 折りたたみ Accordion / Collapse\",\"text\":\"セクションの開閉。height: auto へは CSS transition が効かない、が定番の壁。解決策は grid の 0fr → 1fr（JS不要・内容の高さを知らなくてよい）。 操作：見出しをクリック。\"},{\"page\":\"02-basic.html\",\"pageTitle\":\"第2弾 A：一般的なUI操作（01〜22）動くデモ\",\"id\":\"n19\",\"title\":\"19タブ Tabs\",\"text\":\"同じ領域を複数のビューで切り替える。WAI-ARIAの作法：タブ列は role=tablist、Tabキーでは選択中タブに止まり、←→ で隣へ移動。 操作：クリック、またはタブにフォーカスして矢印キー。\"},{\"page\":\"02-basic.html\",\"pageTitle\":\"第2弾 A：一般的なUI操作（01〜22）動くデモ\",\"id\":\"n20\",\"title\":\"20ドロップダウン / メニュー Dropdown / Menu\",\"text\":\"ボタン押下で選択肢を展開する。自作するときの必須処理は3つ：外側クリックで閉じる、Escで閉じる、項目選択で閉じる。 操作：ボタンを押し、外をクリックや Esc で閉じる。\"},{\"page\":\"02-basic.html\",\"pageTitle\":\"第2弾 A：一般的なUI操作（01〜22）動くデモ\",\"id\":\"n21\",\"title\":\"21ページネーション / 無限スクロール Pagination / Infinite scroll\",\"text\":\"大量データを分割して取得・表示する2方式。ページ番号は「位置が分かる」、無限スクロールは「操作が要らない」。kintoneのレコード取得（offset/limit、またはカーソルAPI）はこの下で動く。 操作：左は番号で切替。右は末尾までスクロールすると IntersectionObserver が「番兵」を検知して追加読み込みする。\"},{\"page\":\"02-basic.html\",\"pageTitle\":\"第2弾 A：一般的なUI操作（01〜22）動くデモ\",\"id\":\"n22\",\"title\":\"22ローディング表示 Loading / Skeleton / Spinner\",\"text\":\"待ち時間を可視化する。スピナーは「何か待っている」しか伝えないが、スケルトン（内容の形の灰色）は「何が来るか」を先に見せるので体感が速い。 操作：再読込で2秒待ち。どちらの待ち方が楽か比べる。\"},{\"page\":\"03-custom.html\",\"pageTitle\":\"第2弾 B：カスタマイズ性の高いUI（23〜42）動くデモ\",\"id\":\"n23\",\"title\":\"23仮想スクロール Virtual scroll / Windowing\",\"text\":\"10万行あっても DOM は「見えている行＋少し」だけ作る。スクロール位置から開始行を割り算で求め、上に「行高×開始行」の余白を置いて位置を合わせる。 操作：スクロールしても DOM 行数は約20のまま。\"},{\"page\":\"03-custom.html\",\"pageTitle\":\"第2弾 B：カスタマイズ性の高いUI（23〜42）動くデモ\",\"id\":\"n24\",\"title\":\"24スティッキー（固定ヘッダー / 固定列） Sticky header / column\",\"text\":\"スクロールしても見出しが留まる。position: sticky だけで実現でき、JSは不要。左上のセルは top と left の両方を指定して両方向に固定する。 操作：表を縦横にスクロール。\"},{\"page\":\"03-custom.html\",\"pageTitle\":\"第2弾 B：カスタマイズ性の高いUI（23〜42）動くデモ\",\"id\":\"n25\",\"title\":\"25スクロールスナップ Scroll snap\",\"text\":\"スクロールを止めた時、区切り位置に吸着する。CSSだけで「カルーセル」「ページ単位の閲覧」ができ、慣性・タッチ対応もブラウザ任せ。 操作：横にスクロール（Shift+ホイール or トラックパッド）。どこで止めてもカードの先頭に揃う。\"},{\"page\":\"03-custom.html\",\"pageTitle\":\"第2弾 B：カスタマイズ性の高いUI（23〜42）動くデモ\",\"id\":\"n26\",\"title\":\"26パララックス Parallax\",\"text\":\"前景と背景を異なる速度で動かして奥行きを出す。実装は「スクロール量 × 係数」を transform に入れるだけ。業務アプリでは酔いやすいので控えめに。 操作：枠内をスクロール。背景の丸は 0.3 倍の速度で動く。\"},{\"page\":\"03-custom.html\",\"pageTitle\":\"第2弾 B：カスタマイズ性の高いUI（23〜42）動くデモ\",\"id\":\"n27\",\"title\":\"27スクロール連動アニメーション Scroll-driven reveal\",\"text\":\"要素が画面に入った瞬間をトリガーにする。scroll イベントで毎回位置計算せず、IntersectionObserver に「入った／出た」だけ教えてもらう。 操作：枠内をスクロール。入ったカードがフェード＋上昇で現れる。\"},{\"page\":\"03-custom.html\",\"pageTitle\":\"第2弾 B：カスタマイズ性の高いUI（23〜42）動くデモ\",\"id\":\"n28\",\"title\":\"28慣性 / モーメンタム Inertia / Momentum\",\"text\":\"指を離した後も速度を保ちながら減速して止まる。「離した瞬間の速度」を記録し、毎フレーム速度に減衰係数（0.95など）を掛けて位置を進める。パン（02）にこれを足すと「気持ちよさ」が出る。 操作：方眼を素早くドラッグして離す。壁で跳ね返る。\"},{\"page\":\"03-custom.html\",\"pageTitle\":\"第2弾 B：カスタマイズ性の高いUI（23〜42）動くデモ\",\"id\":\"n29\",\"title\":\"29スプリング物理 Spring animation\",\"text\":\"目標との差に比例した力（バネ）と速度に比例した抵抗（減衰）で動かす。時間固定のトランジションと違い、途中で目標が変わっても不自然にならない。 操作：枠内をクリック。連続でクリックして途中変更の滑らかさを見る。剛性・減衰を変えてみる。\"},{\"page\":\"03-custom.html\",\"pageTitle\":\"第2弾 B：カスタマイズ性の高いUI（23〜42）動くデモ\",\"id\":\"n30\",\"title\":\"30FLIPアニメーション First-Last-Invert-Play\",\"text\":\"レイアウトが変わる（並べ替え・追加・削除）ときの定石。①変更前の位置を測る（First）②DOMを変える③変更後の位置を測る（Last）④差分だけ transform で元の位置に戻す（Invert）⑤transformを0へアニメーション（Play）。 操作：シャッフル。DOMは一瞬で並び替わっているが、見た目は滑らかに移動する。\"},{\"page\":\"03-custom.html\",\"pageTitle\":\"第2弾 B：カスタマイズ性の高いUI（23〜42）動くデモ\",\"id\":\"n31\",\"title\":\"31ビュー遷移 View Transitions API\",\"text\":\"DOM更新の「前」と「後」をブラウザがスナップショットし、自動でクロスフェードする。view-transition-name を付けた要素は位置・サイズの移動もアニメーションする。未対応ブラウザでは即時切替にフォールバック。 操作：「一覧」と「詳細」を切り替える。画像だけは同じ名前を持つので位置が繋がる。\"},{\"page\":\"03-custom.html\",\"pageTitle\":\"第2弾 B：カスタマイズ性の高いUI（23〜42）動くデモ\",\"id\":\"n32\",\"title\":\"32ドラッグ並べ替え Sortable / Reorder（Pointer Events自作）\",\"text\":\"HTML標準DnD（08）を使わず Pointer Events で自作すると、タッチ対応・見た目の完全制御・FLIPとの併用ができる。掴んだ要素は transform で追従させ、他要素との重なりで挿入位置を決める。 操作：行をドラッグして並べ替え。\"},{\"page\":\"03-custom.html\",\"pageTitle\":\"第2弾 B：カスタマイズ性の高いUI（23〜42）動くデモ\",\"id\":\"n33\",\"title\":\"33分割パネル / ドッキング Split pane / Dock layout\",\"text\":\"境界（ガター）をドラッグして領域比率を変える。IDE風レイアウトの基礎。grid の列幅を書き換えるだけで、中身のレイアウトは自動で追従する。慣習：最小幅で止まる、ガターのダブルクリックで初期比率に戻す。 操作：中央の縦棒をドラッグ。ダブルクリックでリセット。\"},{\"page\":\"03-custom.html\",\"pageTitle\":\"第2弾 B：カスタマイズ性の高いUI（23〜42）動くデモ\",\"id\":\"n34\",\"title\":\"34キーボードナビゲーション Roving tabindex\",\"text\":\"ツールバーやグリッドの中は矢印キーで移動し、Tab は「グループごと」に抜ける。実現方法は「今の項目だけ tabindex=0、他は -1」に付け替え続けること（roving = 巡回）。 操作：最初のボタンにフォーカス（クリック）→ ←→HomeEnd。Tab で次のグループへ一気に抜ける。\"},{\"page\":\"03-custom.html\",\"pageTitle\":\"第2弾 B：カスタマイズ性の高いUI（23〜42）動くデモ\",\"id\":\"n35\",\"title\":\"35ショートカットキー Hotkeys\",\"text\":\"キー組合せで機能を呼ぶ。要点：①ブラウザ既定動作を preventDefault() で止める ②入力欄にフォーカス中は単独キーのショートカットを無効化 ③Mac は metaKey、Windows は ctrlKey。 操作：このページ上で Ctrl/⌘+S、Ctrl/⌘+K（36へ）、単独 N。入力欄内で N を打つと無視される。\"},{\"page\":\"03-custom.html\",\"pageTitle\":\"第2弾 B：カスタマイズ性の高いUI（23〜42）動くデモ\",\"id\":\"n36\",\"title\":\"36コマンドパレット Command palette\",\"text\":\"Ctrl+K で検索窓を開き、機能を文字で呼び出す。あいまい検索 → 矢印で選択 → Enter で実行。機能が増えてもメニューを掘らずに済む。 操作：ボタンか Ctrl/⌘+K。「csv」「削」などで絞り込み。\"},{\"page\":\"03-custom.html\",\"pageTitle\":\"第2弾 B：カスタマイズ性の高いUI（23〜42）動くデモ\",\"id\":\"n37\",\"title\":\"37アンドゥ / リドゥ Undo / Redo\",\"text\":\"操作履歴を積んで巻き戻す。ここは「状態のスナップショット」方式（過去の状態を丸ごと配列に保存）。単純で確実。状態が大きいなら「逆操作コマンド」方式を検討する。 操作：丸を追加／色替え → Ctrl/⌘+Z / Ctrl/⌘+Shift+Z またはボタン。\"},{\"page\":\"03-custom.html\",\"pageTitle\":\"第2弾 B：カスタマイズ性の高いUI（23〜42）動くデモ\",\"id\":\"n38\",\"title\":\"38インライン編集 Inline editing\",\"text\":\"表示中の値をその場で編集状態に切り替える。終了経路を3つ揃える：Enter=確定、Esc=取消、フォーカスが外れた=確定。どれか欠けると「戻れない」UIになる。 操作：セルをダブルクリック（またはフォーカスして Enter）。\"},{\"page\":\"03-custom.html\",\"pageTitle\":\"第2弾 B：カスタマイズ性の高いUI（23〜42）動くデモ\",\"id\":\"n39\",\"title\":\"39カスタムコンテキストメニュー Custom context menu\",\"text\":\"右クリックで独自メニューを出す。contextmenu イベントを止め、クリック位置に出す。画面端では反転して枠内に収める。 操作：灰色の領域で右クリック（タッチは長押し）。端の方で試す。\"},{\"page\":\"03-custom.html\",\"pageTitle\":\"第2弾 B：カスタマイズ性の高いUI（23〜42）動くデモ\",\"id\":\"n40\",\"title\":\"40進捗表示 Progress（determinate / indeterminate）\",\"text\":\"完了率が分かるなら確定型（バー）、分からないなら不定型（流れるだけ）。長い処理には必ずキャンセル手段を添える。AbortController で中断できる作りにしておく。 操作：開始 → 途中でキャンセル。\"},{\"page\":\"03-custom.html\",\"pageTitle\":\"第2弾 B：カスタマイズ性の高いUI（23〜42）動くデモ\",\"id\":\"n41\",\"title\":\"41ジェスチャー競合の解決 touch-action / 方向ロック\",\"text\":\"「縦にスクロールしたいのか、横にスワイプしたいのか」をブラウザと取り合わない。touch-action: pan-y で縦はブラウザに任せ、横は自分で取る。さらに初動数pxの方向で「今回はどちらか」を確定（方向ロック）する。 操作：カードを横にドラッグ（削除アクションが出る）。縦に動かすと枠がスクロールする。タッチ端末で差がよく分かる。\"},{\"page\":\"03-custom.html\",\"pageTitle\":\"第2弾 B：カスタマイズ性の高いUI（23〜42）動くデモ\",\"id\":\"n42\",\"title\":\"42モーション低減対応 prefers-reduced-motion\",\"text\":\"OS設定で「視覚効果を減らす」を選んだユーザーには、動きを短縮・省略する。CSSのメディアクエリ1つで全アニメーションを止められる。JSからも matchMedia で判定できる。 操作：ボタンで動かす。OS設定を変えるとこのページの動きが止まる（右の表示で確認）。\"},{\"page\":\"04-pro.html\",\"pageTitle\":\"第2弾 C：プロ志向のUI（43〜62）動くデモ\",\"id\":\"n43\",\"title\":\"43無限キャンバス Infinite canvas（パン＋ズーム＋座標変換）\",\"text\":\"画面座標（ピクセル）とワールド座標（図面上の位置）を分けて持つ。表示は screen = world × scale + offset、入力は逆算 world = (screen − offset) ÷ scale。この2つの式だけで、パン・ズーム・クリック位置の特定が全部つながる。 操作：ドラッグでパン、ホイールでズーム（カーソル基準）、ダブルクリックでその位置に点を置く。右上にカーソルのワールド座標が出る。\"},{\"page\":\"04-pro.html\",\"pageTitle\":\"第2弾 C：プロ志向のUI（43〜62）動くデモ\",\"id\":\"n44\",\"title\":\"44ズーム中心の維持 Zoom-to-cursor\",\"text\":\"「ズームすると見ていた場所がズレる」の正体は、原点基準で scale しているから。カーソル下のワールド座標を先に求め、scale 変更後も同じ点がカーソル下に来るよう offset を計算し直す。式：offset = cursor − world × newScale。 操作：方式を切り替えて、同じ位置でホイールしてみる。「原点基準」だと図がカーソルから逃げる。\"},{\"page\":\"04-pro.html\",\"pageTitle\":\"第2弾 C：プロ志向のUI（43〜62）動くデモ\",\"id\":\"n45\",\"title\":\"45ミニマップ Minimap\",\"text\":\"全体を縮小して描き、現在の表示範囲を枠で示す。枠のドラッグでも移動できる。同じワールド座標を「別の縮尺」で描いているだけなので、43 の式がそのまま使える。 操作：大きい方をドラッグでパン、または右下のミニマップの枠をドラッグ。\"},{\"page\":\"04-pro.html\",\"pageTitle\":\"第2弾 C：プロ志向のUI（43〜62）動くデモ\",\"id\":\"n46\",\"title\":\"46ノードエディタ Node graph / Wiring\",\"text\":\"ノード（箱）のポート同士を線で結ぶ。線は SVG のベジェ曲線 M x1 y1 C x1+d y1, x2−d y2, x2 y2。出力ポートからドラッグ→入力ポートで離すと接続。ノードを動かすと線を引き直す。 操作：右側の●から左側の●へドラッグして接続。ノード本体をドラッグで移動。線をクリックで削除。\"},{\"page\":\"04-pro.html\",\"pageTitle\":\"第2弾 C：プロ志向のUI（43〜62）動くデモ\",\"id\":\"n47\",\"title\":\"47スナップ / スマートガイド Snapping / Smart guides\",\"text\":\"ドラッグ中、他要素の端・中心と一定距離（しきい値）以内なら、その座標に吸着してガイド線を出す。候補座標を全部列挙して「最も近いものが閾値内か」を見るだけ。 操作：青い箱をドラッグして灰色の箱の端・中心に近づける。Ctrl を押しながらだとスナップ無効。\"},{\"page\":\"04-pro.html\",\"pageTitle\":\"第2弾 C：プロ志向のUI（43〜62）動くデモ\",\"id\":\"n48\",\"title\":\"48矩形選択 Rubber band selection\",\"text\":\"空白からドラッグして矩形を描き、重なった要素をまとめて選ぶ。判定は「矩形同士が交差するか」の4比較。Shift 併用で既存選択に追加。 操作：空白からドラッグ。Shift+ドラッグで追加選択。\"},{\"page\":\"04-pro.html\",\"pageTitle\":\"第2弾 C：プロ志向のUI（43〜62）動くデモ\",\"id\":\"n49\",\"title\":\"49ポインタキャプチャ setPointerCapture\",\"text\":\"ドラッグ中にポインタが要素の外に出ても、その要素がイベントを受け続けるようにする。これが無いと「速く動かすと箱が置いていかれる」「外で離すと pointerup が来ない」が起きる。 操作：2つの箱を素早くドラッグして比べる。左はキャプチャなし（外に出た瞬間止まる）。\"},{\"page\":\"04-pro.html\",\"pageTitle\":\"第2弾 C：プロ志向のUI（43〜62）動くデモ\",\"id\":\"n50\",\"title\":\"50マルチタッチジェスチャー Pinch / Rotate / 2-finger pan\",\"text\":\"2本の指の「距離」「角度」「中点」の変化量から、拡大率・回転角・移動量を同時に求める。pointerId ごとに座標を Map で持てば、Pointer Events だけで書ける。 操作：タッチ端末なら2本指でピンチ／回転。マウスなら Shift を押しながらドラッグすると「2本目の指が箱の中心に固定されている」扱いで模擬できる。\"},{\"page\":\"04-pro.html\",\"pageTitle\":\"第2弾 C：プロ志向のUI（43〜62）動くデモ\",\"id\":\"n51\",\"title\":\"51修飾キーによる制約 Constrained drag（Shift / Alt / Ctrl）\",\"text\":\"ツール系アプリの共通作法：Shift=軸固定（水平か垂直のみ）、Alt=グリッド吸着、Ctrl=吸着解除。移動量の計算の最後に、押されているキーで補正を掛けるだけ。 操作：箱をドラッグしながら Shift / Alt を押す。\"},{\"page\":\"04-pro.html\",\"pageTitle\":\"第2弾 C：プロ志向のUI（43〜62）動くデモ\",\"id\":\"n52\",\"title\":\"52状態機械駆動UI State-machine driven interaction\",\"text\":\"「押した」「動かした」「離した」を場当たり的に処理するとバグが出る。状態を明示（idle → pressed → dragging → idle）し、各イベントで「今の状態で何が起きたら次はどこか」だけを書く。押しただけ（pressed→idle）はクリック、閾値を超えたらドラッグ、と分岐が自然に決まる。 操作：箱をクリック／少しだけ動かす／大きく動かす。右の図で現在状態が光る。\"},{\"page\":\"04-pro.html\",\"pageTitle\":\"第2弾 C：プロ志向のUI（43〜62）動くデモ\",\"id\":\"n53\",\"title\":\"53Web Animations API WAAPI\",\"text\":\"JS からアニメーションを生成し、一時停止・逆再生・速度変更・完了待ち（Promise）ができる。CSS transition では「途中で止めて戻す」が書きにくいが、WAAPI なら animation.reverse() の1行。 操作：ボタンで制御。「完了待ち」は await anim.finished の後にログが出る。\"},{\"page\":\"04-pro.html\",\"pageTitle\":\"第2弾 C：プロ志向のUI（43〜62）動くデモ\",\"id\":\"n54\",\"title\":\"54描画ループ最適化 rAF batching\",\"text\":\"pointermove は 1フレームに複数回来ることがある（高レートマウス・タッチ）。イベントごとに描画すると無駄。「最新の値だけ保存し、描画は requestAnimationFrame で1フレーム1回」にまとめる。 操作：方眼の上でマウスを素早く動かす。イベント回数と描画回数の差を見る。\"},{\"page\":\"04-pro.html\",\"pageTitle\":\"第2弾 C：プロ志向のUI（43〜62）動くデモ\",\"id\":\"n55\",\"title\":\"55Canvas 描画 Canvas rendering + ヒットテスト + devicePixelRatio\",\"text\":\"DOM要素を数万個作ると重いが、Canvas ならビットマップに描くだけなので軽い。代わりに「どれをクリックしたか」は自分で計算する（ヒットテスト）。高解像度画面では devicePixelRatio 分だけ内部解像度を上げないとぼやける。 操作：点の上にマウスを乗せると赤くなる（距離計算でヒット判定）。\"},{\"page\":\"04-pro.html\",\"pageTitle\":\"第2弾 C：プロ志向のUI（43〜62）動くデモ\",\"id\":\"n56\",\"title\":\"56データグリッド操作 セル範囲選択 / 列幅変更 / フィルハンドル / 貼り付け\",\"text\":\"業務アプリの中核。Excel の作法をどこまで再現するかで使い勝手が決まる。ここでは4つ：①ドラッグでセル範囲選択 ②列見出しの境界ドラッグで列幅変更 ③選択範囲右下の■を下にドラッグで値を埋める ④Excelからコピーした表を Ctrl+V で流し込む（TSV解析）。 操作：セルをドラッグ、列境界をドラッグ、右下■を下へドラッグ、Excel等の表をコピーしてグリッド上で貼り付け。\"},{\"page\":\"04-pro.html\",\"pageTitle\":\"第2弾 C：プロ志向のUI（43〜62）動くデモ\",\"id\":\"n57\",\"title\":\"57楽観的更新 Optimistic UI\",\"text\":\"サーバ応答を待たずに画面を先に更新し、失敗したら元に戻す。kintone の PUT /k/v1/record.json のような更新系で、体感の遅さを消す。ロールバックとエラー通知が必須。 操作：チェックを切り替える（即反映）。「失敗させる」をONにすると 1.2秒後に巻き戻る。\"},{\"page\":\"04-pro.html\",\"pageTitle\":\"第2弾 C：プロ志向のUI（43〜62）動くデモ\",\"id\":\"n58\",\"title\":\"58フォーカス管理 / ライブリージョン Focus trap / inert / aria-live\",\"text\":\"自作モーダルでは3つ必要：①開いたら中にフォーカスを移す ②背面を inert にして Tab が抜けないようにする ③閉じたら元の要素へフォーカスを戻す。非同期の結果は aria-live 領域に書くと読み上げソフトが通知する。 操作：開いて Tab を連打（外に出ない）→ 閉じると「開く」ボタンにフォーカスが戻る。\"},{\"page\":\"04-pro.html\",\"pageTitle\":\"第2弾 C：プロ志向のUI（43〜62）動くデモ\",\"id\":\"n59\",\"title\":\"59ファイルドロップ File drop / DataTransfer\",\"text\":\"OSのエクスプローラからファイルをドラッグして受け取る。dragover で preventDefault() しないとブラウザがファイルを開いてしまう。ドロップ領域のハイライトと、種別・サイズの検証をここで行う。 操作：デスクトップからファイルを枠に落とす（クリックで選択も可）。\"},{\"page\":\"04-pro.html\",\"pageTitle\":\"第2弾 C：プロ志向のUI（43〜62）動くデモ\",\"id\":\"n60\",\"title\":\"60コンテナクエリ Container queries\",\"text\":\"画面幅ではなく「自分が置かれた枠の幅」でレイアウトを切り替える。同じカード部品を、広いメイン領域では横並び、狭いサイドパネルでは縦積みにできる。ドッキングレイアウト（33）の中身に必須。 操作：枠の右下をドラッグして幅を変える。420px を境にカード内のレイアウトが変わる。\"},{\"page\":\"04-pro.html\",\"pageTitle\":\"第2弾 C：プロ志向のUI（43〜62）動くデモ\",\"id\":\"n61\",\"title\":\"61Electron：フレームレスウィンドウの操作 -webkit-app-region\",\"text\":\"OS標準のタイトルバーを消して自前のヘッダーを作る場合、「ここを掴んだらウィンドウごと動く」領域を CSS で宣言する。ボタンなど押したい要素は no-drag で除外しないとクリックできなくなる。ブラウザでは効かないため、ここでは同じCSSを当てたモック（枠内でウィンドウを動かす模擬）を置いている。 操作：模擬ウィンドウのタイトルバーをドラッグ（Electron では本物のウィンドウが動く）。ボタン部分は掴めない。\"},{\"page\":\"04-pro.html\",\"pageTitle\":\"第2弾 C：プロ志向のUI（43〜62）動くデモ\",\"id\":\"n62\",\"title\":\"62Electron：ネイティブメニュー / ショートカット Menu / accelerator / IPC\",\"text\":\"OSのメニューバー（ファイル・編集…）とショートカットはメインプロセスで定義し、押されたら IPC で renderer に通知する。renderer 側は「メニューから来た」「ボタンから来た」を区別せず同じ関数を呼ぶ設計にする。ブラウザでは動かないため、下のボタンで「メニューが押された通知が来た」状況を模擬している。 操作：「メニュー: 新規作成 を模擬」を押すと、renderer の受信ハンドラが動く。\"},{\"page\":\"05-advanced.html\",\"pageTitle\":\"第3弾 D：業務アプリの上位UI（71〜85 抜粋）動くデモ\",\"id\":\"n71\",\"title\":\"71大規模グリッドの複合 仮想スクロール＋固定列＋列並べ替え＋範囲コピー\",\"text\":\"数千〜数万行を扱う一覧の完成形。①行は仮想化（23）②先頭列は固定（24）③見出しをドラッグで列順変更（32の応用）④セル範囲をドラッグ選択して Ctrl+C でTSVとしてコピー（Excelにそのまま貼れる）。データは列順とは独立に保持し、表示時に「列順の配列」を通して並べる。 操作：スクロール／見出しをドラッグして列を入れ替え／セルをドラッグ選択して Ctrl+C。コピー内容は下に表示。\"},{\"page\":\"05-advanced.html\",\"pageTitle\":\"第3弾 D：業務アプリの上位UI（71〜85 抜粋）動くデモ\",\"id\":\"n74\",\"title\":\"74検索の型 インクリメンタル / デバウンス / ハイライト / あいまい検索\",\"text\":\"入力のたびに検索するが、①デバウンス（打鍵が止まって250ms後に実行）で無駄な処理を省き、②一致箇所を &lt;mark&gt; で強調し、③あいまい検索は「文字が順番に現れるか」をスコア化して並べる（先頭一致・連続一致を高得点に）。kintone API へ投げる場合もデバウンスは必須。 操作：「部品12」「p12鈴」「高橋 倉庫」などを入力。「p12鈴」は部分一致では0件、あいまいでは「P-0012 部品12 鈴木…」が上位に来る。\"},{\"page\":\"05-advanced.html\",\"pageTitle\":\"第3弾 D：業務アプリの上位UI（71〜85 抜粋）動くデモ\",\"id\":\"n75\",\"title\":\"75フォームの型 ステッパー / 条件分岐 / 途中保存 / 離脱警告\",\"text\":\"長い入力を①段階に分け（ステッパー）②回答に応じて項目を出し分け（条件分岐）③入力のたびに下書きを保存し（localStorage）④未保存のまま離れようとしたら警告する（beforeunload）。状態は「1つのオブジェクト」に集約し、画面はそれを描画するだけにすると分岐が破綻しない。 操作：入力して次へ。「分納あり」を選ぶと項目が増える。ページを再読込しても下書きが復元される。入力途中でタブを閉じようとすると警告が出る。\"},{\"page\":\"05-advanced.html\",\"pageTitle\":\"第3弾 D：業務アプリの上位UI（71〜85 抜粋）動くデモ\",\"id\":\"n76\",\"title\":\"76バッチ操作UI 複数選択 → 一括変更 → プレビュー → 確定 → 進捗と部分失敗\",\"text\":\"一括更新は「取り消しにくい」ので、確定前にプレビュー（何が何に変わるか）を必ず見せる。実行中は進捗を出し、一部失敗しても止めずに完走させ、最後に「失敗分だけ再試行」を提供する。kintone の PUT /k/v1/records.json（100件上限）に合わせてチャンク分割する形。 操作：行をチェック → ステータスを選ぶ → プレビュー → 実行。約20%が失敗するので再試行を試す。\"},{\"page\":\"05-advanced.html\",\"pageTitle\":\"第3弾 D：業務アプリの上位UI（71〜85 抜粋）動くデモ\",\"id\":\"n77\",\"title\":\"77差分表示 変更前後のハイライト / 変更履歴の切替\",\"text\":\"レコードの版（リビジョン）を並べ、①項目単位で「変更あり」を色分けし、②長文は単語単位の差分（LCS）で削除・追加を示す。kintone の変更履歴を「何がどう変わったか」まで見せる形。差分アルゴリズムは単語配列のLCSで十分（数百語規模なら瞬時）。 操作：比較する版を左右で選ぶ。\"},{\"page\":\"05-advanced.html\",\"pageTitle\":\"第3弾 D：業務アプリの上位UI（71〜85 抜粋）動くデモ\",\"id\":\"n80\",\"title\":\"80ドッキングレイアウト完成形 タブ移動 / 分割リサイズ / 分離（フローティング） / レイアウト保存\",\"text\":\"IDE風の骨格。「パネル（内容）」と「ゾーン（置き場所）」を分けて考え、レイアウト状態を1つのJSONで持つ：{ zones: { left:[...], center:[...], right:[...] }, float:[...], widths:[...] }。描画はこのJSONから毎回組み立て直す。保存・復元はJSONを localStorage に入れるだけ。 操作：タブを別ゾーンへドラッグ／境界をドラッグ／タブの「⧉」で分離、フローティングの「⊡」で戻す／「保存」→再読込で復元。\"},{\"page\":\"05-advanced.html\",\"pageTitle\":\"第3弾 D：業務アプリの上位UI（71〜85 抜粋）動くデモ\",\"id\":\"n81\",\"title\":\"81ワークスペース永続化 画面状態の保存と復元\",\"text\":\"「どのタブを開いていたか」「どこまでスクロールしていたか」「何を選んでいたか」「絞り込み条件」を1つのオブジェクトにまとめ、変更のたびに（デバウンスして）保存する。起動時にそれを読み、描画してから scrollTop を戻す。ユーザーは「昨日の続き」から始められる。 操作：タブ・絞り込み・選択・スクロールを変えてからページを再読込（F5）。同じ状態に戻る。\"},{\"page\":\"05-advanced.html\",\"pageTitle\":\"第3弾 D：業務アプリの上位UI（71〜85 抜粋）動くデモ\",\"id\":\"n85\",\"title\":\"85マルチウィンドウ同期 BroadcastChannel / Electron IPC\",\"text\":\"同じアプリを複数ウィンドウ（タブ）で開いたとき、片方の変更をもう片方へ即時に反映する。ブラウザ／Electron renderer 同士なら BroadcastChannel が最も簡単（同一オリジン内で全ウィンドウに届く）。Electron でメインプロセスが「真実の状態」を持つ設計なら、IPC で全ウィンドウへ配信する。 操作：「別ウィンドウで開く」でこのページをもう1つ開き、片方でカウンタや選択を変えると、もう片方に即反映される。\"},{\"page\":\"05-advanced.html\",\"pageTitle\":\"第3弾 D：業務アプリの上位UI（71〜85 抜粋）動くデモ\",\"id\":\"n72\",\"title\":\"72ツリー / 階層グリッド Tree grid with virtual scroll\",\"text\":\"部品表（BOM）や組織のような階層を、展開状態を持ったまま仮想スクロールする。コツは「木」をそのまま描かず、展開中のノードだけを平坦な配列に変換してから 23 の仮想スクロールに渡すこと。展開／折りたたみは平坦化をやり直すだけ。 操作：▶ で展開。全展開（2,440ノード）しても DOM 行数は増えない。\"},{\"page\":\"05-advanced.html\",\"pageTitle\":\"第3弾 D：業務アプリの上位UI（71〜85 抜粋）動くデモ\",\"id\":\"n73\",\"title\":\"73ピボット集計ビュー Pivot with drag-to-assign axes\",\"text\":\"レコード一覧を「行の軸」「列の軸」「集計値」に振り分けて集計表を作る。項目チップを枠へドラッグして軸を組み替える。集計は Map に「行キー｜列キー」で足し込むだけ。kintone のレコードを取得した後の分析ビューとして使える。 操作：チップを「行」「列」の枠へドラッグ（HTML標準DnD）。「値」は数量/金額を切替。\"},{\"page\":\"05-advanced.html\",\"pageTitle\":\"第3弾 D：業務アプリの上位UI（71〜85 抜粋）動くデモ\",\"id\":\"n78\",\"title\":\"78競合解決 Conflict resolution（楽観ロック）\",\"text\":\"自分が編集している間に他の人が同じレコードを更新していたら、保存時に検知して「上書き／マージ／破棄」を選ばせる。検知はリビジョン番号で行う（kintone は revision を持ち、不一致なら PUT が失敗する）。3方向比較（元・自分・相手）で、片方しか変えていない項目は自動マージできる。 操作：「他ユーザーが更新」を押してから保存すると競合ダイアログが出る。\"},{\"page\":\"05-advanced.html\",\"pageTitle\":\"第3弾 D：業務アプリの上位UI（71〜85 抜粋）動くデモ\",\"id\":\"n79\",\"title\":\"79オフライン対応 Offline queue and sync status\",\"text\":\"通信できない間の操作をキューに溜め、復帰したら順に再送する。画面には「未同期 n 件」を常に見せ、ユーザーが不安にならないようにする。判定は navigator.onLine と online/offline イベント、ただし「繋がっているがAPIが落ちている」も同じ扱いにする（送信失敗→キューに戻す）。 操作：「オフライン」にして操作を数回 → 「オンライン」に戻すとキューが流れる。\"},{\"page\":\"05-advanced.html\",\"pageTitle\":\"第3弾 D：業務アプリの上位UI（71〜85 抜粋）動くデモ\",\"id\":\"n82\",\"title\":\"82ルーティングと履歴 History API / 戻る・進むで状態復元\",\"text\":\"SPA でも「戻る」ボタンが効くように、画面遷移を history.pushState で履歴に積む。state オブジェクトにスクロール位置や絞り込みを入れておけば、popstate で戻ったときにその状態ごと復元できる。Electron でも同じ仕組みが使える。 操作：絞り込み→スクロール→行をクリックで詳細へ→ブラウザの「戻る」（または枠内の←）。一覧が同じ位置・同じ絞り込みで戻る。\"},{\"page\":\"05-advanced.html\",\"pageTitle\":\"第3弾 D：業務アプリの上位UI（71〜85 抜粋）動くデモ\",\"id\":\"n83\",\"title\":\"83スマートプレビュー Hover prefetch and preview card\",\"text\":\"リンクにホバーして一定時間（300ms）留まったら、先読みしてカードで内容を出す。カーソルが通り過ぎただけでは取得しない（遅延＋キャンセル）。取得結果はキャッシュし、2回目は即表示。kintone なら GET /k/v1/record.json をここで叩く。 操作：リンクにホバーして少し待つ。同じリンクに戻ると即表示（キャッシュ）。\"},{\"page\":\"05-advanced.html\",\"pageTitle\":\"第3弾 D：業務アプリの上位UI（71〜85 抜粋）動くデモ\",\"id\":\"n84\",\"title\":\"84ズーム可能タイムライン / ガント Time axis with pan, zoom, drag\",\"text\":\"43 の座標変換を「横軸＝時間」に適用したもの。x = (t − t0) × pxPerDay + offset と逆変換だけで、パン・ズーム・バーのドラッグ（日付変更）・日単位スナップが全部書ける。目盛りはズーム倍率に応じて「日／週／月」を切り替える。 操作：背景ドラッグでパン、ホイールでズーム（カーソル基準）、バーをドラッグで日程変更（日単位に吸着）。\"},{\"page\":\"05-advanced.html\",\"pageTitle\":\"第3弾 D：業務アプリの上位UI（71〜85 抜粋）動くデモ\",\"id\":\"n86\",\"title\":\"86監視ボード型UI Polling / 変化点のフラッシュ / 通知集約\",\"text\":\"現場の状況を常時表示する画面。①一定間隔で取得（タブが隠れている間は止める：visibilitychange）②前回との差分だけをフラッシュ表示 ③通知は1件ずつ出さず「n件更新」に集約し、ミュートできる。ポーリング間隔は「取得にかかった時間」より十分長くする。 操作：2秒ごとに値が変わり、変わったセルが光る。タブを切り替えると停止し、戻ると再開する。\"},{\"page\":\"06-effects.html\",\"pageTitle\":\"第4弾 E：演出・体感の上位効果（63〜70）動くデモ\",\"id\":\"n63\",\"title\":\"63シェアードエレメント遷移 Shared element transition\",\"text\":\"一覧の行が「同じ物として」詳細画面へ拡大移動する。View Transitions（31）で、遷移する瞬間だけクリックした要素に view-transition-name を付ける。全行に同じ名前を付けると衝突して失敗するので、動的に付け外しするのが要点。 操作：カードをクリック→詳細へ。「戻る」で逆再生。非対応ブラウザは即時切替。\"},{\"page\":\"06-effects.html\",\"pageTitle\":\"第4弾 E：演出・体感の上位効果（63〜70）動くデモ\",\"id\":\"n64\",\"title\":\"64スタガーアニメーション Stagger\",\"text\":\"複数要素を数十msずつ遅らせて順に出す。「一斉にドン」より軽く見え、視線を上から下へ誘導できる。CSSなら animation-delay: calc(var(--i) * 40ms)、JSなら WAAPI の delay。要素数が多いときは合計時間が伸びすぎないよう上限を設ける。 操作：再生。間隔を変えて印象の違いを見る。\"},{\"page\":\"06-effects.html\",\"pageTitle\":\"第4弾 E：演出・体感の上位効果（63〜70）動くデモ\",\"id\":\"n65\",\"title\":\"65スケルトン → 実データのモーフィング Skeleton morph\",\"text\":\"スケルトン（22）から本物の内容へ切り替わる瞬間に「ガタつき」が出るのを防ぐ。①スケルトンと本物を同じ位置に重ね、クロスフェードする ②高さが変わるならFLIP（30）の高さ版で滑らかに伸縮する。 操作：再読込。「ガタつき版」と比べる。\"},{\"page\":\"06-effects.html\",\"pageTitle\":\"第4弾 E：演出・体感の上位効果（63〜70）動くデモ\",\"id\":\"n66\",\"title\":\"66マイクロインタラクション Micro-interactions\",\"text\":\"操作に対する「小さな返事」。チェックのバウンス、保存ボタンの「送信中→完了」の形状変化、いいねの弾み。ルール：150〜300ms、ユーザーの操作の直後に、操作したその場所で起きる。装飾ではなく「受け付けた」の合図。 操作：それぞれ押す。\"},{\"page\":\"06-effects.html\",\"pageTitle\":\"第4弾 E：演出・体感の上位効果（63〜70）動くデモ\",\"id\":\"n67\",\"title\":\"67ジェスチャー連動の物理 Interactive back swipe\",\"text\":\"画面遷移を「アニメーション再生」ではなく「指の位置に追従」させ、離した時点で完了か取消かを決める（iOSの戻る操作）。ドラッグ量を0〜1の進捗に変換し、離したら閾値（40%）と速度で判定、残りはスプリング（29）で流す。 操作：詳細画面の左端からドラッグ。途中で戻すとキャンセルされる。\"},{\"page\":\"06-effects.html\",\"pageTitle\":\"第4弾 E：演出・体感の上位効果（63〜70）動くデモ\",\"id\":\"n68\",\"title\":\"68スクロール駆動アニメーション（CSS） animation-timeline: scroll() / view()\",\"text\":\"27 は JS（IntersectionObserver）だったが、CSS だけで「スクロール量＝アニメーション進捗」にできる。scroll() はスクロール位置に、view() は要素が見えている割合に連動する。メインスレッドを使わないので滑らか。非対応ブラウザでは単に表示される（プログレッシブ）。 操作：枠内をスクロール。上端の読了バーと、各カードの出現がスクロールに同期する。\"},{\"page\":\"06-effects.html\",\"pageTitle\":\"第4弾 E：演出・体感の上位効果（63〜70）動くデモ\",\"id\":\"n69\",\"title\":\"69ぼかし / グラスモーフィズム backdrop-filter と性能\",\"text\":\"半透明パネルの背後をぼかす backdrop-filter: blur()。見栄えは良いが、背後が動くたびに毎フレーム再計算されるためGPUが弱い端末では重い。実機で計測し、必要なら blur を外して単なる半透明にする。 操作：ぼかしON/OFFを切り替えて、右上のフレーム時間を比べる（差が出ない端末なら採用してよい）。\"},{\"page\":\"06-effects.html\",\"pageTitle\":\"第4弾 E：演出・体感の上位効果（63〜70）動くデモ\",\"id\":\"n70\",\"title\":\"70ダークモード切替のクロスフェード Theme transition with View Transitions\",\"text\":\"テーマ切替時に全画面がパッと変わるのを、View Transitions で滑らかにする。標準は全体クロスフェード。::view-transition-new(root) に clip-path: circle() をアニメーションさせると「クリック位置から広がる」演出になる。テーマ自体は data-theme 属性と CSS 変数で。 操作：ボタンを押す（押した位置から広がる）。このデモ枠内だけがテーマ切替の対象。\"},{\"page\":\"08-foundations.html\",\"pageTitle\":\"基礎知識：座標系・イベント・描画の土台\",\"id\":\"f1\",\"title\":\"F1座標系の違い clientX / pageX / offsetX / screenX / getBoundingClientRect\",\"text\":\"マウス位置には5種類の「原点」がある。ドラッグやズームで一番よく使うのは clientX と getBoundingClientRect().left の差（＝要素内のローカル座標）。offsetX は「イベントが当たった要素」基準なので、子要素の上で値が飛ぶ。 操作：枠内でマウスを動かす。枠は少しスクロールしてある。青い子要素の上で offsetX がどう変わるか見る。\"},{\"page\":\"08-foundations.html\",\"pageTitle\":\"基礎知識：座標系・イベント・描画の土台\",\"id\":\"f2\",\"title\":\"F2イベントの発火順と伝播 capture → target → bubble / stopPropagation\",\"text\":\"イベントは「外側から内側へ（capture）→ 当たった要素（target）→ 内側から外側へ（bubble）」の順に流れる。addEventListener(type, fn, true) で capture 側に登録できる。stopPropagation() はそこから先へ流さない。preventDefault() は伝播ではなく「ブラウザの既定動作」を止める。この2つの違いが最重要。 操作：内側の箱をクリック。ログに順序が出る。チェックで「中央で stopPropagation」を有効にすると、外側の bubble が来なくなる。\"},{\"page\":\"08-foundations.html\",\"pageTitle\":\"基礎知識：座標系・イベント・描画の土台\",\"id\":\"f3\",\"title\":\"F3transform と left/top の違い レイアウト vs 合成\",\"text\":\"位置を動かす方法は2つあるが、コストが違う。left/top を変えるとブラウザはレイアウト計算（周囲の要素の位置も再計算）をやり直す。transform は最終的な合成段階で動かすだけで、レイアウトは走らない。だからデモは全部 transform で動かしている。opacity も同じく安い。 操作：300個の箱を同じ動きで走らせ、フレーム時間を比べる。差が小さい端末もあるが、要素数が増えるほど開く。\"},{\"page\":\"08-foundations.html\",\"pageTitle\":\"基礎知識：座標系・イベント・描画の土台\",\"id\":\"f4\",\"title\":\"F4passive リスナーと touch-action スクロールを止めたいのに止まらない理由\",\"text\":\"ブラウザは wheel / touchmove を「既定で passive（preventDefault が効かない）」として扱うことがある。自前でズームやパンをするなら { passive: false } を明示する。タッチでは加えて CSS の touch-action で「どの方向をブラウザに任せるか」を宣言する方が確実。 操作：左右の枠でホイール。左は preventDefault が無視されてページがスクロールする。右は止まる。\"},{\"page\":\"08-foundations.html\",\"pageTitle\":\"基礎知識：座標系・イベント・描画の土台\",\"id\":\"f5\",\"title\":\"F5動かし方の4手段 transition / CSS animation / WAAPI / requestAnimationFrame\",\"text\":\"同じ「右に300px動かす」でも手段が4つある。使い分けの軸は「誰が時間を管理するか」と「途中で介入したいか」。迷ったら transition、JSで止めたり戻したりするなら WAAPI、毎フレーム値を計算するなら rAF。 操作：再生。4つが同じ動きをするのを確認し、下の表で選び方を見る。\"},{\"page\":\"08-foundations.html\",\"pageTitle\":\"基礎知識：座標系・イベント・描画の土台\",\"id\":\"f6\",\"title\":\"F6スロットルとデバウンス Throttle / Debounce\",\"text\":\"高頻度イベント（scroll, pointermove, input, resize）の間引き方は2種類。デバウンス＝止まってから1回（検索、保存）。スロットル＝一定間隔で1回（スクロール連動、進捗表示）。描画目的なら 54 の rAF バッチが第3の選択肢。 操作：灰色の帯でマウスを動かす。3つのカウンタの増え方を比べる。\"},{\"page\":\"08-foundations.html\",\"pageTitle\":\"基礎知識：座標系・イベント・描画の土台\",\"id\":\"f7\",\"title\":\"F7重なり順とスタッキングコンテキスト z-index が効かない理由\",\"text\":\"z-index は「同じスタッキングコンテキスト内」でしか比較されない。親に transform・opacity&lt;1・filter・position + z-index などがあると、そこで新しいコンテキストができ、子の z-index がいくら大きくても親の外の要素を追い越せない。ツールチップやドロップダウンが「下に潜る」原因の9割はこれ。 操作：チェックで左の親に transform を付ける。子の z-index:999 が右の z-index:1 に負ける。\"},{\"page\":\"08-foundations.html\",\"pageTitle\":\"基礎知識：座標系・イベント・描画の土台\",\"id\":\"f9\",\"title\":\"F9レイアウトスラッシング 読み取りと書き込みを交互にすると遅くなる\",\"text\":\"DOM の「幅を読む（offsetWidth, getBoundingClientRect）」と「スタイルを書く」を1要素ずつ交互にやると、ブラウザは書くたびにレイアウトをやり直してから読む（強制同期レイアウト）。先に全部読んでから、全部書くだけで桁違いに速くなる。FLIP（30）の「First を全部測ってから DOM を変える」もこの原則。 操作：500要素で2つの方式を実行し、時間を比べる。\"},{\"page\":\"08-foundations.html\",\"pageTitle\":\"基礎知識：座標系・イベント・描画の土台\",\"id\":\"f10\",\"title\":\"F10計測の道具 performance.now / PerformanceObserver(longtask) / rAF フレーム時間\",\"text\":\"「重い気がする」を数字にする3つの道具。①performance.now() で区間時間 ②PerformanceObserver の longtask で 50ms を超えてメインスレッドを塞いだ処理を検出 ③rAF の間隔でフレーム落ちを見る。開発者ツールの Performance タブが本命だが、実機で常時出しておくならこれ。 操作：「重い処理を実行」で意図的に 120ms ブロックする。longtask が検出され、フレーム時間が跳ねる。\"},{\"page\":\"08-foundations.html\",\"pageTitle\":\"基礎知識：座標系・イベント・描画の土台\",\"id\":\"f11\",\"title\":\"F11イベントループと描画のタイミング 同期処理 → microtask → 描画 → setTimeout\",\"text\":\"JS は「今の処理が全部終わってから」描画する。だから クラスを外して即付け直しても、間に描画が無いので何も起きない（14・64 の void el.offsetWidth はレイアウトを強制して「外した状態」を確定させる裏技）。順序は：同期コード → microtask（Promise.then, await の続き）→ requestAnimationFrame → 描画 → setTimeout。「描画してから次をやりたい」なら rAF を2回重ねる。 操作：「順序を見る」で各コールバックの実行順をログに出す。「再アニメーション」で、リフロー強制あり／なしの違いを見る。\"},{\"page\":\"08-foundations.html\",\"pageTitle\":\"基礎知識：座標系・イベント・描画の土台\",\"id\":\"f8\",\"title\":\"F8混同しやすい用語の対比表 名前が似ている・動きが似ている\",\"text\":\"「何が違うのか」を一言で。判断の軸は何が動くか／誰が時間を管理するか／どこが原点か。 \"},{\"page\":\"09-exercises.html\",\"pageTitle\":\"練習課題（12問）\",\"id\":\"\",\"title\":\"課題1：パンに範囲制限を付ける1\",\"text\":\"02 パン で、ワールドが枠の外に完全に出てしまわないよう、tx/ty を ±300px に制限する。\"},{\"page\":\"09-exercises.html\",\"pageTitle\":\"練習課題（12問）\",\"id\":\"\",\"title\":\"課題2：ズームの倍率を段階にする1\",\"text\":\"03 ズーム で、ホイール1回ごとに 25%・50%・100%・200%・400% の5段階だけを行き来するようにする。\"},{\"page\":\"09-exercises.html\",\"pageTitle\":\"練習課題（12問）\",\"id\":\"\",\"title\":\"課題3：トーストを最大3件に制限する1\",\"text\":\"16 トースト で、4件目が来たら一番古いものを即座に消す。\"},{\"page\":\"09-exercises.html\",\"pageTitle\":\"練習課題（12問）\",\"id\":\"\",\"title\":\"課題4：長押しでコンテキストメニューを出す2\",\"text\":\"39 コンテキストメニュー を、タッチ端末向けに「500ms の長押し」でも開けるようにする（05 の長押し判定を合成）。\"},{\"page\":\"09-exercises.html\",\"pageTitle\":\"練習課題（12問）\",\"id\":\"\",\"title\":\"課題5：選択にキーボード操作を足す2\",\"text\":\"11 選択 で、↑↓ で選択を移動、Shift+↑↓ で範囲を伸ばせるようにする。\"},{\"page\":\"09-exercises.html\",\"pageTitle\":\"練習課題（12問）\",\"id\":\"\",\"title\":\"課題6：仮想スクロールの行高を可変にしない代わりに「行の選択」を保つ2\",\"text\":\"23 仮想スクロール で、行をクリックすると選択状態になり、スクロールして DOM が作り直されても選択が保たれるようにする。\"},{\"page\":\"09-exercises.html\",\"pageTitle\":\"練習課題（12問）\",\"id\":\"\",\"title\":\"課題7：慣性パンにする2\",\"text\":\"02 パン に 28 慣性 を合成し、離した後も滑って止まるようにする（壁なし、減衰 0.92）。\"},{\"page\":\"09-exercises.html\",\"pageTitle\":\"練習課題（12問）\",\"id\":\"\",\"title\":\"課題8：Undo をインライン編集に接続する2\",\"text\":\"38 インライン編集 の確定ごとに履歴を積み、Ctrl+Z で表の内容が戻るようにする（37 の方式）。\"},{\"page\":\"09-exercises.html\",\"pageTitle\":\"練習課題（12問）\",\"id\":\"\",\"title\":\"課題9：矩形選択に「ワールド座標」を対応させる3\",\"text\":\"43 無限キャンバス の上で 48 矩形選択 を動かす。パン・ズームした状態でも、矩形に入ったノードだけ選ばれること。\"},{\"page\":\"09-exercises.html\",\"pageTitle\":\"練習課題（12問）\",\"id\":\"\",\"title\":\"課題10：バッチ操作に「中断」と「再開」を付ける3\",\"text\":\"76 バッチ操作 に、実行中の「中断」ボタンと、中断位置からの「再開」を追加する（40 の AbortController を合成）。\"},{\"page\":\"09-exercises.html\",\"pageTitle\":\"練習課題（12問）\",\"id\":\"\",\"title\":\"課題11：ドッキングのタブに「閉じる」と「再表示」を付ける3\",\"text\":\"80 ドッキング で、タブの × でパネルを閉じ、ヘッダーのメニューから閉じたパネルを再表示できるようにする。レイアウト保存にも反映されること。\"},{\"page\":\"09-exercises.html\",\"pageTitle\":\"練習課題（12問）\",\"id\":\"\",\"title\":\"課題12：オフラインキューを楽観的更新と競合解決につなぐ3\",\"text\":\"57 楽観的更新 の送信を 79 のキュー経由にし、送信時にサーバの revision が進んでいたら 78 の競合ダイアログを出す。\"},{\"page\":\"10-accessibility.html\",\"pageTitle\":\"アクセシビリティ：キーボード・読み上げ・色・動き\",\"id\":\"a1\",\"title\":\"A1キーボードだけで操作できるか フォーカス順の可視化\",\"text\":\"マウスなしで全機能に届くか。Tab の順番が見た目の順と一致しているか、フォーカスが見えるか、閉じ込められて抜けられない箇所がないか。下のボタンで、このページ内の「フォーカスできる要素」に番号を振って順路を可視化する。 操作：「フォーカス順を表示」→ 番号が見た目の順に並んでいるか確認。その後 Tab で実際に辿る。\"},{\"page\":\"10-accessibility.html\",\"pageTitle\":\"アクセシビリティ：キーボード・読み上げ・色・動き\",\"id\":\"a2\",\"title\":\"A2読み上げに何が伝わるか アクセシブルネームと role\",\"text\":\"スクリーンリーダーは「役割（role）」と「名前（accessible name）」を読む。アイコンだけのボタンは名前が空になる。aria-label か視覚的に隠したテキストで名前を与える。下の検査は、ページ内のボタン・リンクで名前が空のものを列挙する。 操作：「名前のない操作要素を探す」。右の例は意図的に名前が無い。\"},{\"page\":\"10-accessibility.html\",\"pageTitle\":\"アクセシビリティ：キーボード・読み上げ・色・動き\",\"id\":\"a3\",\"title\":\"A3コントラスト比 WCAG 4.5:1（通常文字）/ 3:1（大きな文字・UI部品）\",\"text\":\"現場の照明や古いモニタでは、薄い灰色の文字は読めない。文字色と背景色から比率を計算し、基準を満たすか確認する。計算式は WCAG の相対輝度。 操作：色を変えて比率を見る。\"},{\"page\":\"10-accessibility.html\",\"pageTitle\":\"アクセシビリティ：キーボード・読み上げ・色・動き\",\"id\":\"a4\",\"title\":\"A4非同期結果の通知 aria-live の polite / assertive\",\"text\":\"保存完了やエラーを画面の隅に出しても、読み上げユーザーには伝わらない。aria-live 領域にテキストを書くと自動で読み上げられる。polite は今の読み上げが終わってから、assertive は割り込む（エラー用）。領域は最初から存在させ、中身だけ変える。 操作：ボタンで通知。スクリーンリーダー（Windows: ナレーター Win+Ctrl+Enter、macOS: VoiceOver Cmd+F5）を起動して聞く。\"},{\"page\":\"10-accessibility.html\",\"pageTitle\":\"アクセシビリティ：キーボード・読み上げ・色・動き\",\"id\":\"a5\",\"title\":\"A5環境設定の尊重 reduced-motion / contrast / color-scheme / forced-colors\",\"text\":\"OS の設定をメディアクエリで拾える。動きを減らす、コントラストを上げる、ダークモード、Windows のハイコントラストモード（forced-colors、色指定が無視される）。この環境の現在値を表示する。 \"},{\"page\":\"10-accessibility.html\",\"pageTitle\":\"アクセシビリティ：キーボード・読み上げ・色・動き\",\"id\":\"a6\",\"title\":\"A6チェックリストと各デモの対応 実装時に見る\",\"text\":\" \"},{\"page\":\"12-electron.html\",\"pageTitle\":\"Electron 実装リファレンス\",\"id\":\"\",\"title\":\"0. 構成の原則（contextIsolation + preload）\",\"text\":\"renderer から Node を直接触らせない。preload で必要な関数だけ window.api として公開し、renderer はそれを呼ぶ。これで UI コードはブラウザで動くものと同じになり、デモ・ui-kit がそのまま使える。\"},{\"page\":\"12-electron.html\",\"pageTitle\":\"Electron 実装リファレンス\",\"id\":\"\",\"title\":\"1. ウィンドウ状態の永続化（位置・サイズ・最大化） ← 81 ワークスペース永続化の OS 側\",\"text\":\"閉じる前に getBounds() を保存し、起動時に復元する。ディスプレイ構成が変わっていると画面外に出るので、screen で表示範囲内か検証してから使う。\"},{\"page\":\"12-electron.html\",\"pageTitle\":\"Electron 実装リファレンス\",\"id\":\"\",\"title\":\"2. フレームレスウィンドウとタイトルバー ← 61\",\"text\":\"自前タイトルバーは -webkit-app-region: drag。Windows/Linux で OS の最小化・最大化・閉じるボタンだけ残したいなら titleBarOverlay。ダブルクリックで最大化は自前実装。\"},{\"page\":\"12-electron.html\",\"pageTitle\":\"Electron 実装リファレンス\",\"id\":\"\",\"title\":\"3. メニュー・アクセラレータと画面内ショートカットの衝突 ← 62, 35\",\"text\":\"アプリメニューの accelerator は renderer の keydown より先に取られる。同じキーを両方に登録しない。方針：アプリ全体の操作（新規、保存、終了）はメニュー側、画面内の操作（矢印移動、セル編集）は renderer 側。globalShortcut はアプリが背面でも効くので、業務アプリでは基本使わない。\"},{\"page\":\"12-electron.html\",\"pageTitle\":\"Electron 実装リファレンス\",\"id\":\"\",\"title\":\"4. IPC の型と失敗の扱い ← 57 楽観的更新, 79 オフライン\",\"text\":\"invoke/handle は Promise を返すので、renderer 側は fetch と同じ感覚で await できる。main で throw した Error は renderer に届く（メッセージのみ）。チャンネル名は '領域:動詞' で統一し、一覧を1ファイルにまとめる。\"},{\"page\":\"12-electron.html\",\"pageTitle\":\"Electron 実装リファレンス\",\"id\":\"\",\"title\":\"5. 複数ウィンドウ ← 85\",\"text\":\"同一アプリの複数 BrowserWindow は同じオリジンなので、renderer 同士は BroadcastChannel（ui-kit の sync.js）で同期できる。main が「真実の状態」を持つ設計なら、BrowserWindow.getAllWindows() に配信する（62 のコード）。ウィンドウごとに webContents.id を持つので、送信元を除外できる。\"},{\"page\":\"12-electron.html\",\"pageTitle\":\"Electron 実装リファレンス\",\"id\":\"\",\"title\":\"6. ファイルの受け渡し ← 59 ファイルドロップ\",\"text\":\"OS からのドロップは renderer の drop で受ける（59 と同じ）。パスが必要なら webUtils.getPathForFile(file)（preload 側）。逆にアプリからエクスプローラへドラッグして出すのは webContents.startDrag。保存ダイアログは main の dialog。\"},{\"page\":\"12-electron.html\",\"pageTitle\":\"Electron 実装リファレンス\",\"id\":\"\",\"title\":\"7. 認証情報の保存 ← 13 kintone\",\"text\":\"API トークンやパスワードを平文の JSON に置かない。safeStorage で OS のキーチェーンに紐づけて暗号化する。renderer には渡さず、main が通信時にだけ復号して使う。\"},{\"page\":\"12-electron.html\",\"pageTitle\":\"Electron 実装リファレンス\",\"id\":\"\",\"title\":\"8. 表示倍率・DPI ← 55 devicePixelRatio\",\"text\":\"Ctrl+ホイールの既定ズームは renderer の内容ごと拡大する。図面ビュー（43）で自前ズームをするなら、既定ズームと衝突しないよう wheel で ctrlKey 付きのものを preventDefault するか、webContents.setVisualZoomLevelLimits(1, 1) でピンチズームを止める。Canvas は devicePixelRatio を見て内部解像度を上げる（55）。\"},{\"page\":\"12-electron.html\",\"pageTitle\":\"Electron 実装リファレンス\",\"id\":\"\",\"title\":\"9. 二重起動・起動時間・開発者ツール\",\"text\":\"if (!app.requestSingleInstanceLock()) app.quit(); // 二重起動禁止。2つ目は既存ウィンドウを前面へ app.on('second-instance', () => { const w = BrowserWindow.getAllWindows()[0]; w?.focus(); }); win.once('ready-to-show', () => win.show()); // 白い画面を見せない（show:false で作る） if (!app.isPackaged) win.webContents.openDevTools({ mode: 'detach' }); 10. チェックリスト 項目確認 contextIsolation / sandbox / nodeIntegration:falserenderer から requir\"},{\"page\":\"13-kintone.html\",\"pageTitle\":\"kintone 連携リファレンス\",\"id\":\"\",\"title\":\"0. 呼び出しの置き場所（Electron の場合）\",\"text\":\"renderer から kintone へ直接 fetch すると、オリジン（file:// や app://）からの CORS で拒否される。main プロセスで通信し、IPC で結果を返す（12 の構成）。トークンも main にだけ置ける。\"},{\"page\":\"13-kintone.html\",\"pageTitle\":\"kintone 連携リファレンス\",\"id\":\"\",\"title\":\"1. 一覧の取得 ← 21 ページネーション / 23 仮想スクロール / 71 大規模グリッド\",\"text\":\"取得は GET /k/v1/records.json。1回の limit は最大 500、offset は上限あり（大きな値で拒否される）。数千件を超えるならカーソル API（作成→取得を繰り返す）か、$id でソートして「前回の最後の id より大きい」を条件にする方法。取り切ったデータは 23/71 の仮想スクロールで描く（DOM は表示分だけ）。\"},{\"page\":\"13-kintone.html\",\"pageTitle\":\"kintone 連携リファレンス\",\"id\":\"\",\"title\":\"2. 更新とリビジョン ← 57 楽観的更新 / 78 競合解決\",\"text\":\"レコードは $revision を持つ。PUT 時に revision を付けると、サーバ側が進んでいればエラーで拒否される（省略または -1 で無視）。これが 78 の「楽観ロック」。手順：①開いた時の revision を保持 ②保存時に付けて PUT ③拒否されたら最新を GET して 3方向マージ（ui-kit/merge.js）→ 再 PUT。\"},{\"page\":\"13-kintone.html\",\"pageTitle\":\"kintone 連携リファレンス\",\"id\":\"\",\"title\":\"3. 一括更新 ← 76 バッチ操作\",\"text\":\"PUT /k/v1/records.json は 1回 最大 100 件（POST 追加・DELETE 削除も同様）。101 件以上は 76 のようにチャンク分割し、チャンクごとに進捗を進める。1回のリクエスト内は全件成功か全件失敗（原子的）なので、「部分失敗」はチャンク単位で起きる。複数種類の操作をまとめて原子的に行いたいときは bulkRequest（1回の中に複数リクエスト、上限あり）。\"},{\"page\":\"13-kintone.html\",\"pageTitle\":\"kintone 連携リファレンス\",\"id\":\"\",\"title\":\"4. 検索 ← 74 検索の型\",\"text\":\"サーバ検索は query パラメータ（like、in、and/or、order by）。入力のたびに投げないよう 74 のデバウンス（250ms 以上）を入れ、前のリクエストが返る前に次が出たら古い結果を捨てる（連番で判定）。取得済みデータの絞り込みなら手元で ui-kit/search.js。\"},{\"page\":\"13-kintone.html\",\"pageTitle\":\"kintone 連携リファレンス\",\"id\":\"\",\"title\":\"5. オフラインと再送 ← 79\",\"text\":\"現場端末で通信が切れる前提なら、更新を ui-kit/offline-queue.js に積む。job には app, id, revision, record を入れ、送信時に revision 不一致なら 78 のフローへ回す（課題12）。Electron では main 再起動後もキューが残るよう、storage にファイル保存の実装を渡す。\"},{\"page\":\"13-kintone.html\",\"pageTitle\":\"kintone 連携リファレンス\",\"id\":\"\",\"title\":\"6. フィールド型と UI 部品の対応 kintone フィールド値の形向く UI（番号） 文字列（1行）／数値{ value: '…' }38 インライン編集、56 グリッド ドロップダウン／ラジオ{ value: '選択肢' }20 ドロップダウン、36 コマンドパレット（選択肢が多い時） チェックボックス／複数選択{ value: ['a','b'] }11 選択（Ctrl/Shift） 日付／日時'2026-09-12' / ISO 860184 タイムライン、75 フォーム ユーザー選択{ value: [{ code, name }] }74 あいまい検索つき選択 テーブル（サブテーブル）{ value: [{ id, value: {…} }] }56 グリッド、32 並べ替え 添付ファイル{ value: [{ fileKey, name }] }59 ファイルドロップ → アップロード API → fileKey を付けて PUT 関連レコード／ルックアップ参照先の値83 スマートプレビュー（ホバーで参照先を先読み） $id / $revisionシステム値78 競合解決、82 ルーティング（URL に id） 7. 上限の早見表（要公式確認） 操作上限（把握値）UI 側の対応 GET records の limit500 件/回21 ページング、23 仮想スクロール GET records の offset上限あり（大きい値は拒否）id 基準取得かカーソル API POST / PUT / DELETE records100 件/回76 チャンク分割と進捗 bulkRequest複数リクエストを1回で原子的に（件数上限あり）76 の「全部成功か全部失敗」が必要な時 同時リクエスト数ドメインごとに上限あり並列度を絞る（76 の Promise.all は数件まで） query の文字列長／like上限あり。前方一致のみ等の制約74 で手元検索と併用 8. kintone カスタマイズ JS の中で使う場合（Electron ではなく kintone 画面内）\",\"text\":\"kintone の画面に JS を読み込ませるカスタマイズでは、通信は kintone.api()（CORS も認証も不要）、画面の差し込み先は kintone.app.getHeaderSpaceElement() 等。デモと ui-kit はそのまま使えるが、kintone 側の DOM は書き換えない（アップデートで壊れる）。自前の要素をスペースに追加し、その中で動かす。\"}];\n","ui-kit/README.md":"# ui-kit\n\n`docs/ui-guide` のデモから切り出した、依存なしのバニラJS部品（ESモジュール）。通信・保存は外から注入する設計で、kintone や Electron に依存しない。\n\n```js\n// ES モジュール\nimport { createVirtualList, registerHotkeys, createPersistentStore } from './ui-kit/index.js';\n```\n```html\n\u003c!-- 単一ファイル版（file:// や kintone カスタマイズ JS でも使える。window.UIKit に全 API） -->\n\u003cscript src=\"ui-kit/dist/ui-kit.js\">\u003c/script>\n\u003cscript>const { createVirtualList } = window.UIKit;\u003c/script>\n```\n`dist/ui-kit.js` は `node ui-kit/build.mjs`（`npm run build`）で各モジュールから生成する。編集はモジュール側で行い、生成物は直接編集しない。\n\n## 実例\n`example/index.html`：受注一覧アプリ。5,000件の仮想リスト、デバウンス検索とハイライト、インライン編集の楽観的更新、Undo/Redo（サーバにも反映）、オフラインキュー、リビジョン競合の3方向マージ、分割パネル、ピン留めの並べ替え、削除モーダルのフォーカス管理、ツールチップ位置決め、別ウィンドウ同期、状態の永続化。ブラウザで開くだけで動く。\n\n| モジュール | 主な API |\n|---|---|\n| `drag.js` | `createDrag(el, {threshold, onStart, onMove, onEnd, onClick})`, `constrain(ctx, {grid})` |\n| `camera.js` | `createCamera({minScale, maxScale})`, `attachPanZoom(view, cam)` |\n| `virtual-list.js` | `createVirtualList(view, {rowHeight, count, renderRow})`, `flattenTree(nodes)` |\n| `undo.js` | `createHistory(initial, {limit})` |\n| `hotkeys.js` | `registerHotkeys({'mod+s': fn}, {ignoreInputs, skipPrevented})` |\n| `search.js` | `debounce`, `substringMatch`, `fuzzyMatch`, `highlight`, `search(items, needle, {fuzzy})` |\n| `offline-queue.js` | `createOfflineQueue({storageKey, send, isOnline})` |\n| `merge.js` | `threeWayMerge(base, mine, theirs)`, `wordDiff(a, b)`, `diffToHtml(parts)` |\n| `store.js` | `createPersistentStore(key, defaults, {debounceMs})` |\n| `sync.js` | `createSyncChannel(name, {onState})` |\n| `focus-trap.js` | `activateFocusTrap(container, {inertTargets, onEscape, initialFocus})` → `release()` |\n| `position.js` | `computePosition(anchorRect, popRect, {placement, align, gap, bounds})`, `positionAtPoint(point, popRect, bounds)` |\n| `toast.js` | `createToaster({host, max, duration, position})` → `show(msg, {kind, duration})` |\n| `sortable.js` | `createSortable(listEl, {handle, onChange})` |\n| `split.js` | `createSplit(container, {sizes, min, gutter, direction, onChange})` |\n\n各ファイル冒頭に使い方・副作用・元デモ番号を記載。TypeScript からは `index.d.ts` が型を提供する（`import { … } from './ui-kit/index.js'` で解決。`tsc --strict` で検証済み）。\n\n## テスト\n```\nnode ui-kit/test/run.mjs\n```\n前提：Node 18+、`playwright` パッケージと Chromium。`PLAYWRIGHT_MODULE`（playwright の解決パス）と `CHROMIUM_PATH` で場所を指定できる。ESモジュールは `file://` では読めないため、実行時に一時 HTTP サーバを立てる。\n","ui-kit/camera.js":"// camera.js — 画面座標 ⇄ ワールド座標の変換（パン・ズームの中核）\n// 参照デモ: 43 無限キャンバス / 44 ズーム中心維持 / 45 ミニマップ / 84 タイムライン\n//\n//   const cam = createCamera({ minScale: 0.25, maxScale: 4 });\n//   cam.toWorld(sx, sy) / cam.toScreen(wx, wy) / cam.panBy(dx, dy) / cam.zoomAt(sx, sy, factor)\n//   cam.transform → 'translate(x px, y px) scale(s)'（CSS transform 用）\n//   cam.subscribe(fn) で変更通知\nexport function createCamera({ x = 0, y = 0, scale = 1, minScale = 0.1, maxScale = 10 } = {}) {\n  const subs = new Set();\n  const cam = {\n    x, y, scale,\n    get transform() { return `translate(${cam.x}px, ${cam.y}px) scale(${cam.scale})`; },\n    toWorld: (sx, sy) => ({ x: (sx - cam.x) / cam.scale, y: (sy - cam.y) / cam.scale }),\n    toScreen: (wx, wy) => ({ x: wx * cam.scale + cam.x, y: wy * cam.scale + cam.y }),\n    panBy(dx, dy) { cam.x += dx; cam.y += dy; emit(); return cam; },\n    // sx, sy（画面座標）を不動点として倍率を factor 倍する\n    zoomAt(sx, sy, factor) {\n      const w = cam.toWorld(sx, sy);\n      cam.scale = Math.min(maxScale, Math.max(minScale, cam.scale * factor));\n      cam.x = sx - w.x * cam.scale; cam.y = sy - w.y * cam.scale;\n      emit(); return cam;\n    },\n    set(next) { Object.assign(cam, next); emit(); return cam; },\n    subscribe(fn) { subs.add(fn); return () => subs.delete(fn); },\n  };\n  const emit = () => subs.forEach(fn => fn(cam));\n  return cam;\n}\n\n// view 要素にパン（ドラッグ）とズーム（ホイール、カーソル基準）を取り付ける\n//   attachPanZoom(viewEl, cam, { wheelSensitivity: 0.002 }) → dispose\nexport function attachPanZoom(view, cam, { wheelSensitivity = 0.002, filter } = {}) {\n  let drag = null;\n  const local = (e) => { const r = view.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };\n  const down = (e) => { if (filter && !filter(e)) return; const p = local(e); drag = { x: p.x - cam.x, y: p.y - cam.y }; view.setPointerCapture(e.pointerId); };\n  const move = (e) => { if (!drag) return; const p = local(e); cam.set({ x: p.x - drag.x, y: p.y - drag.y }); };\n  const up = () => { drag = null; };\n  const wheel = (e) => { e.preventDefault(); const p = local(e); cam.zoomAt(p.x, p.y, Math.exp(-e.deltaY * wheelSensitivity)); };\n  view.addEventListener('pointerdown', down); view.addEventListener('pointermove', move);\n  view.addEventListener('pointerup', up); view.addEventListener('pointercancel', up);\n  view.addEventListener('wheel', wheel, { passive: false });\n  return () => {\n    view.removeEventListener('pointerdown', down); view.removeEventListener('pointermove', move);\n    view.removeEventListener('pointerup', up); view.removeEventListener('pointercancel', up);\n    view.removeEventListener('wheel', wheel);\n  };\n}\n","ui-kit/dist/ui-kit.js":"/* ui-kit 2026-09-05 — 自動生成（node ui-kit/build.mjs）。編集は各モジュール側で行う */\n(function (global, factory) {\n  if (typeof module === 'object' && module.exports) module.exports = factory();\n  else global.UIKit = factory();\n})(typeof globalThis !== 'undefined' ? globalThis : this, function () {\n  'use strict';\n\n// ---- drag.js ----\n// drag.js — ドラッグ操作の共通基盤（状態機械 + ポインタキャプチャ + 修飾キー制約）\n// 参照デモ: 02 パン / 49 ポインタキャプチャ / 51 修飾キー / 52 状態機械\n//\n// 使い方:\n//   const dispose = createDrag(el, {\n//     threshold: 4,                  // これ以上動いたら dragging（未満で離せば click 扱い）\n//     onStart(ctx) {}, onMove(ctx) {}, onEnd(ctx) {}, onClick(ctx) {}, onCancel(ctx) {},\n//   });\n//   ctx = { dx, dy, x, y, startX, startY, event, shift, alt, ctrl, meta, state }\n//\n// 副作用: el に pointer 系リスナーを追加し、touch-action:none を設定する。dispose() で解除。\nfunction createDrag(el, opts = {}) {\n  const { threshold = 4, capture = true, button = 0 } = opts;\n  let state = 'idle', start = null, pointerId = null;\n  const prevTouchAction = el.style.touchAction;\n  el.style.touchAction = 'none';\n\n  const ctxOf = (e) => ({\n    x: e.clientX, y: e.clientY, startX: start.x, startY: start.y,\n    dx: e.clientX - start.x, dy: e.clientY - start.y,\n    shift: e.shiftKey, alt: e.altKey, ctrl: e.ctrlKey, meta: e.metaKey, event: e, state,\n  });\n  const down = (e) => {\n    if (state !== 'idle' || (e.pointerType === 'mouse' && e.button !== button)) return;\n    if (opts.filter && !opts.filter(e)) return;\n    start = { x: e.clientX, y: e.clientY }; pointerId = e.pointerId; state = 'pressed';\n    if (capture) el.setPointerCapture(e.pointerId);\n  };\n  const move = (e) => {\n    if (state === 'idle' || e.pointerId !== pointerId) return;\n    if (state === 'pressed') {\n      if (Math.hypot(e.clientX - start.x, e.clientY - start.y) < threshold) return;\n      state = 'dragging'; opts.onStart?.(ctxOf(e));\n    }\n    opts.onMove?.(ctxOf(e));\n  };\n  const up = (e) => {\n    if (state === 'idle' || e.pointerId !== pointerId) return;\n    const was = state; state = 'idle';\n    was === 'dragging' ? opts.onEnd?.(ctxOf(e)) : opts.onClick?.(ctxOf(e));\n    start = null; pointerId = null;\n  };\n  const cancel = (e) => {\n    if (state === 'idle') return;\n    const was = state; state = 'idle';\n    if (was === 'dragging') opts.onCancel?.(ctxOf(e));\n    start = null; pointerId = null;\n  };\n  el.addEventListener('pointerdown', down);\n  el.addEventListener('pointermove', move);\n  el.addEventListener('pointerup', up);\n  el.addEventListener('pointercancel', cancel);\n  return () => {\n    el.removeEventListener('pointerdown', down); el.removeEventListener('pointermove', move);\n    el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', cancel);\n    el.style.touchAction = prevTouchAction;\n  };\n}\n\n// 修飾キーによる移動量の制約（51）\n//   constrain({dx, dy, shift, alt}, { grid: 20 }) → { dx, dy }\n//   shift: 軸固定（大きい方の軸だけ残す） / alt: grid に吸着\nfunction constrain(ctx, { grid = 0, axisLock = ctx.shift, snap = ctx.alt } = {}) {\n  let { dx, dy } = ctx;\n  if (axisLock) Math.abs(dx) > Math.abs(dy) ? (dy = 0) : (dx = 0);\n  if (snap && grid > 0) { dx = Math.round(dx / grid) * grid; dy = Math.round(dy / grid) * grid; }\n  return { dx, dy };\n}\n\n\n// ---- camera.js ----\n// camera.js — 画面座標 ⇄ ワールド座標の変換（パン・ズームの中核）\n// 参照デモ: 43 無限キャンバス / 44 ズーム中心維持 / 45 ミニマップ / 84 タイムライン\n//\n//   const cam = createCamera({ minScale: 0.25, maxScale: 4 });\n//   cam.toWorld(sx, sy) / cam.toScreen(wx, wy) / cam.panBy(dx, dy) / cam.zoomAt(sx, sy, factor)\n//   cam.transform → 'translate(x px, y px) scale(s)'（CSS transform 用）\n//   cam.subscribe(fn) で変更通知\nfunction createCamera({ x = 0, y = 0, scale = 1, minScale = 0.1, maxScale = 10 } = {}) {\n  const subs = new Set();\n  const cam = {\n    x, y, scale,\n    get transform() { return `translate(${cam.x}px, ${cam.y}px) scale(${cam.scale})`; },\n    toWorld: (sx, sy) => ({ x: (sx - cam.x) / cam.scale, y: (sy - cam.y) / cam.scale }),\n    toScreen: (wx, wy) => ({ x: wx * cam.scale + cam.x, y: wy * cam.scale + cam.y }),\n    panBy(dx, dy) { cam.x += dx; cam.y += dy; emit(); return cam; },\n    // sx, sy（画面座標）を不動点として倍率を factor 倍する\n    zoomAt(sx, sy, factor) {\n      const w = cam.toWorld(sx, sy);\n      cam.scale = Math.min(maxScale, Math.max(minScale, cam.scale * factor));\n      cam.x = sx - w.x * cam.scale; cam.y = sy - w.y * cam.scale;\n      emit(); return cam;\n    },\n    set(next) { Object.assign(cam, next); emit(); return cam; },\n    subscribe(fn) { subs.add(fn); return () => subs.delete(fn); },\n  };\n  const emit = () => subs.forEach(fn => fn(cam));\n  return cam;\n}\n\n// view 要素にパン（ドラッグ）とズーム（ホイール、カーソル基準）を取り付ける\n//   attachPanZoom(viewEl, cam, { wheelSensitivity: 0.002 }) → dispose\nfunction attachPanZoom(view, cam, { wheelSensitivity = 0.002, filter } = {}) {\n  let drag = null;\n  const local = (e) => { const r = view.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };\n  const down = (e) => { if (filter && !filter(e)) return; const p = local(e); drag = { x: p.x - cam.x, y: p.y - cam.y }; view.setPointerCapture(e.pointerId); };\n  const move = (e) => { if (!drag) return; const p = local(e); cam.set({ x: p.x - drag.x, y: p.y - drag.y }); };\n  const up = () => { drag = null; };\n  const wheel = (e) => { e.preventDefault(); const p = local(e); cam.zoomAt(p.x, p.y, Math.exp(-e.deltaY * wheelSensitivity)); };\n  view.addEventListener('pointerdown', down); view.addEventListener('pointermove', move);\n  view.addEventListener('pointerup', up); view.addEventListener('pointercancel', up);\n  view.addEventListener('wheel', wheel, { passive: false });\n  return () => {\n    view.removeEventListener('pointerdown', down); view.removeEventListener('pointermove', move);\n    view.removeEventListener('pointerup', up); view.removeEventListener('pointercancel', up);\n    view.removeEventListener('wheel', wheel);\n  };\n}\n\n\n// ---- virtual-list.js ----\n// virtual-list.js — 固定行高の仮想スクロール\n// 参照デモ: 23 仮想スクロール / 71 大規模グリッド / 72 ツリーグリッド\n//\n//   const vl = createVirtualList(viewEl, { rowHeight: 28, count: 100000, overscan: 2,\n//     renderRow: (index) => '<div class=\"row\">…\u003c/div>'   // 文字列か Element\n//   });\n//   vl.setCount(n) / vl.refresh() / vl.scrollToIndex(i) / vl.range() → {start, end} / vl.dispose()\n//\n// DOM: view の中に spacer(全体高) > rows(表示分だけ) を作る。view は overflow:auto であること。\nfunction createVirtualList(view, { rowHeight, count = 0, overscan = 2, renderRow }) {\n  const spacer = document.createElement('div');\n  const rows = document.createElement('div');\n  spacer.appendChild(rows); view.appendChild(spacer);\n  let total = count, last = { start: -1, end: -1 };\n\n  const render = (force = false) => {\n    const start = Math.max(0, Math.floor(view.scrollTop / rowHeight) - overscan);\n    const end = Math.min(total, Math.ceil((view.scrollTop + view.clientHeight) / rowHeight) + overscan);\n    if (!force && start === last.start && end === last.end) return;\n    last = { start, end };\n    rows.style.transform = `translateY(${start * rowHeight}px)`;\n    const frag = document.createDocumentFragment();\n    for (let i = start; i < end; i++) {\n      const r = renderRow(i);\n      if (typeof r === 'string') { const t = document.createElement('template'); t.innerHTML = r; frag.appendChild(t.content); }\n      else frag.appendChild(r);\n    }\n    rows.replaceChildren(frag);\n  };\n  const setCount = (n) => {\n    total = n; spacer.style.height = total * rowHeight + 'px';\n    const max = Math.max(0, total * rowHeight - view.clientHeight);\n    if (view.scrollTop > max) view.scrollTop = max;   // 行数が減ったときにブラウザの clamp を待たず自分で合わせる\n    render(true);\n  };\n  const onScroll = () => render();\n  view.addEventListener('scroll', onScroll);\n  const ro = new ResizeObserver(() => render(true)); ro.observe(view);\n  setCount(total);\n  return {\n    setCount, refresh: () => render(true), range: () => ({ ...last }),\n    scrollToIndex: (i) => { view.scrollTop = i * rowHeight; },\n    dispose() { view.removeEventListener('scroll', onScroll); ro.disconnect(); spacer.remove(); },\n  };\n}\n\n// ツリーを「展開中ノードだけの平坦配列」にする（72）\n//   flattenTree(nodes, { children: 'children', open: 'open' }) → [{ node, depth }]\nfunction flattenTree(nodes, { children = 'children', open = 'open' } = {}) {\n  const out = [];\n  const walk = (list, depth) => list.forEach(n => { out.push({ node: n, depth }); if (n[open] && n[children]?.length) walk(n[children], depth + 1); });\n  walk(nodes, 0);\n  return out;\n}\n\n\n// ---- undo.js ----\n// undo.js — スナップショット方式の履歴（Undo / Redo）\n// 参照デモ: 37\n//\n//   const h = createHistory(initialState, { limit: 100 });\n//   h.commit(nextState) / h.undo() / h.redo() / h.state / h.canUndo / h.canRedo / h.subscribe(fn)\n// 状態は不変オブジェクトとして扱う（commit には新しいオブジェクトを渡す）。\nfunction createHistory(initial, { limit = 100 } = {}) {\n  let past = [], future = [], state = initial;\n  const subs = new Set(), emit = () => subs.forEach(fn => fn(state));\n  return {\n    get state() { return state; },\n    get canUndo() { return past.length > 0; },\n    get canRedo() { return future.length > 0; },\n    commit(next) { past.push(state); if (past.length > limit) past.shift(); future = []; state = next; emit(); return state; },\n    undo() { if (!past.length)
