\\n  const N = 3000, recs = Array.from({ length: N }, (_, i) => `P-${String(i + 1).padStart(4, '0')} 部品${i + 1} ${['佐藤', '鈴木', '高橋'][i % 3]} ${['本社', '第2工場', '倉庫'][i % 3]}`);\\n  const q = $('#s74-q'), list = $('#s74-list'), out = $('#s74-out');\\n  const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };\\n  const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));\\n  // 部分一致：位置で <mark>\\n  const sub = (text, needle) => { const i = text.toLowerCase().indexOf(needle); return i < 0 ? null : { score: 1000 - i, html: esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + needle.length)) + '\u003c/mark>' + esc(text.slice(i + needle.length)) }; };\\n  // あいまい：文字を順に探し、連続・先頭で加点\\n  const fuzzy = (text, needle) => {\\n    const t = text.toLowerCase(); let ti = 0, score = 0, prev = -2, html = '';\\n    for (const ch of needle) {\\n      const i = t.indexOf(ch, ti); if (i < 0) return null;\\n      score += (i === prev + 1 ? 8 : 1) + (i === 0 ? 10 : 0) - (i - ti) * 0.1; // 連続+8、先頭+10、飛び越し減点\\n      html += esc(text.slice(ti, i)) + '<mark>' + esc(text[i]) + '\u003c/mark>'; prev = i; ti = i + 1;\\n    }\\n    return { score: score - text.length * 0.01, html: html + esc(text.slice(ti)) };  // 同点なら短い方を上に\\n  };\\n  const run = () => {\\n    const needle = q.value.trim().toLowerCase(), t0 = performance.now();\\n    const mode = $('input[name=s74]:checked').value;\\n    if (!needle) { list.innerHTML = recs.slice(0, 50).map(r => `<div>${esc(r)}\u003c/div>`).join(''); out.textContent = `全 ${N} 件（先頭50表示）`; return; }\\n    const hits = [];\\n    for (const r of recs) { const m = (mode === 'sub' ? sub : fuzzy)(r, needle); if (m) hits.push({ ...m, r }); }\\n    hits.sort((a, b) => b.score - a.score);\\n    list.innerHTML = hits.slice(0, 100).map(h => `<div><span>${h.html}\u003c/span><small>${h.score.toFixed(1)}\u003c/small>\u003c/div>`).join('') || '<div style=\\\"color:#6b7280\\\">該当なし\u003c/div>';\\n    out.textContent = `${hits.length} 件 / ${(performance.now() - t0).toFixed(1)}ms（上位100表示）`;\\n  };\\n  q.addEventListener('input', debounce(run, 250));  // ← 打鍵が止まってから実行\\n  $$('input[name=s74]').forEach(r => r.addEventListener('change', run));\\n  run();\\n})();\"},{\"page\":\"05-advanced.html\",\"pageTitle\":\"第3弾 D：業務アプリの上位UI（71〜85 抜粋）動くデモ\",\"id\":\"n75\",\"title\":\"75フォームの型 ステッパー / 条件分岐 / 途中保存 / 離脱警告\",\"what\":\"長い入力を①段階に分け（ステッパー）②回答に応じて項目を出し分け（条件分岐）③入力のたびに下書きを保存し（localStorage）④未保存のまま離れようとしたら警告する（beforeunload）。状態は「1つのオブジェクト」に集約し、画面はそれを描画するだけにすると分岐が破綻しない。\",\"how\":\"操作：入力して次へ。「分納あり」を選ぶと項目が増える。ページを再読込しても下書きが復元される。入力途中でタブを閉じようとすると警告が出る。\",\"html\":\"<div class=\\\"stage\\\">\\n    <div class=\\\"s75-steps\\\" id=\\\"s75-steps\\\">\u003c/div>\\n    <div id=\\\"s75-body\\\" class=\\\"s75-body\\\">\u003c/div>\\n    <div class=\\\"row\\\"><button id=\\\"s75-prev\\\">← 戻る\u003c/button><button id=\\\"s75-next\\\" class=\\\"primary\\\">次へ →\u003c/button><button id=\\\"s75-clear\\\">下書きを破棄\u003c/button><span class=\\\"readout\\\" id=\\\"s75-out\\\">-\u003c/span>\u003c/div>\\n  \u003c/div>\",\"css\":\".s75-steps { display: flex; gap: 6px; margin-bottom: 10px; font-size: 12px; }\\n.s75-steps span { flex: 1; padding: 4px 8px; border-radius: 4px; background: #e2e8f0; text-align: center; }\\n.s75-steps span.on { background: var(--accent); color: #fff; } .s75-steps span.done { background: #bbf7d0; }\\n.s75-body { background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; padding: 12px; margin-bottom: 8px; font-size: 13px; min-height: 90px; }\\n.s75-body label { display: block; margin-bottom: 6px; } .s75-body input[type=text], .s75-body select { margin-left: 6px; }\\n.s75-body .err { color: #dc2626; font-size: 12px; }\",\"js\":\"(() => {\\n  const KEY = 'ui-guide.s75.draft';\\n  const STEPS = ['顧客', '納品', '確認'];\\n  let form = { step: 0, customer: '', qty: '', split: 'no', splitCount: '', note: '' };\\n  let dirty = false;\\n  try { Object.assign(form, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch {}   // 復元\\n  const steps = $('#s75-steps'), body = $('#s75-body'), out = $('#s75-out');\\n  const save = () => { localStorage.setItem(KEY, JSON.stringify(form)); out.textContent = `下書き保存 ${new Date().toLocaleTimeString()}`; };\\n  const validate = () => form.step === 0 && !form.customer ? '顧客名は必須' : form.step === 1 && !(+form.qty > 0) ? '数量は1以上' : form.step === 1 && form.split === 'yes' && !(+form.splitCount > 1) ? '分納回数は2以上' : '';\\n  const render = () => {\\n    steps.innerHTML = STEPS.map((s, i) => `<span class=\\\"${i === form.step ? 'on' : i < form.step ? 'done' : ''}\\\">${i + 1}. ${s}\u003c/span>`).join('');\\n    body.innerHTML = [\\n      `<label>顧客名 <input type=\\\"text\\\" data-k=\\\"customer\\\" value=\\\"${form.customer}\\\">\u003c/label><label>備考 <input type=\\\"text\\\" data-k=\\\"note\\\" value=\\\"${form.note}\\\">\u003c/label>`,\\n      `<label>数量 <input type=\\\"text\\\" data-k=\\\"qty\\\" value=\\\"${form.qty}\\\">\u003c/label>\\n       <label>分納 <select data-k=\\\"split\\\"><option value=\\\"no\\\" ${form.split === 'no' ? 'selected' : ''}>なし\u003c/option><option value=\\\"yes\\\" ${form.split === 'yes' ? 'selected' : ''}>あり\u003c/option>\u003c/select>\u003c/label>\\n       ${form.split === 'yes' ? `<label>分納回数 <input type=\\\"text\\\" data-k=\\\"splitCount\\\" value=\\\"${form.splitCount}\\\">\u003c/label>` : ''}`,   // ← 条件分岐\\n      `<b>確認\u003c/b><br>顧客: ${form.customer} / 数量: ${form.qty} / 分納: ${form.split === 'yes' ? form.splitCount + '回' : 'なし'} / 備考: ${form.note || '-'}<br><br><button id=\\\"s75-submit\\\" class=\\\"primary\\\">送信\u003c/button>`\\n    ][form.step] + `<div class=\\\"err\\\" id=\\\"s75-err\\\">\u003c/div>`;\\n    $('#s75-prev').disabled = form.step === 0; $('#s75-next').hidden = form.step === 2;\\n    $('#s75-submit')?.addEventListener('click', () => { localStorage.removeItem(KEY); dirty = false; form = { step: 0, customer: '', qty: '', split: 'no', splitCount: '', note: '' }; out.textContent = '送信完了（下書き削除）'; render(); });\\n  };\\n  body.addEventListener('input', e => { const k = e.target.dataset.k; if (!k) return; form[k] = e.target.value; dirty = true; save(); if (k === 'split') render(); });\\n  $('#s75-next').onclick = () => { const err = validate(); if (err) { $('#s75-err').textContent = err; return; } form.step++; save(); render(); };\\n  $('#s75-prev').onclick = () => { form.step--; save(); render(); };\\n  $('#s75-clear').onclick = () => { localStorage.removeItem(KEY); dirty = false; form = { step: 0, customer: '', qty: '', split: 'no', splitCount: '', note: '' }; out.textContent = '破棄'; render(); };\\n  window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });  // 離脱警告（文言はブラウザ固定）\\n  render(); if (localStorage.getItem(KEY)) out.textContent = '下書きを復元しました';\\n})();\"},{\"page\":\"05-advanced.html\",\"pageTitle\":\"第3弾 D：業務アプリの上位UI（71〜85 抜粋）動くデモ\",\"id\":\"n76\",\"title\":\"76バッチ操作UI 複数選択 → 一括変更 → プレビュー → 確定 → 進捗と部分失敗\",\"what\":\"一括更新は「取り消しにくい」ので、確定前にプレビュー（何が何に変わるか）を必ず見せる。実行中は進捗を出し、一部失敗しても止めずに完走させ、最後に「失敗分だけ再試行」を提供する。kintone の PUT /k/v1/records.json（100件上限）に合わせてチャンク分割する形。\",\"how\":\"操作：行をチェック → ステータスを選ぶ → プレビュー → 実行。約20%が失敗するので再試行を試す。\",\"html\":\"<div class=\\\"stage\\\">\\n    <div class=\\\"row\\\"><label><input type=\\\"checkbox\\\" id=\\\"s76-all\\\"> 全選択\u003c/label><select id=\\\"s76-status\\\"><option value=\\\"\\\">変更後ステータス…\u003c/option><option>受注\u003c/option><option>製造中\u003c/option><option>出荷済\u003c/option>\u003c/select><button id=\\\"s76-preview\\\">プレビュー\u003c/button><span class=\\\"readout\\\" id=\\\"s76-out\\\">-\u003c/span>\u003c/div>\\n    <div class=\\\"row\\\" style=\\\"align-items:flex-start\\\">\\n      <table class=\\\"mini\\\" id=\\\"s76-t\\\" style=\\\"flex:1\\\">\u003c/table>\\n      <div id=\\\"s76-panel\\\" style=\\\"flex:1;font-size:13px\\\">\u003c/div>\\n    \u003c/div>\\n  \u003c/div>\",\"css\":\"\",\"js\":\"(() => {\\n  const recs = Array.from({ length: 8 }, (_, i) => ({ id: 1001 + i, name: `受注 #${1001 + i}`, status: ['受注', '製造中', '受注', '出荷済'][i % 4] }));\\n  const t = $('#s76-t'), panel = $('#s76-panel'), out = $('#s76-out'), sel = new Set();\\n  const fakeUpdate = rec => new Promise((ok, ng) => setTimeout(() => Math.random() < 0.2 ? ng(new Error('timeout')) : ok(), 150 + Math.random() * 200));\\n  const render = () => t.innerHTML = '<tr><th>\u003c/th><th>ID\u003c/th><th>名称\u003c/th><th>ステータス\u003c/th>\u003c/tr>' + recs.map(r => `<tr><td><input type=\\\"checkbox\\\" data-id=\\\"${r.id}\\\" ${sel.has(r.id) ? 'checked' : ''}>\u003c/td><td>${r.id}\u003c/td><td>${r.name}\u003c/td><td>${r.status}\u003c/td>\u003c/tr>`).join('');\\n  t.addEventListener('change', e => { const id = +e.target.dataset.id; e.target.checked ? sel.add(id) : sel.delete(id); out.textContent = `${sel.size} 件選択`; });\\n  $('#s76-all').onchange = e => { recs.forEach(r => e.target.checked ? sel.add(r.id) : sel.delete(r.id)); render(); out.textContent = `${sel.size} 件選択`; };\\n  $('#s76-preview').onclick = () => {\\n    const to = $('#s76-status').value; if (!to || !sel.size) { out.textContent = '選択とステータスが必要'; return; }\\n    const changes = recs.filter(r => sel.has(r.id) && r.status !== to).map(r => ({ r, from: r.status, to }));\\n    panel.innerHTML = `<b>プレビュー（${changes.length} 件が変わる、${sel.size - changes.length} 件は変更なし）\u003c/b><table class=\\\"mini\\\">` + changes.map(c => `<tr><td>${c.r.name}\u003c/td><td>${c.from}\u003c/td><td>→\u003c/td><td>${c.to}\u003c/td>\u003c/tr>`).join('') + `\u003c/table><div class=\\\"row\\\" style=\\\"margin-top:6px\\\"><button id=\\\"s76-run\\\" class=\\\"primary\\\">実行\u003c/button>\u003c/div><progress id=\\\"s76-p\\\" max=\\\"${changes.length}\\\" value=\\\"0\\\" style=\\\"width:100%\\\" hidden>\u003c/progress><div id=\\\"s76-res\\\">\u003c/div>`;\\n    $('#s76-run').onclick = () => run(changes);\\n  };\\n  async function run(changes) {\\n    const p = $('#s76-p'), res = $('#s76-res'); p.hidden = false; p.value = 0; $('#s76-run').disabled = true;\\n    const failed = [];\\n    const CHUNK = 3;                                                     // API上限に合わせて分割\\n    for (let i = 0; i < changes.length; i += CHUNK) {\\n      const chunk = changes.slice(i, i + CHUNK);\\n      await Promise.all(chunk.map(c => fakeUpdate(c.r).then(() => { c.r.status = c.to; }).catch(err => failed.push({ ...c, err }))));\\n      p.value = Math.min(changes.length, i + CHUNK); render();\\n    }\\n    res.innerHTML = `<b>完了：成功 ${changes.length - failed.length} / 失敗 ${failed.length}\u003c/b>` + (failed.length ? `<ul style=\\\"margin:4px 0\\\">${failed.map(f => `<li>${f.r.name}（${f.err.message}）\u003c/li>`).join('')}\u003c/ul><button id=\\\"s76-retry\\\">失敗分だけ再試行\u003c/button>` : '');\\n    $('#s76-retry')?.addEventListener('click', () => run(failed.map(f => ({ r: f.r, from: f.from, to: f.to }))));\\n  }\\n  render();\\n})();\"},{\"page\":\"05-advanced.html\",\"pageTitle\":\"第3弾 D：業務アプリの上位UI（71〜85 抜粋）動くデモ\",\"id\":\"n77\",\"title\":\"77差分表示 変更前後のハイライト / 変更履歴の切替\",\"what\":\"レコードの版（リビジョン）を並べ、①項目単位で「変更あり」を色分けし、②長文は単語単位の差分（LCS）で削除・追加を示す。kintone の変更履歴を「何がどう変わったか」まで見せる形。差分アルゴリズムは単語配列のLCSで十分（数百語規模なら瞬時）。\",\"how\":\"操作：比較する版を左右で選ぶ。\",\"html\":\"<div class=\\\"stage\\\">\\n    <div class=\\\"row\\\">比較元 <select id=\\\"s77-a\\\">\u003c/select> → 比較先 <select id=\\\"s77-b\\\">\u003c/select>\u003c/div>\\n    <table class=\\\"mini\\\" id=\\\"s77-t\\\" style=\\\"width:100%\\\">\u003c/table>\\n  \u003c/div>\",\"css\":\"#s77-t td.chg { background: #fef3c7; }\\n#s77-t del { background: #fecaca; text-decoration: line-through; } #s77-t ins { background: #bbf7d0; text-decoration: none; }\",\"js\":\"(() => {\\n  const revs = [\\n    { rev: 1, at: '09-01 10:12', by: '佐藤', f: { 顧客: '株式会社サンプル', 数量: '100', 納期: '2026-09-20', 備考: '通常納品。梱包は 標準 仕様で 依頼。' } },\\n    { rev: 2, at: '09-02 15:40', by: '鈴木', f: { 顧客: '株式会社サンプル', 数量: '120', 納期: '2026-09-20', 備考: '通常納品。梱包は 強化 仕様で 依頼。分納可。' } },\\n    { rev: 3, at: '09-04 09:05', by: '高橋', f: { 顧客: '株式会社サンプル 本社', 数量: '120', 納期: '2026-09-25', 備考: '梱包は 強化 仕様で 依頼。分納可。' } },\\n  ];\\n  const a = $('#s77-a'), b = $('#s77-b'), t = $('#s77-t');\\n  a.innerHTML = b.innerHTML = revs.map(r => `<option value=\\\"${r.rev}\\\">rev${r.rev} ${r.at} ${r.by}\u003c/option>`).join('');\\n  a.value = 1; b.value = 3;\\n  const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));\\n  // 単語単位の差分（LCS）\\n  const wordDiff = (x, y) => {\\n    const A = x.split(/(\\\\s+)/), B = y.split(/(\\\\s+)/), n = A.length, m = B.length;\\n    const L = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));\\n    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);\\n    let i = 0, j = 0, html = '';\\n    while (i < n && j < m) {\\n      if (A[i] === B[j]) { html += esc(A[i]); i++; j++; }\\n      else if (L[i + 1][j] >= L[i][j + 1]) { html += `<del>${esc(A[i])}\u003c/del>`; i++; }\\n      else { html += `<ins>${esc(B[j])}\u003c/ins>`; j++; }\\n    }\\n    while (i < n) html += `<del>${esc(A[i++])}\u003c/del>`; while (j < m) html += `<ins>${esc(B[j++])}\u003c/ins>`;\\n    return html;\\n  };\\n  const render = () => {\\n    const ra = revs.find(r => r.rev == a.value), rb = revs.find(r => r.rev == b.value);\\n    t.innerHTML = '<tr><th>項目\u003c/th><th>比較元\u003c/th><th>比較先\u003c/th><th>差分\u003c/th>\u003c/tr>' + Object.keys(ra.f).map(k => {\\n      const chg = ra.f[k] !== rb.f[k];\\n      return `<tr><td>${k}\u003c/td><td class=\\\"${chg ? 'chg' : ''}\\\">${esc(ra.f[k])}\u003c/td><td class=\\\"${chg ? 'chg' : ''}\\\">${esc(rb.f[k])}\u003c/td><td>${chg ? wordDiff(ra.f[k], rb.f[k]) : '<span style=\\\"color:#9ca3af\\\">変更なし\u003c/span>'}\u003c/td>\u003c/tr>`;\\n    }).join('');\\n  };\\n  a.onchange = b.onchange = render; render();\\n})();\"},{\"page\":\"05-advanced.html\",\"pageTitle\":\"第3弾 D：業務アプリの上位UI（71〜85 抜粋）動くデモ\",\"id\":\"n80\",\"title\":\"80ドッキングレイアウト完成形 タブ移動 / 分割リサイズ / 分離（フローティング） / レイアウト保存\",\"what\":\"IDE風の骨格。「パネル（内容）」と「ゾーン（置き場所）」を分けて考え、レイアウト状態を1つのJSONで持つ：{ zones: { left:[...], center:[...], right:[...] }, float:[...], widths:[...] }。描画はこのJSONから毎回組み立て直す。保存・復元はJSONを localStorage に入れるだけ。\",\"how\":\"操作：タブを別ゾーンへドラッグ／境界をドラッグ／タブの「⧉」で分離、フローティングの「⊡」で戻す／「保存」→再読込で復元。\",\"html\":\"<div class=\\\"stage tall\\\" style=\\\"padding:0\\\">\\n    <div class=\\\"row\\\" style=\\\"padding:6px 8px;border-bottom:1px solid #e5e7eb;background:#fff\\\"><button id=\\\"s80-save\\\">レイアウト保存\u003c/button><button id=\\\"s80-reset\\\">初期化\u003c/button><span class=\\\"readout\\\" id=\\\"s80-out\\\">-\u003c/span>\u003c/div>\\n    <div id=\\\"s80-dock\\\" class=\\\"s80-dock\\\">\u003c/div>\\n    <div id=\\\"s80-float\\\">\u003c/div>\\n  \u003c/div>\",\"css\":\".s80-dock { display: grid; height: 300px; grid-template-columns: var(--cols); position: relative; user-select: none; }\\n.s80-zone { display: flex; flex-direction: column; min-width: 0; background: #fff; }\\n.s80-zone.over { outline: 2px dashed var(--accent); outline-offset: -2px; }\\n.s80-tabs { display: flex; background: #f1f5f9; border-bottom: 1px solid #cbd5e1; min-height: 28px; }\\n.s80-tab { padding: 4px 10px; font-size: 12px; border-right: 1px solid #cbd5e1; cursor: grab; display: flex; gap: 6px; align-items: center; touch-action: none; }\\n.s80-tab.on { background: #fff; font-weight: 600; } .s80-tab.drag { opacity: .4; }\\n.s80-tab i { font-style: normal; cursor: pointer; color: var(--muted); }\\n.s80-content { flex: 1; padding: 10px; font-size: 13px; color: var(--muted); overflow: auto; }\\n.s80-gutter { background: #cbd5e1; cursor: col-resize; touch-action: none; }\\n.s80-win { position: absolute; width: 220px; background: #fff; border: 1px solid #94a3b8; border-radius: 8px; box-shadow: 0 12px 30px rgba(0,0,0,.25); overflow: hidden; z-index: 10; }\\n.s80-win .s80-tabs { cursor: move; touch-action: none; }\",\"js\":\"(() => {\\n  const KEY = 'ui-guide.s80.layout';\\n  const PANELS = { list: '一覧', detail: '詳細', log: 'ログ', props: 'プロパティ', tree: 'ツリー' };\\n  const DEFAULT = () => ({ zones: { left: ['tree'], center: ['list', 'detail'], right: ['props', 'log'] }, active: { left: 'tree', center: 'list', right: 'props' }, float: [], widths: [180, 180] });\\n  let L; try { L = JSON.parse(localStorage.getItem(KEY)) || DEFAULT(); } catch { L = DEFAULT(); }\\n  const dock = $('#s80-dock'), fl = $('#s80-float'), out = $('#s80-out');\\n  const render = () => {\\n    dock.style.setProperty('--cols', `${L.widths[0]}px 6px 1fr 6px ${L.widths[1]}px`);\\n    dock.innerHTML = ['left', 'center', 'right'].map((z, i) => `${i ? `<div class=\\\"s80-gutter\\\" data-g=\\\"${i - 1}\\\">\u003c/div>` : ''}<div class=\\\"s80-zone\\\" data-zone=\\\"${z}\\\">\\n      <div class=\\\"s80-tabs\\\">${L.zones[z].map(p => `<div class=\\\"s80-tab ${L.active[z] === p ? 'on' : ''}\\\" data-p=\\\"${p}\\\" data-zone=\\\"${z}\\\">${PANELS[p]}<i data-pop=\\\"${p}\\\" title=\\\"分離\\\">⧉\u003c/i>\u003c/div>`).join('')}\u003c/div>\\n      <div class=\\\"s80-content\\\">${L.active[z] && L.zones[z].includes(L.active[z]) ? PANELS[L.active[z]] + ' の内容' : '（空）'}\u003c/div>\u003c/div>`).join('');\\n    fl.innerHTML = L.float.map(f => `<div class=\\\"s80-win\\\" data-p=\\\"${f.p}\\\" style=\\\"left:${f.x}px;top:${f.y}px\\\"><div class=\\\"s80-tabs\\\"><div class=\\\"s80-tab on\\\" data-p=\\\"${f.p}\\\" data-float=\\\"1\\\">${PANELS[f.p]}<i data-dock=\\\"${f.p}\\\" title=\\\"ドックへ戻す\\\">⊡\u003c/i>\u003c/div>\u003c/div><div class=\\\"s80-content\\\">${PANELS[f.p]} の内容（分離）\u003c/div>\u003c/div>`).join('');\\n    out.textContent = JSON.stringify({ zones: L.zones, float: L.float.map(f => f.p) });\\n  };\\n  const removeEverywhere = p => { for (const z in L.zones) L.zones[z] = L.zones[z].filter(x => x !== p); L.float = L.float.filter(f => f.p !== p); };\\n  // タブ操作：クリックで切替、ドラッグでゾーン移動、⧉で分離、⊡で戻す\\n  let drag = null;\\n  dock.parentElement.addEventListener('pointerdown', e => {\\n    if (e.target.dataset.pop) { const p = e.target.dataset.pop; removeEverywhere(p); L.float.push({ p, x: 60 + L.float.length * 20, y: 60 + L.float.length * 20 }); render(); return; }\\n    if (e.target.dataset.dock) { const p = e.target.dataset.dock; removeEverywhere(p); L.zones.center.push(p); L.active.center = p; render(); return; }\\n    const g = e.target.closest('[data-g]'); if (g) { drag = { type: 'gutter', g: +g.dataset.g, x: e.clientX, w: [...L.widths] }; g.setPointerCapture(e.pointerId); return; }\\n    const tab = e.target.closest('.s80-tab');\\n    if (tab && tab.dataset.float) { const win = tab.closest('.s80-win'), f = L.float.find(f => f.p === tab.dataset.p); drag = { type: 'win', f, dx: e.clientX - f.x, dy: e.clientY - f.y, win }; tab.setPointerCapture(e.pointerId); return; }\\n    if (tab) { L.active[tab.dataset.zone] = tab.dataset.p; render(); drag = { type: 'tab', p: tab.dataset.p, from: tab.dataset.zone, moved: false }; $(`.s80-tab[data-p=\\\"${tab.dataset.p}\\\"]`, dock)?.setPointerCapture(e.pointerId); }\\n  });\\n  dock.parentElement.addEventListener('pointermove', e => {\\n    if (!drag) return;\\n    if (drag.type === 'gutter') { const d = e.clientX - drag.x; L.widths[drag.g] = Math.max(100, drag.w[drag.g] + (drag.g === 0 ? d : -d)); dock.style.setProperty('--cols', `${L.widths[0]}px 6px 1fr 6px ${L.widths[1]}px`); }\\n    else if (drag.type === 'win') { drag.f.x = e.clientX - drag.dx; drag.f.y = e.clientY - drag.dy; drag.win.style.left = drag.f.x + 'px'; drag.win.style.top = drag.f.y + 'px'; }\\n    else if (drag.type === 'tab') { drag.moved = true; const z = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-zone]'); $$('.s80-zone', dock).forEach(el => el.classList.toggle('over', el === z && z.dataset.zone !== drag.from)); $(`.s80-tab[data-p=\\\"${drag.p}\\\"]`, dock)?.classList.add('drag'); }\\n  });\\n  dock.parentElement.addEventListener('pointerup', e => {\\n    if (drag?.type === 'tab' && drag.moved) {\\n      const z = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-zone]')?.dataset.zone;\\n      if (z && z !== drag.from) { removeEverywhere(drag.p); L.zones[z].push(drag.p); L.active[z] = drag.p; if (L.active[drag.from] === drag.p) L.active[drag.from] = L.zones[drag.from][0]; }\\n      render();\\n    }\\n    drag = null; $$('.s80-zone', dock).forEach(el => el.classList.remove('over')); $$('.s80-tab', dock).forEach(t => t.classList.remove('drag'));\\n  });\\n  $('#s80-save').onclick = () => { localStorage.setItem(KEY, JSON.stringify(L)); out.textContent = '保存しました（再読込で復元）'; };\\n  $('#s80-reset').onclick = () => { localStorage.removeItem(KEY); L = DEFAULT(); render(); };\\n  render();\\n})();\"},{\"page\":\"05-advanced.html\",\"pageTitle\":\"第3弾 D：業務アプリの上位UI（71〜85 抜粋）動くデモ\",\"id\":\"n81\",\"title\":\"81ワークスペース永続化 画面状態の保存と復元\",\"what\":\"「どのタブを開いていたか」「どこまでスクロールしていたか」「何を選んでいたか」「絞り込み条件」を1つのオブジェクトにまとめ、変更のたびに（デバウンスして）保存する。起動時にそれを読み、描画してから scrollTop を戻す。ユーザーは「昨日の続き」から始められる。\",\"how\":\"操作：タブ・絞り込み・選択・スクロールを変えてからページを再読込（F5）。同じ状態に戻る。\",\"html\":\"<div class=\\\"stage\\\">\\n    <div class=\\\"row\\\"><button data-tab=\\\"orders\\\">受注\u003c/button><button data-tab=\\\"parts\\\">部品\u003c/button><input id=\\\"s81-filter\\\" type=\\\"text\\\" placeholder=\\\"絞り込み\\\" style=\\\"width:120px\\\"><button id=\\\"s81-clear\\\">状態を消す\u003c/button>\u003c/div>\\n    <div id=\\\"s81-list\\\" class=\\\"s81-list\\\">\u003c/div>\\n    <div class=\\\"readout\\\" id=\\\"s81-out\\\" style=\\\"margin-top:6px;white-space:pre-wrap\\\">\u003c/div>\\n  \u003c/div>\",\"css\":\".s81-list { height: 130px; overflow: auto; background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; }\\n.s81-list div { padding: 3px 10px; border-bottom: 1px solid #f1f5f9; cursor: default; } .s81-list div.sel { background: var(--accent-soft); }\",\"js\":\"(() => {\\n  const KEY = 'ui-guide.s81.workspace';\\n  let ws = { tab: 'orders', filter: '', selected: null, scroll: 0 };\\n  try { Object.assign(ws, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch {}\\n  const list = $('#s81-list'), out = $('#s81-out'), filter = $('#s81-filter');\\n  const debounce = (fn, ms) => { let t; return () => { clearTimeout(t); t = setTimeout(fn, ms); }; };\\n  const persist = debounce(() => { localStorage.setItem(KEY, JSON.stringify(ws)); out.textContent = 'saved: ' + JSON.stringify(ws); }, 200);\\n  const rows = tab => Array.from({ length: 60 }, (_, i) => tab === 'orders' ? `受注 #${1001 + i}` : `部品 P-${String(i + 1).padStart(3, '0')}`);\\n  const render = () => {\\n    $$('[data-tab]').forEach(b => b.classList.toggle('primary', b.dataset.tab === ws.tab));\\n    filter.value = ws.filter;\\n    list.innerHTML = rows(ws.tab).filter(r => r.includes(ws.filter)).map(r => `<div class=\\\"${r === ws.selected ? 'sel' : ''}\\\">${r}\u003c/div>`).join('');\\n    list.scrollTop = ws.scroll;                     // 描画後にスクロール位置を戻す\\n    out.textContent = 'state: ' + JSON.stringify(ws);\\n  };\\n  $$('[data-tab]').forEach(b => b.onclick = () => { ws.tab = b.dataset.tab; ws.scroll = 0; ws.selected = null; render(); persist(); });\\n  filter.addEventListener('input', () => { ws.filter = filter.value; ws.scroll = 0; render(); persist(); });\\n  list.addEventListener('click', e => { if (e.target.tagName === 'DIV') { ws.selected = e.target.textContent; render(); persist(); } });\\n  list.addEventListener('scroll', () => { ws.scroll = list.scrollTop; persist(); });\\n  $('#s81-clear').onclick = () => { localStorage.removeItem(KEY); ws = { tab: 'orders', filter: '', selected: null, scroll: 0 }; render(); };\\n  render();\\n})();\"},{\"page\":\"05-advanced.html\",\"pageTitle\":\"第3弾 D：業務アプリの上位UI（71〜85 抜粋）動くデモ\",\"id\":\"n85\",\"title\":\"85マルチウィンドウ同期 BroadcastChannel / Electron IPC\",\"what\":\"同じアプリを複数ウィンドウ（タブ）で開いたとき、片方の変更をもう片方へ即時に反映する。ブラウザ／Electron renderer 同士なら BroadcastChannel が最も簡単（同一オリジン内で全ウィンドウに届く）。Electron でメインプロセスが「真実の状態」を持つ設計なら、IPC で全ウィンドウへ配信する。\",\"how\":\"操作：「別ウィンドウで開く」でこのページをもう1つ開き、片方でカウンタや選択を変えると、もう片方に即反映される。\",\"html\":\"<div class=\\\"stage\\\">\\n    <div class=\\\"row\\\"><button id=\\\"s85-open\\\">別ウィンドウで開く\u003c/button><button id=\\\"s85-inc\\\">カウンタ +1\u003c/button><select id=\\\"s85-sel\\\"><option>受注\u003c/option><option>製造中\u003c/option><option>出荷済\u003c/option>\u003c/select><span class=\\\"readout\\\" id=\\\"s85-out\\\">-\u003c/span>\u003c/div>\\n    <div class=\\\"log\\\" id=\\\"s85-log\\\">\u003c/div>\\n  \u003c/div>\",\"css\":\"\",\"js\":\"(() => {\\n  // 経路1: BroadcastChannel（同一オリジンの全ウィンドウへ）。経路2: localStorage の storage イベント（file:// など BroadcastChannel が届かない環境の保険）\\n  const ch = new BroadcastChannel('ui-guide.s85'), KEY = 'ui-guide.s85.msg';\\n  const me = Math.random().toString(36).slice(2, 6), log = $('#s85-log'), out = $('#s85-out'), sel = $('#s85-sel'), seen = new Set();\\n  let state = { count: 0, status: '受注' };\\n  const apply = (s, from) => { state = s; sel.value = s.status; out.textContent = `count=${s.count} status=${s.status} (this window: ${me})`; if (from) logTo(log, `← ${from} から受信: ${JSON.stringify(s)}`); };\\n  const send = msg => { msg.id = me + ':' + Date.now() + Math.random(); ch.postMessage(msg); try { localStorage.setItem(KEY, JSON.stringify(msg)); } catch {} };\\n  const receive = msg => {\\n    if (!msg || msg.from === me || seen.has(msg.id)) return; seen.add(msg.id);   // 2経路で届いても1回だけ処理\\n    if (msg.type === 'hello') { send({ from: me, state }); return; }             // 新規ウィンドウには現状を返す\\n    apply(msg.state, msg.from);\\n  };\\n  ch.onmessage = e => receive(e.data);\\n  window.addEventListener('storage', e => { if (e.key === KEY && e.newValue) receive(JSON.parse(e.newValue)); });\\n  const publish = () => { send({ from: me, state }); apply(state); logTo(log, `→ 送信: ${JSON.stringify(state)}`); };\\n  send({ type: 'hello', from: me });                        // 起動時：誰かいれば状態をもらう\\n  $('#s85-inc').onclick = () => { state.count++; publish(); };\\n  sel.onchange = () => { state.status = sel.value; publish(); };\\n  $('#s85-open').onclick = () => window.open(location.href.split('#')[0] + '#n85', '_blank', 'width=900,height=600');\\n  apply(state);\\n})();\"},{\"page\":\"05-advanced.html\",\"pageTitle\":\"第3弾 D：業務アプリの上位UI（71〜85 抜粋）動くデモ\",\"id\":\"n72\",\"title\":\"72ツリー / 階層グリッド Tree grid with virtual scroll\",\"what\":\"部品表（BOM）や組織のような階層を、展開状態を持ったまま仮想スクロールする。コツは「木」をそのまま描かず、展開中のノードだけを平坦な配列に変換してから 23 の仮想スクロールに渡すこと。展開／折りたたみは平坦化をやり直すだけ。\",\"how\":\"操作：▶ で展開。全展開（2,440ノード）しても DOM 行数は増えない。\",\"html\":\"<div class=\\\"stage\\\">\\n    <div class=\\\"row\\\"><button id=\\\"s72-expand\\\">全展開\u003c/button><button id=\\\"s72-collapse\\\">全折りたたみ\u003c/button><span class=\\\"readout\\\" id=\\\"s72-out\\\">\u003c/span>\u003c/div>\\n    <div id=\\\"s72-view\\\" class=\\\"s72-view\\\"><div id=\\\"s72-spacer\\\"><div id=\\\"s72-rows\\\">\u003c/div>\u003c/div>\u003c/div>\\n  \u003c/div>\",\"css\":\".s72-view { height: 200px; overflow-y: auto; background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; user-select: none; }\\n.s72-row { height: 26px; line-height: 26px; border-bottom: 1px solid #f1f5f9; white-space: nowrap; }\\n.s72-row .tg { display: inline-block; width: 18px; text-align: center; cursor: pointer; color: var(--muted); }\",\"js\":\"(() => {\\n  // 3階層のツリー（40 × 10 × 5 = 2,000ノード）\\n  const tree = Array.from({ length: 40 }, (_, i) => ({ name: `製品 ${i + 1}`, open: false, children: Array.from({ length: 10 }, (_, j) => ({ name: `ユニット ${i + 1}-${j + 1}`, open: false, children: Array.from({ length: 5 }, (_, k) => ({ name: `部品 ${i + 1}-${j + 1}-${k + 1}`, children: [] })) })) }));\\n  const H = 26, view = $('#s72-view'), spacer = $('#s72-spacer'), rows = $('#s72-rows'), out = $('#s72-out');\\n  const TOTAL = (c => { const walk = ns => ns.reduce((a, n) => a + 1 + walk(n.children), 0); return walk(c); })(tree);\\n  let flat = [];\\n  const flatten = () => { flat = []; const walk = (nodes, depth) => nodes.forEach(n => { flat.push({ n, depth }); if (n.open) walk(n.children, depth + 1); }); walk(tree, 0); spacer.style.height = flat.length * H + 'px'; };\\n  const render = () => {\\n    const start = Math.floor(view.scrollTop / H), count = Math.ceil(view.clientHeight / H) + 2;\\n    rows.style.transform = `translateY(${start * H}px)`;\\n    rows.innerHTML = flat.slice(start, start + count).map(({ n, depth }, i) => `<div class=\\\"s72-row\\\" style=\\\"padding-left:${depth * 18 + 6}px\\\"><span class=\\\"tg\\\" data-i=\\\"${start + i}\\\">${n.children.length ? (n.open ? '▼' : '▶') : '·'}\u003c/span>${n.name}\u003c/div>`).join('');\\n    out.textContent = `表示中ノード ${flat.length.toLocaleString()} / 全 ${TOTAL.toLocaleString()} / DOM ${rows.children.length} 行`;\\n  };\\n  rows.addEventListener('click', e => { const i = e.target.dataset.i; if (i == null) return; const n = flat[i].n; if (n.children.length) { n.open = !n.open; flatten(); render(); } });\\n  view.addEventListener('scroll', render);\\n  const setAll = open => { const walk = ns => ns.forEach(n => { if (n.children.length) { n.open = open; walk(n.children); } }); walk(tree); flatten(); render(); };\\n  $('#s72-expand').onclick = () => setAll(true); $('#s72-collapse').onclick = () => setAll(false);\\n  flatten(); render();\\n})();\"},{\"page\":\"05-advanced.html\",\"pageTitle\":\"第3弾 D：業務アプリの上位UI（71〜85 抜粋）動くデモ\",\"id\":\"n73\",\"title\":\"73ピボット集計ビュー Pivot with drag-to-assign axes\",\"what\":\"レコード一覧を「行の軸」「列の軸」「集計値」に振り分けて集計表を作る。項目チップを枠へドラッグして軸を組み替える。集計は Map に「行キー｜列キー」で足し込むだけ。kintone のレコードを取得した後の分析ビューとして使える。\",\"how\":\"操作：チップを「行」「列」の枠へドラッグ（HTML標準DnD）。「値」は数量/金額を切替。\",\"html\":\"<div class=\\\"stage\\\">\\n    <div class=\\\"row\\\"><span>項目：\u003c/span><span id=\\\"s73-fields\\\">\u003c/span>\u003c/div>\\n    <div class=\\\"row\\\"><span>行：\u003c/span><span class=\\\"s73-zone\\\" data-axis=\\\"row\\\">\u003c/span><span>列：\u003c/span><span class=\\\"s73-zone\\\" data-axis=\\\"col\\\">\u003c/span><span>値：\u003c/span><select id=\\\"s73-val\\\"><option value=\\\"qty\\\">数量\u003c/option><option value=\\\"amount\\\">金額\u003c/option>\u003c/select>\u003c/div>\\n    <div style=\\\"overflow:auto\\\"><table class=\\\"mini\\\" id=\\\"s73-t\\\">\u003c/table>\u003c/div>\\n  \u003c/div>\",\"css\":\".s73-chip { display: inline-block; padding: 2px 10px; margin: 2px; border-radius: 999px; background: #e0e7ff; color: #3730a3; font-size: 12px; cursor: grab; }\\n.s73-zone { display: inline-block; min-width: 90px; min-height: 26px; padding: 2px; border: 1px dashed #94a3b8; border-radius: 6px; vertical-align: middle; margin-right: 12px; }\\n.s73-zone.over { border-color: var(--accent); background: var(--accent-soft); }\\n#s73-t td.num { text-align: right; } #s73-t .tot { font-weight: 600; background: #f8fafc; }\",\"js\":\"(() => {\\n  const FIELDS = { site: '拠点', person: '担当', month: '月', status: 'ステータス' };\\n  const recs = Array.from({ length: 200 }, (_, i) => ({ site: ['本社', '第2工場', '倉庫'][i % 3], person: ['佐藤', '鈴木', '高橋', '田中'][i % 4], month: `${(i % 6) + 4}月`, status: ['受注', '製造中', '出荷済'][(i * 7) % 3], qty: (i % 9 + 1) * 10, amount: (i % 9 + 1) * 10 * (100 + (i % 5) * 50) }));\\n  const axes = { row: 'site', col: 'month' };\\n  const fields = $('#s73-fields'), t = $('#s73-t');\\n  fields.innerHTML = Object.entries(FIELDS).map(([k, v]) => `<span class=\\\"s73-chip\\\" draggable=\\\"true\\\" data-f=\\\"${k}\\\">${v}\u003c/span>`).join('');\\n  fields.addEventListener('dragstart', e => e.dataTransfer.setData('text/plain', e.target.dataset.f));\\n  $$('.s73-zone').forEach(z => {\\n    z.addEventListener('dragover', e => { e.preventDefault(); z.classList.add('over'); });\\n    z.addEventListener('dragleave', () => z.classList.remove('over'));\\n    z.addEventListener('drop', e => { e.preventDefault(); z.classList.remove('over'); axes[z.dataset.axis] = e.dataTransfer.getData('text/plain'); render(); });\\n  });\\n  const render = () => {\\n    $$('.s73-zone').forEach(z => z.innerHTML = `<span class=\\\"s73-chip\\\">${FIELDS[axes[z.dataset.axis]]}\u003c/span>`);\\n    const val = $('#s73-val').value, sum = new Map(), rows = new Set(), cols = new Set();\\n    for (const r of recs) { const rk = r[axes.row], ck = r[axes.col]; rows.add(rk); cols.add(ck); const k = rk + '|' + ck; sum.set(k, (sum.get(k) || 0) + r[val]); } // 足し込むだけ\\n    const R = [...rows].sort(), C = [...cols].sort(), tot = k => [...sum].filter(([kk]) => kk.startsWith(k + '|')).reduce((a, [, v]) => a + v, 0);\\n    t.innerHTML = `<tr><th>${FIELDS[axes.row]} \\\\\\\\ ${FIELDS[axes.col]}\u003c/th>${C.map(c => `<th>${c}\u003c/th>`).join('')}<th>合計\u003c/th>\u003c/tr>` +\\n      R.map(r => `<tr><th>${r}\u003c/th>${C.map(c => `<td class=\\\"num\\\">${(sum.get(r + '|' + c) || 0).toLocaleString()}\u003c/td>`).join('')}<td class=\\\"num tot\\\">${tot(r).toLocaleString()}\u003c/td>\u003c/tr>`).join('');\\n  };\\n  $('#s73-val').onchange = render; render();\\n})();\"},{\"page\":\"05-advanced.html\",\"pageTitle\":\"第3弾 D：業務アプリの上位UI（71〜85 抜粋）動くデモ\",\"id\":\"n78\",\"title\":\"78競合解決 Conflict resolution（楽観ロック）\",\"what\":\"自分が編集している間に他の人が同じレコードを更新していたら、保存時に検知して「上書き／マージ／破棄」を選ばせる。検知はリビジョン番号で行う（kintone は revision を持ち、不一致なら PUT が失敗する）。3方向比較（元・自分・相手）で、片方しか変えていない項目は自動マージできる。\",\"how\":\"操作：「他ユーザーが更新」を押してから保存すると競合ダイアログが出る。\",\"html\":\"<div class=\\\"stage\\\">\\n    <div class=\\\"row\\\"><button id=\\\"s78-other\\\">他ユーザーが「数量」と「担当」を更新\u003c/button><button id=\\\"s78-save\\\" class=\\\"primary\\\">保存\u003c/button><span class=\\\"readout\\\" id=\\\"s78-out\\\">\u003c/span>\u003c/div>\\n    <div class=\\\"row\\\" style=\\\"align-items:flex-start\\\">\\n      <div style=\\\"flex:1;font-size:13px\\\"><b>自分の編集\u003c/b><div id=\\\"s78-form\\\">\u003c/div>\u003c/div>\\n      <div style=\\\"flex:1;font-size:13px\\\"><b>サーバ\u003c/b><pre class=\\\"readout\\\" id=\\\"s78-server\\\" style=\\\"white-space:pre-wrap\\\">\u003c/pre>\u003c/div>\\n    \u003c/div>\\n    <dialog id=\\\"s78-dlg\\\" class=\\\"s78-dlg\\\"><b>他のユーザーが先に更新しています\u003c/b><table class=\\\"mini\\\" id=\\\"s78-cmp\\\" style=\\\"margin:8px 0\\\">\u003c/table><div class=\\\"row\\\"><button data-act=\\\"merge\\\" class=\\\"primary\\\">自動マージ\u003c/button><button data-act=\\\"overwrite\\\">自分の内容で上書き\u003c/button><button data-act=\\\"discard\\\">自分の変更を破棄\u003c/button>\u003c/div>\u003c/dialog>\\n  \u003c/div>\",\"css\":\".s78-dlg { border: none; border-radius: 10px; padding: 16px; font-size: 13px; } .s78-dlg::backdrop { background: rgba(15,23,42,.4); }\\n#s78-form label { display: block; margin: 4px 0; } #s78-form input { margin-left: 6px; }\\n#s78-cmp td.c { background: #fecaca; } #s78-cmp td.m { background: #bbf7d0; }\",\"js\":\"(() => {\\n  let server = { revision: 5, 数量: '100', 担当: '佐藤', 備考: '通常' };\\n  let base = { ...server }, mine = { ...server };                      // base: 自分が開いた時点、mine: 編集中\\n  const form = $('#s78-form'), sv = $('#s78-server'), out = $('#s78-out'), dlg = $('#s78-dlg');\\n  const F = ['数量', '担当', '備考'];\\n  const render = () => { form.innerHTML = F.map(k => `<label>${k} <input data-k=\\\"${k}\\\" value=\\\"${mine[k]}\\\">\u003c/label>`).join(''); sv.textContent = JSON.stringify(server, null, 1); };\\n  form.addEventListener('input', e => mine[e.target.dataset.k] = e.target.value);\\n  $('#s78-other').onclick = () => { server = { ...server, revision: server.revision + 1, 数量: '150', 担当: '鈴木' }; render(); out.textContent = `サーバが rev ${server.revision} に進んだ`; };\\n  const put = (data) => { server = { ...server, ...data, revision: server.revision + 1 }; base = { ...server }; mine = { ...server }; render(); out.textContent = `保存成功 → rev ${server.revision}`; };\\n  $('#s78-save').onclick = () => {\\n    if (base.revision === server.revision) return put(mine);          // 競合なし\\n    $('#s78-cmp').innerHTML = '<tr><th>項目\u003c/th><th>元\u003c/th><th>自分\u003c/th><th>相手\u003c/th><th>判定\u003c/th>\u003c/tr>' + F.map(k => {\\n      const me = mine[k] !== base[k], other = server[k] !== base[k];\\n      const j = me && other && mine[k] !== server[k] ? '<td class=\\\"c\\\">競合\u003c/td>' : me ? '<td class=\\\"m\\\">自分を採用\u003c/td>' : other ? '<td class=\\\"m\\\">相手を採用\u003c/td>' : '<td>変更なし\u003c/td>';\\n      return `<tr><td>${k}\u003c/td><td>${base[k]}\u003c/td><td>${mine[k]}\u003c/td><td>${server[k]}\u003c/td>${j}\u003c/tr>`;\\n    }).join('');\\n    dlg.showModal();\\n  };\\n  dlg.addEventListener('click', e => {\\n    const act = e.target.dataset.act; if (!act) return; dlg.close();\\n    if (act === 'overwrite') put(mine);\\n    else if (act === 'discard') { base = { ...server }; mine = { ...server }; render(); out.textContent = '自分の変更を破棄してサーバ版を表示'; }\\n    else {                                                             // 3方向マージ：片方だけ変えた項目はそれを採用、両方なら自分を優先\\n      const merged = {}; F.forEach(k => merged[k] = mine[k] !== base[k] ? mine[k] : server[k]);\\n      base = { ...server }; put(merged); out.textContent += '（自動マージ）';\\n    }\\n  });\\n  render();\\n})();\"},{\"page\":\"05-advanced.html\",\"pageTitle\":\"第3弾 D：業務アプリの上位UI（71〜85 抜粋）動くデモ\",\"id\":\"n79\",\"title\":\"79オフライン対応 Offline queue and sync status\",\"what\":\"通信できない間の操作をキューに溜め、復帰したら順に再送する。画面には「未同期 n 件」を常に見せ、ユーザーが不安にならないようにする。判定は navigator.onLine と online/offline イベント、ただし「繋がっているがAPIが落ちている」も同じ扱いにする（送信失敗→キューに戻す）。\",\"how\":\"操作：「オフライン」にして操作を数回 → 「オンライン」に戻すとキューが流れる。\",\"html\":\"<div class=\\\"stage\\\">\\n    <div class=\\\"row\\\"><label><input type=\\\"checkbox\\\" id=\\\"s79-off\\\"> オフライン（模擬）\u003c/label><button id=\\\"s79-do\\\">レコード更新（操作）\u003c/button><span class=\\\"readout\\\" id=\\\"s79-status\\\">-\u003c/span>\u003c/div>\\n    <div class=\\\"log\\\" id=\\\"s79-log\\\">\u003c/div>\\n  \u003c/div>\",\"css\":\"\",\"js\":\"(() => {\\n  const KEY = 'ui-guide.s79.queue';\\n  let queue = JSON.parse(localStorage.getItem(KEY) || '[]'), busy = false, n = 0;\\n  const log = $('#s79-log'), status = $('#s79-status'), off = $('#s79-off');\\n  const online = () => navigator.onLine && !off.checked;\\n  const api = job => new Promise((ok, ng) => setTimeout(() => online() ? ok() : ng(new Error('offline')), 300));\\n  const save = () => { localStorage.setItem(KEY, JSON.stringify(queue)); status.textContent = `${online() ? 'オンライン' : 'オフライン'} / 未同期 ${queue.length} 件`; };\\n  async function flush() {                                             // 復帰時に先頭から順に送る。失敗したら止めて次の機会へ\\n    if (busy) return; busy = true;\\n    while (queue.length && online()) {\\n      const job = queue[0];\\n      try { await api(job); queue.shift(); logTo(log, `✔ 同期: ${job.name}`); save(); }\\n      catch { logTo(log, `✖ 送信失敗、待機: ${job.name}`); break; }\\n    }\\n    busy = false;\\n  }\\n  $('#s79-do').onclick = () => { const job = { id: Date.now(), name: `更新 #${++n}` }; queue.push(job); logTo(log, `+ 操作をキューへ: ${job.name}`); save(); flush(); };\\n  off.onchange = () => { save(); logTo(log, off.checked ? '-- オフラインになった' : '-- オンラインに復帰'); flush(); };\\n  window.addEventListener('online', () => { save(); flush(); }); window.addEventListener('offline', save);\\n  save(); if (queue.length) logTo(log, `前回の未同期 ${queue.length} 件を復元`); flush();\\n})();\"},{\"page\":\"05-advanced.html\",\"pageTitle\":\"第3弾 D：業務アプリの上位UI（71〜85 抜粋）動くデモ\",\"id\":\"n82\",\"title\":\"82ルーティングと履歴 History API / 戻る・進むで状態復元\",\"what\":\"SPA でも「戻る」ボタンが効くように、画面遷移を history.pushState で履歴に積む。state オブジェクトにスクロール位置や絞り込みを入れておけば、popstate で戻ったときにその状態ごと復元できる。Electron でも同じ仕組みが使える。\",\"how\":\"操作：絞り込み→スクロール→行をクリックで詳細へ→ブラウザの「戻る」（または枠内の←）。一覧が同じ位置・同じ絞り込みで戻る。\",\"html\":\"<div class=\\\"stage\\\">\\n    <div class=\\\"row\\\"><button id=\\\"s82-back\\\">← 戻る（history.back）\u003c/button><span class=\\\"readout\\\" id=\\\"s82-out\\\">\u003c/span>\u003c/div>\\n    <div id=\\\"s82-app\\\">\u003c/div>\\n  \u003c/div>\",\"css\":\".s82-list { height: 130px; overflow: auto; background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; }\\n.s82-list div { padding: 3px 10px; border-bottom: 1px solid #f1f5f9; cursor: pointer; }\",\"js\":\"(() => {\\n  const app = $('#s82-app'), out = $('#s82-out');\\n  let ui = { filter: '', scroll: 0 };                                   // 一覧画面の状態（履歴に保存する）\\n  const routes = {\\n    list: () => {\\n      app.innerHTML = `<div class=\\\"row\\\"><input id=\\\"s82-f\\\" placeholder=\\\"絞り込み\\\" value=\\\"${ui.filter}\\\" style=\\\"width:120px\\\">\u003c/div><div class=\\\"s82-list\\\" id=\\\"s82-l\\\">\u003c/div>`;\\n      const l = $('#s82-l'), f = $('#s82-f');\\n      const fill = () => l.innerHTML = Array.from({ length: 80 }, (_, i) => `受注 #${1001 + i}`).filter(r => r.includes(ui.filter)).map(r => `<div data-id=\\\"${r}\\\">${r}\u003c/div>`).join('');\\n      fill(); l.scrollTop = ui.scroll;\\n      f.oninput = () => { ui.filter = f.value; fill(); };\\n      l.onscroll = () => ui.scroll = l.scrollTop;\\n      l.onclick = e => { if (e.target.dataset.id) { history.replaceState({ route: 'list', ui }, '');                 // 離れる前に一覧の状態を保存\\n        history.pushState({ route: 'detail', id: e.target.dataset.id }, '', '#n82'); render(history.state); } };\\n    },\\n    detail: st => app.innerHTML = `<div style=\\\"font-size:13px;padding:8px;background:#fff;border:1px solid #cbd5e1;border-radius:6px\\\"><b>${st.id}\u003c/b> の詳細<br>ブラウザの「戻る」で一覧の位置と絞り込みが復元される。\u003c/div>`,\\n  };\\n  const render = st => { const s = st?.route ? st : { route: 'list', ui }; if (s.ui) ui = s.ui; routes[s.route](s); out.textContent = `route=${s.route} history.length=${history.length}`; };\\n  window.addEventListener('popstate', e => render(e.state));            // 戻る/進む\\n  $('#s82-back').onclick = () => history.back();\\n  render(history.state?.route ? history.state : null);\\n})();\"},{\"page\":\"05-advanced.html\",\"pageTitle\":\"第3弾 D：業務アプリの上位UI（71〜85 抜粋）動くデモ\",\"id\":\"n83\",\"title\":\"83スマートプレビュー Hover prefetch and preview card\",\"what\":\"リンクにホバーして一定時間（300ms）留まったら、先読みしてカードで内容を出す。カーソルが通り過ぎただけでは取得しない（遅延＋キャンセル）。取得結果はキャッシュし、2回目は即表示。kintone なら GET /k/v1/record.json をここで叩く。\",\"how\":\"操作：リンクにホバーして少し待つ。同じリンクに戻ると即表示（キャッシュ）。\",\"html\":\"<div class=\\\"stage\\\" style=\\\"min-height:150px\\\">\\n    <div class=\\\"row\\\" style=\\\"font-size:13px\\\">関連レコード：<a href=\\\"#n83\\\" data-id=\\\"1001\\\">受注 #1001\u003c/a><a href=\\\"#n83\\\" data-id=\\\"1002\\\">受注 #1002\u003c/a><a href=\\\"#n83\\\" data-id=\\\"1003\\\">受注 #1003\u003c/a><span class=\\\"readout\\\" id=\\\"s83-out\\\">-\u003c/span>\u003c/div>\\n    <div id=\\\"s83-card\\\" class=\\\"s83-card\\\" hidden>\u003c/div>\\n  \u003c/div>\",\"css\":\".s83-card { position: absolute; background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px 12px; font-size: 12.5px; box-shadow: 0 10px 24px rgba(0,0,0,.12); width: 220px; z-index: 5; }\",\"js\":\"(() => {\\n  const card = $('#s83-card'), out = $('#s83-out'), cache = new Map();\\n  const fetchRecord = id => cache.get(id) || (cache.set(id, new Promise(r => setTimeout(() => r({ id, customer: '株式会社サンプル', qty: 100 + +id % 100, due: '2026-09-20' }), 600))), cache.get(id)); // Promise ごとキャッシュ\\n  let timer = null, current = null;\\n  $$('a[data-id]').forEach(a => {\\n    a.addEventListener('pointerenter', () => {\\n      const id = a.dataset.id; current = id;\\n      timer = setTimeout(async () => {                                 // 300ms 留まったら取得開始\\n        const t0 = performance.now(); const rec = await fetchRecord(id);\\n        if (current !== id) return;                                     // 待っている間に離れたら表示しない\\n        const r = a.getBoundingClientRect(), s = card.parentElement.getBoundingClientRect();\\n        card.style.left = r.left - s.left + 'px'; card.style.top = r.bottom - s.top + 6 + 'px';\\n        card.innerHTML = `<b>受注 #${rec.id}\u003c/b><br>${rec.customer}<br>数量 ${rec.qty} / 納期 ${rec.due}`; card.hidden = false;\\n        out.textContent = `#${id}: ${(performance.now() - t0).toFixed(0)}ms${performance.now() - t0 < 50 ? '（キャッシュ）' : '（取得）'}`;\\n      }, 300);\\n    });\\n    a.addEventListener('pointerleave', () => { clearTimeout(timer); current = null; card.hidden = true; });\\n    a.addEventListener('click', e => e.preventDefault());\\n  });\\n})();\"},{\"page\":\"05-advanced.html\",\"pageTitle\":\"第3弾 D：業務アプリの上位UI（71〜85 抜粋）動くデモ\",\"id\":\"n84\",\"title\":\"84ズーム可能タイムライン / ガント Time axis with pan, zoom, drag\",\"what\":\"43 の座標変換を「横軸＝時間」に適用したもの。x = (t − t0) × pxPerDay + offset と逆変換だけで、パン・ズーム・バーのドラッグ（日付変更）・日単位スナップが全部書ける。目盛りはズーム倍率に応じて「日／週／月」を切り替える。\",\"how\":\"操作：背景ドラッグでパン、ホイールでズーム（カーソル基準）、バーをドラッグで日程変更（日単位に吸着）。\",\"html\":\"<div class=\\\"stage\\\" style=\\\"padding:0\\\">\\n    <div id=\\\"s84-view\\\" class=\\\"s84-view\\\"><svg id=\\\"s84-svg\\\" class=\\\"s84-svg\\\">\u003c/svg><span class=\\\"readout\\\" id=\\\"s84-out\\\" style=\\\"position:absolute;right:8px;top:8px\\\">-\u003c/span>\u003c/div>\\n  \u003c/div>\",\"css\":\".s84-view { position: relative; height: 240px; background: #fff; overflow: hidden; touch-action: none; user-select: none; cursor: grab; }\\n.s84-svg { width: 100%; height: 100%; display: block; }\\n.s84-svg .tick { stroke: #e5e7eb; } .s84-svg .tick.major { stroke: #94a3b8; } .s84-svg text { font-size: 11px; fill: #64748b; }\\n.s84-svg .bar { fill: var(--accent); rx: 4; cursor: ew-resize; } .s84-svg .bar:hover { fill: #1d4ed8; } .s84-svg .label { fill: #fff; font-size: 11px; pointer-events: none; }\",\"js\":\"(() => {\\n  const view = $('#s84-view'), svg = $('#s84-svg'), out = $('#s84-out'), DAY = 86400000;\\n  const t0 = new Date('2026-09-01').getTime();\\n  const tasks = [{ name: '設計', s: 0, d: 5 }, { name: '材料手配', s: 3, d: 7 }, { name: '加工', s: 9, d: 10 }, { name: '組立', s: 18, d: 6 }, { name: '検査', s: 23, d: 3 }, { name: '出荷', s: 26, d: 1 }];\\n  let ppd = 24, off = 40;                                              // px/日, オフセット\\n  const x = day => day * ppd + off, day = px => (px - off) / ppd;      // 変換と逆変換\\n  const render = () => {\\n    const W = view.clientWidth, H = view.clientHeight; let s = '';\\n    const step = ppd > 40 ? 1 : ppd > 12 ? 7 : 30;                    // ズームに応じた目盛り（日/週/月）\\n    for (let d = Math.floor(day(0) / step) * step; x(d) < W; d += step) {\\n      const dt = new Date(t0 + d * DAY), major = step === 1 ? dt.getDay() === 1 : true;\\n      s += `<line class=\\\"tick ${major ? 'major' : ''}\\\" x1=\\\"${x(d)}\\\" x2=\\\"${x(d)}\\\" y1=\\\"24\\\" y2=\\\"${H}\\\"/><text x=\\\"${x(d) + 3}\\\" y=\\\"16\\\">${step === 30 ? `${dt.getMonth() + 1}月` : `${dt.getMonth() + 1}/${dt.getDate()}`}\u003c/text>`;\\n    }\\n    tasks.forEach((t, i) => s += `<rect class=\\\"bar\\\" data-i=\\\"${i}\\\" x=\\\"${x(t.s)}\\\" y=\\\"${36 + i * 32}\\\" width=\\\"${t.d * ppd}\\\" height=\\\"24\\\"/><text class=\\\"label\\\" x=\\\"${x(t.s) + 6}\\\" y=\\\"${52 + i * 32}\\\">${t.name} ${new Date(t0 + t.s * DAY).getDate()}日〜\u003c/text>`);\\n    svg.innerHTML = s; out.textContent = `${ppd.toFixed(1)} px/日（目盛り: ${step === 1 ? '日' : step === 7 ? '週' : '月'}）`;\\n  };\\n  let drag = null;\\n  view.addEventListener('pointerdown', e => { const bar = e.target.closest('.bar'); drag = bar ? { type: 'bar', t: tasks[+bar.dataset.i], s0: tasks[+bar.dataset.i].s, x0: e.clientX } : { type: 'pan', x0: e.clientX, off0: off }; view.setPointerCapture(e.pointerId); });\\n  view.addEventListener('pointermove', e => {\\n    if (!drag) return;\\n    if (drag.type === 'pan') off = drag.off0 + e.clientX - drag.x0;\\n    else drag.t.s = Math.round(drag.s0 + (e.clientX - drag.x0) / ppd);  // 日単位にスナップ\\n    render();\\n  });\\n  view.addEventListener('pointerup', () => drag = null);\\n  view.addEventListener('wheel', e => { e.preventDefault(); const cx = e.clientX - view.getBoundingClientRect().left, d = day(cx); ppd = Math.min(120, Math.max(3, ppd * Math.exp(-e.deltaY * 0.002))); off = cx - d * ppd; render(); }, { passive: false }); // カーソル基準ズーム\\n  new ResizeObserver(render).observe(view);\\n})();\"},{\"page\":\"05-advanced.html\",\"pageTitle\":\"第3弾 D：業務アプリの上位UI（71〜85 抜粋）動くデモ\",\"id\":\"n86\",\"title\":\"86監視ボード型UI Polling / 変化点のフラッシュ / 通知集約\",\"what\":\"現場の状況を常時表示する画面。①一定間隔で取得（タブが隠れている間は止める：visibilitychange）②前回との差分だけをフラッシュ表示 ③通知は1件ずつ出さず「n件更新」に集約し、ミュートできる。ポーリング間隔は「取得にかかった時間」より十分長くする。\",\"how\":\"操作：2秒ごとに値が変わり、変わったセルが光る。タブを切り替えると停止し、戻ると再開する。\",\"html\":\"<div class=\\\"stage\\\">\\n    <div class=\\\"row\\\"><label><input type=\\\"checkbox\\\" id=\\\"s86-run\\\" checked> ポーリング（2s）\u003c/label><label><input type=\\\"checkbox\\\" id=\\\"s86-mute\\\"> 通知ミュート\u003c/label><span class=\\\"readout\\\" id=\\\"s86-out\\\">-\u003c/span><span class=\\\"pill\\\" id=\\\"s86-badge\\\" hidden>0\u003c/span>\u003c/div>\\n    <table class=\\\"mini\\\" id=\\\"s86-t\\\" style=\\\"width:100%\\\">\u003c/table>\\n  \u003c/div>\",\"css\":\"#s86-t td.flash { animation: s86-flash 1.2s ease-out; }\\n@keyframes s86-flash { from { background: #fde68a; } }\",\"js\":\"(() => {\\n  const LINES = ['ライン1', 'ライン2', 'ライン3', 'ライン4'], COLS = ['稼働', '生産数', '不良', '状態'];\\n  let prev = null, timer = null, pending = 0;\\n  const t = $('#s86-t'), out = $('#s86-out'), badge = $('#s86-badge');\\n  let sim = LINES.map((l, i) => [l, '稼働中', String(1000 + i * 100), '0', '正常']);\\n  const fetchStatus = () => new Promise(r => setTimeout(() => {                 // 疑似API：毎回2〜3セルだけ変わる\\n    sim = sim.map(row => [...row]);\\n    for (let k = 0; k < 2 + Math.floor(Math.random() * 2); k++) {\\n      const row = sim[Math.floor(Math.random() * sim.length)], c = 1 + Math.floor(Math.random() * 4);\\n      row[c] = c === 2 ? String(+row[c] + 1) : c === 3 ? String(+row[c] + (Math.random() < 0.3 ? 1 : 0)) : c === 1 ? (Math.random() < 0.8 ? '稼働中' : '停止') : (Math.random() < 0.8 ? '正常' : '要確認');\\n    }\\n    r(sim);\\n  }, 200));\\n  const render = rows => {\\n    let changed = 0;\\n    t.innerHTML = '<tr><th>\u003c/th>' + COLS.map(c => `<th>${c}\u003c/th>`).join('') + '\u003c/tr>' + rows.map((r, i) => `<tr><th>${r[0]}\u003c/th>${r.slice(1).map((v, j) => { const f = prev && prev[i][j + 1] !== v; if (f) changed++; return `<td class=\\\"${f ? 'flash' : ''}\\\">${v}\u003c/td>`; }).join('')}\u003c/tr>`).join('');\\n    prev = rows;\\n    if (changed && !$('#s86-mute').checked) { pending += changed; badge.hidden = false; badge.textContent = `${pending} 件更新`; } // 集約\\n  };\\n  const poll = async () => {\\n    if (document.hidden) return;                                       // 見えていないなら取得しない\\n    const t0 = performance.now(); const rows = await fetchStatus(); render(rows);\\n    out.textContent = `最終取得 ${new Date().toLocaleTimeString()}（${(performance.now() - t0).toFixed(0)}ms）`;\\n  };\\n  const start = () => { clearInterval(timer); if ($('#s86-run').checked) { poll(); timer = setInterval(poll, 2000); } };\\n  document.addEventListener('visibilitychange', () => { out.textContent = document.hidden ? '非表示：ポーリング停止' : out.textContent; if (!document.hidden) poll(); });\\n  $('#s86-run').onchange = start; badge.onclick = () => { pending = 0; badge.hidden = true; };\\n  start();\\n})();\"},{\"page\":\"06-effects.html\",\"pageTitle\":\"第4弾 E：演出・体感の上位効果（63〜70）動くデモ\",\"id\":\"n63\",\"title\":\"63シェアードエレメント遷移 Shared element transition\",\"what\":\"一覧の行が「同じ物として」詳細画面へ拡大移動する。View Transitions（31）で、遷移する瞬間だけクリックした要素に view-transition-name を付ける。全行に同じ名前を付けると衝突して失敗するので、動的に付け外しするのが要点。\",\"how\":\"操作：カードをクリック→詳細へ。「戻る」で逆再生。非対応ブラウザは即時切替。\",\"html\":\"<div class=\\\"stage tall\\\" style=\\\"padding:0\\\">\\n    <div id=\\\"s63-root\\\" class=\\\"s63-root\\\">\u003c/div>\\n  \u003c/div>\",\"css\":\".s63-root { height: 280px; padding: 12px; overflow: auto; }\\n.s63-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }\\n.s63-card { background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px; cursor: pointer; font-size: 13px; }\\n.s63-thumb { height: 50px; border-radius: 6px; margin-bottom: 6px; }\\n.s63-detail .s63-thumb { height: 120px; }\\n::view-transition-old(hero), ::view-transition-new(hero) { animation-duration: .4s; }\",\"js\":\"(() => {\\n  const root = $('#s63-root');\\n  const items = [['受注 #1001', '#2563eb'], ['受注 #1002', '#16a34a'], ['受注 #1003', '#d97706'], ['受注 #1004', '#dc2626'], ['受注 #1005', '#7c3aed'], ['受注 #1006', '#0891b2']];\\n  let current = null;\\n  const renderList = () => root.innerHTML = `<div class=\\\"s63-list\\\">${items.map(([t, c], i) => `<div class=\\\"s63-card\\\" data-i=\\\"${i}\\\"><div class=\\\"s63-thumb\\\" style=\\\"background:${c}\\\">\u003c/div>${t}\u003c/div>`).join('')}\u003c/div>`;\\n  const renderDetail = i => root.innerHTML = `<div class=\\\"s63-detail\\\"><div class=\\\"s63-thumb\\\" style=\\\"background:${items[i][1]};view-transition-name:hero\\\">\u003c/div><b>${items[i][0]}\u003c/b><p style=\\\"font-size:13px\\\">詳細画面。サムネイルが一覧から「移動してきた」ように見える。\u003c/p><button id=\\\"s63-back\\\">← 戻る\u003c/button>\u003c/div>`;\\n  const go = (mutate, tagBefore) => {\\n    if (!document.startViewTransition) { mutate(); return; }\\n    tagBefore?.();                                           // 遷移前：出発側の要素に名前を付ける\\n    document.startViewTransition(mutate).finished.then(() => $$('.s63-card').forEach(c => c.style.viewTransitionName = ''));\\n  };\\n  root.addEventListener('click', e => {\\n    const card = e.target.closest('.s63-card');\\n    if (card) { current = +card.dataset.i; go(() => renderDetail(current), () => $('.s63-thumb', card).style.viewTransitionName = 'hero'); }\\n    if (e.target.id === 's63-back') go(() => { renderList(); $(`.s63-card[data-i=\\\"${current}\\\"] .s63-thumb`).style.viewTransitionName = 'hero'; }); // 到着側に名前を付ける\\n  });\\n  renderList();\\n})();\"},{\"page\":\"06-effects.html\",\"pageTitle\":\"第4弾 E：演出・体感の上位効果（63〜70）動くデモ\",\"id\":\"n64\",\"title\":\"64スタガーアニメーション Stagger\",\"what\":\"複数要素を数十msずつ遅らせて順に出す。「一斉にドン」より軽く見え、視線を上から下へ誘導できる。CSSなら animation-delay: calc(var(--i) * 40ms)、JSなら WAAPI の delay。要素数が多いときは合計時間が伸びすぎないよう上限を設ける。\",\"how\":\"操作：再生。間隔を変えて印象の違いを見る。\",\"html\":\"<div class=\\\"stage\\\">\\n    <div class=\\\"row\\\"><button id=\\\"s64-run\\\">再生\u003c/button>間隔 <input id=\\\"s64-gap\\\" type=\\\"range\\\" min=\\\"0\\\" max=\\\"120\\\" value=\\\"40\\\"> <span class=\\\"readout\\\" id=\\\"s64-out\\\">40ms\u003c/span>\u003c/div>\\n    <div id=\\\"s64-list\\\">\u003c/div>\\n  \u003c/div>\",\"css\":\".s64-item { background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; padding: 6px 10px; margin-bottom: 4px; font-size: 13px; opacity: 0; transform: translateY(10px); }\\n.s64-item.in { animation: s64-in .35s ease-out forwards; animation-delay: calc(var(--i) * var(--gap)); }\\n@keyframes s64-in { to { opacity: 1; transform: none; } }\",\"js\":\"(() => {\\n  const list = $('#s64-list'), gap = $('#s64-gap'), out = $('#s64-out');\\n  list.innerHTML = Array.from({ length: 6 }, (_, i) => `<div class=\\\"s64-item\\\" style=\\\"--i:${Math.min(i, 10)}\\\">行 ${i + 1}\u003c/div>`).join(''); // --i に上限（10）を設けて合計時間を抑える\\n  gap.oninput = () => out.textContent = gap.value + 'ms';\\n  $('#s64-run').onclick = () => {\\n    list.style.setProperty('--gap', gap.value + 'ms');\\n    $$('.s64-item').forEach(el => { el.classList.remove('in'); void el.offsetWidth; el.classList.add('in'); });\\n  };\\n})();\"},{\"page\":\"06-effects.html\",\"pageTitle\":\"第4弾 E：演出・体感の上位効果（63〜70）動くデモ\",\"id\":\"n65\",\"title\":\"65スケルトン → 実データのモーフィング Skeleton morph\",\"what\":\"スケルトン（22）から本物の内容へ切り替わる瞬間に「ガタつき」が出るのを防ぐ。①スケルトンと本物を同じ位置に重ね、クロスフェードする ②高さが変わるならFLIP（30）の高さ版で滑らかに伸縮する。\",\"how\":\"操作：再読込。「ガタつき版」と比べる。\",\"html\":\"<div class=\\\"stage\\\">\\n    <div class=\\\"row\\\"><button id=\\\"s65-reload\\\">再読込（1.5秒）\u003c/button>\u003c/div>\\n    <div class=\\\"row\\\" style=\\\"align-items:flex-start\\\">\\n      <div class=\\\"s65-card\\\" id=\\\"s65-plain\\\"><div class=\\\"s65-sk\\\">\u003c/div>\u003c/div>\\n      <div class=\\\"s65-card s65-morph\\\" id=\\\"s65-morph\\\"><div class=\\\"s65-layer s65-sk\\\">\u003c/div><div class=\\\"s65-layer s65-real\\\" style=\\\"opacity:0\\\">\u003c/div>\u003c/div>\\n    \u003c/div>\\n  \u003c/div>\",\"css\":\".s65-card { flex: 1; background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; padding: 12px; font-size: 13px; position: relative; overflow: hidden; }\\n.s65-sk { display: grid; gap: 8px; } .s65-sk::before, .s65-sk::after { content: ''; height: 12px; border-radius: 6px; background: #e5e7eb; } .s65-sk::after { width: 60%; }\\n.s65-morph .s65-layer { transition: opacity .35s; }\\n.s65-morph .s65-real { position: absolute; inset: 12px; }         /* 重ねる */\\n.s65-morph.done { transition: height .35s ease; }\",\"js\":\"(() => {\\n  const plain = $('#s65-plain'), morph = $('#s65-morph');\\n  const content = '<b>受注 #1001\u003c/b><div>株式会社サンプル\u003c/div><div>納期 2026-09-12 / 数量 120\u003c/div><div>備考：分納可、梱包は強化仕様。\u003c/div>';\\n  const load = () => {\\n    plain.innerHTML = '<div class=\\\"s65-sk\\\">\u003c/div>';\\n    morph.classList.remove('done'); morph.style.height = ''; $('.s65-sk', morph).style.opacity = 1; const real = $('.s65-real', morph); real.style.opacity = 0; real.innerHTML = '';\\n    setTimeout(() => {\\n      plain.innerHTML = content;                                        // ガタつき版：差し替えるだけ\\n      const h0 = morph.offsetHeight; real.innerHTML = content;           // モーフ版：高さを測ってから\\n      real.style.position = 'static'; const h1 = morph.offsetHeight; real.style.position = '';\\n      morph.style.height = h0 + 'px'; morph.classList.add('done'); void morph.offsetHeight; morph.style.height = h1 + 'px';  // 高さを FLIP\\n      $('.s65-sk', morph).style.opacity = 0; real.style.opacity = 1;    // クロスフェード\\n      morph.addEventListener('transitionend', () => { real.style.position = 'static'; morph.style.height = ''; }, { once: true });\\n    }, 1500);\\n  };\\n  $('#s65-reload').onclick = load; load();\\n})();\"},{\"page\":\"06-effects.html\",\"pageTitle\":\"第4弾 E：演出・体感の上位効果（63〜70）動くデモ\",\"id\":\"n66\",\"title\":\"66マイクロインタラクション Micro-interactions\",\"what\":\"操作に対する「小さな返事」。チェックのバウンス、保存ボタンの「送信中→完了」の形状変化、いいねの弾み。ルール：150〜300ms、ユーザーの操作の直後に、操作したその場所で起きる。装飾ではなく「受け付けた」の合図。\",\"how\":\"操作：それぞれ押す。\",\"html\":\"<div class=\\\"stage\\\">\\n    <div class=\\\"row\\\">\\n      <label class=\\\"s66-check\\\"><input type=\\\"checkbox\\\"><span class=\\\"s66-box\\\">\u003c/span> 完了にする\u003c/label>\\n      <button id=\\\"s66-save\\\" class=\\\"primary s66-save\\\"><span class=\\\"s66-label\\\">保存\u003c/span>\u003c/button>\\n      <button id=\\\"s66-like\\\" class=\\\"s66-like\\\">♥ <span>12\u003c/span>\u003c/button>\\n    \u003c/div>\\n  \u003c/div>\",\"css\":\".s66-check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 13px; }\\n.s66-check input { display: none; }\\n.s66-box { width: 18px; height: 18px; border: 2px solid #94a3b8; border-radius: 4px; display: grid; place-items: center; transition: background .15s, border-color .15s; }\\n.s66-box::after { content: '✓'; color: #fff; font-size: 12px; transform: scale(0); transition: transform .2s cubic-bezier(.3,1.6,.5,1); } /* 行き過ぎて戻る */\\n.s66-check input:checked + .s66-box { background: var(--accent); border-color: var(--accent); }\\n.s66-check input:checked + .s66-box::after { transform: scale(1); }\\n.s66-save { min-width: 90px; transition: background .2s, min-width .2s; } .s66-save.busy { background: #94a3b8; border-color: #94a3b8; } .s66-save.ok { background: #16a34a; border-color: #16a34a; }\\n.s66-like { transition: color .15s; } .s66-like.on { color: #dc2626; } .s66-like.pop { animation: s66-pop .3s; }\\n@keyframes s66-pop { 30% { transform: scale(1.3); } }\",\"js\":\"(() => {\\n  const save = $('#s66-save'), label = $('.s66-label', save);\\n  save.onclick = async () => {\\n    if (save.classList.contains('busy')) return;\\n    save.classList.add('busy'); label.textContent = '保存中…';\\n    await new Promise(r => setTimeout(r, 900));\\n    save.classList.replace('busy', 'ok'); label.textContent = '✓ 保存済み';\\n    setTimeout(() => { save.classList.remove('ok'); label.textContent = '保存'; }, 1500);\\n  };\\n  const like = $('#s66-like'), n = $('span', like);\\n  like.onclick = () => { const on = like.classList.toggle('on'); n.textContent = +n.textContent + (on ? 1 : -1); like.classList.remove('pop'); void like.offsetWidth; like.classList.add('pop'); };\\n})();\"},{\"page\":\"06-effects.html\",\"pageTitle\":\"第4弾 E：演出・体感の上位効果（63〜70）動くデモ\",\"id\":\"n67\",\"title\":\"67ジェスチャー連動の物理 Interactive back swipe\",\"what\":\"画面遷移を「アニメーション再生」ではなく「指の位置に追従」させ、離した時点で完了か取消かを決める（iOSの戻る操作）。ドラッグ量を0〜1の進捗に変換し、離したら閾値（40%）と速度で判定、残りはスプリング（29）で流す。\",\"how\":\"操作：詳細画面の左端からドラッグ。途中で戻すとキャンセルされる。\",\"html\":\"<div class=\\\"stage tall\\\" style=\\\"padding:0\\\">\\n    <div id=\\\"s67-stack\\\" class=\\\"s67-stack\\\">\\n      <div class=\\\"s67-page s67-list\\\">一覧画面<br><small>（背面）\u003c/small>\u003c/div>\\n      <div id=\\\"s67-detail\\\" class=\\\"s67-page s67-detail\\\"><div class=\\\"s67-edge\\\">\u003c/div>詳細画面<br><small>左端からドラッグして戻る\u003c/small><br><button id=\\\"s67-reopen\\\" hidden>詳細を開く\u003c/button>\u003c/div>\\n    \u003c/div>\\n  \u003c/div>\",\"css\":\".s67-stack { position: relative; height: 260px; overflow: hidden; background: #e2e8f0; }\\n.s67-page { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-size: 15px; }\\n.s67-list { background: #f8fafc; }\\n.s67-detail { background: #fff; box-shadow: -6px 0 20px rgba(0,0,0,.15); touch-action: pan-y; will-change: transform; }\\n.s67-edge { position: absolute; left: 0; top: 0; bottom: 0; width: 28px; cursor: ew-resize; background: linear-gradient(90deg, rgba(37,99,235,.15), transparent); }\",\"js\":\"(() => {\\n  const detail = $('#s67-detail'), W = () => detail.offsetWidth;\\n  let st = null, x = 0, raf = 0;\\n  const set = px => { x = px; detail.style.transform = `translateX(${px}px)`; $('.s67-list').style.filter = `brightness(${0.85 + 0.15 * px / W()})`; };\\n  detail.addEventListener('pointerdown', e => { if (e.offsetX > 28 || e.target.tagName === 'BUTTON') return; cancelAnimationFrame(raf); st = { x: e.clientX, t: performance.now(), last: e.clientX, v: 0 }; detail.setPointerCapture(e.pointerId); });\\n  detail.addEventListener('pointermove', e => { if (!st) return; const now = performance.now(); st.v = (e.clientX - st.last) / Math.max(1, now - st.t); st.last = e.clientX; st.t = now; set(Math.max(0, e.clientX - st.x)); });\\n  detail.addEventListener('pointerup', () => {\\n    if (!st) return;\\n    const complete = x / W() > 0.4 || st.v > 0.5;               // 進捗 40% 超 or 速いフリックで確定\\n    const target = complete ? W() : 0; st = null; let v = 0;\\n    const tick = () => { v = (v + (target - x) * 0.15) * 0.75; set(x + v); if (Math.abs(target - x) > 0.5 || Math.abs(v) > 0.5) raf = requestAnimationFrame(tick); else { set(target); if (complete) $('#s67-reopen').hidden = false; } };\\n    raf = requestAnimationFrame(tick);\\n  });\\n  $('#s67-reopen').onclick = e => { e.stopPropagation(); $('#s67-reopen').hidden = true; detail.animate([{ transform: `translateX(${W()}px)` }, { transform: 'none' }], { duration: 300, easing: 'cubic-bezier(.2,.8,.2,1)' }).finished.then(() => set(0)); };\\n})();\"},{\"page\":\"06-effects.html\",\"pageTitle\":\"第4弾 E：演出・体感の上位効果（63〜70）動くデモ\",\"id\":\"n68\",\"title\":\"68スクロール駆動アニメーション（CSS） animation-timeline: scroll() / view()\",\"what\":\"27 は JS（IntersectionObserver）だったが、CSS だけで「スクロール量＝アニメーション進捗」にできる。scroll() はスクロール位置に、view() は要素が見えている割合に連動する。メインスレッドを使わないので滑らか。非対応ブラウザでは単に表示される（プログレッシブ）。\",\"how\":\"操作：枠内をスクロール。上端の読了バーと、各カードの出現がスクロールに同期する。\",\"html\":\"<div class=\\\"stage\\\" style=\\\"padding:0\\\">\\n    <div id=\\\"s68-view\\\" class=\\\"s68-view\\\"><div class=\\\"s68-bar\\\">\u003c/div>\\n      <div class=\\\"s68-inner\\\"><p>読了バーは scroll()、カードは view()\u003c/p><div class=\\\"s68-card\\\">カード 1\u003c/div><div class=\\\"s68-card\\\">カード 2\u003c/div><div class=\\\"s68-card\\\">カード 3\u003c/div><div class=\\\"s68-card\\\">カード 4\u003c/div><div class=\\\"s68-card\\\">カード 5\u003c/div><p>終わり\u003c/p>\u003c/div>\\n    \u003c/div>\\n    <span class=\\\"readout\\\" id=\\\"s68-out\\\" style=\\\"position:absolute;right:8px;top:8px\\\">\u003c/span>\\n  \u003c/div>\",\"css\":\".s68-view { height: 240px; overflow-y: auto; scroll-timeline: --s68 y; position: relative; }\\n.s68-inner { padding: 14px; } .s68-inner p { font-size: 13px; color: var(--muted); }\\n.s68-bar { position: sticky; top: 0; height: 4px; background: var(--accent); transform-origin: 0 50%; transform: scaleX(0); z-index: 1;\\n  animation: s68-grow linear both; animation-timeline: --s68; }                  /* スクロール位置 → 進捗 */\\n@keyframes s68-grow { to { transform: scaleX(1); } }\\n.s68-card { background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; padding: 14px; margin: 50px 0; font-size: 13px;\\n  animation: s68-in linear both; animation-timeline: view(); animation-range: entry 0% entry 80%; } /* 見え始め〜80% 見えた時点で完了 */\\n@keyframes s68-in { from { opacity: 0; transform: translateX(-30px); } }\",\"js\":\"(() => { $('#s68-out').textContent = CSS.supports('animation-timeline: scroll()') ? 'animation-timeline: 対応' : '非対応 → 静的表示にフォールバック'; })();\"},{\"page\":\"06-effects.html\",\"pageTitle\":\"第4弾 E：演出・体感の上位効果（63〜70）動くデモ\",\"id\":\"n69\",\"title\":\"69ぼかし / グラスモーフィズム backdrop-filter と性能\",\"what\":\"半透明パネルの背後をぼかす backdrop-filter: blur()。見栄えは良いが、背後が動くたびに毎フレーム再計算されるためGPUが弱い端末では重い。実機で計測し、必要なら blur を外して単なる半透明にする。\",\"how\":\"操作：ぼかしON/OFFを切り替えて、右上のフレーム時間を比べる（差が出ない端末なら採用してよい）。\",\"html\":\"<div class=\\\"stage tall\\\" style=\\\"padding:0\\\">\\n    <div class=\\\"s69-view\\\"><div id=\\\"s69-bg\\\" class=\\\"s69-bg\\\">\u003c/div><div id=\\\"s69-glass\\\" class=\\\"s69-glass blur\\\"><b>グラスパネル\u003c/b><br><label><input type=\\\"checkbox\\\" id=\\\"s69-toggle\\\" checked> backdrop-filter: blur(12px)\u003c/label>\u003c/div><span class=\\\"readout\\\" id=\\\"s69-out\\\" style=\\\"position:absolute;right:8px;top:8px\\\">-\u003c/span>\u003c/div>\\n  \u003c/div>\",\"css\":\".s69-view { position: relative; height: 240px; overflow: hidden; background: #0f172a; }\\n.s69-bg { position: absolute; inset: -50%; background: conic-gradient(from 0deg, #2563eb, #db2777, #d97706, #16a34a, #2563eb); animation: s69-spin 6s linear infinite; }\\n@keyframes s69-spin { to { transform: rotate(360deg); } }\\n.s69-glass { position: absolute; left: 30px; top: 40px; width: 300px; padding: 16px; border-radius: 12px; color: #fff; font-size: 13px;\\n  background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.35); }\\n.s69-glass.blur { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }\",\"js\":\"(() => {\\n  const glass = $('#s69-glass'), out = $('#s69-out');\\n  $('#s69-toggle').onchange = e => glass.classList.toggle('blur', e.target.checked);\\n  let last = performance.now(), acc = 0, n = 0;                      // フレーム時間の移動平均\\n  const tick = t => { acc += t - last; n++; last = t; if (n === 30) { out.textContent = `平均 ${(acc / n).toFixed(1)} ms/frame`; acc = n = 0; } requestAnimationFrame(tick); };\\n  requestAnimationFrame(tick);\\n})();\"},{\"page\":\"06-effects.html\",\"pageTitle\":\"第4弾 E：演出・体感の上位効果（63〜70）動くデモ\",\"id\":\"n70\",\"title\":\"70ダークモード切替のクロスフェード Theme transition with View Transitions\",\"what\":\"テーマ切替時に全画面がパッと変わるのを、View Transitions で滑らかにする。標準は全体クロスフェード。::view-transition-new(root) に clip-path: circle() をアニメーションさせると「クリック位置から広がる」演出になる。テーマ自体は data-theme 属性と CSS 変数で。\",\"how\":\"操作：ボタンを押す（押した位置から広がる）。このデモ枠内だけがテーマ切替の対象。\",\"html\":\"<div class=\\\"stage\\\" style=\\\"padding:0\\\">\\n    <div id=\\\"s70-app\\\" class=\\\"s70-app\\\" data-theme=\\\"light\\\"><div class=\\\"row\\\" style=\\\"padding:10px\\\"><button id=\\\"s70-btn\\\">🌙 ダークに切替\u003c/button><span class=\\\"readout\\\" id=\\\"s70-out\\\">\u003c/span>\u003c/div><div class=\\\"s70-body\\\"><b>ダッシュボード\u003c/b><p>CSS変数を data-theme で切り替え、View Transitions で遷移をつなぐ。\u003c/p>\u003c/div>\u003c/div>\\n  \u003c/div>\",\"css\":\".s70-app { --bg: #fff; --fg: #1d1f23; background: var(--bg); color: var(--fg); height: 170px; transition: none; }\\n.s70-app[data-theme=\\\"dark\\\"] { --bg: #0f172a; --fg: #e2e8f0; }\\n.s70-body { padding: 0 14px; font-size: 13px; }\\n::view-transition-old(root) { animation: none; }                                     /* 旧画面は静止、新画面を円で広げる */\\n::view-transition-new(root) { animation: s70-reveal .5s ease-out; clip-path: circle(150% at var(--x) var(--y)); }\\n@keyframes s70-reveal { from { clip-path: circle(0 at var(--x) var(--y)); } }\",\"js\":\"(() => {\\n  const app = $('#s70-app'), btn = $('#s70-btn'), out = $('#s70-out');\\n  out.textContent = document.startViewTransition ? 'View Transitions: 対応' : '非対応 → 即時切替';\\n  btn.onclick = e => {\\n    document.documentElement.style.setProperty('--x', e.clientX + 'px'); document.documentElement.style.setProperty('--y', e.clientY + 'px'); // クリック位置を中心に\\n    const swap = () => { const dark = app.dataset.theme !== 'dark'; app.dataset.theme = dark ? 'dark' : 'light'; btn.textContent = dark ? '☀ ライトに切替' : '🌙 ダークに切替'; };\\n    document.startViewTransition ? document.startViewTransition(swap) : swap();\\n  };\\n})();\"},{\"page\":\"08-foundations.html\",\"pageTitle\":\"基礎知識：座標系・イベント・描画の土台\",\"id\":\"f1\",\"title\":\"F1座標系の違い clientX / pageX / offsetX / screenX / getBoundingClientRect\",\"what\":\"マウス位置には5種類の「原点」がある。ドラッグやズームで一番よく使うのは clientX と getBoundingClientRect().left の差（＝要素内のローカル座標）。offsetX は「イベントが当たった要素」基準なので、子要素の上で値が飛ぶ。\",\"how\":\"操作：枠内でマウスを動かす。枠は少しスクロールしてある。青い子要素の上で offsetX がどう変わるか見る。\",\"html\":\"<div class=\\\"stage\\\">\\n    <div id=\\\"f1-view\\\" class=\\\"f1-view\\\"><div class=\\\"f1-inner\\\"><div class=\\\"box\\\" style=\\\"position:absolute;left:120px;top:60px\\\">子要素\u003c/div>\u003c/div>\u003c/div>\\n    <table class=\\\"cmp\\\" id=\\\"f1-t\\\" style=\\\"margin-top:8px\\\">\u003c/table>\\n  \u003c/div>\",\"css\":\".f1-view { height: 150px; overflow: auto; border: 1px solid #cbd5e1; background: #fff; }\\n.f1-inner { position: relative; width: 900px; height: 400px; background-image: linear-gradient(#f1f5f9 1px, transparent 1px), linear-gradient(90deg, #f1f5f9 1px, transparent 1px); background-size: 40px 40px; }\",\"js\":\"(() => {\\n  const view = $('#f1-view'), t = $('#f1-t');\\n  view.scrollTop = 30; view.scrollLeft = 20;\\n  const rows = [\\n    ['clientX/Y', 'ブラウザの表示領域（ビューポート）左上が原点。スクロールしても要素は動くが原点は動かない', e => [e.clientX, e.clientY]],\\n    ['pageX/Y', 'ページ全体の左上が原点。client + ページのスクロール量', e => [e.pageX, e.pageY]],\\n    ['offsetX/Y', 'イベントが当たった要素（target）の左上が原点。子要素の上では値が飛ぶ → ドラッグには使わない', e => [e.offsetX, e.offsetY]],\\n    ['screenX/Y', '画面（モニタ）左上が原点。UIではほぼ使わない', e => [e.screenX, e.screenY]],\\n    ['client − rect', '要素の getBoundingClientRect() を引く → 要素内ローカル座標。ドラッグ・ズーム・キャンバスはこれ', e => { const r = view.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }],\\n    ['+ scroll', 'ローカル座標 + 要素のスクロール量 → スクロール内容上の座標', e => { const r = view.getBoundingClientRect(); return [e.clientX - r.left + view.scrollLeft, e.clientY - r.top + view.scrollTop]; }],\\n  ];\\n  const render = e => t.innerHTML = '<tr><th>値\u003c/th><th>原点\u003c/th><th>x, y\u003c/th>\u003c/tr>' + rows.map(([k, d, f]) => { const [x, y] = e ? f(e).map(Math.round) : ['-', '-']; return `<tr><td class=\\\"k\\\">${k}\u003c/td><td>${d}\u003c/td><td>${x}, ${y}\u003c/td>\u003c/tr>`; }).join('');\\n  view.addEventListener('pointermove', render); render(null);\\n})();\"},{\"page\":\"08-foundations.html\",\"pageTitle\":\"基礎知識：座標系・イベント・描画の土台\",\"id\":\"f2\",\"title\":\"F2イベントの発火順と伝播 capture → target → bubble / stopPropagation\",\"what\":\"イベントは「外側から内側へ（capture）→ 当たった要素（target）→ 内側から外側へ（bubble）」の順に流れる。addEventListener(type, fn, true) で capture 側に登録できる。stopPropagation() はそこから先へ流さない。preventDefault() は伝播ではなく「ブラウザの既定動作」を止める。この2つの違いが最重要。\",\"how\":\"操作：内側の箱をクリック。ログに順序が出る。チェックで「中央で stopPropagation」を有効にすると、外側の bubble が来なくなる。\",\"html\":\"<div class=\\\"stage\\\">\\n    <div class=\\\"row\\\"><label><input type=\\\"checkbox\\\" id=\\\"f2-stop\\\"> 中央（bubble）で stopPropagation()\u003c/label><button id=\\\"f2-clear\\\">ログ消去\u003c/button>\u003c/div>\\n    <div class=\\\"row\\\" style=\\\"align-items:flex-start\\\">\\n      <div id=\\\"f2-outer\\\" class=\\\"f2-box\\\">外側<div id=\\\"f2-mid\\\" class=\\\"f2-box\\\">中央<div id=\\\"f2-inner\\\" class=\\\"f2-box\\\" style=\\\"background:var(--accent);color:#fff\\\">内側\u003c/div>\u003c/div>\u003c/div>\\n      <div class=\\\"log\\\" id=\\\"f2-log\\\" style=\\\"flex:1\\\">\u003c/div>\\n    \u003c/div>\\n  \u003c/div>\",\"css\":\".f2-box { padding: 14px; border: 1px solid #94a3b8; border-radius: 8px; background: #fff; font-size: 12px; user-select: none; cursor: pointer; }\",\"js\":\"(() => {\\n  const log = $('#f2-log');\\n  ['outer', 'mid', 'inner'].forEach(id => {\\n    const el = $('#f2-' + id);\\n    el.addEventListener('click', e => logTo(log, `capture: ${id}`), true);                 // capture 側\\n    el.addEventListener('click', e => { logTo(log, `bubble:  ${id}` + (e.target === el ? '（target）' : '')); if (id === 'mid' && $('#f2-stop').checked) { e.stopPropagation(); logTo(log, '  → stopPropagation: ここで止める'); } });\\n  });\\n  $('#f2-inner').addEventListener('click', () => logTo(log, '---'));\\n  $('#f2-clear').onclick = () => log.textContent = '';\\n})();\"},{\"page\":\"08-foundations.html\",\"pageTitle\":\"基礎知識：座標系・イベント・描画の土台\",\"id\":\"f3\",\"title\":\"F3transform と left/top の違い レイアウト vs 合成\",\"what\":\"位置を動かす方法は2つあるが、コストが違う。left/top を変えるとブラウザはレイアウト計算（周囲の要素の位置も再計算）をやり直す。transform は最終的な合成段階で動かすだけで、レイアウトは走らない。だからデモは全部 transform で動かしている。opacity も同じく安い。\",\"how\":\"操作：300個の箱を同じ動きで走らせ、フレーム時間を比べる。差が小さい端末もあるが、要素数が増えるほど開く。\",\"html\":\"<div class=\\\"stage\\\">\\n    <div class=\\\"row\\\"><button id=\\\"f3-left\\\">left/top で動かす\u003c/button><button id=\\\"f3-tf\\\">transform で動かす\u003c/button><span class=\\\"readout\\\" id=\\\"f3-out\\\">-\u003c/span>\u003c/div>\\n    <div id=\\\"f3-field\\\" class=\\\"f3-field\\\">\u003c/div>\\n  \u003c/div>\",\"css\":\".f3-field { position: relative; height: 120px; overflow: hidden; background: #fff; border: 1px solid #cbd5e1; }\\n.f3-field i { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); left: 0; top: 0; }\",\"js\":\"(() => {\\n  const field = $('#f3-field'), out = $('#f3-out'), N = 300;\\n  field.innerHTML = Array.from({ length: N }, () => '<i>\u003c/i>').join('');\\n  const dots = $$('i', field);\\n  const run = mode => {\\n    const t0 = performance.now(); let frames = 0, worst = 0, last = t0;\\n    const step = now => {\\n      const p = (now - t0) / 1500; worst = Math.max(worst, now - last); last = now; frames++;\\n      dots.forEach((d, i) => {\\n        const x = p * 400 + (i % 30) * 6, y = 10 + Math.floor(i / 30) * 10 + Math.sin(p * 6 + i) * 4;\\n        if (mode === 'left') { d.style.left = x + 'px'; d.style.top = y + 'px'; d.style.transform = ''; }\\n        else { d.style.transform = `translate(${x}px, ${y}px)`; d.style.left = d.style.top = ''; }\\n      });\\n      if (p < 1) requestAnimationFrame(step); else out.textContent = `${mode}: 平均 ${((now - t0) / frames).toFixed(1)} ms/frame, 最悪 ${worst.toFixed(1)} ms`;\\n    };\\n    requestAnimationFrame(step);\\n  };\\n  $('#f3-left').onclick = () => run('left'); $('#f3-tf').onclick = () => run('transform');\\n})();\"},{\"page\":\"08-foundations.html\",\"pageTitle\":\"基礎知識：座標系・イベント・描画の土台\",\"id\":\"f4\",\"title\":\"F4passive リスナーと touch-action スクロールを止めたいのに止まらない理由\",\"what\":\"ブラウザは wheel / touchmove を「既定で passive（preventDefault が効かない）」として扱うことがある。自前でズームやパンをするなら { passive: false } を明示する。タッチでは加えて CSS の touch-action で「どの方向をブラウザに任せるか」を宣言する方が確実。\",\"how\":\"操作：左右の枠でホイール。左は preventDefault が無視されてページがスクロールする。右は止まる。\",\"html\":\"<div class=\\\"stage\\\">\\n    <div class=\\\"row\\\" style=\\\"align-items:stretch\\\">\\n      <div id=\\\"f4-a\\\" class=\\\"f4-box\\\">passive: true<br><small>preventDefault は無視される\u003c/small><br><span class=\\\"readout\\\" id=\\\"f4-a-out\\\">-\u003c/span>\u003c/div>\\n      <div id=\\\"f4-b\\\" class=\\\"f4-box\\\">passive: false<br><small>ページは動かない\u003c/small><br><span class=\\\"readout\\\" id=\\\"f4-b-out\\\">-\u003c/span>\u003c/div>\\n    \u003c/div>\\n  \u003c/div>\",\"css\":\".f4-box { flex: 1; padding: 14px; background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; text-align: center; touch-action: none; }\",\"js\":\"(() => {\\n  $('#f4-a').addEventListener('wheel', e => { e.preventDefault(); $('#f4-a-out').textContent = `defaultPrevented=${e.defaultPrevented}`; }, { passive: true });   // 効かない（コンソールに警告）\\n  $('#f4-b').addEventListener('wheel', e => { e.preventDefault(); $('#f4-b-out').textContent = `defaultPrevented=${e.defaultPrevented}`; }, { passive: false });  // 効く\\n})();\"},{\"page\":\"08-foundations.html\",\"pageTitle\":\"基礎知識：座標系・イベント・描画の土台\",\"id\":\"f5\",\"title\":\"F5動かし方の4手段 transition / CSS animation / WAAPI / requestAnimationFrame\",\"what\":\"同じ「右に300px動かす」でも手段が4つある。使い分けの軸は「誰が時間を管理するか」と「途中で介入したいか」。迷ったら transition、JSで止めたり戻したりするなら WAAPI、毎フレーム値を計算するなら rAF。\",\"how\":\"操作：再生。4つが同じ動きをするのを確認し、下の表で選び方を見る。\",\"html\":\"<div class=\\\"stage\\\">\\n    <div class=\\\"row\\\"><button id=\\\"f5-run\\\">再生\u003c/button>\u003c/div>\\n    <div class=\\\"f5-lane\\\"><span>1. transition\u003c/span><div class=\\\"f5-ball f5-tr\\\">\u003c/div>\u003c/div>\\n    <div class=\\\"f5-lane\\\"><span>2. CSS animation\u003c/span><div class=\\\"f5-ball f5-an\\\">\u003c/div>\u003c/div>\\n    <div class=\\\"f5-lane\\\"><span>3. WAAPI\u003c/span><div class=\\\"f5-ball f5-wa\\\">\u003c/div>\u003c/div>\\n    <div class=\\\"f5-lane\\\"><span>4. rAF\u003c/span><div class=\\\"f5-ball f5-raf\\\">\u003c/div>\u003c/div>\\n    <table class=\\\"cmp\\\" style=\\\"margin-top:8px\\\">\\n      <tr><th>手段\u003c/th><th>時間管理\u003c/th><th>向いている場面\u003c/th><th>途中介入\u003c/th><th>デモ\u003c/th>\u003c/tr>\\n      <tr><td class=\\\"k\\\">transition\u003c/td><td>ブラウザ\u003c/td><td>状態AとBの間を補間する。ホバー、開閉、表示切替\u003c/td><td>弱い（クラスを外すと戻るだけ）\u003c/td><td><a href=\\\"02-basic.html#n14\\\">14\u003c/a>\u003c/td>\u003c/tr>\\n      <tr><td class=\\\"k\\\">CSS animation\u003c/td><td>ブラウザ\u003c/td><td>繰り返し、複数キーフレーム、ローディング\u003c/td><td>弱い\u003c/td><td><a href=\\\"02-basic.html#n22\\\">22\u003c/a>, <a href=\\\"06-effects.html#n64\\\">64\u003c/a>\u003c/td>\u003c/tr>\\n      <tr><td class=\\\"k\\\">WAAPI\u003c/td><td>ブラウザ（JSから制御）\u003c/td><td>一時停止・逆再生・速度変更・完了待ちが要る\u003c/td><td>強い\u003c/td><td><a href=\\\"04-pro.html#n53\\\">53\u003c/a>, <a href=\\\"03-custom.html#n30\\\">30\u003c/a>\u003c/td>\u003c/tr>\\n      <tr><td class=\\\"k\\\">rAF\u003c/td><td>自分\u003c/td><td>物理（慣性・スプリング）、入力追従、Canvas\u003c/td><td>完全\u003c/td><td><a href=\\\"03-custom.html#n28\\\">28\u003c/a>, <a href=\\\"03-custom.html#n29\\\">29\u003c/a>\u003c/td>\u003c/tr>\\n    \u003c/table>\\n  \u003c/div>\",\"css\":\".f5-lane { position: relative; height: 28px; margin-bottom: 4px; background: #fff; border: 1px solid #e5e7eb; border-radius: 6px; }\\n.f5-lane span { position: absolute; left: 8px; top: 4px; font-size: 12px; color: var(--muted); }\\n.f5-ball { position: absolute; top: 3px; left: 4px; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); }\\n.f5-tr { transition: transform .8s ease-out; } .f5-tr.go { transform: translateX(300px); }\\n@keyframes f5-move { to { transform: translateX(300px); } } .f5-an.go { animation: f5-move .8s ease-out forwards; }\",\"js\":\"(() => {\\n  $('#f5-run').onclick = () => {\\n    const tr = $('.f5-tr'), an = $('.f5-an'), wa = $('.f5-wa'), raf = $('.f5-raf');\\n    tr.classList.remove('go'); an.classList.remove('go'); void tr.offsetWidth;                       // リセット\\n    tr.classList.add('go');                                                                          // 1. transition：クラス付与\\n    an.classList.add('go');                                                                          // 2. CSS animation：クラス付与\\n    wa.animate([{ transform: 'none' }, { transform: 'translateX(300px)' }], { duration: 800, easing: 'ease-out', fill: 'forwards' }); // 3. WAAPI\\n    const t0 = performance.now(), ease = p => 1 - (1 - p) ** 3;                                    // 4. rAF：自分で補間\\n    const step = now => { const p = Math.min(1, (now - t0) / 800); raf.style.transform = `translateX(${ease(p) * 300}px)`; if (p < 1) requestAnimationF
