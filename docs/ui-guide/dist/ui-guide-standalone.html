 return state; future.push(state); state = past.pop(); emit(); return state; },\n    redo() { if (!future.length) return state; past.push(state); state = future.pop(); emit(); return state; },\n    subscribe(fn) { subs.add(fn); return () => subs.delete(fn); },\n  };\n}\n\n\n// ---- hotkeys.js ----\n// hotkeys.js — ショートカットキー登録\n// 参照デモ: 35 ショートカット / 36 コマンドパレット\n//\n//   const dispose = registerHotkeys({\n//     'mod+s': (e) => save(),        // mod = Windows: Ctrl / Mac: ⌘\n//     'mod+shift+z': (e) => redo(),\n//     'n': (e) => create(),          // 単独キーは入力欄内では発火しない（ignoreInputs）\n//   }, { target: document, ignoreInputs: true });\n// 内側の部品（focus-trap の Esc など）が preventDefault 済みのイベントは無視する（skipPrevented: true）。\nfunction registerHotkeys(map, { target = document, ignoreInputs = true, skipPrevented = true } = {}) {\n  const isMac = /Mac|iPhone|iPad/.test(navigator.platform);\n  const norm = (combo) => combo.toLowerCase().split('+').map(k => k === 'mod' ? (isMac ? 'meta' : 'ctrl') : k).sort().join('+');\n  const table = new Map(Object.entries(map).map(([k, fn]) => [norm(k), fn]));\n  const typing = () => { const a = target.activeElement || document.activeElement; return a && (/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) || a.isContentEditable); };\n  const handler = (e) => {\n    if (skipPrevented && e.defaultPrevented) return;\n    const parts = [];\n    if (e.ctrlKey) parts.push('ctrl'); if (e.metaKey) parts.push('meta'); if (e.altKey) parts.push('alt'); if (e.shiftKey) parts.push('shift');\n    const key = e.key.length === 1 ? e.key.toLowerCase() : e.key.toLowerCase();\n    if (!['control', 'meta', 'alt', 'shift'].includes(key)) parts.push(key);\n    const fn = table.get(parts.sort().join('+'));\n    if (!fn) return;\n    if (ignoreInputs && typing() && !e.ctrlKey && !e.metaKey) return;   // 入力中は修飾なしキーを無視\n    e.preventDefault(); fn(e);\n  };\n  target.addEventListener('keydown', handler);\n  return () => target.removeEventListener('keydown', handler);\n}\n\n\n// ---- search.js ----\n// search.js — デバウンス / あいまい検索 / ハイライト\n// 参照デモ: 74 検索の型\nfunction debounce(fn, ms) {\n  let t; const d = (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };\n  d.cancel = () => clearTimeout(t); return d;\n}\nconst esc = (s) => String(s).replace(/[&<>\"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;' }[c]));\n\n// 部分一致: 一致位置 1 箇所。null なら不一致\nfunction substringMatch(text, needle) {\n  const i = text.toLowerCase().indexOf(needle.toLowerCase());\n  return i < 0 ? null : { score: 1000 - i, ranges: [[i, i + needle.length]] };\n}\n// あいまい一致: needle の文字が順番に現れるか。連続 +8、先頭 +10、飛び越し減点、短いテキスト微優先\nfunction fuzzyMatch(text, needle) {\n  const t = text.toLowerCase(), n = needle.toLowerCase();\n  let ti = 0, score = 0, prev = -2; const ranges = [];\n  for (const ch of n) {\n    const i = t.indexOf(ch, ti); if (i < 0) return null;\n    score += (i === prev + 1 ? 8 : 1) + (i === 0 ? 10 : 0) - (i - ti) * 0.1;\n    if (ranges.length && ranges[ranges.length - 1][1] === i) ranges[ranges.length - 1][1] = i + 1; else ranges.push([i, i + 1]);\n    prev = i; ti = i + 1;\n  }\n  return { score: score - text.length * 0.01, ranges };\n}\n// ranges を <mark> で囲んだ HTML（エスケープ済み）\nfunction highlight(text, ranges, tag = 'mark') {\n  let out = '', pos = 0;\n  for (const [a, b] of ranges) { out += esc(text.slice(pos, a)) + `<${tag}>` + esc(text.slice(a, b)) + `\u003c/${tag}>`; pos = b; }\n  return out + esc(text.slice(pos));\n}\n// 一括検索してスコア順に返す\n//   search(items, needle, { text: item => item.name, fuzzy: true, limit: 100 }) → [{ item, score, ranges }]\nfunction search(items, needle, { text = (x) => String(x), fuzzy = false, limit = Infinity } = {}) {\n  if (!needle) return items.slice(0, limit).map(item => ({ item, score: 0, ranges: [] }));\n  const match = fuzzy ? fuzzyMatch : substringMatch, hits = [];\n  for (const item of items) { const m = match(text(item), needle); if (m) hits.push({ item, ...m }); }\n  hits.sort((a, b) => b.score - a.score);\n  return hits.slice(0, limit);\n}\n\n\n// ---- offline-queue.js ----\n// offline-queue.js — オフライン時の操作キューと再送\n// 参照デモ: 79 オフライン対応 / 57 楽観的更新\n//\n//   const q = createOfflineQueue({\n//     storageKey: 'app.queue',\n//     send: async (job) => { await api.put(job) },      // 失敗は throw（キューに残る）\n//     isOnline: () => navigator.onLine,                  // 任意\n//   });\n//   q.push(job) / q.flush() / q.size / q.jobs / q.subscribe(fn)\n// 送信は先頭から順に。1件失敗したらそこで止め、次の flush（online イベント or 手動）で再開。\nfunction createOfflineQueue({ storageKey, send, isOnline = () => navigator.onLine, storage = globalThis.localStorage } = {}) {\n  let jobs = []; try { jobs = JSON.parse(storage?.getItem(storageKey) || '[]'); } catch {}\n  let busy = false; const subs = new Set();\n  const persist = () => { try { storage?.setItem(storageKey, JSON.stringify(jobs)); } catch {} subs.forEach(fn => fn(api)); };\n  const api = {\n    get size() { return jobs.length; }, get jobs() { return jobs.slice(); }, get busy() { return busy; },\n    push(job) { jobs.push({ id: Date.now() + Math.random(), ...job }); persist(); return api.flush(); },\n    async flush() {\n      if (busy) return { sent: 0, failed: null };\n      busy = true; let sent = 0, failed = null;\n      try {\n        while (jobs.length && isOnline()) {\n          const job = jobs[0];\n          try { await send(job); jobs.shift(); sent++; persist(); }\n          catch (err) { failed = { job, err }; break; }\n        }\n      } finally { busy = false; }\n      subs.forEach(fn => fn(api));\n      return { sent, failed };\n    },\n    clear() { jobs = []; persist(); },\n    subscribe(fn) { subs.add(fn); return () => subs.delete(fn); },\n  };\n  globalThis.addEventListener?.('online', () => api.flush());\n  return api;\n}\n\n\n// ---- merge.js ----\n// merge.js — 3方向マージ（競合解決）\n// 参照デモ: 78 競合解決 / 77 差分表示\n//\n//   threeWayMerge(base, mine, theirs, { prefer: 'mine' })\n//   → { merged, conflicts: [{ key, base, mine, theirs }], changes: { key: 'mine'|'theirs'|'both'|'none' } }\n// 片方だけ変えた項目はその値、両方が別の値に変えた項目は conflict（prefer で暫定採用）。\nfunction threeWayMerge(base, mine, theirs, { prefer = 'mine' } = {}) {\n  const keys = new Set([...Object.keys(base || {}), ...Object.keys(mine || {}), ...Object.keys(theirs || {})]);\n  const merged = {}, conflicts = [], changes = {};\n  for (const k of keys) {\n    const b = base?.[k], m = mine?.[k], t = theirs?.[k];\n    const mc = m !== b, tc = t !== b;\n    if (mc && tc && m !== t) { conflicts.push({ key: k, base: b, mine: m, theirs: t }); merged[k] = prefer === 'mine' ? m : t; changes[k] = 'both'; }\n    else if (mc) { merged[k] = m; changes[k] = 'mine'; }\n    else if (tc) { merged[k] = t; changes[k] = 'theirs'; }\n    else { merged[k] = b; changes[k] = 'none'; }\n  }\n  return { merged, conflicts, changes };\n}\n\n// 単語単位の差分（LCS）: [{ type: 'same'|'del'|'ins', text }]\nfunction wordDiff(a, b) {\n  const A = a.split(/(\\s+)/), B = b.split(/(\\s+)/), n = A.length, m = B.length;\n  const L = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));\n  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);\n  const out = []; let i = 0, j = 0;\n  const push = (type, text) => { const last = out[out.length - 1]; last && last.type === type ? (last.text += text) : out.push({ type, text }); };\n  while (i < n && j < m) {\n    if (A[i] === B[j]) { push('same', A[i]); i++; j++; }\n    else if (L[i + 1][j] >= L[i][j + 1]) { push('del', A[i++]); }\n    else { push('ins', B[j++]); }\n  }\n  while (i < n) push('del', A[i++]); while (j < m) push('ins', B[j++]);\n  return out;\n}\nfunction diffToHtml(parts) {\n  const esc = (s) => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));\n  return parts.map(p => p.type === 'same' ? esc(p.text) : `<${p.type}>${esc(p.text)}\u003c/${p.type}>`).join('');\n}\n\n\n// ---- store.js ----\n// store.js — 永続化ストア（ワークスペース状態・下書き・レイアウト）\n// 参照デモ: 75 フォーム下書き / 80 レイアウト保存 / 81 ワークスペース永続化\n//\n//   const ws = createPersistentStore('app.workspace', { tab: 'orders', filter: '', scroll: 0 }, { debounceMs: 200 });\n//   ws.get() / ws.set({ tab: 'parts' }) / ws.reset() / ws.subscribe(fn) / ws.flush()\n// set はマージ。保存はデバウンスされる（連続スクロール等で書き込み過多にならない）。\nfunction createPersistentStore(key, defaults, { debounceMs = 200, storage = globalThis.localStorage } = {}) {\n  let state = { ...defaults };\n  try { Object.assign(state, JSON.parse(storage?.getItem(key) || '{}')); } catch {}\n  const subs = new Set(); let timer = null;\n  const write = () => { timer = null; try { storage?.setItem(key, JSON.stringify(state)); } catch {} };\n  return {\n    get: () => state,\n    set(patch) { state = { ...state, ...patch }; subs.forEach(fn => fn(state)); clearTimeout(timer); timer = setTimeout(write, debounceMs); return state; },\n    flush() { clearTimeout(timer); write(); },\n    reset() { state = { ...defaults }; try { storage?.removeItem(key); } catch {} subs.forEach(fn => fn(state)); },\n    subscribe(fn) { subs.add(fn); return () => subs.delete(fn); },\n  };\n}\n\n\n// ---- sync.js ----\n// sync.js — 複数ウィンドウ間の状態同期（BroadcastChannel + storage イベントの2経路）\n// 参照デモ: 85 マルチウィンドウ同期\n//\n//   const ch = createSyncChannel('app.state', { onState: (state, from) => render(state) });\n//   ch.publish(state)   // 自分以外の全ウィンドウへ\n//   ch.hello(() => state) // 起動時: 既存ウィンドウに現状を問い合わせる（応答は onState に届く）\n//   ch.dispose()\nfunction createSyncChannel(name, { onState, storage = globalThis.localStorage } = {}) {\n  const me = Math.random().toString(36).slice(2, 8), seen = new Set(), key = `sync:${name}`;\n  const bc = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel(name) : null;\n  let current = null;\n  const send = (msg) => {\n    msg.id = `${me}:${Date.now()}:${Math.random()}`; msg.from = me;\n    bc?.postMessage(msg);\n    try { storage?.setItem(key, JSON.stringify(msg)); } catch {}\n  };\n  const receive = (msg) => {\n    if (!msg || msg.from === me || seen.has(msg.id)) return; seen.add(msg.id);\n    if (seen.size > 500) seen.clear();\n    if (msg.type === 'hello') { if (current) send({ type: 'state', state: current() }); return; }\n    if (msg.type === 'state') onState?.(msg.state, msg.from);\n  };\n  const onBc = (e) => receive(e.data);\n  const onStorage = (e) => { if (e.key === key && e.newValue) { try { receive(JSON.parse(e.newValue)); } catch {} } };\n  bc?.addEventListener('message', onBc);\n  globalThis.addEventListener?.('storage', onStorage);\n  return {\n    id: me,\n    publish: (state) => send({ type: 'state', state }),\n    hello(getState) { current = getState; send({ type: 'hello' }); },\n    dispose() { bc?.removeEventListener('message', onBc); bc?.close(); globalThis.removeEventListener?.('storage', onStorage); },\n  };\n}\n\n\n// ---- focus-trap.js ----\n// focus-trap.js — モーダル用のフォーカス管理（閉じ込め・背面 inert・復帰）\n// 参照デモ: 58 フォーカス管理 / 15 モーダル\n//\n//   const trap = activateFocusTrap(modalEl, { inertTargets: [mainEl], onEscape: close, initialFocus: 'input' });\n//   trap.release()   // 背面の inert を戻し、開く前の要素へフォーカスを返す\nfunction activateFocusTrap(container, { inertTargets = [], onEscape, initialFocus } = {}) {\n  const SEL = 'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex=\"-1\"])';\n  const opener = document.activeElement;\n  const prevInert = inertTargets.map(el => [el, el.inert]);\n  inertTargets.forEach(el => { if (!el.contains(container)) el.inert = true; });\n  const focusables = () => [...container.querySelectorAll(SEL)].filter(el => el.getClientRects().length);\n  const first = typeof initialFocus === 'string' ? container.querySelector(initialFocus) : initialFocus || focusables()[0] || container;\n  if (first) { if (first === container && container.tabIndex < 0) container.tabIndex = -1; first.focus(); }\n  const onKey = (e) => {\n    if (e.key === 'Escape' && onEscape) { e.preventDefault(); onEscape(e); return; }\n    if (e.key !== 'Tab') return;\n    const list = focusables(); if (!list.length) { e.preventDefault(); return; }\n    const i = list.indexOf(document.activeElement);\n    if (e.shiftKey && (i <= 0)) { e.preventDefault(); list[list.length - 1].focus(); }        // 先頭で Shift+Tab → 末尾へ\n    else if (!e.shiftKey && (i === -1 || i === list.length - 1)) { e.preventDefault(); list[0].focus(); } // 末尾で Tab → 先頭へ\n  };\n  container.addEventListener('keydown', onKey);\n  return {\n    release() {\n      container.removeEventListener('keydown', onKey);\n      prevInert.forEach(([el, v]) => el.inert = v);\n      opener?.focus?.();\n    },\n  };\n}\n\n\n// ---- position.js ----\n// position.js — ツールチップ / ポップオーバー / メニューの位置決め（反転・枠内補正）\n// 参照デモ: 17 ツールチップ / 20 ドロップダウン / 39 コンテキストメニュー\n//\n//   const { left, top, placement } = computePosition(anchorRect, popRect, {\n//     placement: 'top' | 'bottom' | 'left' | 'right',   // 希望する方向\n//     align: 'center' | 'start' | 'end',                 // 直交方向の揃え\n//     gap: 6,\n//     bounds: { left, top, right, bottom },              // 収める範囲（省略時はビューポート）\n//   });\n// 戻り値は bounds と同じ座標系。希望方向に余白が無ければ反対側へ反転し、直交方向は枠内に押し込む。\nfunction computePosition(anchor, pop, { placement = 'top', align = 'center', gap = 6, bounds } = {}) {\n  const b = bounds || { left: 0, top: 0, right: window.innerWidth, bottom: window.innerHeight };\n  const fits = (p) => p === 'top' ? anchor.top - gap - pop.height >= b.top : p === 'bottom' ? anchor.bottom + gap + pop.height <= b.bottom\n    : p === 'left' ? anchor.left - gap - pop.width >= b.left : anchor.right + gap + pop.width <= b.right;\n  const opposite = { top: 'bottom', bottom: 'top', left: 'right', right: 'left' };\n  let p = placement; if (!fits(p) && fits(opposite[p])) p = opposite[p];\n  let left, top;\n  const alongX = (p === 'top' || p === 'bottom');\n  if (alongX) {\n    top = p === 'top' ? anchor.top - gap - pop.height : anchor.bottom + gap;\n    left = align === 'start' ? anchor.left : align === 'end' ? anchor.right - pop.width : anchor.left + anchor.width / 2 - pop.width / 2;\n  } else {\n    left = p === 'left' ? anchor.left - gap - pop.width : anchor.right + gap;\n    top = align === 'start' ? anchor.top : align === 'end' ? anchor.bottom - pop.height : anchor.top + anchor.height / 2 - pop.height / 2;\n  }\n  left = Math.max(b.left, Math.min(left, b.right - pop.width));   // 枠内に押し込む\n  top = Math.max(b.top, Math.min(top, b.bottom - pop.height));\n  return { left, top, placement: p };\n}\n\n// クリック位置に出すメニュー用：右下に出し、はみ出す軸だけ反転\n//   positionAtPoint({x, y}, popRect, bounds) → { left, top }\nfunction positionAtPoint(point, pop, bounds) {\n  const b = bounds || { left: 0, top: 0, right: window.innerWidth, bottom: window.innerHeight };\n  let left = point.x, top = point.y;\n  if (left + pop.width > b.right) left = Math.max(b.left, point.x - pop.width);\n  if (top + pop.height > b.bottom) top = Math.max(b.top, point.y - pop.height);\n  return { left, top };\n}\n\n\n// ---- toast.js ----\n// toast.js — 通知トースト（積み上げ・自動消去・ホバーで停止・件数上限・aria-live）\n// 参照デモ: 16 トースト\n//\n//   const toast = createToaster({ host: document.body, max: 3, duration: 2500, position: 'bottom-right' });\n//   toast.show('保存しました');  toast.show('失敗', { kind: 'error', duration: 4000 });\n//   toast.dispose()\n// スタイルはクラス .uk-toast-host / .uk-toast / .uk-toast.error に自分で当てる（最小限のインラインは付与）。\nfunction createToaster({ host = document.body, max = 3, duration = 2500, position = 'bottom-right' } = {}) {\n  const wrap = document.createElement('div');\n  wrap.className = 'uk-toast-host'; wrap.setAttribute('aria-live', 'polite'); wrap.setAttribute('role', 'status');\n  const [v, h] = position.split('-');\n  Object.assign(wrap.style, { position: 'fixed', [v]: '16px', [h]: '16px', display: 'flex', flexDirection: v === 'top' ? 'column' : 'column-reverse', gap: '8px', zIndex: 9999, pointerEvents: 'none' });\n  host.appendChild(wrap);\n  const live = [];                                                       // 表示中（退場アニメーション中は含めない）\n  const dismiss = (el) => {\n    const i = live.indexOf(el); if (i < 0) return; live.splice(i, 1);     // 先に「表示中」から外す（上限判定はこの配列で行う）\n    el.classList.add('leaving'); const done = () => el.remove();\n    el.addEventListener('animationend', done, { once: true }); setTimeout(done, 400);\n  };\n  return {\n    show(message, { kind = 'info', duration: ms = duration } = {}) {\n      while (live.length >= max) dismiss(live[0]);                       // 古いものから消す\n      const el = document.createElement('div');\n      el.className = `uk-toast ${kind}`; el.textContent = message; el.style.pointerEvents = 'auto';\n      wrap.appendChild(el); live.push(el);\n      let timer; const arm = () => { timer = setTimeout(() => dismiss(el), ms); };\n      el.addEventListener('pointerenter', () => clearTimeout(timer));   // 読んでいる間は消さない\n      el.addEventListener('pointerleave', arm);\n      if (ms > 0) arm();\n      return { dismiss: () => { clearTimeout(timer); dismiss(el); } };\n    },\n    dispose() { wrap.remove(); },\n  };\n}\n\n\n// ---- sortable.js ----\n// sortable.js — Pointer Events によるドラッグ並べ替え（縦リスト、FLIP 付き）\n// 参照デモ: 32 ドラッグ並べ替え / 30 FLIP\n//\n//   const dispose = createSortable(listEl, {\n//     handle: '.grip',                 // 省略時は子要素全体\n//     onChange: (order) => {},         // 並び替え後の子要素配列\n//   });\n// 子要素は listEl の直下にあり、縦に並んでいる前提。持ち上げ中は .lifted クラスが付く。\nfunction createSortable(list, { handle, onChange, liftedClass = 'lifted' } = {}) {\n  let lifted = null, startY = 0, naturalTop = 0, pointerId = null;\n  const animating = new WeakSet();   // FLIP 中の兄弟は当たり判定から外す（アニメーション中の rect で判定すると往復してしまう）\n  const down = (e) => {\n    const item = e.target.closest(`${list.tagName === 'UL' || list.tagName === 'OL' ? 'li' : ':scope > *'}`);\n    if (!item || item.parentElement !== list) return;\n    if (handle && !e.target.closest(handle)) return;\n    lifted = item; pointerId = e.pointerId; startY = e.clientY; naturalTop = item.getBoundingClientRect().top;\n  split.js — 分割パネル（ガターのドラッグで幅を変更、最小幅、ダブルクリックで初期化）\n// 参照デモ: 33 分割パネル / 80 ドッキング\n//\n//   const split = createSplit(containerEl, { sizes: [240, null], min: 120, gutter: 6, direction: 'horizontal',\n//     onChange: (sizes) => save(sizes) });\n//   split.setSizes([300, null]) / split.getSizes() / split.dispose()\n// container は grid になり、子要素の間にガターが挿入される。sizes の null は 1fr（残り）。\nfunction createSplit(container, { sizes, min = 100, gutter = 6, direction = 'horizontal', onChange } = {}) {\n  const panes = [...container.children];\n  const horizontal = direction === 'horizontal';\n  const initial = sizes ? sizes.slice() : panes.map((_, i) => i === panes.length - 1 ? null : 200);\n  let cur = initial.slice();\n  const gutters = [];\n  const apply = () => {\n    const tpl = cur.map(s => s == null ? 'minmax(0, 1fr)' : `${s}px`).join(` ${gutter}px `);\n    container.style.display = 'grid';\n    container.style[horizontal ? 'gridTemplateColumns' : 'gridTemplateRows'] = tpl;\n    onChange?.(cur.slice());\n  };\n  panes.slice(0, -1).forEach((pane, i) => {\n    const g = document.createElement('div');\n    g.className = 'uk-gutter'; g.style.cursor = horizontal ? 'col-resize' : 'row-resize'; g.style.touchAction = 'none'; g.style.userSelect = 'none';\n    pane.after(g); gutters.push(g);\n    let st = null;\n    g.addEventListener('pointerdown', e => { st = { pos: horizontal ? e.clientX : e.clientY, size: panes[i][horizontal ? 'offsetWidth' : 'offsetHeight'] }; g.setPointerCapture(e.pointerId); });\n    g.addEventListener('pointermove', e => {\n      if (!st) return;\n      const total = container[horizontal ? 'clientWidth' : 'clientHeight'];\n      const others = cur.reduce((a, s, k) => a + (k === i || s == null ? 0 : s), 0) + gutter * (panes.length - 1);\n      cur[i] = Math.max(min, Math.min(total - others - min, st.size + (horizontal ? e.clientX : e.clientY) - st.pos));\n      apply();\n    });\n    g.addEventListener('pointerup', () => st = null);\n    g.addEventListener('dblclick', () => { cur[i] = initial[i]; apply(); });\n  });\n  apply();\n  return {\n    getSizes: () => cur.slice(),\n    setSizes: (s) => { cur = s.slice(); apply(); },\n    dispose() { gutters.forEach(g => g.remove()); container.style.display = ''; container.style[horizontal ? 'gridTemplateColumns' : 'gridTemplateRows'] = ''; },\n  };\n}\n\n\n  return { createDrag, constrain, createCamera, attachPanZoom, createVirtualList, flattenTree, createHistory, registerHotkeys, debounce, substringMatch, fuzzyMatch, highlight, search, createOfflineQueue, threeWayMerge, wordDiff, diffToHtml, createPersistentStore, createSyncChannel, activateFocusTrap, computePosition, positionAtPoint, createToaster, createSortable, createSplit };\n});\n","ui-kit/drag.js":"// drag.js — ドラッグ操作の共通基盤（状態機械 + ポインタキャプチャ + 修飾キー制約）\n// 参照デモ: 02 パン / 49 ポインタキャプチャ / 51 修飾キー / 52 状態機械\n//\n// 使い方:\n//   const dispose = createDrag(el, {\n//     threshold: 4,                  // これ以上動いたら dragging（未満で離せば click 扱い）\n//     onStart(ctx) {}, onMove(ctx) {}, onEnd(ctx) {}, onClick(ctx) {}, onCancel(ctx) {},\n//   });\n//   ctx = { dx, dy, x, y, startX, startY, event, shift, alt, ctrl, meta, state }\n//\n// 副作用: el に pointer 系リスナーを追加し、touch-action:none を設定する。dispose() で解除。\nexport function createDrag(el, opts = {}) {\n  const { threshold = 4, capture = true, button = 0 } = opts;\n  let state = 'idle', start = null, pointerId = null;\n  const prevTouchAction = el.style.touchAction;\n  el.style.touchAction = 'none';\n\n  const ctxOf = (e) => ({\n    x: e.clientX, y: e.clientY, startX: start.x, startY: start.y,\n    dx: e.clientX - start.x, dy: e.clientY - start.y,\n    shift: e.shiftKey, alt: e.altKey, ctrl: e.ctrlKey, meta: e.metaKey, event: e, state,\n  });\n  const down = (e) => {\n    if (state !== 'idle' || (e.pointerType === 'mouse' && e.button !== button)) return;\n    if (opts.filter && !opts.filter(e)) return;\n    start = { x: e.clientX, y: e.clientY }; pointerId = e.pointerId; state = 'pressed';\n    if (capture) el.setPointerCapture(e.pointerId);\n  };\n  const move = (e) => {\n    if (state === 'idle' || e.pointerId !== pointerId) return;\n    if (state === 'pressed') {\n      if (Math.hypot(e.clientX - start.x, e.clientY - start.y) < threshold) return;\n      state = 'dragging'; opts.onStart?.(ctxOf(e));\n    }\n    opts.onMove?.(ctxOf(e));\n  };\n  const up = (e) => {\n    if (state === 'idle' || e.pointerId !== pointerId) return;\n    const was = state; state = 'idle';\n    was === 'dragging' ? opts.onEnd?.(ctxOf(e)) : opts.onClick?.(ctxOf(e));\n    start = null; pointerId = null;\n  };\n  const cancel = (e) => {\n    if (state === 'idle') return;\n    const was = state; state = 'idle';\n    if (was === 'dragging') opts.onCancel?.(ctxOf(e));\n    start = null; pointerId = null;\n  };\n  el.addEventListener('pointerdown', down);\n  el.addEventListener('pointermove', move);\n  el.addEventListener('pointerup', up);\n  el.addEventListener('pointercancel', cancel);\n  return () => {\n    el.removeEventListener('pointerdown', down); el.removeEventListener('pointermove', move);\n    el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', cancel);\n    el.style.touchAction = prevTouchAction;\n  };\n}\n\n// 修飾キーによる移動量の制約（51）\n//   constrain({dx, dy, shift, alt}, { grid: 20 }) → { dx, dy }\n//   shift: 軸固定（大きい方の軸だけ残す） / alt: grid に吸着\nexport function constrain(ctx, { grid = 0, axisLock = ctx.shift, snap = ctx.alt } = {}) {\n  let { dx, dy } = ctx;\n  if (axisLock) Math.abs(dx) > Math.abs(dy) ? (dy = 0) : (dx = 0);\n  if (snap && grid > 0) { dx = Math.round(dx / grid) * grid; dy = Math.round(dy / grid) * grid; }\n  return { dx, dy };\n}\n","ui-kit/example/index.html":"<!DOCTYPE html>\n<html lang=\"ja\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>ui-kit 実例：受注一覧\u003c/title>\n\u003cscript src=\"../dist/ui-kit.js\">\u003c/script>\n<style>\n  :root { --accent: #2563eb; --line: #e5e7eb; --muted: #6b7280; }\n  * { box-sizing: border-box; }\n  body { margin: 0; font: 13px system-ui, -apple-system, \"Segoe UI\", \"Noto Sans JP\", sans-serif; color: #1d1f23; background: #f6f7f9; height: 100vh; display: flex; flex-direction: column; }\n  header { display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: #fff; border-bottom: 1px solid var(--line); flex-wrap: wrap; }\n  header h1 { font-size: 15px; margin: 0 8px 0 0; }\n  input[type=search], input[type=text], select { font: inherit; padding: 5px 8px; border: 1px solid #cbd5e1; border-radius: 6px; }\n  button { font: inherit; padding: 5px 10px; border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; cursor: pointer; } button:hover { background: #f1f5f9; } button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }\n  .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #e0e7ff; color: #3730a3; cursor: default; } .badge.warn { background: #fef3c7; color: #92400e; } .badge.off { background: #fee2e2; color: #991b1b; }\n  #split { flex: 1; min-height: 0; }\n  #list { height: 100%; overflow: auto; background: #fff; user-select: none; }\n  .row { display: grid; grid-template-columns: 90px 1fr 140px 60px 80px; height: 30px; line-height: 30px; padding: 0 10px; border-bottom: 1px solid #f1f5f9; white-space: nowrap; overflow: hidden; cursor: default; }\n  .row.sel { background: #dbeafe; } .row.head { position: sticky; top: 0; background: #f1f5f9; font-weight: 600; z-index: 1; }\n  .row mark { background: #fde68a; padding: 0; }\n  .uk-gutter { background: #cbd5e1; } .uk-gutter:hover { background: var(--accent); }\n  #detail { height: 100%; overflow: auto; padding: 14px; background: #fff; }\n  #detail label { display: block; margin-bottom: 8px; } #detail label span { display: inline-block; width: 70px; color: var(--muted); }\n  #pins { list-style: none; padding: 0; margin: 6px 0; } #pins li { padding: 6px 10px; background: #f8fafc; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 4px; cursor: grab; touch-action: none; } #pins li.lifted { box-shadow: 0 8px 20px rgba(0,0,0,.15); background: #fff; }\n  .uk-toast { padding: 10px 14px; border-radius: 8px; background: #0f172a; color: #fff; font-size: 13px; box-shadow: 0 8px 20px rgba(0,0,0,.2); animation: in .25s ease-out; } .uk-toast.error { background: #dc2626; } .uk-toast.leaving { animation: out .25s ease-in forwards; }\n  @keyframes in { from { opacity: 0; transform: translateY(12px); } } @keyframes out { to { opacity: 0; transform: translateY(12px); } }\n  #modal { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: grid; place-items: center; } #modal[hidden] { display: none; } #modal .panel { background: #fff; padding: 18px; border-radius: 10px; width: 320px; } #modal :focus-visible { outline: 3px solid #f59e0b; }\n  #tip { position: fixed; background: #0f172a; color: #fff; font-size: 12px; padding: 6px 10px; border-radius: 6px; pointer-events: none; max-width: 240px; }\n  kbd { border: 1px solid #cbd5e1; border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; font-size: 11px; background: #fff; }\n  .hint { color: var(--muted); font-size: 12px; margin-left: auto; }\n\u003c/style>\n\u003c/head>\n<body>\n<header>\n  <h1>受注一覧（ui-kit 実例）\u003c/h1>\n  <input id=\"q\" type=\"search\" placeholder=\"検索（Ctrl+F）\" style=\"width:200px\">\n  <label><input type=\"checkbox\" id=\"fuzzy\"> あいまい\u003c/label>\n  <span id=\"count\" class=\"badge\">-\u003c/span>\n  <button id=\"undo\" title=\"Ctrl+Z\">↶\u003c/button><button id=\"redo\" title=\"Ctrl+Shift+Z\">↷\u003c/button>\n  <label><input type=\"checkbox\" id=\"offline\"> オフライン（模擬）\u003c/label>\n  <span id=\"sync\" class=\"badge\">同期済み\u003c/span>\n  <button id=\"other\">他ユーザーが更新（競合を起こす）\u003c/button>\n  <button id=\"open\">別ウィンドウ\u003c/button>\n  <span class=\"hint\"><kbd>Ctrl\u003c/kbd>+<kbd>F\u003c/kbd> 検索 / <kbd>Ctrl\u003c/kbd>+<kbd>Z\u003c/kbd> 取消 / <kbd>Ctrl\u003c/kbd>+<kbd>S\u003c/kbd> 送信 / <kbd>Esc\u003c/kbd> 選択解除\u003c/span>\n\u003c/header>\n<div id=\"split\">\n  <div id=\"list\">\u003c/div>\n  <div id=\"detail\"><p style=\"color:var(--muted)\">左の行を選択してください\u003c/p>\u003c/div>\n\u003c/div>\n<div id=\"modal\" role=\"dialog\" aria-modal=\"true\" hidden><div class=\"panel\"><b id=\"modal-title\">\u003c/b><p style=\"color:var(--muted)\">この操作は取り消せません。\u003c/p><div style=\"display:flex;gap:8px;justify-content:flex-end\"><button id=\"modal-cancel\">キャンセル\u003c/button><button id=\"modal-ok\" class=\"primary\">削除\u003c/button>\u003c/div>\u003c/div>\u003c/div>\n<div id=\"tip\" hidden>\u003c/div>\n\u003cscript>\n(() => {\n  const K = window.UIKit, $ = s => document.querySelector(s);\n  // ---------- データ（疑似サーバ） ----------\n  const STATUS = ['受注', '製造中', '出荷済'];\n  const server = new Map(Array.from({ length: 5000 }, (_, i) => [1001 + i, { id: 1001 + i, name: `部品${i + 1}`, customer: ['株式会社サンプル', '有限会社テスト', '合同会社デモ'][i % 3], qty: (i % 9 + 1) * 10, status: STATUS[(i * 7) % 3], revision: 1 }]));\n  const api = { // 13-kintone の PUT 相当。revision 不一致は競合エラー\n    put: (id, patch, revision) => new Promise((ok, ng) => setTimeout(() => {\n      if ($('#offline').checked) return ng(new Error('offline'));\n      const cur = server.get(id); if (cur.revision !== revision) return ng(Object.assign(new Error('conflict'), { code: 'CONFLICT', server: { ...cur } }));\n      server.set(id, { ...cur, ...patch, revision: cur.revision + 1 }); ok(server.get(id));\n    }, 300)),\n  };\n  // ---------- 状態 ----------\n  const history = K.createHistory({ records: [...server.values()].map(r => ({ ...r })), pins: [] });   // undo 対象\n  const ws = K.createPersistentStore('ui-kit.example.ws', { filter: '', fuzzy: false, selected: null, scroll: 0, sizes: [null, 360] }); // 永続化\n  const toast = K.createToaster({ max: 3 });\n  let view = [];                                                                                          // 検索結果（表示順の行）\n  const byId = id => history.state.records.find(r => r.id === id);\n  // ---------- 通信キュー（オフライン対応 + 競合解決） ----------\n  const queue = K.createOfflineQueue({ storageKey: 'ui-kit.example.queue', isOnline: () => !$('#offline').checked, send: async job => {\n    try { const saved = await api.put(job.id, job.patch, job.revision); applyServer(saved); }\n    catch (err) {\n      if (err.code !== 'CONFLICT') throw err;                                                             // 通信系はキューに残す\n      const base = { ...job.base }, mine = { ...job.base, ...job.patch }, theirs = { qty: err.server.qty, status: err.server.status, name: err.server.name };\n      const { merged, conflicts } = K.threeWayMerge(base, mine, theirs);                                   // 78: 3方向マージ\n      toast.show(`#${job.id}: 他ユーザー更新と自動マージ${conflicts.length ? `（競合 ${conflicts.map(c => c.key).join(',')} は自分を優先）` : ''}`, { kind: conflicts.length ? 'error' : 'info', duration: 4000 });\n      const saved = await api.put(job.id, merged, err.server.revision); applyServer(saved);\n    }\n  }});\n  const applyServer = saved => { const r = byId(saved.id); if (r) Object.assign(r, saved); renderList(); renderDetail(); };\n  const syncBadge = () => { const b = $('#sync'); const off = $('#offline').checked; b.textContent = off ? `オフライン / 未同期 ${queue.size}` : queue.size ? `送信中 / 未同期 ${queue.size}` : '同期済み'; b.className = 'badge ' + (off ? 'off' : queue.size ? 'warn' : ''); };\n  queue.subscribe(syncBadge); $('#offline').onchange = () => { syncBadge(); queue.flush(); };\n  // ---------- 編集（楽観的更新 + undo + キュー） ----------\n  const edit = (id, patch) => {\n    const r = byId(id); const base = { qty: r.qty, status: r.status, name: r.name };\n    const records = history.state.records.map(x => x.id === id ? { ...x, ...patch } : x);                 // 先に画面へ（57）\n    history.commit({ ...history.state, records });\n    queue.push({ id, patch, base, revision: r.revision });                                                // 送信はキュー経由（79）\n    channel.publish({ records: history.state.records.filter(x => x.id === id) });\n    renderList(); renderDetail();\n  };\n  // ---------- 検索 + 仮想リスト ----------\n  const list = $('#list'); list.innerHTML = '<div class=\"row head\"><div>ID\u003c/div><div>品名 / 顧客\u003c/div><div>ステータス\u003c/div><div>数量\u003c/div><div>rev\u003c/div>\u003c/div>';\n  const vl = K.createVirtualList(list, { rowHeight: 30, count: 0, renderRow: i => {\n    const h = view[i], r = h.item, sel = ws.get().selected === r.id;\n    const label = h.ranges.length ? K.highlight(`${r.name} ${r.customer}`, h.ranges) : `${r.name} ${r.customer}`;\n    return `<div class=\"row ${sel ? 'sel' : ''}\" data-id=\"${r.id}\"><div>#${r.id}\u003c/div><div>${label}\u003c/div><div>${r.status}\u003c/div><div>${r.qty}\u003c/div><div>${r.revision}\u003c/div>\u003c/div>`;\n  }});\n  const runSearch = () => {\n    const { filter, fuzzy } = ws.get();\n    view = K.search(history.state.records, filter, { text: r => `${r.name} ${r.customer}`, fuzzy });\n    vl.setCount(view.length); $('#count').textContent = `${view.length.toLocaleString()} / ${history.state.records.length.toLocaleString()} 件`;\n  };\n  const renderList = () => { runSearch(); vl.refresh(); };\n  $('#q').addEventListener('input', K.debounce(() => { ws.set({ filter: $('#q').value, scroll: 0 }); list.scrollTop = 0; renderList(); }, 250));\n  $('#fuzzy').onchange = () => { ws.set({ fuzzy: $('#fuzzy').checked }); renderList(); };\n  list.addEventListener('click', e => { const row = e.target.closest('[data-id]'); if (row) { ws.set({ selected: +row.dataset.id }); vl.refresh(); renderDetail(); } });\n  list.addEventListener('scroll', () => ws.set({ scroll: list.scrollTop }));\n  // ---------- 詳細（インライン編集 / ピン / 削除モーダル） ----------\n  const detail = $('#detail');\n  const renderDetail = () => {\n    const r = byId(ws.get().selected);\n    if (!r) { detail.innerHTML = '<p style=\"color:var(--muted)\">左の行を選択してください\u003c/p>'; return; }\n    detail.innerHTML = `<h3 style=\"margin:0 0 10px\">#${r.id} ${r.name} <small style=\"color:var(--muted)\">rev ${r.revision}\u003c/small>\u003c/h3>\n      <label><span>顧客\u003c/span>${r.customer}\u003c/label>\n      <label><span>数量\u003c/span><input id=\"f-qty\" type=\"text\" value=\"${r.qty}\" style=\"width:80px\">\u003c/label>\n      <label><span>ステータス\u003c/span><select id=\"f-status\">${STATUS.map(s => `<option ${s === r.status ? 'selected' : ''}>${s}\u003c/option>`).join('')}\u003c/select>\u003c/label>\n      <div style=\"display:flex;gap:8px;margin:12px 0\"><button id=\"pin\">ピン留め\u003c/button><button id=\"del\">削除…\u003c/button>\u003c/div>\n      <b>ピン留め（ドラッグで並べ替え）\u003c/b><ul id=\"pins\">${history.state.pins.map(id => `<li data-id=\"${id}\">⋮⋮ #${id} ${byId(id)?.name || ''}\u003c/li>`).join('') || '<li style=\"color:var(--muted);cursor:default\">なし\u003c/li>'}\u003c/ul>`;\n    $('#f-qty').addEventListener('change', e => { const v = +e.target.value; if (v > 0) edit(r.id, { qty: v }); else { toast.show('数量は1以上', { kind: 'error' }); e.target.focus(); } });\n    $('#f-status').addEventListener('change', e => edit(r.id, { status: e.target.value }));\n    $('#pin').onclick = () => { if (!history.state.pins.includes(r.id)) { history.commit({ ...history.state, pins: [...history.state.pins, r.id] }); renderDetail(); } };\n    $('#del').onclick = () => openModal(r);\n    K.createSortable($('#pins'), { onChange: items => { const pins = items.map(li => +li.dataset.id).filter(Boolean); history.commit({ ...history.state, pins }); } });\n  };\n  // 削除モーダル：focus-trap（58）\n  const modal = $('#modal'); let trap = null;\n  const openModal = r => { $('#modal-title').textContent = `#${r.id} ${r.name} を削除しますか？`; modal.hidden = false; trap = K.activateFocusTrap(modal, { inertTargets: [document.querySelector('header'), $('#split')], onEscape: closeModal, initialFocus: '#modal-cancel' });\n    $('#modal-ok').onclick = () => { history.commit({ ...history.state, records: history.state.records.filter(x => x.id !== r.id), pins: history.state.pins.filter(id => id !== r.id) }); ws.set({ selected: null }); closeModal(); renderList(); renderDetail(); toast.show(`#${r.id} を削除（Ctrl+Z で戻せます）`); }; };\n  const closeModal = () => { trap?.release(); trap = null; modal.hidden = true; };\n  $('#modal-cancel').onclick = closeModal;\n  // ---------- ショートカット ----------\n  // undo/redo は画面だけ戻すのではなく、変わったレコードをサーバにも送る（差分をキューへ）\n  const travel = (dir) => {\n    const before = history.state; const after = dir === 'undo' ? history.undo() : history.redo(); if (after === before) return;\n    after.records.forEach(r => { const b = before.records.find(x => x.id === r.id); if (b && (b.qty !== r.qty || b.status !== r.status)) queue.push({ id: r.id, patch: { qty: r.qty, status: r.status }, base: { qty: b.qty, status: b.status, name: b.name }, revision: r.revision }); });\n    renderList(); renderDetail();\n  };\n  K.registerHotkeys({\n    'mod+f': () => { $('#q').focus(); $('#q').select(); },\n    'mod+z': () => travel('undo'),\n    'mod+shift+z': () => travel('redo'),\n    'mod+s': () => queue.flush().then(r => toast.show(r.sent ? `${r.sent} 件送信` : r.failed ? '送信失敗（未同期のまま）' : '未送信なし')),\n    'escape': () => { if (!modal.hidden) return; ws.set({ selected: null }); vl.refresh(); renderDetail(); },\n  });\n  $('#undo').onclick = () => travel('undo'); $('#redo').onclick = () => travel('redo');\n  // ---------- ツールチップ（position） ----------\n  const tip = $('#tip');\n  $('#sync').addEventListener('pointerenter', e => { tip.textContent = queue.size ? `未同期: ${queue.jobs.map(j => '#' + j.id).join(', ')}` : '全ての変更がサーバに反映されています'; tip.hidden = false; const p = K.computePosition(e.target.getBoundingClientRect(), tip.getBoundingClientRect(), { placement: 'bottom' }); tip.style.left = p.left + 'px'; tip.style.top = p.top + 'px'; });\n  $('#sync').addEventListener('pointerleave', () => tip.hidden = true);\n  // ---------- 別ウィンドウ同期（sync） ----------\n  const channel = K.createSyncChannel('ui-kit.example', { onState: s => { s.records?.forEach(u => { const r = byId(u.id); if (r) Object.assign(r, u); }); renderList(); renderDetail(); } });\n  channel.hello(() => ({ records: history.state.records.slice(0, 200) }));\n  $('#open').onclick = () => window.open(location.href, '_blank', 'width=1000,height=700');\n  // ---------- 他ユーザー更新の模擬（競合） ----------\n  $('#other').onclick = () => { const id = ws.get().selected || 1001; const cur = server.get(id); server.set(id, { ...cur, qty: cur.qty + 5, revision: cur.revision + 1 }); toast.show(`サーバ側で #${id} が更新された（rev ${cur.revision + 1}）。次の保存で競合解決が動く`); };\n  // ---------- レイアウト（split）と初期化 ----------\n  const split = K.createSplit($('#split'), { sizes: ws.get().sizes, min: 240, gutter: 6, onChange: s => ws.set({ sizes: s }) });\n  $('#q').value = ws.get().filter; $('#fuzzy').checked = ws.get().fuzzy;\n  renderList(); renderDetail(); syncBadge();\n  requestAnimationFrame(() => { list.scrollTop = ws.get().scroll; });\n  history.subscribe(() => { $('#undo').disabled = !history.canUndo; $('#redo').disabled = !history.canRedo; });\n  window.__app = { history, ws, queue, view: () => view, server };   // 検証用\n})();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n","ui-kit/focus-trap.js":"// focus-trap.js — モーダル用のフォーカス管理（閉じ込め・背面 inert・復帰）\n// 参照デモ: 58 フォーカス管理 / 15 モーダル\n//\n//   const trap = activateFocusTrap(modalEl, { inertTargets: [mainEl], onEscape: close, initialFocus: 'input' });\n//   trap.release()   // 背面の inert を戻し、開く前の要素へフォーカスを返す\nexport function activateFocusTrap(container, { inertTargets = [], onEscape, initialFocus } = {}) {\n  const SEL = 'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex=\"-1\"])';\n  const opener = document.activeElement;\n  const prevInert = inertTargets.map(el => [el, el.inert]);\n  inertTargets.forEach(el => { if (!el.contains(container)) el.inert = true; });\n  const focusables = () => [...container.querySelectorAll(SEL)].filter(el => el.getClientRects().length);\n  const first = typeof initialFocus === 'string' ? container.querySelector(initialFocus) : initialFocus || focusables()[0] || container;\n  if (first) { if (first === container && container.tabIndex < 0) container.tabIndex = -1; first.focus(); }\n  const onKey = (e) => {\n    if (e.key === 'Escape' && onEscape) { e.preventDefault(); onEscape(e); return; }\n    if (e.key !== 'Tab') return;\n    const list = focusables(); if (!list.length) { e.preventDefault(); return; }\n    const i = list.indexOf(document.activeElement);\n    if (e.shiftKey && (i <= 0)) { e.preventDefault(); list[list.length - 1].focus(); }        // 先頭で Shift+Tab → 末尾へ\n    else if (!e.shiftKey && (i === -1 || i === list.length - 1)) { e.preventDefault(); list[0].focus(); } // 末尾で Tab → 先頭へ\n  };\n  container.addEventListener('keydown', onKey);\n  return {\n    release() {\n      container.removeEventListener('keydown', onKey);\n      prevInert.forEach(([el, v]) => el.inert = v);\n      opener?.focus?.();\n    },\n  };\n}\n","ui-kit/hotkeys.js":"// hotkeys.js — ショートカットキー登録\n// 参照デモ: 35 ショートカット / 36 コマンドパレット\n//\n//   const dispose = registerHotkeys({\n//     'mod+s': (e) => save(),        // mod = Windows: Ctrl / Mac: ⌘\n//     'mod+shift+z': (e) => redo(),\n//     'n': (e) => create(),          // 単独キーは入力欄内では発火しない（ignoreInputs）\n//   }, { target: document, ignoreInputs: true });\n// 内側の部品（focus-trap の Esc など）が preventDefault 済みのイベントは無視する（skipPrevented: true）。\nexport function registerHotkeys(map, { target = document, ignoreInputs = true, skipPrevented = true } = {}) {\n  const isMac = /Mac|iPhone|iPad/.test(navigator.platform);\n  const norm = (combo) => combo.toLowerCase().split('+').map(k => k === 'mod' ? (isMac ? 'meta' : 'ctrl') : k).sort().join('+');\n  const table = new Map(Object.entries(map).map(([k, fn]) => [norm(k), fn]));\n  const typing = () => { const a = target.activeElement || document.activeElement; return a && (/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) || a.isContentEditable); };\n  const handler = (e) => {\n    if (skipPrevented && e.defaultPrevented) return;\n    const parts = [];\n    if (e.ctrlKey) parts.push('ctrl'); if (e.metaKey) parts.push('meta'); if (e.altKey) parts.push('alt'); if (e.shiftKey) parts.push('shift');\n    const key = e.key.length === 1 ? e.key.toLowerCase() : e.key.toLowerCase();\n    if (!['control', 'meta', 'alt', 'shift'].includes(key)) parts.push(key);\n    const fn = table.get(parts.sort().join('+'));\n    if (!fn) return;\n    if (ignoreInputs && typing() && !e.ctrlKey && !e.metaKey) return;   // 入力中は修飾なしキーを無視\n    e.preventDefault(); fn(e);\n  };\n  target.addEventListener('keydown', handler);\n  return () => target.removeEventListener('keydown', handler);\n}\n","ui-kit/index.d.ts":"// ui-kit の型定義（TypeScript / エディタ補完用）。実装は各 .js。\n// import { createVirtualList } from './ui-kit/index.js';  ← この宣言が当たる\n\nexport interface DragContext {\n  x: number; y: number; startX: number; startY: number; dx: number; dy: number;\n  shift: boolean; alt: boolean; ctrl: boolean; meta: boolean; event: PointerEvent; state: 'idle' | 'pressed' | 'dragging';\n}\nexport interface DragOptions {\n  threshold?: number; capture?: boolean; button?: number; filter?: (e: PointerEvent) => boolean;\n  onStart?: (ctx: DragContext) => void; onMove?: (ctx: DragContext) => void; onEnd?: (ctx: DragContext) => void;\n  onClick?: (ctx: DragContext) => void; onCancel?: (ctx: DragContext) => void;\n}\nexport function createDrag(el: HTMLElement, opts?: DragOptions): () => void;\nexport function constrain(ctx: { dx: number; dy: number; shift?: boolean; alt?: boolean }, opts?: { grid?: number; axisLock?: boolean; snap?: boolean }): { dx: number; dy: number };\n\nexport interface Camera {\n  x: number; y: number; scale: number; readonly transform: string;\n  toWorld(sx: number, sy: number): { x: number; y: number };\n  toScreen(wx: number, wy: number): { x: number; y: number };\n  panBy(dx: number, dy: number): Camera;\n  zoomAt(sx: number, sy: number, factor: number): Camera;\n  set(next: Partial<{ x: number; y: number; scale: number }>): Camera;\n  subscribe(fn: (cam: Camera) => void): () => void;\n}\nexport function createCamera(opts?: { x?: number; y?: number; scale?: number; minScale?: number; maxScale?: number }): Camera;\nexport function attachPanZoom(view: HTMLElement, cam: Camera, opts?: { wheelSensitivity?: number; filter?: (e: PointerEvent) => boolean }): () => void;\n\nexport interface VirtualList {\n  setCount(n: number): void; refresh(): void; range(): { start: number; end: number }; scrollToIndex(i: number): void; dispose(): void;\n}\nexport function createVirtualList(view: HTMLElement, opts: { rowHeight: number; count?: number; overscan?: number; renderRow: (index: number) => string | Node }): VirtualList;\nexport function flattenTree<T extends Record<string, any>>(nodes: T[], opts?: { children?: string; open?: string }): { node: T; depth: number }[];\n\nexport interface History<S> {\n  readonly state: S; readonly canUndo: boolean; readonly canRedo: boolean;\n  commit(next: S): S; undo(): S; redo(): S; subscribe(fn: (state: S) => void): () => void;\n}\nexport function createHistory<S>(initial: S, opts?: { limit?: number }): History<S>;\n\nexport function registerHotkeys(map: Record<string, (e: KeyboardEvent) => void>, opts?: { target?: EventTarget & { activeElement?: Element | null }; ignoreInputs?: boolean; skipPrevented?: boolean }): () => void;\n\nexport interface Match { score: number; ranges: [number, number][] }\nexport function debounce<F extends (...args: any[]) => void>(fn: F, ms: number): F & { cancel(): void };\nexport function substringMatch(text: string, needle: string): Match | null;\nexport function fuzzyMatch(text: string, needle: string): Match | null;\nexport function highlight(text: string, ranges: [number, number][], tag?: string): string;\nexport function search<T>(items: T[], needle: string, opts?: { text?: (item: T) => string; fuzzy?: boolean; limit?: number }): ({ item: T } & Match)[];\n\nexport interface OfflineQueue<J = any> {\n  readonly size: number; readonly jobs: (J & { id: number })[]; readonly busy: boolean;\n  push(job: J): Promise<{ sent: number; failed: { job: J; err: unknown } | null }>;\n  flush(): Promise<{ sent: number; failed: { job: J; err: unknown } | null }>;\n  clear(): void; subscribe(fn: (q: OfflineQueue<J>) => void): () => void;\n}\nexport function createOfflineQueue<J = any>(opts: { storageKey: string; send: (job: J & { id: number }) => Promise<unknown>; isOnline?: () => boolean; storage?: Pick<Storage, 'getItem' | 'setItem'> | null }): OfflineQueue<J>;\n\nexport type Change = 'mine' | 'theirs' | 'both' | 'none';\nexport function threeWayMerge<T extends Record<string, any>>(base: T, mine: T, theirs: T, opts?: { prefer?: 'mine' | 'theirs' }): { merged: T; conflicts: { key: keyof T; base: any; mine: any; theirs: any }[]; changes: Record<keyof T, Change> };\nexport function wordDiff(a: string, b: string): { type: 'same' | 'del' | 'ins'; text: string }[];\nexport function diffToHtml(parts: { type: 'same' | 'del' | 'ins'; text: string }[]): string;\n\nexport interface PersistentStore<S> { get(): S; set(patch: Partial<S>): S; flush(): void; reset(): void; subscribe(fn: (state: S) => void): () => void }\nexport function createPersistentStore<S extends Record<string, any>>(key: string, defaults: S, opts?: { debounceMs?: number; storage?: Pick<Storage, 'getItem' | 'setItem' | 'removeItem'> | null }): PersistentStore<S>;\n\nexport interface SyncChannel<S> { readonly id: string; publish(state: S): void; hello(getState: () => S): void; dispose(): void }\nexport function createSyncChannel<S = any>(name: string, opts?: { onState?: (state: S, from: string) => void; storage?: Pick<Storage, 'setItem'> | null }): SyncChannel<S>;\n\nexport function activateFocusTrap(container: HTMLElement, opts?: { inertTargets?: HTMLElement[]; onEscape?: (e: KeyboardEvent) => void; initialFocus?: string | HTMLElement }): { release(): void };\n\nexport interface Rect { left: number; top: number; right?: number; bottom?: number; width: number; height: number }\nexport type Placement = 'top' | 'bottom' | 'left' | 'right';\nexport function computePosition(anchor: Rect & { right: number; bottom: number }, pop: { width: number; height: number }, opts?: { placement?: Placement; align?: 'center' | 'start' | 'end'; gap?: number; bounds?: { left: number; top: number; right: number; bottom: number } }): { left: number; top: number; placement: Placement };\nexport function positionAtPoint(point: { x: number; y: number }, pop: { width: number; height: number }, bounds?: { left: number; top: number; right: number; bottom: number }): { left: number; top: number };\n\nexport interface Toaster { show(message: string, opts?: { kind?: string; duration?: number }): { dismiss(): void }; dispose(): void }\nexport function createToaster(opts?: { host?: HTMLElement; max?: number; duration?: number; position?: 'top-left' | 'top-right' | 'bottom-left' | 'bottom-right' }): Toaster;\n\nexport function createSortable(list: HTMLElement, opts?: { handle?: string; onChange?: (items: Element[]) => void; liftedClass?: string }): () => void;\n\nexport interface Split { getSizes(): (number | null)[]; setSizes(sizes: (number | null)[]): void; dispose(): void }\nexport function createSplit(container: HTMLElement, opts?: { sizes?: (number | null)[]; min?: number; gutter?: number; direction?: 'horizontal' | 'vertical'; onChange?: (sizes: (number | null)[]) => void }): Split;\n","ui-kit/index.js":"// ui-kit — レクチャー資料（docs/ui-guide）のデモから切り出した再利用部品。依存なし・ESモジュール。\nexport { createDrag, constrain } from './drag.js';\nexport { createCamera, attachPanZoom } from './camera.js';\nexport { createVirtualList, flattenTree } from './virtual-list.js';\nexport { createHistory } from './undo.js';\nexport { registerHotkeys } from './hotkeys.js';\nexport { debounce, substringMatch, fuzzyMatch, highlight, search } from './search.js';\nexport { createOfflineQueue } from './offline-queue.js';\nexport { threeWayMerge, wordDiff, diffToHtml } from './merge.js';\nexport { createPersistentStore } from './store.js';\nexport { createSyncChannel } from './sync.js';\nexport { activateFocusTrap } from './focus-trap.js';\nexport { computePosition, positionAtPoint } from './position.js';\nexport { createToaster } from './toast.js';\nexport { createSortable } from './sortable.js';\nexport { createSplit } from './split.js';\n","ui-kit/merge.js":"// merge.js — 3方向マージ（競合解決）\n// 参照デモ: 78 競合解決 / 77 差分表示\n//\n//   threeWayMerge(base, mine, theirs, { prefer: 'mine' })\n//   → { merged, conflicts: [{ key, base, mine, theirs }], changes: { key: 'mine'|'theirs'|'both'|'none' } }\n// 片方だけ変えた項目はその値、両方が別の値に変えた項目は conflict（prefer で暫定採用）。\nexport function threeWayMerge(base, mine, theirs, { prefer = 'mine' } = {}) {\n  const keys = new Set([...Object.keys(base || {}), ...Object.keys(mine || {}), ...Object.keys(theirs || {})]);\n  const merged = {}, conflicts = [], changes = {};\n  for (const k of keys) {\n    const b = base?.[k], m = mine?.[k], t = theirs?.[k];\n    const mc = m !== b, tc = t !== b;\n    if (mc && tc && m !== t) { conflicts.push({ key: k, base: b, mine: m, theirs: t }); merged[k] = prefer === 'mine' ? m : t; changes[k] = 'both'; }\n    else if (mc) { merged[k] = m; changes[k] = 'mine'; }\n    else if (tc) { merged[k] = t; changes[k] = 'theirs'; }\n    else { merged[k] = b; changes[k] = 'none'; }\n  }\n  return { merged, conflicts, changes };\n}\n\n// 単語単位の差分（LCS）: [{ type: 'same'|'del'|'ins', text }]\nexport function wordDiff(a, b) {\n  const A = a.split(/(\\s+)/), B = b.split(/(\\s+)/), n = A.length, m = B.length;\n  const L = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));\n  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);\n  const out = []; let i = 0, j = 0;\n  const push = (type, text) => { const last = out[out.length - 1]; last && last.type === type ? (last.text += text) : out.push({ type, text }); };\n  while (i < n && j < m) {\n    if (A[i] === B[j]) { push('same', A[i]); i++; j++; }\n    else if (L[i + 1][j] >= L[i][j + 1]) { push('del', A[i++]); }\n    else { push('ins', B[j++]); }\n  }\n  while (i < n) push('del', A[i++]); while (j < m) push('ins', B[j++]);\n  return out;\n}\nexport function diffToHtml(parts) {\n  const esc = (s) => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));\n  return parts.map(p => p.type === 'same' ? esc(p.text) : `<${p.type}>${esc(p.text)}\u003c/${p.type}>`).join('');\n}\n","ui-kit/offline-queue.js":"// offline-queue.js — オフライン時の操作キューと再送\n// 参照デモ: 79 オフライン対応 / 57 楽観的更新\n//\n//   const q = createOfflineQueue({\n//     storageKey: 'app.queue',\n//     send: async (job) => { await api.put(job) },      // 失敗は throw（キューに残る）\n//     isOnline: () => navigator.onLine,                  // 任意\n//   });\n//   q.push(job) / q.flush() / q.size / q.jobs / q.subscribe(fn)\n// 送信は先頭から順に。1件失敗したらそこで止め、次の flush（online イベント or 手動）で再開。\nexport function createOfflineQueue({ storageKey, send, isOnline = () => navigator.onLine, storage = globalThis.localStorage } = {}) {\n  let jobs = []; try { jobs = JSON.parse(storage?.getItem(storageKey) || '[]'); } catch {}\n  let busy = false; const subs = new Set();\n  const persist = () => { try { storage?.setItem(storageKey, JSON.stringify(jobs)); } catch {} subs.forEach(fn => fn(api)); };\n  const api = {\n    get size() { return jobs.length; }, get jobs() { return jobs.slice(); }, get busy() { return busy; },\n    push(job) { jobs.push({ id: Date.now() + Math.random(), ...job }); persist(); return api.flush(); },\n    async flush() {\n      if (busy) return { sent: 0, failed: null };\n      busy = true; let sent = 0, failed = null;\n      try {\n        while (jobs.length && isOnline()) {\n          const job = jobs[0];\n          try { await send(job); jobs.shift(); sent++; persist(); }\n          catch (err) { failed = { job, err }; break; }\n        }\n      } finally { busy = false; }\n      subs.forEach(fn => fn(api));\n      return { sent, failed };\n    },\n    clear() { jobs = []; persist(); },\n    subscribe(fn) { subs.add(fn); return () => subs.delete(fn); },\n  };\n  globalThis.addEventListener?.('online', () => api.flush());\n  return api;\n}\n","ui-kit/position.js":"// position.js — ツールチップ / ポップオーバー / メニューの位置決め（反転・枠内補正）\n// 参照デモ: 17 ツールチップ / 20 ドロップダウン / 39 コンテキストメニュー\n//\n//   const { left, top, placement } = computePosition(anchorRect, popRect, {\n//     placement: 'top' | 'bottom' | 'left' | 'right',   // 希望する方向\n//     align: 'center' | 'start' | 'end',                 // 直交方向の揃え\n//     gap: 6,\n//     bounds: { left, top, right, bottom },              // 収める範囲（省略時はビューポート）\n//   });\n// 戻り値は bounds と同じ座標系。希望方向に余白が無ければ反対側へ反転し、直交方向は枠内に押し込む。\nexport function computePosition(anchor, pop, { placement = 'top', align = 'center', gap = 6, bounds } = {}) {\n  const b = bounds || { left: 0, top: 0, right: window.innerWidth, bottom: window.innerHeight };\n  const fits = (p) => p === 'top' ? anchor.top - gap - pop.height >= b.top : p === 'bottom' ? anchor.bottom + gap + pop.height <= b.bottom\n    : p === 'left' ? anchor.left - gap - pop.width >= b.left : anchor.right + gap + pop.width <= b.right;\n  const opposite = { top: 'bottom', bottom: 'top', left: 'right', right: 'left' };\n  let p = placement; if (!fits(p) && fits(opposite[p])) p = opposite[p];\n  let left, top;\n  const alongX = (p === 'top' || p === 'bottom');\n  if (alongX) {\n    top = p === 'top' ? anchor.top - gap - pop.height : anchor.bottom + gap;\n    left = align === 'start' ? anchor.left : align === 'end' ? anchor.right - pop.width : anchor.left + anchor.width / 2 - pop.width / 2;\n  } else {\n    left = p === 'left' ? anchor.left - gap - pop.width : anchor.right + gap;\n    top = align === 'start' ? anchor.top : align === 'end' ? anchor.bottom - pop.height : anchor.top + anchor.height / 2 - pop.height / 2;\n  }\n  left = Math.max(b.left, Math.min(left, b.right - pop.width));   // 枠内に押し込む\n  top = Math.max(b.top, Math.min(top, b.bottom - pop.height));\n  return { left, top, placement: p };\n}\n\n// クリック位置に出すメニュー用：右下に出し、はみ出す軸だけ反転\n//   positionAtPoint({x, y}, popRect, bounds) → { left, top }\nexport function positionAtPoint(point, pop, bounds) {\n  const b = bounds || { left: 0, top: 0, right: window.innerWidth, bottom: window.innerHeight };\n  let left = point.x, top = point.y;\n  if (left + pop.width > b.right) left = Math.max(b.left, point.x - pop.width);\n  if (top + pop.height > b.bottom) top = Math.max(b.top, point.y - pop.height);\n  return { left, top };\n}\n","ui-kit/search.js":"// search.js — デバウンス / あいまい検索 / ハイライト\n// 参照デモ: 74 検索の型\nexport function debounce(fn, ms) {\n  let t; const d = (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };\n  d.cancel = () => clearTimeout(t); return d;\n}\nconst esc = (s) => String(s).replace(/[&<>\"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;' }[c]));\n\n// 部分一致: 一致位置 1 箇所。null なら不一致\nexport function substringMatch(text, needle) {\n  const i = text.toLowerCase().indexOf(needle.toLowerCase());\n  return i < 0 ? null : { score: 1000 - i, ranges: [[i, i + needle.length]] };\n}\n// あいまい一致: needle の文字が順番に現れるか。連続 +8、先頭 +10、飛び越し減点、短いテキスト微優先\nexport function fuzzyMatch(text, needle) {\n  const t = text.toLowerCase(), n = needle.toLowerCase();\n  let ti = 0, score = 0, prev = -2; const ranges = [];\n  for (const ch of n) {\n    const i = t.indexOf(ch, ti); if (i < 0) return null;\n    score += (i === prev + 1 ? 8 : 1) + (i === 0 ? 10 : 0) - (i - ti) * 0.1;\n    if (ranges.length && ranges[ranges.length - 1][1] === i) ranges[ranges.length - 1][1] = i + 1; else ranges.push([i, i + 1]);\n    prev = i; ti = i + 1;\n  }\n  return { score: score - text.length * 0.01, ranges };\n}\n// ranges を <mark> で囲んだ HTML（エスケープ済み）\nexport function highlight(text, ranges, tag = 'mark') {\n  let out = '', pos = 0;\n  for (const [a, b] of ranges) { out += esc(text.slice(pos, a)) + `<${tag}>` + esc(text.slice(a, b)) + `\u003c/${tag}>`; pos = b; }\n  return out + esc(text.slice(pos));\n}\n// 一括検索してスコア順に返す\n//   search(items, needle, { text: item => item.name, fuzzy: true, limit: 100 }) → [{ item, score, ranges }]\nexport function search(items, needle, { text = (x) => String(x), fuzzy = false, limit = Infinity } = {}) {\n  if (!needle) return items.slice(0, limit).map(item => ({ item, score: 0, ranges: [] }));\n  const match = fuzzy ? fuzzyMatch : substringMatch, hits = [];\n  for (const item of items) { const m = match(text(item), needle); if (m) hits.push({ item, ...m }); }\n  hits.sort((a, b) => b.score - a.score);\n  return hits.slice(0, limit);\n}\n","ui-kit/sortable.js":"// sortable.js — Pointer Events によるドラッグ並べ替え（縦リスト、FLIP 付き）\n// 参照デモ: 32 ドラッグ並べ替え / 30 FLIP\n//\n//   const dispose = createSortable(listEl, {\n//     handle: '.grip',                 // 省略時は子要素全体\n//     onChange: (order) => {},         // 並び替え後の子要素配列\n//   });\n// 子要素は listEl の直下にあり、縦に並んでいる前提。持ち上げ中は .lifted クラスが付く。\nexport function createSortable(list, { handle, onChange, liftedClass = 'lifted' } = {}) {\n  let lifted = null, startY = 0, naturalTop = 0, pointerId = null;\n  const animating = new WeakSet();   // FLIP 中の兄弟は当たり判定から外す（アニメーション中の rect で判定すると往復してしまう）\n  const down = (e) => {\n    const item = e.target.closest(`${list.tagName === 'UL' || list.tagName === 'OL' ? 'li' : ':scope > *'}`);\n    if (!item || item.parentElement !== list) return;\n    if (handle && !e.target.closest(handle)) return;\n    lifted = item; pointerId = e.pointerId; startY = e.clientY; naturalTop = item.getBoundingClientRect().top;\n    item.classList.add(liftedClass); item.style.position = 'relative'; item.style.zIndex = '2';\n    item.setPointerCapture(e.pointerId);\n  };\n  const move = (e) => {\n    if (!lifted || e.pointerId !== pointerId) return;\n    const dy = e.clientY - startY;\n    lifted.style.transform = `translateY(${dy}px)`;\n    const cy = naturalTop + dy + lifted.offsetHeight / 2;\n    for (const sib of list.children) {\n      if (sib === lifted || animating.has(sib)) continue;\n      const r = sib.getBoundingClientRect();\n      if (cy < r.top || cy > r.bottom) continue;\n      const liftedIsAfter = sib.compareDocumentPosition(lifted) & Node.DOCUMENT_POSITION_FOLLOWING;\n      liftedIsAfter ? list.insertBefore(lifted, sib) : list.insertBefore(lifted, sib.nextSibling);\n      const after = sib.getBoundingClientRect();\n      const anim = sib.animate?.([{ transform: `translateY(${r.top - after.top}px)` }, { transform: 'none' }], { duration: 150 });\n      if (anim) { animating.add(sib); anim.finished.then(() => animating.delete(sib), () => animating.delete(sib)); }\n      const newNatural = lifted.getBoundingClientRect().top - dy;\n      startY += newNatural - naturalTop; naturalTop = newNatural;\n      lifted.style.transform = `translateY(${e.clientY - startY}px)`;\n      break;\n    }\n  };\n  const up = (e) => {\n    if (!lifted || e.pointerId !== pointerId) return;\n    lifted.style.transform = ''; lifted.style.position = ''; lifted.style.zIndex = ''; lifted.classList.remove(liftedClass);\n    lifted = null; pointerId = null;\n    onChange?.([...list.children]);\n  };\n  list.addEventListener('pointerdown', down); list.addEventListener('pointermove', move);\n  list.addEventListener('pointerup', up); list.addEventListener('pointercancel', up);\n  return () => { list.removeEventListener('pointerdown', down); list.removeEventListener('pointermove', move); list.removeEventListener('pointerup', up); list.removeEventListener('pointercancel', up); };\n}\n","ui-kit/split.js":"// split.js — 分割パネル（ガターのドラッグで幅を変更、最小幅、ダブルクリックで初期化）\n// 参照デモ: 33 分割パネル / 80 ドッキング\n//\n//   const split = createSplit(containerEl, { sizes: [240, null], min: 120, gutter: 6, direction: 'horizontal',\n//     onChange: (sizes) => save(sizes) });\n//   split.setSizes([300, null]) / split.getSizes() / spl     '});',
    'if (window.__ANCHOR) window.addEventListener("load", function () {',
    '  setTimeout(function () { var el = document.getElementById(window.__ANCHOR); if (el) el.scrollIntoView(); }, 60);',
    '});'
  ].join('\n');

  // ---- 親側（シェル） ----
  var frame = document.getElementById('ug-frame');
  var nav = document.getElementById('ug-nav');
  var more = document.getElementById('ug-more');
  var current = GUIDE + '00-index.html';

  function show(key, anchor) {
    current = key;
    frame.srcdoc = compose(key, anchor);
    [].forEach.call(nav.querySelectorAll('a'), function (a) { a.classList.toggle('on', a.getAttribute('data-key') === key); });
    more.value = PAGES.some(function (p) { return p.key === key; }) ? '' : key;
    var hash = '#' + key + (anchor ? '@' + anchor : '');
    try { history.replaceState(null, '', hash); } catch (e) { location.hash = hash; }
    document.getElementById('ug-path').textContent = key.replace(GUIDE, '') + (anchor ? ' #' + anchor : '');
  }

  window.addEventListener('message', function (e) {
    var href = e.data && e.data.uiGuideNav;
    if (!href) return;
    var parts = href.split('#'), key = resolve(current, parts[0]);
    if (FILES[key] == null) { alert('単一ファイル版に含まれていないファイルです：' + key); return; }
    show(key, parts[1] || '');
  });

  // ナビの見出しは短く：「第N弾」と括弧書きを落とし、「見出し：説明」は見出しだけにする
  function navLabel(title) {
    var t = title.replace(/^第\d+弾\s*/, '').replace(/[（(].*$/, '').trim();
    var head = t.split('：')[0];
    return head.length >= 3 ? head : t;
  }
  nav.innerHTML = PAGES.map(function (p) {
    return '\x3ca href="#" data-key="' + p.key + '" title="' + p.title + '">' + navLabel(p.title) + '\x3c/a>';
  }).join('');
  nav.addEventListener('click', function (e) {
    var a = e.target.closest('a[data-key]');
    if (!a) return;
    e.preventDefault();
    show(a.getAttribute('data-key'), '');
  });

  var others = Object.keys(FILES).filter(function (k) { return !PAGES.some(function (p) { return p.key === k; }); }).sort();
  more.innerHTML = '\x3coption value="">その他のファイル…\x3c/option>' + others.map(function (k) {
    return '\x3coption value="' + k + '">' + k + '\x3c/option>';
  }).join('');
  more.addEventListener('change', function () { if (more.value) show(more.value, ''); });

  document.getElementById('ug-gen').textContent = '生成 ' + (B.generated || '') + ' ／ ' + Object.keys(FILES).length + ' ファイル';

  // ハッシュ（#キー@アンカー）でページを決める。起動時と、戻る/進む・手打ちの変更に対応する。
  function fromHash() {
    var h = decodeURIComponent((location.hash || '').slice(1));
    var at = h.lastIndexOf('@');
    return { key: at > 0 ? h.slice(0, at) : h, anchor: at > 0 ? h.slice(at + 1) : '' };
  }
  window.addEventListener('hashchange', function () {
    var t = fromHash();
    if (FILES[t.key] && (t.key !== current || t.anchor)) show(t.key, t.anchor);
  });
  var start = fromHash();
  show(FILES[start.key] ? start.key : GUIDE + '00-index.html', start.anchor);
})();
</script>
</body>
</html>
